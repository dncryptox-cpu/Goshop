<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thay Fam</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{
    --bg:#f6f6f3; --card:#fff; --ink:#1b1b18; --mute:#6d6d66; --line:#e4e3dc;
    --acc:#1f6f4a; --acc-ink:#fff; --warn:#b4540a; --bad:#b42318; --ok:#1f6f4a; --chip:#efeee8;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#141413; --card:#1d1d1b; --ink:#ecebe4; --mute:#9b9a92; --line:#2f2f2b;
      --acc:#3fa673; --acc-ink:#0d1a12; --warn:#e3913f; --bad:#ef6b5e; --ok:#57c08a; --chip:#262623;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button{font:inherit;cursor:pointer}
  .wrap{max-width:860px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  header h1{font-size:20px;margin:0;letter-spacing:-.01em}
  header .sub{color:var(--mute);font-size:13px}
  header .sp{flex:1}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;white-space:nowrap}
  .btn:hover{border-color:var(--mute)}
  .btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
  .btn.sm{padding:4px 9px;font-size:13px}
  .btn[disabled]{opacity:.5;cursor:default}
  .tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--line);overflow-x:auto}
  .tab{white-space:nowrap}
  .tab{border:0;background:none;padding:9px 12px;color:var(--mute);border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab.on{color:var(--ink);border-color:var(--ink);font-weight:600}
  .tab .n.hot{background:var(--warn);color:#fff}
  .tab .n{display:inline-block;min-width:20px;padding:0 6px;border-radius:10px;background:var(--chip);font-size:12px;margin-left:4px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
  .rn{font-weight:700;font-size:16px;min-width:64px}
  .mono{cursor:pointer}
  .mono:hover{text-decoration:underline dotted}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px}
  .mute{color:var(--mute)}
  .badge{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);white-space:nowrap;align-self:center;line-height:1.5}
  .badge.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .grow{flex:1;min-width:0}
  .ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .chips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:4px 12px;font-size:13px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .empty{text-align:center;color:var(--mute);padding:40px 0}
  .err{background:color-mix(in srgb,var(--bad) 12%,transparent);color:var(--bad);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  .okbox{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);border-radius:8px;padding:10px 12px;margin-bottom:12px}
  /* Panel thay fam */
  .ov{position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:10}
  .step{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px}
  .step h3{margin:0 0 8px;font-size:15px;display:flex;align-items:center;gap:8px}
  .step h3 .num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:inline-grid;place-items:center;font-size:12px}
  .kv{display:grid;grid-template-columns:70px 1fr auto;gap:6px 10px;align-items:center}
  .kv .k{color:var(--mute);font-size:13px}
  .otp{font-size:20px;font-weight:700;letter-spacing:2px}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;width:60px}
  .bar i{display:block;height:100%;background:var(--acc)}
  .cus{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
  .cus:first-of-type{border-top:0}
  .cus input{width:18px;height:18px}
  .search{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .search input{flex:1;min-width:0}
  .rep{margin:0 14px 10px;padding:8px 10px;border-radius:8px;background:color-mix(in srgb,var(--bad) 9%,transparent);border-left:3px solid var(--bad);font-size:13px}
  .rep b{color:var(--bad)}
  .rep-list{display:flex;flex-direction:column;gap:2px;margin-top:4px}
  .st{font-size:12px;padding:2px 8px;border-radius:10px;white-space:nowrap;background:var(--chip)}
  .st.free{background:color-mix(in srgb,var(--acc) 15%,transparent);color:var(--acc)}
  .st.need{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  .st.pending{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .st.joined{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
  .slotrow td{vertical-align:middle}
  .mv{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:6px;font-family:inherit}
  td.mono .mv button,td.mono .mv label{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  .mv input[type=text]{flex:1;min-width:180px}
  .cp{cursor:pointer;border-bottom:1px dotted currentColor}
  .cp:hover{color:var(--acc)}
  tr.hit td{background:color-mix(in srgb,var(--acc) 14%,transparent);font-weight:600}
  .xp{width:30px;padding:4px 0;text-align:center}
  .peek{border-top:1px solid var(--line);padding:8px 14px 12px;overflow-x:auto}
  .peek-own{font-size:13px;margin-bottom:6px}
  @media (max-width:560px){ .card>.row>.grow{flex-basis:calc(100% - 110px)} .card>.row>.badge{margin-left:110px} .card>.row>.btn.pri{margin-left:auto} }
  tr.conf td{background:color-mix(in srgb,var(--warn) 14%,transparent)}
  .warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:8px;padding:8px 10px;margin:8px 0;font-size:13px}
  .copied{color:var(--ok);font-size:12px}
  .foot{position:sticky;bottom:0;background:var(--bg);padding:12px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  input[type=password],input[type=text],input[type=search],select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
  .login{max-width:320px;margin:80px auto;display:grid;gap:10px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--mute);font-weight:500}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:20}
  @media (max-width:560px){ .kv{grid-template-columns:56px 1fr auto} .hide-sm{display:none} .card.row>.grow{flex-basis:calc(100% - 80px)} .card.row>.badge{margin-left:72px} .card.row>.btn{margin-left:auto} }
</style>
</head>
<body x-data="app()" x-init="init()">
<div class="wrap">

  <!-- ĐĂNG NHẬP -->
  <template x-if="!pass">
    <form class="login" @submit.prevent="login()">
      <h1 style="margin:0">Thay Fam</h1>
      <input type="password" x-model="passInput" placeholder="Mật khẩu hoặc key" autofocus>
      <button class="btn pri">Vào</button>
      <div class="err" x-show="error" x-text="error"></div>
    </form>
  </template>

  <template x-if="pass">
    <div>
      <header>
        <div>
          <h1>Thay Fam</h1>
          <div class="sub" x-text="today ? 'Hôm nay ' + today + ' · ' + frs.length + ' FR sẵn sàng' : 'Đang tải…'"></div>
          <div class="sub" x-show="me.name"><b x-text="me.name"></b> · <span x-text="roleName()"></span><span x-show="me.limit" x-text="' · đã thay ' + me.usedToday + '/' + me.limit + ' hôm nay'"></span></div>
        </div>
        <div class="sp"></div>
        <button class="btn sm" @click="load()" :disabled="loading" x-text="loading ? 'Đang tải…' : 'Tải lại'"></button>
        <button class="btn sm" @click="logout()">Thoát</button>
      </header>

      <div class="err" x-show="error" x-text="error"></div>
      <div class="row" x-show="checkDue().length && tab!=='slots'" style="background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:10px">
        <span class="grow" x-text="'🔎 ' + checkDue().length + ' fam đã mời khách ≥' + slotPendingH + 'h mà chưa kiểm tra ai vào: ' + checkDue().map(f => f.rn).slice(0, 12).join(', ') + (checkDue().length > 12 ? '…' : '')"></span>
        <button class="btn sm" @click="tab='slots'; slotFilter='late'">Kiểm tra</button>
      </div>
      <div class="row" x-show="blocksDue && can('blocks') && tab!=='blocks'" style="background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn);border-radius:8px;padding:10px 12px;margin-bottom:10px">
        <span class="grow" x-text="'⚠️ ' + blocksDue + ' fam đã đến hoặc sắp đến ngày mời lại (Google chặn mời trước đó).'"></span>
        <button class="btn sm" @click="tab='blocks'; loadBlocks()">Xem</button>
      </div>
      <div class="okbox row" x-show="lastDone">
        <span class="grow" x-text="lastDone"></span>
        <template x-if="lastActionId">
          <button class="btn sm" @click="askUndo(lastActionId)" :disabled="!!undoBusy" x-text="undoConfirm===lastActionId ? 'Bấm lần nữa để hoàn tác' : 'Hoàn tác'"></button>
        </template>
      </div>
      <template x-if="notify">
        <div class="card" style="padding:12px 14px">
          <div class="row"><b class="grow" x-text="'Báo khách ' + notify.rn + ' (' + notify.sent.length + '/' + notify.items.length + ' đã copy)'"></b><button class="btn sm" @click="notify=null">Xong</button></div>
          <div class="mute" style="font-size:13px;margin:4px 0 8px">Copy tin rồi gửi Zalo cho khách (hoặc gửi CTV). Khách có Zalo là khách đã điền khi báo lỗi.</div>
          <template x-for="it in notify.items" :key="it.email">
            <div class="row" style="padding:6px 0;border-top:1px solid var(--line)">
              <div class="grow" style="min-width:0">
                <div class="mono ellip" x-text="it.email"></div>
                <div class="mute" style="font-size:12px" x-text="(it.ctv ? 'CTV ' + it.ctv : 'Không rõ CTV') + (it.zalo ? ' · Zalo ' + it.zalo : '')"></div>
              </div>
              <a class="btn sm" x-show="it.zalo" :href="'https://zalo.me/' + it.zalo" target="_blank" rel="noopener">Mở Zalo</a>
              <button class="btn sm" :class="!notify.sent.includes(it.email) && 'pri'" @click="copyNotify(notify, it)" x-text="notify.sent.includes(it.email) ? '✓ Đã copy' : 'Copy tin'"></button>
            </div>
          </template>
        </div>
      </template>
      <template x-if="undoConflict">
        <div class="err">
          <div x-text="undoConflict.msg"></div>
          <div class="row" style="margin-top:8px">
            <button class="btn sm" @click="undoConflict=null">Thôi</button>
            <button class="btn sm" @click="undoConflict.kind==='sync' ? doSync(undoConflict.id, true) : doUndo(undoConflict.id, true)" :disabled="!!undoBusy" x-text="undoConflict.kind==='sync' ? 'Vẫn đồng bộ (ghi đè gốc)' : 'Vẫn hoàn tác (ghi đè)'"></button>
          </div>
        </div>
      </template>

      <div class="search" x-show="can('search')">
        <input type="search" x-model="q" @input.debounce.400ms="doSearch()" @keydown.escape="q=''; results=[]" placeholder="Tìm nhanh: RN, email chủ fam, email thành viên, mail phụ…">
        <span class="mute" style="font-size:12px" x-show="searchOn()" x-text="searching ? 'Đang tìm…' : (searchTotal + ' fam' + (searchTotal>results.length ? ' (hiện ' + results.length + ')' : ''))"></span>
      </div>

      <nav class="tabs" x-show="!searchOn()">
        <button class="tab" :class="tab==='due' && 'on'" @click="tab='due'">Đến hạn<span class="n" x-text="due.length"></span></button>
        <button class="tab" :class="tab==='report' && 'on'" @click="tab='report'">🚨 Khách báo lỗi<span class="n" x-text="reported.length"></span></button>
        <button class="tab" x-show="can('slots')" :class="tab==='slots' && 'on'" @click="tab='slots'; loadSlots()">Còn slot<span class="n" x-text="slotsLoaded ? slots.length : '·'"></span></button>
        <button class="tab" x-show="can('blocks')" :class="tab==='blocks' && 'on'" @click="tab='blocks'; loadBlocks()">Chặn mời<span class="n" :class="blocksDue && 'hot'" x-text="blocksOpen"></span></button>
        <button class="tab" x-show="me.role !== 'outsource'" :class="tab==='renew' && 'on'" @click="tab='renew'">Nhắc gia hạn<span class="n" x-text="renewals.length"></span></button>
        <button class="tab" x-show="can('review')" :class="tab==='sync' && 'on'" @click="tab='sync'; loadReview()">Đồng bộ<span class="n" x-text="review.length"></span></button>
        <button class="tab" :class="tab==='log' && 'on'" @click="tab='log'; loadLog()">Lịch sử</button>
        <button class="tab" x-show="me.role==='admin'" :class="tab==='notes' && 'on'" @click="tab='notes'; loadNotes()">Cần xử lý<span class="n" :class="openNotes && 'hot'" x-text="openNotes"></span></button>
        <button class="tab" x-show="me.role==='admin'" :class="tab==='users' && 'on'" @click="tab='users'; loadUsers()">Tài khoản</button>
      </nav>

      <!-- TAB ĐẾN HẠN -->
      <section x-show="tab==='due' || tab==='report' || searchOn()">
        <div class="mute" style="font-size:13px;margin-bottom:10px" x-show="tab==='report' && !searchOn()">Fam có khách báo lỗi hoặc khách báo không thấy lời mời, chưa thay fam sau lần báo. Thay fam xong hoặc bấm "Đã mời lại" thì tự biến mất.</div>
        <template x-if="tab==='report' && !searchOn() && !loading && reported.length===0"><div class="empty">Không có khách nào đang báo lỗi.</div></template>
        <div class="chips" x-show="!searchOn() && tab==='due'">
          <button class="chip" :class="ahead===0 && 'on'" @click="ahead=0; load()">Hôm nay & quá hạn</button>
          <button class="chip" :class="ahead===3 && 'on'" @click="ahead=3; load()">+3 ngày tới</button>
          <button class="chip" :class="ahead===7 && 'on'" @click="ahead=7; load()">+7 ngày tới</button>
        </div>
        <template x-if="tab==='due' && !searchOn() && !loading && due.length===0"><div class="empty">Không có RN nào đến hạn.</div></template>
        <template x-if="searchOn() && !searching && results.length===0"><div class="empty">Không tìm thấy fam nào.</div></template>
        <template x-for="f in (searchOn() ? results : (tab==='report' ? reported : due))" :key="f.rn">
          <div class="card" style="padding:0">
            <div class="row" style="padding:12px 14px">
              <button class="btn sm xp" @click="toggleOpen(f.rn)" :aria-expanded="isOpen(f.rn)" x-text="expanded(f) ? '▾' : '▸'" title="Xem nhanh"></button>
              <div class="rn" x-text="f.rn"></div>
              <button class="btn sm" x-show="can('sendMail') && f.customers && f.customers.length" @click="mailFam(f)" title="Chọn / bỏ chọn cả fam để gửi mail" x-text="famMailed(f) ? '✉ bỏ fam' : '✉ cả fam'"></button>
              <div class="grow">
                <div class="mono ellip" x-text="f.email"></div>
                <div class="mute" style="font-size:13px">
                  Renew <span x-text="f.renew"></span> · <span x-text="activeCount(f)"></span>/<span x-text="f.customers.length"></span> khách còn hạn · <span x-text="f.status"></span>
                </div>
              </div>
              <span class="badge bad" x-show="f.report && f.report.reporters.length" x-text="'🚨 ' + (f.report ? f.report.reporters.length : 0) + ' báo lỗi'"></span>
              <span class="badge warn" x-show="f.report && f.report.reinvites.length" x-text="'🔁 ' + (f.report ? f.report.reinvites.length : 0) + ' cần mời lại'"></span>
              <span class="badge" :class="f.daysToRenew<0 ? 'bad' : (f.daysToRenew===0 ? 'warn' : '')" x-text="f.daysToRenew===null ? f.status : renewLabel(f.daysToRenew)"></span>
              <button class="btn sm" @click="noteFor = noteFor===f.rn ? '' : f.rn; noteText=''" title="Ghi chú cho admin">Ghi chú</button>
              <button class="btn pri sm" @click="openSwap(f)" :disabled="!frs.length">Thay fam</button>
            </div>
            <template x-if="f.report">
              <div class="rep">
                <div class="row" style="gap:8px;align-items:center">
                  <div class="grow"><b>Khách báo lỗi</b> · từ <span x-text="f.report.createdAt"></span> · <span x-text="f.report.status"></span><span x-show="f.report.activity" x-text="' · nhóm ' + f.report.activity.toLowerCase()"></span></div>
                  <button class="btn sm pri" x-show="f.report.reporters.length || f.report.ticketId" @click="fixDone(f)" :disabled="!!f.fixing" title="Đã xử lý xong mà không cần thay fam: đóng báo lỗi, khách thấy 'Đã xử lý' trong app" x-text="f.fixing ? 'Đang lưu…' : (f.fixConfirm ? 'Bấm lần nữa' : 'Đã fix xong')"></button>
                </div>
                <div class="rep-list">
                  <template x-for="r in f.report.reporters" :key="r.email">
                    <div><input type="checkbox" x-show="can('sendMail')" style="margin-right:6px" :checked="!!mailSel[lcm(r.email)]" @change="toggleMail(r.email, f.rn, hsdOf(f, r.email))" title="Chọn để gửi mail"><span class="mono" x-text="r.email"></span> <span class="mute" x-text="'· ' + r.at + (r.zalo ? ' · Zalo ' + r.zalo : '') + (r.by ? ' · ' + r.by : '')"></span><span class="badge" x-show="mailLog[lcm(r.email)]" style="margin-left:6px;cursor:pointer" :title="mailTip(r.email)" @click="mailInfo = mailInfo === lcm(r.email) ? '' : lcm(r.email)" x-text="'✉ ' + (mailLog[lcm(r.email)] || {}).at"></span><div class="mute" style="font-size:12px;white-space:pre-wrap;font-family:inherit" x-show="mailInfo && mailInfo === lcm(r.email)" x-text="mailTip(r.email)"></div></div>
                  </template>
                  <div class="mute" x-show="!f.report.reporters.length && !f.report.reinvites.length">Có ticket nhưng chưa có email báo.</div>
                </div>
                <template x-if="f.report.reinvites.length">
                  <div style="margin-top:6px">
                    <b>Cần mời lại</b>
                    <template x-for="r in f.report.reinvites" :key="r.id">
                      <div class="row" style="gap:8px;margin-top:4px">
                        <div class="grow" style="min-width:0"><span class="mono" x-text="r.email"></span> <span class="mute" x-text="'· ' + r.reason + ' · ' + r.at + (r.zalo ? ' · Zalo ' + r.zalo : '')"></span></div>
                        <a class="btn sm" x-show="r.zalo" :href="'https://zalo.me/' + r.zalo" target="_blank" rel="noopener">Mở Zalo</a>
                        <button class="btn sm" @click="blockInvite(f, r.email)" :disabled="!!f.blocking" title="Google báo hết lượt mời" x-text="f.blockedUntil ? 'Chặn đến ' + f.blockedUntil : (f.blockConfirm ? 'Bấm lần nữa' : 'Google chặn mời')"></button>
                        <button class="btn sm pri" @click="rejoinDone(f, r)" :disabled="!!r.busy" x-text="r.busy ? 'Đang lưu…' : 'Đã mời lại'"></button>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </template>
            <template x-if="noteFor===f.rn">
              <div class="peek row">
                <input type="text" class="grow" x-model="noteText" placeholder="Ghi chú cho admin, vd: khách báo lỗi, còn slot, cần kiểm tra…" @keydown.enter="sendNote(f.rn)" x-init="$el.focus()">
                <button class="btn pri sm" @click="sendNote(f.rn)" :disabled="!noteText.trim() || noteBusy">Gửi</button>
              </div>
            </template>
            <template x-if="expanded(f)">
              <div class="peek">
                <div class="peek-own mute">

                <template x-if="f.customers.length===0"><div class="mute" style="font-size:13px">Không có email khách.</div></template>

                        <template x-if="mv.row === c.row">

                            <label class="mute" style="font-size:13px" x-show="me.role==='admin'"><input type="checkbox" x-model="autoSync" @change="lsSet('thayfam_autosync', autoSync ? '1' : '0')"> Ghi luôn vào gốc</label>
                            <button class="btn sm pri" @click="doMove(f, c)" :disabled="!!mv.busy" x-text="mv.busy ? 'Đang chuyển…' : (mv.confirm ? 'Bấm lần nữa để chuyển' : 'Chuyển vào')"></button>
                            <button class="btn sm" @click="mv = {}">Huỷ</button>
                            <div class="err" style="width:100%;margin:0" x-show="mv.error" x-text="mv.error"></div>
                          </div>

                        <template x-if="em.row === c.row">
                          <div class="mv">
                            <input type="text" x-model="em.newEmail" placeholder="Mail mới (mail phụ của khách)" class="mono">

                            <label style="font-size:13px;width:100%;color:var(--bad)"><input type="checkbox" x-model="em.oldRemoved"> <b>Đã xoá mail cũ khỏi nhóm Gia đình</b> (hoặc mail cũ chưa từng vào nhóm). Bắt buộc, tránh 1 khách chiếm 2 slot.</label>
                            <label class="mute" style="font-size:13px" x-show="me.role==='admin'"><input type="checkbox" x-model="autoSync" @change="lsSet('thayfam_autosync', autoSync ? '1' : '0')"> Ghi luôn vào gốc</label>
                            <button class="btn sm pri" @click="doSwapMail(c)" :disabled="!!em.busy || !em.oldRemoved" x-text="em.busy ? 'Đang đổi…' : (em.confirm ? 'Bấm lần nữa để đổi' : 'Đổi mail')"></button>

                          </div>
                        </template></td>
                        <td x-text="c.ctv || '—'"></td>
                        <td x-text="c.hsd || '—'"></td>
                        <td :style="c.daysLeft!==null && c.daysLeft<0 ? 'color:var(--bad)' : (c.daysLeft!==null && c.daysLeft<=10 ? 'color:var(--warn)' : '')" x-text="c.daysLeft===null ? '—' : (c.daysLeft<0 ? 'hết ' + (-c.daysLeft) + 'n' : c.daysLeft + ' ngày')"></td>
                        <td class="hide-sm mono" x-show="me.role !== 'outsource'" x-text="c.mailPhu || '—'"></td>
                        <td style="text-align:right;white-space:nowrap"><button class="btn sm" x-show="can('move') && mv.row !== c.row && c.daysLeft !== null && c.daysLeft < 0" @click="mv = { row: c.row, email: '', invited: false }">Chuyển khách vào</button><button class="btn sm" x-show="can('move') && mv.row !== c.row && !(c.daysLeft !== null && c.daysLeft < 0)" @click="mv = { row: c.row, email: '', invited: false, replace: c.email }" title="Khách chưa vào / bỏ slot: đổi sang khách khác. Khách hiện tại được chép xuống cuối sheet DATA">Đổi khách</button><button class="btn sm" x-show="can('move') && can('slots') && c.email && pick.row !== c.row" @click="findSlot(f, c)" title="Tìm fam khác còn slot để chuyển khách này sang">Tìm fam</button><button class="btn sm" x-show="can('swapMail') && c.email && em.row !== c.row" @click="em = { row: c.row, newEmail: livePhu(c.mailPhu), invited: false }" title="Đổi sang mail phụ, giữ mail gốc ở cột Mail phụ">Đổi mail</button></td>
                      </tr>
                    </template>
                    <template x-for="sl in (f.slots || []).filter(x => !x.email)" :key="'e' + sl.row">

                            <button class="btn sm pri" @click="doMove(f, sl)" :disabled="!!mv.busy" x-text="mv.busy ? 'Đang chuyển…' : (mv.confirm ? 'Bấm lần nữa để chuyển' : 'Chuyển vào')"></button>
                            <button class="btn sm" @click="mv = {}">Huỷ</button>
                            <div class="err" style="width:100%;margin:0" x-show="mv.error" x-text="mv.error"></div>

                        </template></td>
                        <td></td><td></td><td></td><td class="hide-sm" x-show="me.role !== 'outsource'"></td>
                        <td style="text-align:right"><button class="btn sm" x-show="can('move') && mv.row !== sl.row" @click="mv = { row: sl.row, email: '', invited: false }">Chuyển khách vào</button></td>

                    </template>
                  </tbody>

                <template x-if="pick.row && f.customers.some(c => c.row === pick.row)">

                          </div>
                          <button class="btn sm" @click="pickBlocked()" :disabled="!!pick.blocking" title="Google báo hết lượt mời ở fam này: ghi Chặn mời (hẹn mời lại sau vài ngày) rồi chuyển sang fam khác" x-text="pick.blocking ? '…' : (pick.blockConfirm ? 'Bấm lần nữa' : 'Google chặn mời → fam khác')"></button>

                          <span x-show="cur().fam.mkp"> · MKP <span class="mono cp" title="Bấm để copy" @click="copy(cur().fam.mkp, 'Đã copy MKP')" x-text="cur().fam.mkp"></span></span>
                          · 2FA <b class="mono" :class="cur().fam.twofa && 'cp'" title="Bấm để copy mã" @click="cur().fam.twofa && copy(slotOtp.P, 'Đã copy mã 2FA')" x-text="cur().fam.twofa ? (slotOtp.P || '······') : 'không'"></b>
                          · <a href="https://myaccount.google.com/family/details" target="_blank" rel="noopener">Trang Gia đình ↗</a>
                        </div>

                        <div class="mute" style="font-size:12px">Đang đăng nhập fam này: thấy khách nào chưa vào nhóm thì bấm <b>Chưa vào</b> để giữ slot (hiện ở Còn slot, dùng Đổi khách sau).</div>

      <!-- TAB CHẶN MỜI -->
      <section x-show="tab==='blocks' && !searchOn()">

          </div>
        </template>
      </section>

      <!-- TAB CÒN SLOT -->
      <section x-show="tab==='slots' && !searchOn()">
        <div class="mute" style="font-size:13px;margin-bottom:10px">Fam đang chạy còn chỗ, có khách cần mời, hoặc đã mời mà chưa xác nhận vào. Fam còn nhiều ngày dùng xếp trước. Google chặn khi 1 fam mời quá ~<b x-text="slotLimit"></b> lời mời / 7 ngày.</div>

            <div class="mute" style="font-size:13px;margin-bottom:10px"><b>Chỉ để soi, webapp không sửa gì.</b> Đỏ = email khách trùng 2 chỗ hoặc mail phụ đang là khách ở dòng khác (gần như chắc chắn dư slot). Vàng = có mail phụ chưa ghi "hủy" (có thể nhân viên cũ đã mời cả mail phụ). Bạn đăng nhập fam, so với nhóm Gia đình rồi tự xoá / đổi.</div>

                    <span x-show="f.twofa"> · 2FA <b class="mono cp" @click="copy(slotOtp['M' + f.rn], 'Đã copy mã 2FA')" x-text="slotOtp['M' + f.rn] || '······'"></b></span>
                    · <a href="https://myaccount.google.com/family/details" target="_blank" rel="noopener">Trang Gia đình ↗</a>

        <template x-for="f in filteredSlots()" :key="f.rn">

              <div class="grow">
                <div class="mono ellip" x-text="f.email"></div>
                <div class="mute" style="font-size:13px" x-text="'Renew ' + f.renew + ' · còn ' + f.days + ' ngày dùng · ' + (f.free ? f.free + ' slot trống' : 'hết slot')"></div>
                <div class="mute" style="font-size:13px">Pass <span class="mono cp" title="Bấm để copy" @click="copy(f.pass, 'Đã copy pass')" x-text="f.pass || '—'"></span><span x-show="f.twofa"> · 2FA <b class="mono cp" title="Bấm để copy mã" @click="copy(slotOtp[f.rn], 'Đã copy mã 2FA')" x-text="slotOtp[f.rn] || '······'"></b></span> · <a href="https://myaccount.google.com/family/details" target="_blank" rel="noopener">Trang Gia đình ↗</a></div>
              </div>
              <span class="badge" :class="f.used >= f.limit ? 'bad' : (f.used >= f.limit - 1 ? 'warn' : 'ok')" :title="'Lời mời đã gửi trong 7 ngày'" x-text="'Mời ' + f.used + '/' + f.limit + ' tuần'"></span>
              <span class="badge bad" x-show="f.blockedUntil" x-text="'Google chặn mời đến ' + f.blockedUntil"></span>
              <button class="btn sm" x-show="!f.blockedUntil" @click="blockInvite(f)" :disabled="!!f.blocking" :title="'Bấm khi Google báo: You\'ve reached the family invitation limit'" x-text="f.blocking ? '…' : (f.blockConfirm ? 'Bấm lần nữa' : 'Google chặn mời')"></button>
              <button class="btn sm" x-show="f.pend || f.rows.some(r => r.state === 'nojoin')" @click="f.check = !f.check" x-text="f.check ? 'Đóng' : 'Kiểm tra fam'"></button>
            </div>
            <template x-if="f.check">
              <div class="peek" style="border-top:1px solid var(--line)">
                <div class="peek-own">Đăng nhập chủ fam (pass / 2FA ở trên), mở trang Gia đình, bấm <b>Đã vào</b> / <b>Chưa vào</b> cho từng khách rồi bấm Lưu. Khách <b>Chưa vào</b> được giữ slot, hiện ở đây với nút Đổi khách để hôm sau dùng.</div>
              </div>
            </template>
            <div class="peek" style="padding-top:4px">
              <table>
                <tbody>
                  <template x-for="r in f.rows" :key="r.row">
                    <tr class="slotrow">
                      <td style="width:1%">
                        <div x-show="f.check && ['pending','nojoin'].includes(r.state)" style="display:flex;gap:4px;white-space:nowrap">
                          <button class="btn sm" :class="f.mark[r.email]==='in' && 'pri'" @click="setMark(f, r.email, 'in')">Đã vào</button>
                          <button class="btn sm" :class="f.mark[r.email]==='out' && 'pri'" @click="setMark(f, r.email, 'out')">Chưa vào</button>
                        </div>
                      </td>
                      <td>
                        <div class="mono" x-text="r.email || '(trống)'"></div>
                        <div class="mute" style="font-size:12px" x-show="r.email" x-text="(r.ctv ? 'CTV ' + r.ctv + ' · ' : '') + (r.hsd ? 'HSD ' + r.hsd : '')"></div>
<template x-if="em.row === r.row">
                          <div class="mv">
                            <input type="text" x-model="em.newEmail" placeholder="Mail mới (mail phụ của khách)" class="mono">
                            <label class="mute" style="font-size:13px"><input type="checkbox" x-model="em.invited"> Đã mời mail mới</label>
                            <label style="font-size:13px;width:100%;color:var(--bad)"><input type="checkbox" x-model="em.oldRemoved"> <b>Đã xoá mail cũ khỏi nhóm Gia đình</b> (hoặc mail cũ chưa từng vào nhóm). Bắt buộc, tránh 1 khách chiếm 2 slot.</label>
                            <label class="mute" style="font-size:13px" x-show="me.role==='admin'"><input type="checkbox" x-model="autoSync" @change="lsSet('thayfam_autosync', autoSync ? '1' : '0')"> Ghi luôn vào gốc</label>
                            <button class="btn sm pri" @click="doSwapMail(r)" :disabled="!!em.busy || !em.oldRemoved" x-text="em.busy ? 'Đang đổi…' : (em.confirm ? 'Bấm lần nữa để đổi' : 'Đổi mail')"></button>
                            <button class="btn sm" @click="em = {}">Huỷ</button>
                            <div class="mute" style="width:100%;font-size:12px">Mail gốc <b x-text="r.email"></b> sẽ chuyển sang cột Mail phụ để lưu. HSD, CTV giữ nguyên.</div>
                            <div class="err" style="width:100%;margin:0" x-show="em.error" x-text="em.error"></div>
                          </div>
                        </template>
                        <template x-if="mv.row === r.row">
                          <div class="mv">
                            <div class="mute" style="width:100%;font-size:12px" x-show="mv.replace" x-text="'Đổi khách: ' + mv.replace + ' sẽ được chép xuống cuối sheet DATA (không mất data).'"></div>
                            <input type="text" x-model="mv.email" placeholder="Email khách cần chuyển vào (đang ở fam khác)" class="mono">
                            <label class="mute" style="font-size:13px"><input type="checkbox" x-model="mv.invited"> Đã mời luôn</label>
                            <label class="mute" style="font-size:13px" x-show="me.role==='admin'"><input type="checkbox" x-model="autoSync" @change="lsSet('thayfam_autosync', autoSync ? '1' : '0')"> Ghi luôn vào gốc</label>
                            <button class="btn sm pri" @click="doMove(f, r)" :disabled="!!mv.busy" x-text="mv.busy ? 'Đang chuyển…' : (mv.confirm ? 'Bấm lần nữa để chuyển' : 'Chuyển vào')"></button>
                            <button class="btn sm" @click="mv = {}">Huỷ</button>
                            <div class="err" style="width:100%;margin:0" x-show="mv.error" x-text="mv.error"></div>
                          </div>
                        </template>
                      </td>
                      <td style="text-align:right;white-space:nowrap">
                        <span class="st" x-show="stLabel(r)" :class="stClass(r)" x-text="stLabel(r)"></span>
                        <button class="btn sm" x-show="['free','reuse','expiredIn'].includes(r.state) && mv.row !== r.row" @click="mv = { row: r.row, email: '', invited: false }">Chuyển khách vào</button>
                        <button class="btn sm" x-show="['pending','need','nojoin'].includes(r.state) && mv.row !== r.row" @click="mv = { row: r.row, email: '', invited: false, replace: r.email }" title="Đổi sang khách khác. Khách hiện tại được chép xuống cuối sheet DATA">Đổi khách</button>
                        <button class="btn sm" x-show="can('swapMail') && r.email && em.row !== r.row" @click="em = { row: r.row, newEmail: livePhu(r.mailPhu), invited: false }" title="Đổi sang mail phụ, giữ mail gốc ở cột Mail phụ">Đổi mail</button>
                        <button class="btn sm pri" x-show="r.state==='need' && !f.blockedUntil" @click="doInvite(f, r)" :disabled="!!r.busy" x-text="r.busy ? '…' : (r.confirm ? 'Bấm lần nữa' : 'Đã mời')"></button>
                      </td>
                    </tr>
                  </template>
                </tbody>
              </table>
              <div class="row" x-show="f.check" style="margin-top:8px">
                <span class="grow mute" style="font-size:13px" x-text="markCount(f, 'in') + ' đã vào · ' + markCount(f, 'out') + ' chưa vào (giữ slot, khi cần thì Đổi khách)'"></span>
                <button class="btn sm pri" @click="saveJoined(f)" :disabled="!Object.keys(f.mark).length || !!f.saving" x-text="f.saving ? 'Đang lưu…' : 'Lưu kiểm tra'"></button>
              </div>
            </div>
          </div>
        </template>
      </section>

      <!-- TAB NHẮC GIA HẠN -->
      <section x-show="tab==='renew' && !searchOn()">
        <div class="chips">
          <button class="chip" :class="ctvFilter==='' && 'on'" @click="ctvFilter=''">Tất cả</button>
          <template x-for="c in ctvList()" :key="c">
            <button class="chip" :class="ctvFilter===c && 'on'" @click="ctvFilter=c" x-text="c + ' (' + renewals.filter(r=>r.ctv===c).length + ')'"></button>
          </template>
        </div>
        <div class="row" x-show="can('sendMail') && filteredRenewals().length" style="margin-bottom:8px"><button class="btn sm" @click="filteredRenewals().forEach(r => { if (!mailSel[lcm(r.email)]) toggleMail(r.email, r.rn, r.hsd) })">✉ Chọn tất cả đang hiện</button></div>
        <template x-if="filteredRenewals().length===0"><div class="empty">Không có khách cần nhắc.</div></template>
        <template x-for="r in filteredRenewals()" :key="r.rn + r.email">
          <div class="card row">
            <div class="grow">
              <div class="mono ellip"><input type="checkbox" x-show="can('sendMail')" style="margin-right:6px" :checked="!!mailSel[lcm(r.email)]" @change="toggleMail(r.email, r.rn, r.hsd)" title="Chọn để gửi mail"><span x-text="r.email"></span><span class="badge" x-show="mailLog[lcm(r.email)]" style="margin-left:6px;cursor:pointer" :title="mailTip(r.email)" @click="mailInfo = mailInfo === lcm(r.email) ? '' : lcm(r.email)" x-text="'✉ ' + (mailLog[lcm(r.email)] || {}).at"></span><div class="mute" style="font-size:12px;white-space:pre-wrap;font-family:inherit" x-show="mailInfo && mailInfo === lcm(r.email)" x-text="mailTip(r.email)"></div></div>
              <div class="mute" style="font-size:13px"><span x-text="r.rn"></span> · HSD <span x-text="r.hsd"></span> · CTV <span x-text="r.ctv || '—'"></span></div>
            </div>
            <span class="badge" :class="r.daysLeft<0 ? 'bad' : (r.daysLeft<=3 ? 'warn' : '')" x-text="r.daysLeft<0 ? 'Hết hạn ' + (-r.daysLeft) + ' ngày' : (r.daysLeft===0 ? 'Hết hạn hôm nay' : 'Còn ' + r.daysLeft + ' ngày')"></span>
            <button class="btn sm" @click="copy(renewMsg(r), 'Đã copy tin nhắn')">Copy tin nhắn</button>
          </div>
        </template>
      </section>

      <!-- TAB ĐỒNG BỘ -->
      <section x-show="tab==='sync' && !searchOn()">
        <div class="card">
          <div class="row">
            <div class="grow">
              <b>Đối chiếu bản sao ↔ data gốc</b>
              <div class="mute" style="font-size:13px">Luật cố định: <b>Ngày mua, Số tháng, CTV lấy từ gốc</b> · <b>còn lại lấy từ bản sao</b> · email khách lệch thì bạn tự chọn. Làm đầu mỗi ca.<span x-show="lastPull" x-text="' Lần gần nhất: ' + lastPull"></span></div>
            </div>
            <button class="btn sm" @click="pullCheck()" :disabled="pulling" x-text="pulling && !pull ? 'Đang so…' : 'Kiểm tra'"></button>
          </div>
          <template x-if="pull">
            <div style="margin-top:10px">
              <div x-show="!pull.nRows" style="font-size:13px">✓ Hai bên đã khớp.</div>
              <div class="warn" x-show="pull.skipped && pull.skipped.length" x-text="'Bỏ qua (khối RN ở gốc lệch vị trí, cần làm tay): ' + (pull.skipped || []).join(', ')"></div>

              <div class="row" x-show="pull.nPush || pull.nPull" style="flex-wrap:wrap;gap:8px">
                <span class="grow" style="font-size:14px"><b x-text="pull.nPush"></b> ô bản sao → gốc · <b x-text="pull.nPull"></b> ô gốc → bản sao</span>
                <button class="btn sm" @click="pullShow = !pullShow" x-text="pullShow ? 'Ẩn chi tiết' : 'Xem chi tiết'"></button>
                <button class="btn sm" @click="askPushAll()" :disabled="pulling" title="Bỏ qua luật cột: chép MỌI ô lệch (trừ dòng email khách lệch) từ bản sao sang gốc" x-text="pushAllConfirm ? 'Bấm lần nữa: tất cả sao → gốc' : 'Tất cả sao → gốc'"></button>
                <button class="btn pri sm" @click="askPull()" :disabled="pulling" x-text="pulling ? 'Đang ghi…' : (pullConfirm ? 'Bấm lần nữa để ghi' : 'Đồng bộ theo luật')"></button>
              </div>
              <div style="overflow-x:auto;margin-top:8px" x-show="pullShow">
                <table>
                  <thead><tr><th>RN</th><th>Khách</th><th>Ô: bản sao ⇄ gốc</th><th></th></tr></thead>
                  <tbody>
                    <template x-for="r in pull.rows.filter(x => !x.review)" :key="r.key">
                      <tr>
                        <td x-text="r.rn"></td>
                        <td class="mono" x-text="r.email"></td>
                        <td class="mono" style="font-size:13px"><template x-for="c in r.cells" :key="c.field"><div><span x-text="c.field + ': '"></span><b x-text="c.sao || '(trống)'"></b> <span x-text="c.dir === 'push' ? '→' : '←'"></span> <span class="mute" x-text="c.goc || '(trống)'"></span></div></template></td>
                        <td style="white-space:nowrap;text-align:right">
                          <button class="btn sm" @click="pullRow(r.key, 'push')" :disabled="pulling" title="Chép cả dòng từ bản sao sang gốc">Sao → gốc</button>
                          <button class="btn sm" @click="pullRow(r.key, 'pull')" :disabled="pulling" title="Chép cả dòng từ gốc về bản sao">Gốc → sao</button>
                        </td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>

              <template x-if="pull.nReview">
                <div style="margin-top:14px">
                  <b style="color:#b42318" x-text="'Cần xem: ' + pull.nReview + ' dòng email khách lệch'"></b>
                  <div class="mute" style="font-size:13px">Thường do chuyển/đổi khách bằng tay ở gốc. Chọn bên đúng cho cả dòng.</div>
                  <template x-for="r in pull.rows.filter(x => x.review)" :key="r.key">
                    <div class="card" style="margin-top:8px;border-color:#f3b5ad">
                      <div class="row" style="flex-wrap:wrap;gap:8px">
                        <div class="rn" x-text="r.rn"></div>
                        <div class="grow mono" style="font-size:13px">
                          <template x-for="c in r.cells" :key="c.field"><div><span x-text="c.field + ': '"></span><b x-text="c.sao || '(trống)'"></b> <span class="mute">| gốc:</span> <span x-text="c.goc || '(trống)'"></span></div></template>
                        </div>
                        <button class="btn sm" @click="pullRow(r.key, 'push')" :disabled="pulling">Giữ bản sao</button>
                        <button class="btn sm" @click="pullRow(r.key, 'pull')" :disabled="pulling">Lấy gốc</button>
                      </div>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </template>
        </div>

        <div class="mute" style="font-size:13px;margin:16px 0 12px"><b>Đẩy bản sao → data gốc:</b> chỉ những ô mà webapp đã ghi. Duyệt thì chép sang data gốc.</div>
        <template x-if="reviewLoading"><div class="empty">Đang đối chiếu…</div></template>
        <template x-if="!reviewLoading && review.length===0"><div class="empty">Không có thay đổi nào chờ đồng bộ.<br>Sau mỗi lần Thay fam → Hoàn tất, thay đổi hiện ở đây để bạn đối chiếu và bấm <b>Duyệt & đồng bộ</b> sang data gốc.</div></template>
        <div class="row" x-show="review.length > 1" style="margin-bottom:10px">
          <label class="grow" style="font-size:14px"><input type="checkbox" :checked="syncSel.length && syncSel.length === review.filter(x => !x.rowMismatch).length" @change="syncSel = $event.target.checked ? review.filter(x => !x.rowMismatch).map(x => x.id) : []"> Chọn tất cả (<span x-text="syncSel.length"></span>/<span x-text="review.filter(x => !x.rowMismatch).length"></span>)</label>
          <button class="btn pri sm" @click="batchSync()" :disabled="!syncSel.length || !!undoBusy" x-text="batchBusy ? 'Đang đồng bộ ' + batchBusy : (batchConfirm ? 'Bấm lần nữa: ghi ' + syncSel.length + ' mục vào gốc' : 'Duyệt ' + syncSel.length + ' mục đã chọn')"></button>
        </div>
        <div class="warn" x-show="batchReport" x-text="batchReport"></div>
        <template x-for="it in review" :key="it.id">
          <div class="card">
            <div class="row">
              <input type="checkbox" x-show="!it.rowMismatch" :checked="syncSel.includes(it.id)" @change="syncSel = $event.target.checked ? [...syncSel, it.id] : syncSel.filter(x => x !== it.id)">
              <div class="rn" x-text="it.rn"></div>
              <div class="grow">
                <div class="mono ellip"><span x-text="it.oldEmail"></span> → <span x-text="it.newEmail"></span></div>
                <div class="mute" style="font-size:13px"><span x-text="it.time"></span> · <span x-text="it.fr"></span> · <span x-text="it.cells.length + ' ô khác gốc'"></span></div>
              </div>
              <button class="btn pri sm" @click="askSync(it.id)" :disabled="!!undoBusy || !!it.rowMismatch" x-text="undoBusy===it.id ? 'Đang đồng bộ…' : (syncConfirm===it.id ? 'Bấm lần nữa để ghi vào gốc' : 'Duyệt & đồng bộ')"></button>
            </div>
            <div class="warn" x-show="it.rowMismatch" x-text="it.rowMismatch + ' — dòng bị lệch, không đồng bộ tự động được.'"></div>
            <div class="warn" x-show="it.cells.some(c=>c.conflict)">Ô tô vàng: data gốc đã bị sửa sau khi tạo bản sao. Duyệt sẽ ghi đè.</div>
            <div style="overflow-x:auto;margin-top:8px">
              <table>
                <thead><tr><th>Ô</th><th>Data gốc (hiện tại)</th><th>Bản sao (sẽ ghi vào gốc)</th></tr></thead>
                <tbody>
                  <template x-for="c in it.cells" :key="c.cell">
                    <tr :class="c.conflict && 'conf'"><td x-text="c.cell"></td><td class="mono" x-text="c.goc || '(trống)'"></td><td class="mono" x-text="c.sao || '(trống)'"></td></tr>
                  </template>
                </tbody>
              </table>
            </div>
            <div style="font-size:13px;margin-top:8px" x-show="it.banned">
              FamRenew: <span class="mono" x-text="it.banned && it.banned.email"></span> (<span x-text="it.banned && it.banned.fr"></span>)
              → Trạng thái <b>Banned</b><span class="mute" x-text="it.banned && it.banned.curStatus ? ' (hiện: ' + it.banned.curStatus + ')' : ''"></span>,
              ghi chú "<span x-text="it.banned && it.banned.note"></span>"
            </div>
            <div class="warn" x-show="!it.banned && it.id.indexOf('TF') === 0">Không tìm thấy email cũ trong FamRenew KHO_RENEW, nên sẽ không đánh Banned được.</div>
            <div class="mute" style="font-size:12px;margin-top:6px" x-show="it.skippedFr">2FA của FR đã ghi thẳng vào FamRenew lúc thay fam, không cần đồng bộ.</div>
          </div>
        </template>
      </section>

      <!-- TAB CẦN XỬ LÝ (admin) -->
      <section x-show="tab==='notes' && !searchOn()">
        <div class="mute" style="font-size:13px;margin-bottom:12px">Fam còn slot trống sau khi thay (tự báo) và ghi chú của nhân viên / outsource. Xử lý xong bấm <b>Đã xử lý</b>.</div>
        <template x-if="notesLoading"><div class="empty">Đang tải…</div></template>
        <template x-if="!notesLoading && notes.length===0"><div class="empty">Không có gì cần xử lý.</div></template>
        <template x-for="n in notes" :key="n.id">
          <div class="card" :style="n.status!=='Mở' && 'opacity:.55'">
            <div class="row">
              <button class="btn sm" @click="q = n.rn; doSearch()" title="Mở fam này" x-text="n.rn || '—'" style="font-weight:700"></button>
              <span class="badge" :class="n.type==='Dư slot' ? 'warn' : (n.type==='Chờ mời' ? (n.dueReached ? 'ok' : 'bad') : '')" x-text="n.type==='Chờ mời' && n.status==='Mở' ? (n.dueReached ? 'Đến ngày mời lại' : 'Chờ mời đến ' + n.due) : n.type"></span>
              <span class="grow mute" style="font-size:13px" x-text="n.time + ' · ' + n.by + (n.status!=='Mở' ? ' · ' + n.status + (n.doneBy ? ' bởi ' + n.doneBy + ' ' + n.doneAt : '') : '')"></span>
              <button class="btn sm" x-show="n.status==='Mở'" @click="noteOp('done', n.id)" :disabled="noteBusy">Đã xử lý</button>
              <button class="btn sm" x-show="n.status==='Đã xử lý'" @click="noteOp('reopen', n.id)" :disabled="noteBusy">Mở lại</button>
            </div>
            <div style="margin-top:6px;font-size:14px;white-space:pre-wrap" x-text="n.text"></div>
          </div>
        </template>
      </section>

      <!-- TAB TÀI KHOẢN (admin) -->
      <section x-show="tab==='users' && !searchOn()">
        <div class="card">
          <b>Thêm tài khoản</b>
          <div class="row" style="margin-top:8px">
            <input type="text" x-model="newUser.name" placeholder="Tên (vd: Hùng)" style="flex:1;min-width:140px" @keydown.enter="userOp('add', newUser)">
            <select x-model="newUser.role">
              <option value="outsource">Outsource</option>
              <option value="nhanvien">Nhân viên</option>
            </select>
            <button class="btn pri sm" @click="userOp('add', newUser)" :disabled="usersBusy || !newUser.name.trim()">Thêm</button>
          </div>
          <template x-if="newKeyMsg">

<script>
/* ========= ĐIỀN SAU KHI DEPLOY APPS SCRIPT ========= */
const RENEW_API = 'https://script.google.com/macros/s/AKfycbwWQkopYjL131FKXIN1A_UU5VykUaj8YRL_rP0ZVVmqeqYo_hVyi7JdpmcCIX1eJzd1/exec'; // hệ thống báo lỗi (renew)
const API_URL = 'https://script.google.com/macros/s/AKfycby2lwu9UYCAsbYMZtXnGTLMWlRE2aaO_FaBG312jiBEEjZdf5NotZsJ06I39TgG3Zjg/exec';
const FIXYTB_URL = 'https://godnc.com/fixytb/';

const PRICES = [['1 tháng', '30k'], ['3 tháng', '80k'], ['6 tháng', '150k'], ['12 tháng', '280k']];

function app() {
  return {
    pass: lsGet('thayfam_pass') || '', passInput: '',
    tab: 'due', ahead: 0, loading: false, error: '', lastDone: '', notify: null,
    slots: [], slotsLoading: false, slotsLoaded: false, slotFilter: '', slotLimit: 6, slotPendingH: 24, slotOtp: {}, mv: {}, em: {}, pick: { row: null, list: [] }, mp: { items: [], loading: false, loaded: false }, mailSel: {}, mailLog: {}, mailFrom: '', mailInfo: '', mailOpen: false, mailSubject: '', mailBody: '', mailBusy: false, mailConfirm: false, mailErr: '',
    mailTpl: {
      'Đã chuyển nhóm': ['YouTube Premium: bạn đã được chuyển sang nhóm mới', 'Chào bạn,\n\nNhóm YouTube Premium của bạn vừa được chuyển sang nhóm mới. Bạn mở Gmail ({email}), tìm thư mời "Tham gia nhóm gia đình" của Google và bấm Chấp nhận nhé.\n\nHướng dẫn chi tiết: https://godnc.com/fixytb/?email={email}\n\nHạn sử dụng của bạn: {hsd}.\nCảm ơn bạn đã dùng dịch vụ của shop!'],
      'Đang xử lý lỗi': ['YouTube Premium: shop đang xử lý nhóm của bạn', 'Chào bạn,\n\nNhóm YouTube Premium của email {email} đang được shop xử lý. Bạn xem trạng thái tại: https://godnc.com/fixytb/?email={email}\n\nXong shop sẽ báo lại ngay. Cảm ơn bạn đã kiên nhẫn!'],
      'Nhắc gia hạn': ['YouTube Premium của bạn sắp hết hạn ({hsd})', 'Chào bạn,\n\nGói YouTube Premium của email {email} sẽ hết hạn ngày {hsd}. Bạn muốn gia hạn thì nhắn shop qua Zalo nhé.\n\nCảm ơn bạn!'],
      'Trống': ['', ''],
    }, autoSync: lsGet('thayfam_autosync') !== '0', syncSel: [], batchBusy: '', batchConfirm: false, batchReport: '',
    blocks: [], blocksLoading: false, blocksBusy: '', blocksOpen: 0, blocksDue: 0, blockWait: 5,
    today: '', due: [], reported: [], renewals: [], frs: [], skipped: [],
    ctvFilter: '', log: [], logLoading: false, actions: [],
    lastActionId: '', undoConfirm: '', undoBusy: '', undoConflict: null,
    review: [], reviewLoading: false, syncConfirm: '', openRows: [],
    q: '', results: [], searching: false, searchTotal: 0,
    me: { name: '', role: '', perms: [] },
    notes: [], notesLoading: false, openNotes: 0, noteBusy: false, noteFor: '', noteText: '',
    users: [], usersLoading: false, usersBusy: false, usersLimit: 10, limitInput: 10,
    newUser: { name: '', role: 'outsource' }, newKeyMsg: '', userConfirm: '',
    pull: null, pulling: false, pullConfirm: false, pushAllConfirm: false, pullShow: false, lastPull: '',
    swap: null, swapError: '', confirming: false, saving: false,
    otp: { old: '', fr: '' }, otpPct: 100, toast: '',

    init() {
      // Bấm vào bất kỳ email nào → tự copy
      document.addEventListener('click', e => {
        const t = e.target;
        if (!t || t.closest('button, input, a, label')) return;
        const txt = (t.textContent || '').trim();
        if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(txt) && t.children.length === 0) {
          this.copy(txt, 'Đã copy ' + txt);
          if (this.swap && this.swap.f.customers.some(c => c.email === txt) && !this.swap.copied.includes(txt)) this.swap.copied.push(txt);
        }
      });
      if (this.pass) this.load(); setInterval(() => this.tickOtp(), 1000); },

    async api(body) {
      const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, pass: this.pass }) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'Lỗi không rõ');
      return data;
    },
    async login() { this.pass = this.passInput; this.error = ''; await this.load(); if (this.pass) lsSet('thayfam_pass', this.pass); },
    logout() { this.pass = ''; lsSet('thayfam_pass', ''); this.me = { name: '', role: '', perms: [] }; this._reviewed = false; this.review = []; this.tab = 'due'; },

    async load() {
      this.loading = true; this.error = '';
      try {
        const d = await this.api({ action: 'dashboard', ahead: this.ahead });
        this.today = d.today; this.due = d.due; this.reported = d.reported || []; this.renewals = d.renewals;
        this.me = d.me || { name: 'Admin', role: 'admin', perms: [] };
        if (d.openNotes !== null && d.openNotes !== undefined) this.openNotes = d.openNotes;
        this.blocksOpen = d.blocksOpen || 0; this.blocksDue = d.blocksDue || 0;
        if (!this.can('review') && this.tab === 'sync') this.tab = 'due';
        if (this.me.role === 'outsource' && this.tab === 'renew') this.tab = 'due';
        if (this.can('review') && !this._reviewed) { this._reviewed = true; this.loadReview(); }
        if (this.can('slots') && !this.slotsLoaded && !this.slotsLoading) this.loadSlots();
        if (this.can('mailLog') && !this._mailLoaded) { this._mailLoaded = true; this.loadMailLog(); }
        this.frs = d.frs.filter(x => !this.skipped.includes(x.row));
      } catch (e) {
        this.error = e.message;
        if (/mật khẩu/i.test(e.message)) { this.pass = ''; lsSet('thayfam_pass', ''); }
      }
      this.loading = false;
    },
    async loadLog() {
      this.logLoading = true;
      try { const d = await this.api({ action: 'log', days: 30 }); this.log = d.log; this.actions = d.actions || []; } catch (e) { this.error = e.message; }
      this.logLoading = false;
    },

    notifyMsg(n, it) {
      return 'Chào bạn, nhóm YouTube Premium của bạn vừa được chuyển sang nhóm mới.\n'
        + 'Bạn làm theo 3 bước ở link này nhé (khoảng 1 phút): ' + n.url + '?email=' + encodeURIComponent(it.email);
    },
    copyNotify(n, it) { this.copy(this.notifyMsg(n, it), 'Đã copy tin cho ' + it.email); if (!n.sent.includes(it.email)) n.sent.push(it.email); },
    async autoSyncAfter(id) {
      if (this.me.role !== 'admin' || !this.autoSync || !id) return;
      try {
        const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', id: id, pass: this.pass }) }).then(x => x.json());
        this.lastDone = this.lastDone.replace(/ Hoàn tác được.*$/, '') + (r.ok ? ' Đã ghi luôn vào data gốc (' + r.cells + ' ô).' : ' CHƯA ghi vào gốc: ' + (r.error || 'lỗi') + ' Vào tab Đồng bộ để xử lý.');
      } catch (e) { this.lastDone += ' CHƯA ghi vào gốc (' + e.message + '). Vào tab Đồng bộ để xử lý.'; }
    },
    async doSwapMail(c) {
      const m = this.em;
      m.error = '';
      const ne = String(m.newEmail || '').trim();

      this.usersLoading = true;
      try { this.setUsers(await this.api({ action: 'users', op: 'list' })); }
      catch (e) { this.error = /không được dùng/.test(e.message) ? 'Apps Script đang chạy bản cũ, chưa có chức năng Tài khoản. Dán lại Code.gs mới rồi Deploy → New version.' : e.message; }
      this.usersLoading = false;
    },
    setUsers(d) { this.users = d.users; this.usersLimit = d.limit; this.limitInput = d.limit; },
    loginMsg(u) { return 'Trang: ' + (location.protocol === 'file:' ? 'https://godnc.com/thayfam/' : location.href.split('?')[0].split('#')[0]) + '\nTên: ' + u.name + '\nKey đăng nhập: ' + u.key; },
    askUser(op, u) {
      const k = op + ':' + u.name;
      if (this.userConfirm !== k) { this.userConfirm = k; clearTimeout(this._uc); this._uc = setTimeout(() => this.userConfirm = '', 4000); return; }
      this.userConfirm = ''; this.userOp(op, { name: u.name });
    },
    async userOp(op, data) {
      this.usersBusy = true; this.error = ''; this.newKeyMsg = '';
      try {
        const d = await this.api(Object.assign({ action: 'users', op }, data));
        this.setUsers(d);
        const u = d.users.find(x => x.name === (data.name || '').trim());
        if (op === 'add' && u) { this.newKeyMsg = this.loginMsg(u); this.newUser = { name: '', role: this.newUser.role }; }
        if (op === 'reset' && u) this.newKeyMsg = this.loginMsg(u);
        if (op === 'limit') { this.toast = 'Đã lưu giới hạn ' + d.limit + '/ngày'; setTimeout(() => this.toast = '', 1500); }
      } catch (e) { this.error = e.message; }
      this.usersBusy = false;
    },
    can(a) { return (this.me.perms || []).includes(a); },
    roleName() { return { admin: 'Admin', nhanvien: 'Nhân viên', outsource: 'Outsource' }[this.me.role] || this.me.role; },
    searchOn() { return this.can('search') && this.q.trim().length >= 2; },
    async doSearch() {
      const q = this.q.trim();
      if (q.length < 2) { this.results = []; return; }
      this.searching = true;
      try { const d = await this.api({ action: 'search', q }); if (this.q.trim() === q) { this.results = d.items; this.searchTotal = d.total; } }
      catch (e) { this.error = e.message; }
      this.searching = false;
    },
    toggleOpen(rn) { this.openRows = this.openRows.includes(rn) ? this.openRows.filter(x => x !== rn) : [...this.openRows, rn]; },
    isOpen(rn) { return this.openRows.includes(rn); },
    // Kết quả tìm có thành viên khớp thì tự mở; bấm ▾ để đóng lại
    expanded(f) { const auto = this.searchOn() && f.hit && f.hit.length; return auto ? !this.openRows.includes(f.rn) : this.openRows.includes(f.rn); },
    askUndo(id) {
      if (this.undoConfirm !== id) { this.undoConfirm = id; clearTimeout(this._u); this._u = setTimeout(() => this.undoConfirm = '', 4000); return; }
      this.undoConfirm = ''; this.doUndo(id, false);
    },
    async doUndo(id, force) {
      this.undoBusy = id; this.error = ''; this.undoConflict = null;
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'undo', id, force: !!force, pass: this.pass }) });
        const r = await res.json();
        if (r.conflict) { this.undoConflict = { kind: 'undo', id, msg: r.error }; }
        else if (!r.ok) { this.error = r.error; }
        else {
          this.lastDone = '↩ Đã hoàn tác ' + r.rn + ' về ' + r.restoredTo + (r.goc ? ' (cả data gốc)' : '') + ' (' + r.fr + ' trả lại kho FR).';
          if (this.lastActionId === id) this.lastActionId = '';
          await this.load(); if (this.tab === 'log') await this.loadLog(); if (this.tab === 'sync') await this.loadReview();
        }
      } catch (e) { this.error = e.message; }
      this.undoBusy = '';
    },
    async loadReview() {
      this.reviewLoading = true;
      try { const d = await this.api({ action: 'review' }); this.review = d.items; this.lastPull = d.lastPull || ''; } catch (e) { this.error = e.message; }
      this.reviewLoading = false;
    },
    async pullCheck() {
      this.pulling = true; this.pull = null; this.pullConfirm = false; this.error = '';
      try { this.pull = await this.api({ action: 'pull' }); } catch (e) { this.error = e.message; }
      this.pulling = false;
    },
    askPull() {
      if (!this.pullConfirm) { this.pullConfirm = true; clearTimeout(this._p); this._p = setTimeout(() => this.pullConfirm = false, 4000); return; }
      this.pullConfirm = false;
      this.doPull(this.pull.rows.filter(r => !r.review).map(r => ({ key: r.key, dir: 'auto' })));
    },
    pullCells() { return (this.pull ? this.pull.rows : []).filter(r => !r.review).flatMap(r => r.cells.map(c => Object.assign({ rn: r.rn, email: r.email }, c))); },
    askPushAll() {
      if (!this.pushAllConfirm) { this.pushAllConfirm = true; clearTimeout(this._pa); this._pa = setTimeout(() => this.pushAllConfirm = false, 4000); return; }
      this.pushAllConfirm = false;
      this.doPull(this.pull.rows.filter(r => !r.review).map(r => ({ key: r.key, dir: 'push' })));
    },
    pullRow(key, dir) { this.doPull([{ key: key, dir: dir }]); },
    async doPull(items) {
      this.pulling = true; this.error = ''; this.lastDone = '';
      try {
        const r = await this.api({ action: 'pull', apply: true, items: items });
        this.lastDone = '✓ Đồng bộ ' + r.nRowsDone + ' dòng: ' + r.pushed + ' ô → gốc, ' + r.pulled + ' ô ← gốc.' + (r.id ? ' Hoàn tác phần ghi gốc ở tab Lịch sử (' + r.id + ').' : '');
        if (r.lastPull) this.lastPull = r.lastPull;
        await this.load();
        this.pulling = false;
        await this.pullCheck();
      } catch (e) { this.error = e.message; }
      this.pulling = false;
    },
    async batchSync() {
      if (!this.batchConfirm) { this.batchConfirm = true; clearTimeout(this._bc); this._bc = setTimeout(() => this.batchConfirm = false, 4000); return; }
      this.batchConfirm = false; this.batchReport = ''; this.error = ''; this.lastDone = '';
      const ids = this.review.filter(x => this.syncSel.includes(x.id)).map(x => x.id);
      let ok = 0; const conflicts = [], errors = [];
      for (let k = 0; k < ids.length; k++) {
        const id = ids[k], it = this.review.find(x => x.id === id);
        this.batchBusy = (k + 1) + '/' + ids.length; this.undoBusy = id;
        try {
          const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', id, force: false, pass: this.pass }) });
          const r = await res.json();
          if (r.conflict) conflicts.push(it.rn);
          else if (!r.ok) errors.push(it.rn + ': ' + r.error);
          else ok++;
        } catch (e) { errors.push(it.rn + ': ' + e.message); }
      }
      this.batchBusy = ''; this.undoBusy = ''; this.syncSel = [];
      this.lastDone = '✓ Đã đồng bộ ' + ok + '/' + ids.length + ' mục sang data gốc.';
      if (conflicts.length || errors.length) this.batchReport = (conflicts.length ? 'Chưa đồng bộ vì data gốc đã bị sửa (xem từng mục, duyệt riêng nếu muốn ghi đè): ' + conflicts.join(', ') + '. ' : '') + (errors.length ? 'Lỗi: ' + errors.join('; ') : '');
      await this.loadReview();
    },
    askSync(id) {
      if (this.syncConfirm !== id) { this.syncConfirm = id; clearTimeout(this._s); this._s = setTimeout(() => this.syncConfirm = '', 4000); return; }
      this.syncConfirm = ''; this.doSync(id, false);
    },
    async doSync(id, force) {
      this.undoBusy = id; this.error = ''; this.undoConflict = null; this.lastDone = '';
      try {
        const res = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'sync', id, force: !!force, pass: this.pass }) });
        const r = await res.json();
        if (r.conflict) { this.undoConflict = { kind: 'sync', id, msg: r.error }; }
        else if (!r.ok) { this.error = r.error; }
        else { this.lastDone = '✓ Đã đồng bộ ' + r.rn + ' sang data gốc (' + r.cells + ' ô)' + (r.banned ? ', ' + r.banned + ' → Banned' : '') + '. Vẫn hoàn tác được ở tab Lịch sử.'; await this.loadReview(); }
      } catch (e) { this.error = e.message; }
      this.undoBusy = '';
    },
    copySelected() {
      const list = this.swap.f.customers.map(c => c.email).filter(e => this.swap.sel.includes(e));
      this.copy(list.join(', '), 'Đã copy ' + list.length + ' email');
      list.forEach(e => { if (!this.swap.copied.includes(e)) this.swap.copied.push(e); });
    },
    copyCus(email) { this.copy(email); if (!this.swap.copied.includes(email)) this.swap.copied.push(email); },

    async complete() {
      this.saving = true; this.swapError = '';
      const s = this.swap;
      try {
        const r = await this.api({
          action: 'complete', rn: s.f.rn, stockRow: s.f.stockRow, oldEmail: s.f.email,
          fr: s.fr.fr, frRow: s.fr.row, frEmail: s.fr.email, invited: s.sel, twofa: s.fr.twofa ? '' : s.newTwofa, note: s.note,
        });
        this.lastDone = '✓ ' + r.rn + ': ' + r.oldEmail + ' → ' + r.newEmail + ' (' + r.fr + '), renew ' + r.renew + ', mời ' + r.invited + '/' + r.customers + ' khách, trạng thái ' + r.status + '.' + (r.closedTickets ? ' Đã đóng ' + r.closedTickets + ' ticket báo lỗi.' : '')
;
        this.lastActionId = r.actionId || '';
        const zaloOf = e => { const x = s.f.report && s.f.report.reporters.find(p => p.email === String(e).toLowerCase()); return x ? x.zalo : ''; };
        this.notify = { rn: r.rn, url: r.fixUrl || FIXYTB_URL, sent: [], items: s.f.customers.filter(c => s.sel.includes(c.email)).map(c => ({ email: c.email, ctv: c.ctv, zalo: zaloOf(c.email) })) };
        if (!this.notify.items.length) this.notify = null;
        if (this.me.role === 'admin') this.openNotes += (r.invited < 5 ? 1 : 0) + (s.note && s.note.trim() ? 1 : 0);
        if (this.me.limit) this.me.usedToday++;
        this.loadReview();
        this.due = this.due.filter(x => x.rn !== s.f.rn);
        this.reported = this.reported.filter(x => x.rn !== s.f.rn);
        this.frs = this.frs.filter(x => x.row !== s.fr.row);
        this.swap = null;
      } catch (e) { this.swapError = e.message; }
      this.saving = false; this.confirming = false;
    },

    async tickOtp() {
      const sec = Math.floor(Date.now() / 1000);
      this.otpPct = ((30 - (sec % 30)) / 30) * 100;
      if (this.tab === 'slots' && !this.searchOn()) {
        const m = {};
        for (const f of this.filteredSlots()) if (f.twofa) m[f.rn] = await totp(f.twofa);
        this.slotOtp = { ...this.slotOtp, ...m };
      }
      if (this.searchOn() || this.tab === 'due' || this.tab === 'report') {
        const m = {};
        for (const f of (this.searchOn() ? this.results : (this.tab === 'report' ? this.reported : this.due))) if (f.twofa && this.expanded(f)) m['S' + f.rn] = await totp(f.twofa);
        this.slotOtp = { ...this.slotOtp, ...m };
      }
      if (this.pick.list && this.pick.list.length) {
        const t = this.cur();
        this.slotOtp = { ...this.slotOtp, P: t.fam && t.fam.twofa ? await totp(t.fam.twofa) : '' };
      }
      if (this.tab === 'slots' && this.slotFilter === 'mp') {
        const m = {};
        for (const f of this.mp.items) if (f.twofa) m['M' + f.rn] = await totp(f.twofa);
        this.slotOtp = { ...this.slotOtp, ...m };
      }
      if (this.tab === 'blocks') {
        const m = {};
        for (const b of this.blocks) if (b.twofa) m['B' + b.rn] = await totp(b.twofa);
        this.slotOtp = { ...this.slotOtp, ...m };
      }
      if (!this.swap) return;
      this.otp.old = this.swap.f.twofa ? await totp(this.swap.f.twofa) : '';
      this.otp.fr = this.frSecret() ? await totp(this.frSecret()) : '';
    },

    async copy(text, msg) {
      if (!text) return;
      try { await navigator.clipboard.writeText(text); }
      catch (e) { const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
      this.toast = msg || 'Đã copy'; clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 1200);
    },
  };
}

/* ===== TOTP (mã 2FA 6 số từ secret) ===== */
async function totp(secret) {
  try {
    const key = base32(secret);
    if (!key.length) return '';
    const counter = Math.floor(Date.now() / 30000);
    const buf = new ArrayBuffer(8); const v = new DataView(buf);
    v.setUint32(0, Math.floor(counter / 2 ** 32)); v.setUint32(4, counter >>> 0);
    const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const h = new Uint8Array(await crypto.subtle.sign('HMAC', k, buf));
    const o = h[h.length - 1] & 15;
    const code = ((h[o] & 127) << 24 | h[o + 1] << 16 | h[o + 2] << 8 | h[o + 3]) % 1e6;
    return String(code).padStart(6, '0');
  } catch (e) { return ''; }
}
function base32(s) {
  const A = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
  const clean = String(s).toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '', out = [];
  for (const c of clean) bits += A.indexOf(c).toString(2).padStart(5, '0');
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
