<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>FIRE5Y</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0D3B3E">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icon-180.png">?v=3
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700;800&family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: một cột app 480px, lịch là màn chính, nav dưới + nút ghi nổi. Nhận diện trail: Ocean Deep / Dawn Gold / Sea Foam / Trail Moss / Berry Alert / Ink Teal */
:root{
  --bg:#EAF2F0; --surface:#F8FBFA; --surface-2:#DDEAE6; --line:#C9DDD8;
  --ink:#16282A; --ink-2:#4D6467; --ink-3:#7C9295;
  --ocean:#0D3B3E; --accent:#0D3B3E; --accent-fg:#EAF2F0;
  --gold:#E3A73B; --gold-ink:#9A6410; --moss:#5C8A62; --berry:#A63A50;
  --hero-bg:#0D3B3E; --hero-fg:#EAF2F0; --hero-2:#9FC3BF;
  --h1:rgba(92,138,98,.16); --h2:rgba(92,138,98,.38); --h3:rgba(227,167,59,.55); --h4:rgba(166,58,80,.62);
  --shadow:0 10px 30px rgba(13,59,62,.18);
  --f-display:"Be Vietnam Pro",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A1C; --surface:#13262A; --surface-2:#1A3236; --line:#24413F;
  --ink:#E4EFEC; --ink-2:#A0B8B5; --ink-3:#6E8887;
  --accent:#7CC2BC; --accent-fg:#0C1A1C; --gold-ink:#E9B65A; --moss:#7DB083; --berry:#E07289;
  --hero-bg:#0F3A3D; --hero-fg:#EAF2F0; --hero-2:#8DB5B1;
  --h1:rgba(125,176,131,.16); --h2:rgba(125,176,131,.36); --h3:rgba(227,167,59,.5); --h4:rgba(224,114,137,.58);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A1C; --surface:#13262A; --surface-2:#1A3236; --line:#24413F;
  --ink:#E4EFEC; --ink-2:#A0B8B5; --ink-3:#6E8887;
  --accent:#7CC2BC; --accent-fg:#0C1A1C; --gold-ink:#E9B65A; --moss:#7DB083; --berry:#E07289;
  --hero-bg:#0F3A3D; --hero-fg:#EAF2F0; --hero-2:#8DB5B1;
  --h1:rgba(125,176,131,.16); --h2:rgba(125,176,131,.36); --h3:rgba(227,167,59,.5); --h4:rgba(224,114,137,.58);
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{max-width:480px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h2{font-size:17px;font-weight:700}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.section{display:flex;flex-direction:column;gap:10px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:-.01em}
.brand b{color:var(--gold-ink)}
.month-nav{display:flex;align-items:center;gap:4px}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icon-btn svg{width:18px;height:18px}
.month-label{font-family:var(--f-display);font-weight:700;min-width:96px;text-align:center}

.banner{background:var(--surface-2);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.banner button{border:0;background:none;color:var(--accent);font-weight:600;padding:0}

/* hero */
.hero{background:var(--hero-bg);color:var(--hero-fg);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--hero-2)}
.hero-amt{font-family:var(--f-mono);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.02em}
.hero-amt.over{color:#F2A0B0}
.hero-sub{font-size:13px;color:var(--hero-2);display:flex;gap:14px;flex-wrap:wrap}
.hero-sub b{color:var(--hero-fg);font-family:var(--f-mono);font-weight:500}
.hero-ridge{position:absolute;right:0;bottom:0;width:45%;height:56px;opacity:.12;pointer-events:none}
.hero button.link{align-self:flex-start;background:var(--gold);color:#16282A;border:0;border-radius:10px;padding:8px 12px;font-weight:600;margin-top:6px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.dow{font-size:11px;text-align:center;color:var(--ink-3);font-weight:600;padding-bottom:2px}
.day{aspect-ratio:1/1.08;max-width:100%;border-radius:10px;border:1px solid transparent;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 4px;position:relative;min-width:0;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.day.empty{background:none}
.day .d{font-size:12px;font-weight:600;color:var(--ink-2)}
.day .s{font-family:var(--f-mono);font-size:10px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.day.h1{background:var(--h1)} .day.h2{background:var(--h2)} .day.h3{background:var(--h3)} .day.h4{background:var(--h4)}
.day.today{border-color:var(--ink)}
.day.sel{box-shadow:inset 0 0 0 2px var(--gold)}
.day.future .d{color:var(--ink-3)}
.day .inc{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--gold)}
.day .bill{position:absolute;top:5px;left:5px;width:6px;height:6px;border-radius:2px;border:1.5px solid var(--berry)}
.daytip{position:fixed;z-index:30;width:260px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px;pointer-events:none;display:flex;flex-direction:column;gap:6px}
.daytip .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.daytip .r{display:flex;justify-content:space-between;gap:10px;min-width:0}
.daytip .r span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.daytip .r span:last-child{font-family:var(--f-mono);white-space:nowrap}
.daytip .more{color:var(--ink-3);font-size:12px}
.legend{display:flex;gap:10px;align-items:center;font-size:11px;color:var(--ink-3);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}

/* stats */
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio .card{padding:10px 12px}
.trio .v{font-family:var(--f-mono);font-weight:600;font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos{color:var(--moss)} .neg{color:var(--berry)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:10px var(--f-mono)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:flex;flex-direction:column;gap:4px}
.bar-row .row{font-size:13px}
.bar-track{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar-fill{height:100%;border-radius:4px;background:var(--moss)}
.bar-fill.warn{background:var(--gold)} .bar-fill.over{background:var(--berry)}
.hint{font-size:12px;color:var(--ink-3)}

/* lists */
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item .main{flex:1;min-width:0}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .m{font-size:12px;color:var(--ink-3)}
.item .a{font-family:var(--f-mono);font-weight:600;white-space:nowrap}
.item.tap{cursor:pointer}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.late{background:var(--h4);color:var(--ink)} .chip.soon{background:var(--h3);color:var(--ink)} .chip.ok{background:var(--h1);color:var(--ink-2)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13px;white-space:nowrap}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.btn.gold{background:var(--gold);color:#16282A;border-color:transparent}
.btn.ghost{background:none}
.btn.danger{color:var(--berry)}
.btn.block{width:100%;padding:12px;font-size:15px;border-radius:12px}
.empty-note{padding:18px 4px;text-align:center;color:var(--ink-3);font-size:13px}

/* nav + fab */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:6px 0}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="page"]{color:var(--accent)}
.fab{position:fixed;z-index:21;right:max(18px,calc((100vw - 480px)/2 + 6px),calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(76px + env(safe-area-inset-bottom,0px));
  width:58px;height:58px;border-radius:18px;border:0;background:var(--gold);color:#16282A;box-shadow:var(--shadow);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* sheet */
.backdrop{position:fixed;inset:0;z-index:40;background:rgba(10,24,26,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;
  padding:16px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;animation:up .2s ease}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
@keyframes up{from{transform:translateY(30px);opacity:.6}} @keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{border:0;background:none;border-radius:8px;padding:8px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg3{grid-template-columns:1fr 1fr 1fr}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2);min-width:0}
.inp{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:15px;color:var(--ink);min-width:0}
textarea.inp{resize:none;font-size:18px;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 11px;font-size:13px;font-weight:500}
.chips button.on{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.preview{display:flex;flex-direction:column;gap:6px}
.pv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 10px;border-radius:10px;background:var(--surface-2)}
.pv .a{font-family:var(--f-mono);font-weight:600}
.pv.bad{color:var(--berry)}
.toast{position:fixed;z-index:60;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);max-width:calc(100vw - 32px);width:max-content;
  background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:up .2s ease}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 0}
.kv .num{font-weight:600}
.big{font-family:var(--f-mono);font-size:30px;font-weight:600;letter-spacing:-.02em}
.progress{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--moss),var(--gold));border-radius:5px}
.legend-line{display:flex;gap:14px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.legend-line i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
</style>

</head>
<body>
<div class="app" id="app"></div>

<nav class="nav" aria-label="Điều hướng"><div class="nav-in" id="nav"></div></nav>
<button class="fab" id="fab" aria-label="Ghi khoản mới"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
(() => {
/* ================= dữ liệu ================= */
const KEY = 'fire5y_v3';
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbzm49bx5a2HCd1Bb9QX58aj3lxZET_WnJSri-46ynMAxOkWjtpsftQHlhdUWIga4tnq/exec';
const DEFAULT_CATS = [
  {name:'Ăn uống',type:'Chi',budget:4500000},{name:'Cà phê',type:'Chi',budget:1200000},
  {name:'Đi lại',type:'Chi',budget:1000000},{name:'Nhà & hoá đơn',type:'Chi',budget:0},
  {name:'Gói đăng ký',type:'Chi',budget:0},{name:'Trail & sức khoẻ',type:'Chi',budget:3000000},
  {name:'Mua sắm',type:'Chi',budget:1500000},{name:'Giải trí',type:'Chi',budget:1000000},
  {name:'Kinh doanh DNC',type:'Chi',budget:0},{name:'Khác',type:'Chi',budget:0},
  {name:'Doanh thu Premium',type:'Thu',budget:0},{name:'Thu khác',type:'Thu',budget:0}
];
const KEYWORDS = {
  'Cà phê':['cafe','ca phe','cf','coffee','tra sua','highlands','starbucks','nuoc ep','sinh to'],
  'Ăn uống':['an','com','pho','bun','banh mi','banh','lau','nuong','an trua','an toi','an sang','do an','grabfood','bun cha','hu tieu','mi','oc','hai san','di cho','sieu thi'],
  'Đi lại':['grab','xang','taxi','be','gui xe','ve may bay','xe khach','sua xe','xanh sm'],
  'Nhà & hoá đơn':['nha','tien nha','dien','nuoc','internet','wifi','gas','dien thoai','4g'],
  'Gói đăng ký':['netflix','spotify','icloud','youtube','chatgpt','google one','claude','canva'],
  'Trail & sức khoẻ':['giay','gel','giai','race','vmm','gym','massage','chay','trail','dinh duong','vitamin'],
  'Mua sắm':['mua','shopee','lazada','tiki','quan ao','ao','quan'],
  'Giải trí':['phim','game','bia','nhau','karaoke','du lich'],
  'Kinh doanh DNC':['ctv','gia von','nhap slot','ads','quang cao','tk ytb','fam'],
  'Doanh thu Premium':['doanh thu','ban','khach','gia han','thu tien'],
  'Thu khác':['luong','thuong','lai','hoan tien','thu']
};

const TRANSFER_CAT = 'Chuyển khoản';
const blank = () => ({v:3, tx:[], cats:DEFAULT_CATS.map(c=>({...c})), rec:[], debts:[], rules:{},
  accounts:[{name:'Tiền mặt', initial:0}, {name:'Ngân hàng', initial:0}], pendingDel:[], noSpend:{},
  set:{income:0, incomeMode:'manual', saveRate:30, netWorth:0, ret:6, lastAcc:'Tiền mặt'}, sync:{api:DEFAULT_API, user:'', last:null}, sample:false});
let S;
try { S = JSON.parse(localStorage.getItem(KEY)) || null; } catch(e) { S = null; }
const FIRST_RUN = !S;
if (!S) S = blank();
else { const b = blank(); S = {...b, ...S, set:{...b.set, ...S.set}, sync:{...b.sync, ...S.sync}}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

/* ================= tiện ích ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayS = () => ymd(new Date());
const dim = (y,m) => new Date(y, m+1, 0).getDate();
const monthKey = s => s.slice(0,7);
const fmt = n => Math.round(n).toLocaleString('vi-VN') + 'đ';
function compact(n){
  const a = Math.abs(n), sg = n < 0 ? '−' : '';
  if (a >= 1e9) return sg + (a/1e9).toFixed(a%1e9?1:0).replace('.',',') + 'tỷ';
  if (a >= 1e6) return sg + (+(a/1e6).toFixed(1)).toString().replace('.',',') + 'tr';
  if (a >= 1e3) return sg + Math.round(a/1e3) + 'k';
  return sg + Math.round(a);
}
const strip = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLowerCase().replace(/\s+/g,' ').trim();
const catType = name => (S.cats.find(c=>c.name===name)||{}).type || 'Chi';
const monthly = r => r.repeat==='w' ? r.amount*52/12 : r.repeat==='y' ? r.amount/12 : r.amount;
const REPEAT = {m:'hằng tháng', w:'hằng tuần', y:'hằng năm'};

/* ---- nhập tiền: 50k, 1tr2, 1,5tr, 200.000, 45 (=45k) ---- */
function parseLine(line){
  let s = line.trim(); if (!s) return null;
  let forceThu = false;
  if (s.startsWith('+')) { forceThu = true; s = s.slice(1).trim(); }
  const pats = [
    [/(\d+(?:[.,]\d+)?)\s*(?:tr|triệu|trieu|m)(\d{1,3})?(?!\p{L})/iu, m => parseFloat(m[1].replace(',','.'))*1e6 + (m[2] ? +m[2]*Math.pow(10, 6-m[2].length) : 0)],
    [/(\d+(?:[.,]\d+)?)\s*(?:k|nghìn|ngàn|nghin|ngan)(?!\p{L})/iu, m => parseFloat(m[1].replace(',','.'))*1e3],
    [/\d{1,3}(?:[.,]\d{3})+(?!\d)/u, m => +m[0].replace(/[.,]/g,'')],
    [/\d+(?:[.,]\d+)?/u, m => { const n = parseFloat(m[0].replace(',','.')); return n < 1000 ? n*1000 : n; }]
  ];
  for (const [re, fn] of pats) {
    const m = s.match(re);
    if (m) {
      const amount = Math.round(fn(m));
      const note = (s.slice(0, m.index) + ' ' + s.slice(m.index + m[0].length)).replace(/\s+/g,' ').replace(/^[-–:,\s]+|[-–:,\s]+$/g,'');
      return {amount, note, forceThu};
    }
  }
  return {amount:0, note:s, forceThu};
}
function guessCat(note){
  const n = strip(note); if (!n) return null;
  if (S.rules[n]) return S.rules[n];
  const padded = ' ' + n + ' ';
  for (const k of Object.keys(S.rules)) if (k.length >= 3 && padded.includes(' ' + k + ' ')) return S.rules[k];
  let best = null, bestLen = 0;
  for (const [cat, kws] of Object.entries(KEYWORDS)) {
    if (!S.cats.some(c=>c.name===cat)) continue;
    for (const kw of kws) if (padded.includes(' ' + kw + ' ') && kw.length > bestLen) { best = cat; bestLen = kw.length; }
  }
  return best;
}

// chuyển tiền giữa ví không phải thu/chi → loại khỏi mọi thống kê
function monthTx(y,m){ const d = new Date(y,m,1), k = `${d.getFullYear()}-${pad(d.getMonth()+1)}`; return S.tx.filter(t => !t.transfer && monthKey(t.date) === k); }
function rangeTx(from, to){ return S.tx.filter(t => !t.transfer && t.date >= from && t.date <= to); }
function balances(){
  const m = {}; S.accounts.forEach(a => m[a.name] = a.initial || 0);
  for (const t of S.tx) if (t.account in m) m[t.account] += t.type==='Thu' ? t.amount : -t.amount;
  return m;
}
const INCOME_MODES = {manual:'Tự nhập số cố định', avg3:'Trung bình 3 tháng trước', actual:'Chỉ tiền đã về tháng này'};
function incomeBasis(y,m){
  const thuNow = sums(monthTx(y,m)).thu, mode = S.set.incomeMode || 'manual';
  if (mode === 'actual') return {income: thuNow, label:'tiền đã về'};
  if (mode === 'avg3'){
    const arr = [];
    for (let i=1; i<=3; i++){ const s = sums(monthTx(y, m-i)); if (s.thu || s.chi) arr.push(s.thu); }
    if (arr.length) return {income: arr.reduce((a,b)=>a+b,0)/arr.length, label:`thu TB ${arr.length} tháng`};
  }
  return {income: Math.max(S.set.income||0, thuNow), label:'thu nhập dự kiến'};
}
function sums(list){
  let thu=0, chi=0, varChi=0;
  for (const t of list){ if (t.transfer) continue; if (t.type==='Thu') thu+=t.amount; else { chi+=t.amount; if(!t.fixed) varChi+=t.amount; } }
  return {thu, chi, varChi};
}
function fixedMonthly(){ return S.rec.filter(r=>r.type==='Chi').reduce((a,r)=>a+monthly(r),0); }
function budgetFor(y,m){
  const {income, label} = incomeBasis(y,m);
  const fixed = fixedMonthly();
  const saveAmt = income * (S.set.saveRate||0) / 100;
  const pool = income - fixed - saveAmt;
  return {income, label, fixed, saveAmt, pool, base: pool / dim(y,m)};
}
function safeToday(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), d = now.getDate();
  const b = budgetFor(y,m);
  const list = monthTx(y,m);
  const t = todayS();
  let before = 0, today = 0;
  for (const x of list) if (x.type==='Chi' && !x.fixed) { if (x.date < t) before += x.amount; else if (x.date === t) today += x.amount; }
  const daysLeft = dim(y,m) - d + 1;
  const allowance = Math.max(0, (b.pool - before) / daysLeft);
  return {...b, before, today, daysLeft, allowance, left: allowance - today, poolLeft: b.pool - before - today};
}
function historyMonths(n){
  const out = [], now = new Date();
  for (let i=1; i<=n; i++){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    const s = sums(monthTx(d.getFullYear(), d.getMonth()));
    if (s.thu || s.chi) out.push(s);
  }
  if (!out.length){ // chưa có tháng đủ → ngoại suy tháng này
    const s = sums(monthTx(now.getFullYear(), now.getMonth()));
    const f = dim(now.getFullYear(), now.getMonth()) / now.getDate();
    if (s.thu || s.chi) out.push({thu: Math.max(s.thu, S.set.income||0), chi: s.chi*f});
  }
  return out;
}

function paceCard(y,m,list,b){
  const n = dim(y,m), W=320, H=120, L=34, R=8, T=10, B=20, iw=W-L-R, ih=H-T-B;
  const daily = Array(n+1).fill(0);
  for (const x of list) if (x.type==='Chi' && !x.fixed) daily[+x.date.slice(8)] += x.amount;
  const isNow = y===now0.getFullYear() && m===now0.getMonth();
  const last = isNow ? now0.getDate() : (new Date(y,m,1) > now0 ? 0 : n);
  let cum = 0; const pts = [[0,0]];
  for (let d=1; d<=last; d++){ cum += daily[d]; pts.push([d,cum]); }
  const max = Math.max(b.pool, cum) * 1.08 || 1;
  const X = d => L + d/n*iw, Y = v => T + ih - v/max*ih;
  const line = pts.map(([d,v],i)=>`${i?'L':'M'}${X(d).toFixed(1)} ${Y(v).toFixed(1)}`).join(' ');
  const area = pts.length>1 ? `${line} L${X(last).toFixed(1)} ${Y(0)} L${X(0)} ${Y(0)} Z` : '';
  const ahead = cum - b.pool * last / n;
  const ticks = [0, b.pool/2, b.pool].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-4}" y="${Y(v)+3}" text-anchor="end">${compact(v)}</text>`).join('');
  const xt = [1, Math.round(n/2), n].map(d=>`<text x="${X(d)}" y="${H-5}" text-anchor="middle">${d}</text>`).join('');
  const end = pts[pts.length-1];
  return `<section class="card section">
    <div class="row between"><h2>Đường chạy tháng</h2><span class="chip ${ahead>0?'late':'ok'}">${last? (ahead>0 ? 'Nhanh hơn kế hoạch ' + compact(ahead) : 'Chậm hơn kế hoạch ' + compact(-ahead)) : 'Chưa bắt đầu'}</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chi tiêu cộng dồn so với quỹ tháng">
      ${ticks}${xt}
      <line x1="${X(0)}" y1="${Y(0)}" x2="${X(n)}" y2="${Y(b.pool)}" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="4 4"/>
      ${area ? `<path d="${area}" fill="var(--h2)"/><path d="${line}" fill="none" stroke="var(--moss)" stroke-width="2.2" stroke-linejoin="round"/>
      <circle cx="${X(end[0])}" cy="${Y(end[1])}" r="4" fill="var(--moss)" stroke="var(--surface)" stroke-width="2"/>` : ''}
    </svg>
    <div class="legend-line"><span><i style="background:var(--moss)"></i>Chi linh hoạt cộng dồn</span><span><i style="background:var(--gold)"></i>Nhịp đều để vừa quỹ ${compact(b.pool)}</span></div>
  </section>`;
}
function catBars(list){
  const by = {};
  for (const x of list) if (x.type==='Chi') by[x.category] = (by[x.category]||0) + x.amount;
  const rows = Object.entries(by).sort((a,b)=>b[1]-a[1]);
  if (!rows.length) return `<section class="card"><h2>Theo danh mục</h2><div class="empty-note">Chưa có khoản chi nào trong tháng. Bấm nút + để ghi khoản đầu tiên.</div></section>`;
  const top = rows[0][1];
  return `<section class="card section"><h2>Theo danh mục</h2><div class="bars">${rows.map(([c,v])=>{
    const bud = (S.cats.find(x=>x.name===c)||{}).budget || 0;
    const pct = bud ? v/bud : v/top;
    const cls = bud ? (pct>1?'over':pct>.85?'warn':'') : '';
    return `<div class="bar-row"><div class="row between"><span>${esc(c)}</span><span class="num">${compact(v)}${bud?` <span class="muted">/ ${compact(bud)}</span>`:''}</span></div>
      <div class="bar-track"><div class="bar-fill ${cls}" style="width:${Math.min(100,pct*100).toFixed(1)}%"></div></div></div>`;
  }).join('')}</div></section>`;
}
function dayTipHtml(ds){
  const list = S.tx.filter(t=>t.date===ds && !(t.transfer && t.type==='Thu'));
  const d = parseD(ds), s = sums(list);
  const head = `<div class="h"><span>${d.getDate()}/${d.getMonth()+1}</span><span class="num">${s.chi?'<span class="neg">−'+compact(s.chi)+'</span>':''}${s.thu?' <span class="pos">+'+compact(s.thu)+'</span>':''}</span></div>`;
  if (!list.length) return head + '<div class="more">Chưa có khoản nào</div>';

    return `<div class="r"><span>${esc(t.note || t.category)} · ${esc(t.category)}</span><span class="${t.type==='Thu'?'pos':''}">${t.type==='Thu'?'+':'−'}${compact(t.amount)}</span></div>`;
  }).join('');
  return head + rows + (list.length > 8 ? `<div class="more">+${list.length-8} khoản nữa · bấm để xem hết</div>` : '');

function bindDayTips(){
  if (!window.matchMedia || !matchMedia('(hover: hover) and (pointer: fine)').matches) return;
  let tip = document.getElementById('daytip');
  if (!tip) { tip = document.createElement('div'); tip.id = 'daytip'; tip.className = 'daytip'; tip.hidden = true; document.body.appendChild(tip); }
  tip.hidden = true;
  document.querySelectorAll('[data-day]').forEach(el => {
    el.addEventListener('mouseenter', () => {
      tip.innerHTML = dayTipHtml(el.dataset.day); tip.hidden = false;
      const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
      let left = Math.min(Math.max(8, r.left + r.width/2 - tw/2), innerWidth - tw - 8);
      let top = r.bottom + 6; if (top + th > innerHeight - 8) top = Math.max(8, r.top - th - 6);
      tip.style.left = left + 'px'; tip.style.top = top + 'px';
    });
    el.addEventListener('mouseleave', () => { tip.hidden = true; });
  });
}

function addLines(){
  return $('#addQ').value.split('\n').map(parseLine).filter(Boolean).map((p,i,arr) => {
    const g = guessCat(p.note);
    let type = p.forceThu ? 'Thu' : ADD.type;
    if (!p.forceThu && ADD.type==='Chi' && !ADD.cat && g && catType(g)==='Thu') type = 'Thu';
    let cat = (arr.length===1 && ADD.cat) ? ADD.cat : (g && catType(g)===type ? g : null);
    if (!cat) cat = type==='Thu' ? (S.cats.find(c=>c.type==='Thu')||{name:'Thu khác'}).name : 'Khác';
    return {...p, type, cat, guessed: !!g};
  });
}
function addPreview(){
  document.querySelectorAll('#addType button').forEach(b=>b.classList.toggle('on', b.dataset.t===ADD.type));

  const shownType = lines.length===1 ? lines[0].type : ADD.type;
  const cur = lines.length===1 ? lines[0].cat : ADD.cat;
  const used = {}; S.tx.slice(-200).forEach(t=>used[t.category]=(used[t.category]||0)+1);
  const cats = S.cats.filter(c=>c.type===shownType).sort((a,b)=>(used[b.name]||0)-(used[a.name]||0));

function addSave(){
  const lines = addLines().filter(l=>l.amount);
  if (!lines.length) return;
  const date = $('#addDate').value || todayS();
  if (S.sample) clearSample(true);
  for (const l of lines){
    if (l.note) S.rules[strip(l.note)] = l.cat;
  }
  S.set.lastAcc = ADD.acc;
  if (ADD.edit){
    const t = S.tx.find(x=>x.id===ADD.edit.id);
    if (t){ const l = lines[0]; Object.assign(t, {amount:l.amount, note:l.note, category:l.cat, type:l.type, date, account:ADD.acc, synced:false}); }
  } else {
    for (const l of lines) S.tx.push({id:uid(), date, type:l.type, amount:l.amount, category:l.cat, note:l.note, account:ADD.acc, synced:false});
  }
  save(); closeSheet(); UI.sel = date;
  const d = parseD(date); UI.y = d.getFullYear(); UI.m = d.getMonth();
  render(); autoPush();
  const total = lines.reduce((a,l)=>a+(l.type==='Chi'?l.amount:0),0);

  toast(msg);
}

  });
}

/* ---- tổng kết tuần / tháng ---- */
function periodStats(from, to){
  const list = rangeTx(from, to);
  let thu=0, chi=0, varChi=0; const byCat={}, byDay={};
  for (const t of list){
    if (t.type==='Thu') { thu += t.amount; continue; }
    chi += t.amount; byCat[t.category] = (byCat[t.category]||0) + t.amount;
    if (!t.fixed) { varChi += t.amount; byDay[t.date] = (byDay[t.date]||0) + t.amount; }
  }
  const end = to < todayS() ? to : todayS();
  let days = 0, zero = 0;
  for (let d = parseD(from); ymd(d) <= end; d.setDate(d.getDate()+1)) { days++; if (!byDay[ymd(d)]) zero++; }
  const maxDay = Object.keys(byDay).sort((a,b)=>byDay[b]-byDay[a])[0];
  return {thu, chi, varChi, byCat, maxDay, maxAmt: maxDay ? byDay[maxDay] : 0, days, zero, count:list.length};
}
function openSummary(mode){
  mode = mode || 'week';
  const now = new Date();
  let from, to, pf, pt, title;
  if (mode === 'week') {
    const mon = new Date(now.getFullYear(), now.getMonth(), now.getDate() - (now.getDay()+6)%7);
    from = ymd(mon); to = ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()+6));
    pf = ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()-7)); pt = ymd(new Date(mon.getFullYear(), mon.getMonth(), mon.getDate()-1));
    const e = parseD(to); title = `Tuần ${mon.getDate()}/${mon.getMonth()+1} – ${e.getDate()}/${e.getMonth()+1}`;
  } else {
    const y = UI.y, m = UI.m;
    from = ymd(new Date(y,m,1)); to = ymd(new Date(y,m+1,0));
    pf = ymd(new Date(y,m-1,1)); pt = ymd(new Date(y,m,0));
    title = `Tháng ${m+1}/${y}`;
  }
  const c = periodStats(from, to), p = periodStats(pf, pt);
  const delta = (a,b) => b ? Math.round((a-b)/b*100) : null;
  const dChi = delta(c.chi, p.chi);
  const rate = c.thu ? Math.round((c.thu-c.chi)/c.thu*100) : null;
  const cats = Object.entries(c.byCat).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const md = c.maxDay ? parseD(c.maxDay) : null;
  const label = mode==='week' ? 'tuần trước' : 'tháng trước';
  openSheet(`<div class="grab"></div>
    <div class="seg" id="sumSeg"><button data-m="week" class="${mode==='week'?'on':''}">Tuần này</button><button data-m="month" class="${mode==='month'?'on':''}">Tháng ${UI.m+1}</button></div>
    <h2>${title}</h2>
    ${c.count ? `
    <div class="kv"><span>Thu</span><span class="num pos">${fmt(c.thu)}</span></div>
    <div class="kv"><span>Chi</span><span class="num">${fmt(c.chi)}${dChi!==null?` <span class="chip ${dChi>0?'late':'ok'}">${dChi>0?'+':''}${dChi}% so với ${label}</span>`:''}</span></div>
    <div class="kv"><span>Để dành</span><span class="num ${c.thu-c.chi>=0?'pos':'neg'}">${fmt(c.thu-c.chi)}${rate!==null?` · ${rate}%`:''}</span></div>
    <div class="kv"><span>Chi linh hoạt TB/ngày</span><span class="num">${compact(c.varChi / Math.max(1,c.days))}</span></div>
    <div class="kv"><span>Ngày không tiêu linh hoạt</span><span class="num">${c.zero}/${c.days} ngày</span></div>
    ${md ? `<div class="kv"><span>Ngày tiêu nhiều nhất</span><span class="num">${md.getDate()}/${md.getMonth()+1} · ${compact(c.maxAmt)}</span></div>` : ''}
    <h2 style="margin-top:6px">Chi nhiều nhất</h2>
    <div class="list">${cats.map(([k,v])=>{ const d = delta(v, p.byCat[k]||0);
      return `<div class="item"><div class="main"><div class="t">${esc(k)}</div></div>${d!==null?`<span class="chip ${d>0?'soon':'ok'}">${d>0?'+':''}${d}%</span>`:'<span class="chip">mới</span>'}<div class="a">${compact(v)}</div></div>`; }).join('')}</div>`
    : '<div class="empty-note">Kỳ này chưa có khoản nào.</div>'}
    <div class="hint">Không tính tiền chuyển giữa các ví. Bản tổng kết tự gửi qua Telegram mỗi tối Chủ nhật và sáng ngày 1 khi đã cài trong Apps Script.</div>`);
  $('#sumSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) openSummary(b.dataset.m); });
}

function daysUntil(ds){ return Math.round((parseD(ds) - parseD(todayS()))/864e5); }
function dueChip(ds){
  const n = daysUntil(ds);
  if (n < 0) return `<span class="chip late">Quá hạn ${-n} ngày</span>`;
  if (n === 0) return `<span class="chip late">Hôm nay</span>`;
  if (n <= 5) return `<span class="chip soon">Còn ${n} ngày</span>`;
  return `<span class="chip ok">${parseD(ds).getDate()}/${parseD(ds).getMonth()+1}</span>`;
}

function advance(ds, rep){
  const d = parseD(ds);
  if (rep==='w') d.setDate(d.getDate()+7);
  else if (rep==='y') d.setFullYear(d.getFullYear()+1);
  else { const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+1); d.setDate(Math.min(day, dim(d.getFullYear(), d.getMonth()))); }
  return ymd(d);
}
function payRec(id){
  const r = S.rec.find(x=>x.id===id); if (!r) return;
  if (S.sample) clearSample(true);
  const date = r.next < todayS() ? r.next : todayS();
  S.tx.push({id:uid(), date, type:r.type, amount:r.amount, category:r.category, note:r.name, account:S.set.lastAcc || (S.accounts[0]||{}).name || 'Tiền mặt', fixed:true, synced:false});
  r.next = advance(r.next, r.repeat);
  save(); render(); autoPush();
  toast(`Đã ghi ${compact(r.amount)} · ${r.name}. Kỳ tới ${parseD(r.next).getDate()}/${parseD(r.next).getMonth()+1}`);
}

function viewFire(){
  const hist = historyMonths(3);
  const avgThu = hist.length ? hist.reduce((a,s)=>a+s.thu,0)/hist.length : (S.set.income||0);
  const avgChi = hist.length ? hist.reduce((a,s)=>a+s.chi,0)/hist.length : 0;
  const saveM = avgThu - avgChi, rate = avgThu ? saveM/avgThu*100 : 0;
  const target = avgChi * 12 * 25;
  const nw = S.set.netWorth || 0, r = (S.set.ret||0)/100;
  const prog = target ? Math.min(1, nw/target) : 0;
  const sim = (extra) => { let v = nw, pts=[[0,v]], m=0, hit=null;
    while (m < 50*12){ m++; v = v*(1+r/12) + saveM + extra; if (m%12===0) pts.push([m/12, v]); if (hit===null && v>=target) hit=m; if (hit!==null && m>=Math.max(60,hit) && m%12===0) break; }
    return {pts, hit, at5: pts.find(p=>p[0]===5)}; };
  const A = sim(0), Bx = sim(avgThu*0.1);
  const yrs = mth => mth===null ? 'trên 50 năm' : mth < 12 ? `${mth} tháng` : `${Math.floor(mth/12)} năm${mth%12?` ${mth%12} tháng`:''}`;
  const less50 = sim(50000*30);
  const gain = (A.hit!==null && less50.hit!==null) ? A.hit - less50.hit : null;

  const noData = !avgChi;
  return `<header class="top"><h1 class="brand">Mục tiêu FIRE</h1></header>
  ${sampleBanner()}
  <section class="hero"><div class="eyebrow">Đỉnh FIRE · 25 lần chi tiêu một năm</div>
    <div class="hero-amt">${noData ? '—' : fmt(target)}</div>
    <div class="hero-sub"><span>Đã leo <b>${(prog*100).toFixed(1)}%</b></span><span>Tài sản <b>${compact(nw)}</b></span><span>Về đích <b>${noData?'—':yrs(A.hit)}</b></span></div>
    <div class="progress" style="background:rgba(234,242,240,.15)"><div style="width:${(prog*100).toFixed(1)}%"></div></div>${ridge()}
  </section>
  ${noData ? '<section class="card"><div class="empty-note">Cần ít nhất vài tuần ghi chép để app tính chi tiêu trung bình và mục tiêu FIRE.</div></section>' : `
  <section class="trio">
    <div class="card"><div class="eyebrow">Chi TB/tháng</div><div class="v">${compact(avgChi)}</div></div>
    <div class="card"><div class="eyebrow">Để dành TB</div><div class="v ${saveM>=0?'pos':'neg'}">${compact(saveM)}</div></div>
    <div class="card"><div class="eyebrow">Tỷ lệ</div><div class="v ${rate>=0?'pos':'neg'}">${Math.round(rate)}%</div></div>
  </section>
  ${fireChart(A, Bx, target)}
  <section class="card section"><h2>Mốc 5 năm</h2>
    <div class="kv"><span>Giữ nhịp hiện tại</span><span class="num">${A.at5?compact(A.at5[1]):'—'} · ${A.at5&&target?Math.round(A.at5[1]/target*100):0}%</span></div>
    <div class="kv"><span>Để dành thêm 10% thu nhập (${compact(avgThu*0.1)}/tháng)</span><span class="num pos">${Bx.at5?compact(Bx.at5[1]):'—'} · ${Bx.at5&&target?Math.round(Bx.at5[1]/target*100):0}%</span></div>
    <div class="kv"><span>Về đích nếu để dành thêm 10%</span><span class="num">${yrs(Bx.hit)}</span></div>
    ${gain>0 ? `<div class="hint">Mỗi ngày bớt 50k (một ly cà phê và bánh) sẽ về đích sớm hơn ${yrs(gain)}.</div>` : ''}
    <div class="hint">Tính trên ${hist.length} tháng gần nhất có dữ liệu, lợi nhuận đầu tư ${S.set.ret}%/năm, rút 4%/năm khi về hưu.</div>
  </section>`}
  <section class="card section"><h2>Thông số</h2>
    <div class="grid2"><label class="f">Tài sản hiện có<input class="inp num" id="fNw" value="${nw||''}" placeholder="500tr"></label>
    <label class="f">Lợi nhuận kỳ vọng %/năm<input class="inp num" id="fRet" type="number" step="0.5" value="${S.set.ret}"></label></div>
    <button class="btn primary" data-act="save-fire">Cập nhật</button>
  </section>`;
}
function fireChart(A, Bx, target){
  const W=320, H=150, L=40, R=10, T=12, B=20, iw=W-L-R, ih=H-T-B;
  const maxX = Math.max(5, Math.min(30, Math.ceil(((A.hit ?? 360)/12))+1));
  const pa = A.pts.filter(p=>p[0]<=maxX), pb = Bx.pts.filter(p=>p[0]<=maxX);
  const maxY = Math.max(target, ...pa.map(p=>p[1]), ...pb.map(p=>p[1])) * 1.08 || 1;
  const X = x => L + x/maxX*iw, Y = v => T + ih - Math.max(0,v)/maxY*ih;
  const path = pts => pts.map((p,i)=>`${i?'L':'M'}${X(p[0]).toFixed(1)} ${Y(p[1]).toFixed(1)}`).join(' ');
  const area = `${path(pa)} L${X(pa[pa.length-1][0])} ${Y(0)} L${X(0)} ${Y(0)} Z`;
  const step = maxX<=10?1:maxX<=20?5:5;
  let xt=''; for (let x=0;x<=maxX;x+=step) xt += `<text x="${X(x)}" y="${H-5}" text-anchor="middle">${x}</text>`;
  return `<section class="card section"><div class="row between"><h2>Đường lên đỉnh</h2><span class="hint">năm</span></div>
    <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Dự phóng tài sản theo năm so với mục tiêu FIRE">
      <line x1="${L}" x2="${W-R}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--gold)" stroke-width="1.6" stroke-dasharray="5 4"/>
      <text x="${W-R}" y="${Y(target)-5}" text-anchor="end" style="fill:var(--gold-ink)">Đỉnh ${compact(target)}</text>
      <line x1="${X(5)}" x2="${X(5)}" y1="${T}" y2="${Y(0)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${X(5)+3}" y="${T+8}">mốc 5Y</text>
      <text x="${L-4}" y="${Y(0)+3}" text-anchor="end">0</text>
      ${xt}
      <path d="${area}" fill="var(--h1)"/>
      <path d="${path(pb)}" fill="none" stroke="var(--moss)" stroke-width="1.6" stroke-dasharray="3 3"/>
      <path d="${path(pa)}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <div class="legend-line"><span><i style="background:var(--accent)"></i>Nhịp hiện tại</span><span><i style="background:var(--moss)"></i>Để dành thêm 10%</span></div>
  </section>`;
}

/* ================= đồng bộ Sheet ================= */
async function api(payload){
  const body = payload.action === 'login' ? payload : {...payload, token:S.sync.token};
  const res = await fetch(S.sync.api, {method:'POST', body:JSON.stringify(body)});
  const j = await res.json();
  if (j.code === 'AUTH' && payload.action !== 'login') { S.sync.user = ''; S.sync.token = ''; save(); render(); }
  if (j.status !== 'success') throw new Error(j.message || 'Sheet trả về lỗi');
  return j;
}
const sig = t => [t.date, t.type, Math.round(t.amount), strip(t.category), strip(t.note)].join('|');
let pushing = false, pushTimer = null;
function autoPush(){ if (!S.sync.user || S.sample) return; clearTimeout(pushTimer); pushTimer = setTimeout(()=>push(true), 2500); }
async function push(silent){
  if (pushing || !S.sync.user) return;
  const items = S.tx.filter(t=>!t.synced && !t.sample), dels = [...S.pendingDel];
  if (!items.length && !dels.length){ if(!silent) toast('Mọi thay đổi đã được sao lưu'); return; }
  pushing = true;
  try {
    if (items.length) {
      await api({action:'upsert_transactions', user:S.sync.user, items: items.map(t=>({id:t.id, date:t.date, type:t.type, amount:t.amount, category:t.category, account:t.account||'Tiền mặt', description:t.note||'', source:'FIRE5Y app', status:'Confirmed'}))});
      items.forEach(t=>{ t.synced = true; t.up = true; });
    }
    if (dels.length) {
      await api({action:'delete_transactions', user:S.sync.user, ids:dels});
      S.pendingDel = S.pendingDel.filter(id => !dels.includes(id));
    }
    S.sync.last = Date.now(); S.sync.err = ''; save();
    if (!silent) toast(`Đã sao lưu ${items.length + dels.length} thay đổi lên Sheet`);
    if (UI.view==='set') render();
  } catch(e){
    const msg = /Action không hợp lệ/.test(e.message||'') ? 'Apps Script chưa cập nhật bản mới, cần dán code.gs mới và deploy lại' : (e.message || 'không kết nối được Sheet');
    S.sync.err = msg; save();
    if (!silent) toast('Chưa sao lưu được: ' + msg);
  }
  finally { pushing = false; }
}
async function pull(silent){
  if (!silent) toast('Đang tải từ Sheet…');
  try {
    const [ds, tx, acc] = await Promise.all([api({action:'get_ds', user:S.sync.user}), api({action:'get_transactions', user:S.sync.user}), api({action:'get_accounts', user:S.sync.user}).catch(()=>({data:[]}))]);
    let addedC = 0, addedA = 0;
    for (const c of ds.data||[]) if (c.name && !S.cats.some(x=>x.name===c.name)) { S.cats.push({name:String(c.name), type:c.type==='Thu'?'Thu':'Chi', budget:+c.budget||0}); addedC++; }
    for (const a of acc.data||[]) if (a.name && !S.accounts.some(x=>x.name===a.name)) { S.accounts.push({name:String(a.name), initial:+a.initialBalance||0}); addedA++; }
    const haveSig = new Set(S.tx.map(sig)), haveId = new Set(S.tx.map(t=>t.id));
    let added = 0;
    for (const r of tx.data||[]) {
      if (!r.date || !r.amount || r.status === 'Cancelled') continue;
      const id = String(r.id);
      const t = {id, date:String(r.date).slice(0,10), type:r.type==='Thu'?'Thu':'Chi', amount:+r.amount, category:String(r.category||'Khác'), note:String(r.description||''), account:String(r.account||'Tiền mặt'), synced:true, up:true};
      if (t.category === TRANSFER_CAT) { t.transfer = true; t.pair = 'p' + id; }
      if (haveId.has(id) || haveSig.has(sig(t))) continue;
      haveSig.add(sig(t)); haveId.add(id); S.tx.push(t); added++;
      if (!S.accounts.some(a=>a.name===t.account)) { S.accounts.push({name:t.account, initial:0}); addedA++; }
      if (!t.transfer && !S.cats.some(c=>c.name===t.category)) S.cats.push({name:t.category, type:t.type, budget:0});
    }
    S.sync.last = Date.now(); save(); render();
    if (!silent || added) toast(`Đã nhận ${added} khoản${addedC?`, ${addedC} danh mục`:''}${addedA?`, ${addedA} ví`:''} từ Sheet`);
  } catch(e){ if (!silent) toast('Không tải được: ' + (e.message||'lỗi kết nối')); }
}

/* ================= dữ liệu mẫu ================= */
function seedSample(){
  const now = new Date(), t = todayS();
  let seed = 7; const rnd = () => (seed = (seed*9301+49297)%233280)/233280;
  const tx = [];
  const add = (date, type, amount, category, note, fixed) => tx.push({id:uid(), date, type, amount, category, note, account: amount >= 1e6 ? 'Ngân hàng' : 'Tiền mặt', fixed:!!fixed, synced:true, sample:true});
  for (let back=2; back>=0; back--){
    const y = now.getFullYear(), m = now.getMonth()-back, first = new Date(y,m,1), n = dim(first.getFullYear(), first.getMonth());
    for (let d=1; d<=n; d++){
      const ds = ymd(new Date(first.getFullYear(), first.getMonth(), d)); if (ds > t) break;
      if (rnd()<.8) add(ds,'Chi', [29000,35000,45000][Math.floor(rnd()*3)], 'Cà phê', 'cafe sáng');
      add(ds,'Chi', Math.round((40+rnd()*50))*1000, 'Ăn uống', ['cơm trưa','bún chả','phở','cơm gà'][Math.floor(rnd()*4)]);
      if (rnd()<.7) add(ds,'Chi', Math.round((50+rnd()*150))*1000, 'Ăn uống', ['ăn tối','lẩu','đi chợ','hải sản'][Math.floor(rnd()*4)]);
      if (rnd()<.25) add(ds,'Chi', Math.round((30+rnd()*70))*1000, 'Đi lại', ['grab','đổ xăng'][Math.floor(rnd()*2)]);
      if (rnd()<.08) add(ds,'Chi', Math.round((200+rnd()*900))*1000, 'Mua sắm', 'shopee');
      if (rnd()<.06) add(ds,'Chi', Math.round((150+rnd()*500))*1000, 'Trail & sức khoẻ', ['gel','massage','tất chạy'][Math.floor(rnd()*3)]);
      if (rnd()<.05) add(ds,'Chi', Math.round((150+rnd()*300))*1000, 'Giải trí', 'xem phim');
      if (d===5) add(ds,'Chi', 5000000, 'Nhà & hoá đơn', 'Tiền nhà', true);
      if (d===10) add(ds,'Chi', 260000, 'Gói đăng ký', 'Netflix', true);
      if (d===1 || d===15) add(ds,'Thu', 14000000 + Math.round(rnd()*4)*1000000, 'Doanh thu Premium', 'doanh thu nửa tháng');
    }
  }
  S.tx = tx;
  const nm = (day) => { const d = new Date(now.getFullYear(), now.getMonth(), day); if (ymd(d) < t) d.setMonth(d.getMonth()+1); return ymd(d); };
  S.rec = [
    {id:uid(), name:'Tiền nhà', amount:5000000, type:'Chi', category:'Nhà & hoá đơn', repeat:'m', next:nm(5)},
    {id:uid(), name:'Điện nước', amount:700000, type:'Chi', category:'Nhà & hoá đơn', repeat:'m', next:nm(20)},
    {id:uid(), name:'Netflix', amount:260000, type:'Chi', category:'Gói đăng ký', repeat:'m', next:nm(10)},
    {id:uid(), name:'iCloud 200GB', amount:59000, type:'Chi', category:'Gói đăng ký', repeat:'m', next:nm(now.getDate()+2 > 28 ? 2 : now.getDate()+2)},
    {id:uid(), name:'Phí giải trail', amount:6000000, type:'Chi', category:'Trail & sức khoẻ', repeat:'y', next:ymd(new Date(now.getFullYear()+1, 2, 15))}
  ];
  S.debts = [{id:uid(), person:'Anh Minh', amount:2000000, dir:'lend', due:ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate()+12)), note:'mượn mua giày', done:false}];
  S.set = {...S.set, income:30000000, saveRate:30, netWorth:450000000, ret:6};
  S.accounts = [{name:'Tiền mặt', initial:8000000}, {name:'Ngân hàng', initial:40000000}];
  S.sample = true;
}
function clearSample(keepSettings){
  S.tx = S.tx.filter(t=>!t.sample); S.rec = []; S.debts = []; S.sample = false; S.accounts.forEach(a=>a.initial=0);
  if (!keepSettings) S.set = {...S.set, income:0, netWorth:0};
  else S.set = {...S.set, netWorth:0};
}

/* ================= sheet + toast ================= */
let SHEET_CTX = null;
function openSheet(html){
  closeSheet();
  const bd = document.createElement('div'); bd.className = 'backdrop'; bd.id = 'bd';
  bd.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  bd.addEventListener('click', e => { if (e.target === bd) closeSheet(); });
  document.body.appendChild(bd);
}
function closeSheet(){ const b = $('#bd'); if (b) b.remove(); }
let toastT;
function toast(msg){ document.querySelectorAll('.toast').forEach(x=>x.remove()); const d = document.createElement('div'); d.className='toast'; d.setAttribute('role','status'); d.textContent = msg; document.body.appendChild(d); clearTimeout(toastT); toastT = setTimeout(()=>d.remove(), 2800); }

/* ================= sự kiện chung ================= */
document.addEventListener('keydown', e => { if (e.key==='Escape') closeSheet(); });
$('#fab').addEventListener('click', () => openAdd());
document.addEventListener('click', async e => {
  const tab = e.target.closest('[data-tab]'); if (tab) { closeSheet(); go(tab.dataset.tab); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  switch (a){
    case 'prev': UI.m--; if (UI.m<0){UI.m=11;UI.y--;} render(); break;
    case 'next': UI.m++; if (UI.m>11){UI.m=0;UI.y++;} render(); break;
    case 'add-day': closeSheet(); openAdd({date:el.dataset.date}); break;
    case 'edit-tx': { const t = S.tx.find(x=>x.id===id); if (t){ closeSheet(); openAdd({edit:t}); } break; }
    case 'del-tx': removeTx([ADD.edit.id]); save(); closeSheet(); render(); autoPush(); toast('Đã xoá'); break;
    case 'summary': openSummary('week'); break;
    case 'transfer': openTransfer(); break;
    case 'new-acc': openAcc(null); break;
    case 'edit-acc': openAcc(+el.dataset.i); break;
    case 'no-spend': S.noSpend[el.dataset.date] = true; save(); render(); toast('Đã đánh dấu ngày không tiêu'); break;
    case 'clear-sample': clearSample(false); save(); render(); toast('Đã xoá dữ liệu mẫu. Bấm + để ghi khoản đầu tiên.'); break;
    case 'load-sample': if (S.tx.length){ toast('Chỉ xem mẫu được khi chưa có dữ liệu'); break; } seedSample(); save(); go('cal'); break;
    case 'new-rec': openRec(); break;
    case 'edit-rec': openRec(S.rec.find(x=>x.id===id)); break;
    case 'del-rec': S.rec = S.rec.filter(x=>x.id!==SHEET_CTX.rec.id); save(); closeSheet(); render(); break;
    case 'pay-rec': payRec(id); break;
    case 'new-debt': openDebt(); break;
    case 'edit-debt': openDebt(S.debts.find(x=>x.id===id)); break;
    case 'del-debt': S.debts = S.debts.filter(x=>x.id!==SHEET_CTX.debt.id); save(); closeSheet(); render(); break;
    case 'done-debt': { const d = S.debts.find(x=>x.id===id); if (d){ d.done = true; save(); render(); toast(`Đã xong khoản với ${d.person}`); } break; }
    case 'save-fire': { const p = parseLine($('#fNw').value||''); S.set.netWorth = p ? p.amount : 0; S.set.ret = +$('#fRet').value || 0; save(); render(); toast('Đã cập nhật'); break; }
    case 'save-budget': { const p = parseLine($('#sInc').value||''); S.set.income = p ? p.amount : 0; S.set.saveRate = Math.max(0, Math.min(90, +$('#sRate').value||0)); S.set.incomeMode = $('#sMode').value; save(); render(); toast('Đã lưu hạn mức'); break; }
    case 'new-cat': openCat(null); break;
    case 'edit-cat': openCat(+el.dataset.i); break;
    case 'del-cat': { const c = S.cats[SHEET_CTX.cat]; if (S.tx.some(t=>t.category===c.name)) { toast('Danh mục đang có giao dịch, đổi tên thay vì xoá'); break; } S.cats.splice(SHEET_CTX.cat,1); save(); closeSheet(); render(); break; }
    case 'login': {
      const user = $('#sUser').value.trim(), pass = $('#sPass').value; S.sync.api = $('#sApi').value.trim() || DEFAULT_API;
      if (!user || !pass) { toast('Nhập tên đăng nhập và mật khẩu'); break; }
      try { const j = await api({action:'login', user, pass}); S.sync.user = j.user || user; S.sync.token = j.token || ''; save(); render(); toast('Đã kết nối Sheet'); push(true); }
      catch(err){ toast('Không đăng nhập được: ' + (err.message||'lỗi kết nối')); }
      break; }
    case 'logout': S.sync.user = ''; S.sync.token = ''; save(); render(); break;
    case 'push': push(false); break;
    case 'pull': if (S.sample){ clearSample(true); } pull(); break;
    case 'export': {
      try { const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'}); const u = URL.createObjectURL(blob);
        const aEl = document.createElement('a'); aEl.href = u; aEl.download = `fire5y-${todayS()}.json`; document.body.appendChild(aEl); aEl.click(); aEl.remove(); setTimeout(()=>URL.revokeObjectURL(u), 1000);
      } catch(err){ toast('Trình duyệt chặn tải tệp, dùng Sao chép JSON'); } break; }
    case 'copy-json': try { await navigator.clipboard.writeText(JSON.stringify(S)); toast('Đã sao chép JSON'); } catch(err){ toast('Không sao chép được trong trình duyệt này'); } break;
    case 'wipe': $('#wipeConfirm').hidden = false; break;
    case 'wipe-yes': { const sync = S.sync; S = blank(); S.sync = sync; save(); go('cal'); toast('Đã xoá dữ liệu trên máy'); break; }
  }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'sFile' || !e.target.files[0]) return;
  const r = new FileReader();
  r.onload = () => { try { const j = JSON.parse(r.result); if (!j || !Array.isArray(j.tx)) throw 0; S = {...blank(), ...j}; save(); go('cal'); toast(`Đã khôi phục ${S.tx.length} khoản`); } catch(err){ toast('Tệp không đúng định dạng FIRE5Y'); } };
  r.readAsText(e.target.files[0]);
});

try {
  if (FIRST_RUN) { seedSample(); save(); }
  render();
} catch (err) {
  $('#app').innerHTML = `<div class="card">Lỗi khi mở app: ${esc(err.message)}</div>`;
  console.error(err);
}
// tự đồng bộ: đẩy thay đổi lên Sheet rồi kéo khoản mới (vd ghi qua Telegram) về — khi mở app và khi quay lại tab
let lastSync = 0;
async function autoSync(){
  if (!S.sync.user || !S.sync.token || S.sample || Date.now() - lastSync < 30000) return;
  lastSync = Date.now();
  await push(true); await pull(true);
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') autoSync(); });
autoSync();
})();
