<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hỗ trợ khách hàng</title>
<meta name="description" content="Nhắn tin để được hỗ trợ YouTube Premium, Netflix, ChatGPT.">
<meta name="theme-color" content="#0f766e">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f766e'/%3E%3Cpath d='M16 22a8 8 0 0 1 8-8h16a8 8 0 0 1 8 8v12a8 8 0 0 1-8 8H30l-9 8v-8.5A8 8 0 0 1 16 34z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../trading/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1c1b18; --muted:#6b675e; --line:#e6e0d3;
  --accent:#0f766e; --accent-ink:#fff; --accent-soft:#dff1ee;
  --me:#0f766e; --me-ink:#fff; --bot:#ffffff; --human:#fff4dc; --human-line:#f0d9a6;
  --warn:#9a5b00; --err:#b42318; --shadow:0 1px 2px rgba(28,27,24,.06),0 8px 24px rgba(28,27,24,.06);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12130f; --panel:#1b1c18; --ink:#ecebe6; --muted:#a19e94; --line:#2d2e28;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#163a35;
  --me:#2dd4bf; --me-ink:#06201d; --bot:#22231e; --human:#3a2f17; --human-line:#5c4920;
  --warn:#f5b84a; --err:#ff8a7a; --shadow:none;
}}
:root[data-theme="dark"]{
  --bg:#12130f; --panel:#1b1c18; --ink:#ecebe6; --muted:#a19e94; --line:#2d2e28;
  --accent:#2dd4bf; --accent-ink:#06201d; --accent-soft:#163a35;
  --me:#2dd4bf; --me-ink:#06201d; --bot:#22231e; --human:#3a2f17; --human-line:#5c4920;
  --warn:#f5b84a; --err:#ff8a7a; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.app{max-width:640px;margin:0 auto;height:100dvh;display:flex;flex-direction:column}
/* ---- màn mở đầu ---- */
.intro{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px 16px 40px}
.badge{width:56px;height:56px;border-radius:16px;background:var(--accent);display:grid;place-items:center;margin-bottom:20px}
.badge svg{width:30px;height:30px;color:var(--accent-ink)}
.intro h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em}
.intro p{color:var(--muted);margin:0 0 24px}
.field{display:flex;flex-direction:column;gap:10px}
.input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--panel);outline:none;font-size:16px}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.intro .err{color:var(--err);font-size:14px;margin:0}
.intro .hint{font-size:13px;margin:18px 0 0}
/* ---- chat ---- */
.head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.head .badge{width:38px;height:38px;border-radius:11px;margin:0;flex:none}
.head .badge svg{width:20px;height:20px}
.head .who{flex:1;min-width:0}
.head .who b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.head .sub{display:flex;align-items:center;gap:8px;margin-top:2px;min-width:0}
.head .who small{display:block;min-width:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}
.pill.wait{background:var(--human);color:var(--warn)}
.pill.done{background:var(--line);color:var(--muted)}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.icon-btn{border:0;background:transparent;padding:8px;border-radius:10px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.icon-btn:hover{background:var(--line);color:var(--ink)}
.icon-btn svg{width:20px;height:20px}
.feed{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scroll-behavior:smooth}
.row{display:flex;flex-direction:column;max-width:86%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.them{align-self:flex-start}
.who-tag{font-size:12px;color:var(--muted);margin:0 4px 3px;font-weight:500}
.bubble{padding:10px 14px;border-radius:18px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere;box-shadow:var(--shadow)}
.me .bubble{background:var(--me);color:var(--me-ink);border-bottom-right-radius:6px}
.them .bubble{background:var(--bot);border:1px solid var(--line);border-bottom-left-radius:6px}
.them.human .bubble{background:var(--human);border-color:var(--human-line)}
.bubble a{color:inherit;text-decoration:underline;text-underline-offset:2px;font-weight:600}
.time{font-size:11px;color:var(--muted);margin:3px 6px 0}
.sys{align-self:center;font-size:12.5px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:4px 12px;text-align:center;max-width:92%}
.typing{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-radius:18px;padding:12px 16px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:b 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{opacity:.3;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:7px 13px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.compose{display:flex;gap:8px;align-items:flex-end;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
.compose textarea{flex:1;resize:none;max-height:140px;min-height:46px;padding:11px 14px;border:1px solid var(--line);border-radius:14px;background:var(--bg);outline:none;font-size:16px;line-height:1.4}
.compose textarea:focus{border-color:var(--accent)}
.send{width:46px;height:46px;padding:0;flex:none;border-radius:14px}
.send svg{width:20px;height:20px}
.banner{margin:0 16px 10px;padding:10px 14px;border-radius:12px;font-size:14px;background:var(--human);border:1px solid var(--human-line)}
.foot-link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;padding:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:9;max-width:calc(100% - 32px)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:s .7s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
  const SB_URL = "https://pxkwjxmrlucpoehpjbja.supabase.co";
  const SB_KEY = "sb_publishable_GPVgOD3U3O_9yytoRnXv6w_jiiBibnH";
  const FN = SB_URL + "/functions/v1/support-bot";
  const STORE = "hotro_session";
  const CHIPS = ["Mình bị mất YouTube Premium", "Không thấy lời mời vào nhóm", "Cần mã Netflix", "Cần mã 2FA ChatGPT", "Mình muốn gia hạn"];
  const ICON = {
    chat: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4v6a4 4 0 0 1-4 4h-5l-4.5 4v-4.2A4 4 0 0 1 4 13z"/></svg>',
    send: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
    person: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>',
  };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "")}</a>`);
  const hm = v => new Date(v).toLocaleTimeString("vi-VN", { hour: "2-digit", minute: "2-digit" });
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE) || "null"); } catch (_) { return null; } };
  const save = v => { try { v ? localStorage.setItem(STORE, JSON.stringify(v)) : localStorage.removeItem(STORE); } catch (_) {} };

  let S = { ticket: null, msgs: [], busy: false, sending: false, err: "" };
  let pollTimer = null;

  async function api(action, body = {}) {
    if (window.__MOCK_API) return window.__MOCK_API(action, body);
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 60000);
    try {
      const r = await fetch(FN, { method: "POST", signal: ctl.signal,
        headers: { "content-type": "application/json", apikey: SB_KEY }, body: JSON.stringify({ action, ...body }) });
      const j = await r.json().catch(() => ({ ok: false, error: "Máy chủ không phản hồi." }));
      if (!j.ok) throw new Error(j.error || "Có lỗi, thử lại nhé.");
      return j;
    } catch (e) { throw new Error(e.name === "AbortError" ? "Mạng chậm quá, bạn thử lại nhé." : e.message); }
    finally { clearTimeout(t); }
  }
  function toast(m) { const el = $("#toast"); el.textContent = m; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, 3200); }

  const lastId = () => S.msgs.length ? S.msgs[S.msgs.length - 1].id : 0;
  function merge(res) {
    if (res.ticket) S.ticket = res.ticket;
    const seen = new Set(S.msgs.map(m => m.id));
    for (const m of res.messages || []) if (!seen.has(m.id)) S.msgs.push(m);
    S.msgs.sort((a, b) => a.id - b.id);
    save({ token: S.ticket.token, email: S.ticket.email });
  }

  /* ---------- màn mở đầu ---------- */
  function renderIntro() {
    stopPoll();
    $("#app").innerHTML = `<section class="intro">
      <div class="badge">${ICON.chat}</div>
      <h1>Bạn cần hỗ trợ gì?</h1>
      <p>Nhập email bạn dùng cho dịch vụ. Trợ lý sẽ kiểm tra tình trạng và hướng dẫn ngay, việc khó sẽ có người phụ trách trả lời.</p>
      <form class="field" id="startForm" novalidate>
        <input class="input" id="email" type="email" inputmode="email" autocomplete="email" placeholder="tenban@gmail.com" aria-label="Email">
        ${S.err ? `<p class="err">${esc(S.err)}</p>` : ""}
        <button class="btn" type="submit" ${S.busy ? "disabled" : ""}>${S.busy ? '<span class="spin"></span> Đang mở…' : "Bắt đầu chat"}</button>
      </form>
      <p class="hint">Email chỉ dùng để tra tình trạng gói của bạn.</p>
    </section>`;
    const inp = $("#email"); inp.value = S.typed || ""; if (!S.busy) inp.focus();
    $("#startForm").onsubmit = async e => {
      e.preventDefault(); S.typed = inp.value.trim();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.typed)) { S.err = "Email chưa đúng. Ví dụ: tenban@gmail.com"; return renderIntro(); }
      S.busy = true; S.err = ""; renderIntro();
      try { const r = await api("start", { email: S.typed }); S.msgs = []; merge(r); S.busy = false; renderChat(); }
      catch (er) { S.busy = false; S.err = er.message; renderIntro(); }
    };
  }

  async function resume(token) {
    try { const r = await api("poll", { token, after: 0 }); S.msgs = []; merge(r); renderChat(); }
    catch (e) { save(null); S.err = e.message; renderIntro(); }
  }

  /* ---------- chat ---------- */
  function statusPill() {
    const st = S.ticket?.status;
    if (st === "cho_nguoi") return '<span class="pill wait"><i></i>Đang chờ người phụ trách</span>';
    if (st === "dong") return '<span class="pill done"><i></i>Đã kết thúc</span>';
    return '<span class="pill"><i></i>Trợ lý trả lời ngay</span>';
  }
  function msgHtml(m) {
    if (m.role === "he_thong") return `<div class="sys">${esc(m.body.replace(/^Đã chuyển cho người phụ trách:.*/, "Đã chuyển cho người phụ trách"))}</div>`;
    const me = m.role === "khach", human = m.role === "admin";
    return `<div class="row ${me ? "me" : "them"} ${human ? "human" : ""}">
      ${me ? "" : `<div class="who-tag">${human ? "Người phụ trách" : "Trợ lý"}</div>`}
      <div class="bubble">${linkify(m.body)}</div><div class="time">${hm(m.created_at)}</div></div>`;
  }
  function renderChat() {
    const st = S.ticket.status;
    const fewMsgs = !S.msgs.some(m => m.role === "khach");
    $("#app").innerHTML = `
      <header class="head">
        <div class="badge">${ICON.chat}</div>
        <div class="who"><b>Hỗ trợ khách hàng</b><div class="sub">${statusPill()}<small>${esc(S.ticket.email)}</small></div></div>
        <button class="icon-btn" id="newBtn" title="Chat với email khác" aria-label="Chat với email khác">${ICON.reset}</button>
      </header>
      <main class="feed" id="feed" aria-live="polite">${S.msgs.map(msgHtml).join("")}${S.sending && st !== "cho_nguoi" ? '<div class="typing" aria-label="Đang trả lời"><i></i><i></i><i></i></div>' : ""}</main>
      ${st === "cho_nguoi" ? `<div class="banner">Người phụ trách sẽ trả lời tại đây. Bạn có thể đóng trang, mở lại <b>godnc.com/hotro</b> vẫn xem được.</div>` : ""}
      ${fewMsgs ? `<div class="chips">${CHIPS.map(c => `<button class="chip" data-chip="${esc(c)}">${esc(c)}</button>`).join("")}</div>` : ""}
      <form class="compose" id="compose">
        <textarea id="text" rows="1" placeholder="Nhập tin nhắn…" aria-label="Tin nhắn" maxlength="1000"></textarea>
        <button class="btn send" type="submit" aria-label="Gửi" ${S.sending ? "disabled" : ""}>${S.sending ? '<span class="spin"></span>' : ICON.send}</button>
      </form>
      ${st === "bot" ? `<div style="text-align:center;padding:0 16px 10px;background:var(--panel)"><button class="foot-link" id="humanBtn">Muốn nói chuyện với người phụ trách?</button></div>` : ""}`;
    const feed = $("#feed"); feed.scrollTop = feed.scrollHeight;
    const ta = $("#text"); ta.value = S.draft || "";
    const grow = () => { ta.style.height = "auto"; ta.style.height = Math.min(ta.scrollHeight, 140) + "px"; };
    ta.oninput = () => { S.draft = ta.value; grow(); }; grow();
    ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing && matchMedia("(pointer:fine)").matches) { e.preventDefault(); send(); } };
    if (!S.sending && matchMedia("(pointer:fine)").matches) ta.focus();
    $("#compose").onsubmit = e => { e.preventDefault(); send(); };
    document.querySelectorAll("[data-chip]").forEach(b => b.onclick = () => send(b.dataset.chip));
    $("#newBtn").onclick = () => { if (confirm("Bắt đầu chat với email khác? Cuộc chat này vẫn được lưu ở phía shop.")) { save(null); S = { ticket: null, msgs: [], busy: false, sending: false, err: "" }; renderIntro(); } };
    const hb = $("#humanBtn"); if (hb) hb.onclick = askHuman;
    startPoll();
  }

  async function send(preset) {
    const text = (preset ?? S.draft ?? "").trim();
    if (!text || S.sending) return;
    const temp = { id: lastId() + 0.5, role: "khach", body: text, created_at: new Date().toISOString(), temp: true };
    S.msgs.push(temp); S.draft = ""; S.sending = true; renderChat();
    try {
      const r = await api("send", { token: S.ticket.token, text, after: lastId() === temp.id ? temp.id - 0.5 : lastId() });
      S.msgs = S.msgs.filter(m => !m.temp); merge(r);
    } catch (e) {
      S.msgs = S.msgs.filter(m => !m.temp); S.draft = text; toast(e.message);
    } finally { S.sending = false; renderChat(); }
  }
  async function askHuman() {
    try { merge(await api("human", { token: S.ticket.token, after: lastId() })); renderChat(); } catch (e) { toast(e.message); }
  }

  /* ---------- nhận tin người phụ trách ---------- */
  function startPoll() {
    stopPoll();
    const every = S.ticket.status === "cho_nguoi" ? 4000 : 20000;
    pollTimer = setTimeout(async () => {
      if (document.visibilityState === "visible" && !S.sending) {
        try {
          const before = S.msgs.length, st = S.ticket.status;
          merge(await api("poll", { token: S.ticket.token, after: lastId() }));
          if (S.msgs.length !== before || S.ticket.status !== st) {
            if (S.msgs.slice(before).some(m => m.role === "admin") && document.hidden === false) try { navigator.vibrate?.(60); } catch (_) {}
            renderChat(); return;
          }
        } catch (_) {}
      }
      startPoll();
    }, every);
  }
  function stopPoll() { clearTimeout(pollTimer); pollTimer = null; }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && S.ticket && !S.sending) { stopPoll(); api("poll", { token: S.ticket.token, after: lastId() }).then(r => { merge(r); renderChat(); }).catch(() => startPoll()); } });

  const prev = load();
  if (prev && prev.token) resume(prev.token); else renderIntro();
})();
</script>
</body>
</html>
