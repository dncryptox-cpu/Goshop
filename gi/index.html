<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GO INTELLIGENCE · Tài khoản AI chính hãng</title>
<meta name="description" content="ChatGPT, Claude, Gemini, CapCut… giá tốt, giao ngay, bảo hành suốt thời hạn. Ví nạp sẵn, hạng thành viên giảm giá.">
<meta name="theme-color" content="#0F1115">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css?v=3">
<style>
.login-btn{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);font-weight:700;font-size:14px}
.foot{margin:36px 16px 24px;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);font-size:13px;color:var(--mute);line-height:1.6;display:flex;flex-direction:column;gap:10px}
.foot b{color:var(--ink)}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.copyrow button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:5px 9px;font-size:12px;font-weight:700}
.payq img{width:220px;height:auto;border-radius:12px;background:#fff}
.cd{font-family:'JetBrains Mono',monospace;font-weight:700}
.acc{margin:0 16px 14px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:10px;font-size:14px}
.acc .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.acc .inp{flex:1 1 160px;padding:10px 12px}
.skel{height:180px;border-radius:16px;background:linear-gradient(90deg,#15181D,#1C2027,#15181D);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
nav.tab{grid-template-columns:repeat(5,1fr)}
.pk{margin:0 16px 14px;padding:16px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;gap:12px}
.pk .kv{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pk .kv small{display:block;font-size:12px;color:var(--dim);margin-bottom:2px}
.pk .kv b{font-size:15px;word-break:break-all}
.hist{margin:0 16px 14px;display:flex;flex-direction:column;gap:8px}
.hrow{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;display:flex;flex-direction:column;gap:4px}
.hrow .t{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hrow small{color:var(--mute)}
.qwarn{margin:0 16px 14px;padding:12px 14px;border-radius:12px;background:#3A2A0F;border:1px solid #7A5A1F;color:#FCD9A0;font-size:13px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
#sidebal{display:none}
@media(min-width:1024px){#sidebal{display:block;margin-top:auto}#sidebal .side-bal{display:flex}.row2:has(#dealbox[style*="none"]){grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div id="app">
 <div class="views">

  <!-- HOME -->
  <section class="view on" id="v-home">
    <header class="top">
      <div class="brand hb"><i>GI</i>GO INTELLIGENCE</div>
      <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8B909A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input placeholder="Tìm ChatGPT, CapCut, Claude…" aria-label="Tìm sản phẩm" oninput="S.q=this.value;renderHome()"></label>
      <div class="hpill" data-acct></div>
    </header>
    <div class="banners" id="banners"></div>
    <div class="dots" id="dots"></div>
    <div class="row2">
      <button class="tier" onclick="go('tier')">
        <div class="row">
          <div><div style="font-size:12px;font-weight:700;opacity:.8">HẠNG CỦA BẠN</div><div style="font-size:22px;font-weight:800" data-tier-name></div></div>
          <div style="text-align:right"><div style="font-size:22px;font-weight:800" data-tier-off></div><div style="font-size:12px;font-weight:600;opacity:.8" data-tier-back></div></div>
        </div>
        <div class="bar"><div data-tier-bar></div></div>
        <div style="font-size:12px;font-weight:600" data-tier-next></div>
      </button>
      <div class="flash" id="dealbox">
        <div class="t"><b><svg width="16" height="16" viewBox="0 0 24 24" fill="#FB923C" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>Deal xả hàng</b><small>Giá giảm theo số ngày còn lại</small></div>
        <div class="fgrid" id="flash"></div>
      </div>
    </div>
    <div class="h2">Sản phẩm <small id="count"></small></div>
    <div class="chips" id="chips"></div>
    <div class="grid" id="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
    <div class="foot" id="foot"></div>
  </section>

  <!-- PRODUCT -->
  <section class="view" id="v-product">
    <header class="top"><button class="back" onclick="go('home')"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Cửa hàng</button>
      <div data-acct></div></header>
    <div id="pbody"></div>
  </section>

  <!-- PAY QR -->
  <section class="view" id="v-pay">
    <header class="top"><button class="back" onclick="go('orders')"><svg width="20" height="20" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>Thanh toán QR</button></header>
    <div class="paywrap" id="paybody"></div>
  </section>

  <!-- DONE -->
  <section class="view" id="v-done"><div class="done" id="dbody"></div></section>

  <!-- WALLET -->
  <section class="view" id="v-wallet">
    <header class="top"><div class="brand" style="font-size:18px">Ví của tôi</div></header>
    <div id="wbody"></div>
  </section>

  <!-- TIER -->
  <section class="view" id="v-tier">
    <header class="top"><div class="brand" style="font-size:18px">Hạng thành viên</div></header>
    <div class="twrap"><div>
      <div class="tier" style="cursor:default">
        <div style="font-size:12px;font-weight:700;letter-spacing:.06em">GO CLUB</div>
        <div style="font-size:30px;font-weight:800" data-tier-name></div>
        <div style="font-size:13px;font-weight:600">Tổng chi tiêu: <span class="mono" id="spent"></span></div>
        <div class="bar" style="height:8px"><div data-tier-bar></div></div>
        <div style="font-size:13px;font-weight:600" data-tier-next></div>
      </div>
      <p class="sub" style="margin-top:14px">Hạng tự lên theo tổng chi tiêu (trả QR hay trả ví đều tính). Ưu đãi áp dụng tự động cho mọi đơn.</p>
    </div>
    <div class="tlist" id="tlist"></div></div>
  </section>

  <!-- PACK: gói YouTube + lịch sử fix (đọc từ trang renew) -->
  <section class="view" id="v-pack">
    <header class="top"><div class="brand" style="font-size:18px">Gói của tôi</div><div data-acct></div></header>
    <div id="kbody"></div>
  </section>

  <!-- ORDERS -->
  <section class="view" id="v-orders">
    <header class="top"><div class="brand" style="font-size:18px">Đơn của tôi</div></header>
    <div id="obody"></div>
  </section>
 </div>

  <nav class="tab" aria-label="Điều hướng">
    <div class="brand side-brand"><i>GI</i>GO INTELLIGENCE</div>
    <button data-tab="home" class="on" onclick="go('home')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6h-6v6H4a1 1 0 01-1-1z"/></svg>Cửa hàng</button>
    <button data-tab="wallet" onclick="go('wallet')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7h15a3 3 0 013 3v7a3 3 0 01-3 3H6a3 3 0 01-3-3zM3 7l12-3v3M16 13.5h2"/></svg>Ví</button>
    <button data-tab="tier" onclick="go('tier')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg>Hạng</button>
    <button data-tab="pack" onclick="go('pack')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></svg>Gói</button>
    <button data-tab="orders" onclick="go('orders')"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>Đơn<span class="nb" id="nb" style="display:none"></span></button>
    <div id="sidebal"></div>
  </nav>
</div>

<div class="scrim" id="scrim" onclick="if(event.target===this)closeSheet()"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js?v=5"></script>
<script src="common.js?v=5"></script>
<script src="quick.js?v=5"></script>
<script>
// ======================= STATE =======================
const S = { user: null, me: null, cat: { tier: null, bank: null, products: [] }, settings: {}, orders: [], ledger: [],
  catName: 'Tất cả', q: '', cur: null, vid: null, pay: 'wallet', email: '', pack: 2, payOrder: null, view: 'home', loaded: false, topupWatch: null };
const PACK_AMOUNTS = [100000, 200000, 500000, 1000000];
const CHECK = c => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${c || '#2DD4BF'}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>`;

// ======================= DATA =======================
async function loadSettings() {
  const { data, error } = await sb.from('settings').select('key,value');
  if (error) throw error; (data || []).forEach(r => S.settings[r.key] = r.value);
}
async function loadCatalog() {
  const { data, error } = await sb.rpc('catalog');
  if (error) throw error; S.cat = data || { products: [] };
  if (S.cur) S.cur = S.cat.products.find(p => p.id === S.cur.id) || null;
}
async function loadMe() {
  if (!S.user) { S.me = null; S.orders = []; S.ledger = []; S.topups = []; return; }
  const [p, o, l, t] = await Promise.all([
    sb.from('profiles').select('*').eq('id', S.user.id).single(),
    sb.from('orders').select('*').order('created_at', { ascending: false }).limit(50),
    sb.from('wallet_ledger').select('*').order('created_at', { ascending: false }).limit(50),
    sb.from('topup_requests').select('*').order('created_at', { ascending: false }).limit(10)
  ]);
  if (p.error) throw p.error;
  S.me = p.data; S.orders = o.data || []; S.ledger = l.data || []; S.topups = t.data || [];
  if (S.topups.some(x => x.status === 'pending')) startTopupPoll();
}
async function refreshAll() {
  try { await Promise.all([loadSettings(), loadCatalog(), loadMe()]); S.loaded = true; }
  catch (e) { console.error(e); toast('Lỗi tải dữ liệu: ' + errText(e)); }
  render(); if (S.view === 'pack') loadPack();
}
async function login() {
  openAuth('login');
}
async function logout() { await sb.auth.signOut(); S.user = null; await refreshAll(); go('home'); }
const needLogin = () => { if (S.user) return false; toast('Đăng nhập hoặc đăng ký để tiếp tục'); openAuth('register'); return true; };

// ======================= NAV =======================
const VIEWS = ['home', 'product', 'pay', 'done', 'wallet', 'tier', 'pack', 'orders'];
const TABMAP = { product: 'home', done: 'orders', pay: 'orders' };
function go(v) {
  if (!VIEWS.includes(v)) v = 'home';
  if (v !== 'pay') stopPoll('order');
  S.view = v;
  document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === 'v-' + v));
  document.querySelectorAll('nav.tab button[data-tab]').forEach(b => b.classList.toggle('on', b.dataset.tab === (TABMAP[v] || v)));
  if (['home', 'wallet', 'tier', 'pack', 'orders'].includes(v)) history.replaceState(null, '', v === 'home' ? location.pathname : '#' + v);
  window.scrollTo(0, 0); render();
  if (v === 'pack') loadPack();
}

// ======================= RENDER: CHUNG =======================
const tiers = () => (S.settings.tiers || []).slice().sort((a, b) => a.min - b.min);
const curTier = () => S.cat.tier || tiers()[0] || { name: 'Thành viên', off: 0, back: 0, min: 0 };
function renderShared() {
  const spent = S.me ? Number(S.me.spent) : 0, t = curTier(), nx = tiers().find(x => x.min > spent);
  const acct = S.user
    ? `<button class="pill" onclick="go('wallet')" aria-label="Ví và nạp tiền"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2DD4BF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 7h15a3 3 0 013 3v7a3 3 0 01-3 3H6a3 3 0 01-3-3zM3 7l12-3v3M16 13.5h2"/></svg><span class="mono">${vnd(S.me ? S.me.balance : 0)}</span><span class="plus">+</span></button>`
    : `<button class="login-btn" onclick="login()">Đăng nhập</button>`;
  document.querySelectorAll('[data-acct]').forEach(e => e.innerHTML = acct);
  document.querySelectorAll('[data-tier-name]').forEach(e => e.textContent = t.name);
  document.querySelectorAll('[data-tier-off]').forEach(e => e.textContent = t.off ? '−' + t.off + '%' : '0%');
  document.querySelectorAll('[data-tier-back]').forEach(e => e.textContent = `mọi đơn + hoàn ${t.back}%`);
  const pct = nx ? Math.min(100, (spent - t.min) / (nx.min - t.min) * 100) : 100;
  document.querySelectorAll('[data-tier-bar]').forEach(e => e.style.width = Math.max(0, pct) + '%');
  document.querySelectorAll('[data-tier-next]').forEach(e => e.textContent = !S.user ? 'Đăng nhập để tích luỹ hạng' : nx ? `Còn ${vnd(nx.min - spent)} để lên ${nx.name}` : 'Bạn đang ở hạng cao nhất');
  $('#sidebal').innerHTML = S.user
    ? `<button class="side-bal" style="margin:0;width:100%" onclick="go('wallet')"><small>Số dư ví</small><b class="mono">${vnd(S.me ? S.me.balance : 0)}</b><small>Hạng ${esc(t.name)} · −${t.off}% mọi đơn</small><span class="n">+ Nạp tiền</span></button>`
    : `<button class="side-bal" style="margin:0;width:100%" onclick="login()"><small>Chưa đăng nhập</small><b style="font-size:16px">Đăng nhập / Đăng ký</b><small>đăng ký 5 giây để mua, nạp ví, tích hạng</small></button>`;
  const pend = S.orders.filter(o => o.status === 'unpaid' || o.status === 'processing').length;
  const nb = $('#nb'); nb.style.display = pend ? 'grid' : 'none'; nb.textContent = pend;
}

// ======================= HOME =======================
const vInstant = v => v.kind !== 'manual' && v.stock > 0;
function deals() { const out = []; S.cat.products.forEach(p => (p.variants || []).forEach(v => { if (v.kind === 'fixed' && v.stock > 0 && v.age_off > 0) out.push({ p, v }); })); return out; }
function renderHome() {
  const live = S.cat.products || [];
  const cats = ['Tất cả', ...new Set(live.map(p => p.category))];
  $('#chips').innerHTML = cats.map(c => `<button class="chip ${c === S.catName ? 'on' : ''}" data-c="${esc(c)}" onclick="S.catName=this.dataset.c;renderHome()">${esc(c)}</button>`).join('');
  const q = S.q.trim().toLowerCase();
  const list = live.filter(p => (S.catName === 'Tất cả' || p.category === S.catName) && (!q || p.name.toLowerCase().includes(q)));
  $('#count').textContent = S.loaded ? list.length + ' sản phẩm' : '';
  const t = curTier();
  if (S.loaded) $('#grid').innerHTML = list.map(p => {
    const vs = p.variants || []; const min = Math.min(...vs.map(v => v.pay)); const instant = vs.some(vInstant); const sale = vs.some(v => v.kind === 'fixed' && v.stock > 0 && v.age_off > 0);
    return `<button class="pcard" onclick="openP('${p.id}')">${sale ? '<span class="badge">DEAL</span>' : ''}
    ${logo(p)}<div><div class="name">${esc(p.name)}</div><div style="margin-top:6px"><span class="tag ${instant ? 'auto' : 'manual'}">${instant ? 'Có hàng · giao ngay' : 'Shop xử lý ~30p'}</span></div></div>
    <div class="price"><small>Giá ${esc(t.name)} · từ</small><b class="mono">${vnd(min)}</b></div></button>`;
  }).join('') || '<div class="empty" style="grid-column:1/-1">Không tìm thấy sản phẩm</div>';
  const d = deals(); $('#dealbox').style.display = d.length ? '' : 'none';
  $('#flash').innerHTML = d.slice(0, 6).map(({ p, v }) => `<button class="fcard" onclick="openP('${p.id}','${v.id}')">
    <div style="display:flex;gap:8px;align-items:center">${logo(p, 'sm')}<b style="font-size:13px">${esc(p.name)} · ${esc(v.label)}</b></div>
    <span class="old mono">${vnd(v.list_price)}</span><span class="new mono">${vnd(v.pay)} <span style="font-size:12px">−${v.age_off}%</span></span>
    <span class="dl">HSD đến ${fds(v.lot_expires_at)} · còn ${daysLeft(v.lot_expires_at)} ngày</span></button>`).join('');
  const C = window.GI_CONFIG;
  $('#foot').innerHTML = `<div><b>GO INTELLIGENCE</b> · Tài khoản AI & tiện ích chính hãng, giá tốt.</div>
    <div><b>Bảo hành:</b> lỗi trong thời hạn sử dụng được đổi tài khoản mới miễn phí. Không bảo hành khi tự đổi mật khẩu hoặc chia sẻ thông tin đăng nhập.</div>
    <div><b>Ví GO:</b> số dư chỉ dùng để mua hàng tại GO INTELLIGENCE, không quy đổi thành tiền mặt. Đơn không giao được sẽ hoàn tiền vào ví.</div>
    <div><b>Thanh toán:</b> quét QR ngân hàng (đã có sẵn số tiền và nội dung) hoặc trừ ví. Shop xác nhận chuyển khoản trong vài phút (8h–23h). Ghi sai nội dung vui lòng liên hệ hỗ trợ kèm ảnh giao dịch.</div>
    <div><a href="privacy.html">Chính sách bảo mật & Điều khoản</a></div>
    ${C.SUPPORT_URL ? `<a href="${esc(C.SUPPORT_URL)}" target="_blank" rel="noopener" class="btn sm" style="text-decoration:none;align-self:flex-start">Liên hệ hỗ trợ</a>` : ''}`;
}
function banners() {
  const B = [
    { bg: 'linear-gradient(135deg,#134E48,#0B2F2C)', c: '#F2F2F0', t: 'Nạp ví có thưởng tới 8%', s: 'Mua 1 chạm, không cần CK mỗi lần', cta: 'Nạp ngay', cb: '#2DD4BF', ci: '#0F1115', act: "go('wallet')", art: 'coins' },
    { bg: 'linear-gradient(135deg,#7C2D12,#3A1708)', c: '#FFF4EC', t: 'Deal xả hàng mỗi ngày', s: 'HSD rõ từng ngày · càng gần hạn càng rẻ', cta: 'Xem deal', cb: '#FB923C', ci: '#0F1115', act: "document.getElementById('dealbox').scrollIntoView({behavior:'smooth'})", art: 'bolt' },
    { bg: 'linear-gradient(135deg,#E9B949,#B8862A)', c: '#1A1407', t: 'Lên hạng: giảm tới 8% mọi đơn', s: 'Hạng tự lên theo chi tiêu', cta: 'Xem hạng', cb: '#1A1407', ci: '#E9B949', act: "go('tier')", art: 'star' }];
  const art = {
    coins: `<svg class="art" viewBox="0 0 150 150" aria-hidden="true"><ellipse cx="95" cy="110" rx="42" ry="14" fill="#2DD4BF" opacity=".5"/><ellipse cx="95" cy="96" rx="42" ry="14" fill="#2DD4BF" opacity=".7"/><ellipse cx="95" cy="82" rx="42" ry="14" fill="#5EEAD4"/><text x="95" y="88" text-anchor="middle" font-family="JetBrains Mono" font-weight="700" font-size="16" fill="#0F1115">+8%</text></svg>`,
    bolt: `<svg class="art" viewBox="0 0 150 150" aria-hidden="true"><circle cx="100" cy="90" r="52" fill="#FB923C" opacity=".22"/><path d="M108 30L68 92h28l-8 48 44-66h-30z" fill="#FB923C"/></svg>`,
    star: `<svg class="art" viewBox="0 0 150 150" aria-hidden="true"><circle cx="100" cy="92" r="50" fill="#1A1407" opacity=".12"/><path d="M100 46l13 28 30 3-23 20 7 30-27-16-27 16 7-30-23-20 30-3z" fill="#1A1407" opacity=".85"/></svg>` };
  $('#banners').innerHTML = B.map(b => `<button class="banner" style="background:${b.bg};color:${b.c}" onclick="${b.act}"><span>GO INTELLIGENCE</span><b>${b.t}</b><span>${b.s}</span>${art[b.art]}<span class="cta" style="background:${b.cb};color:${b.ci}">${b.cta}</span></button>`).join('');

function closeSheet() { $('#scrim').classList.remove('on'); }
async function placeOrder() {
  const v = curV(), btn = $('#confirmBtn'); btn.disabled = true; btn.textContent = 'Đang xử lý…';
  const { data, error } = await sb.rpc('place_order', { p_variant: v.id, p_pay: S.pay, p_email: v.require_email ? S.email.trim() : null });

async function requestTopup() {
  const amt = Math.round(Number($('#tpamt').value)); const btn = $('#tpBtn');
  btn.disabled = true;
  const { error } = await sb.rpc('request_topup', { p_amount: amt });
  if (error) { btn.disabled = false; return toast(errText(error)); }
  toast('Đã báo shop, chờ xác nhận'); await loadMe(); render();
}
function startTopupPoll() {
  if (POLLS.topup) return;
  startPoll('topup', async () => {
    const { data } = await sb.from('topup_requests').select('*').order('created_at', { ascending: false }).limit(10);
    if (!data) return;
    const was = (S.topups || []).filter(t => t.status === 'pending').map(t => t.id);
    const done = data.filter(t => was.includes(t.id) && t.status !== 'pending');
    if (done.length) {
      await loadMe(); render();
      done.forEach(t => toast(t.status === 'approved' ? `+${vnd(t.credited)} vào ví` : `Yêu cầu nạp ${vnd(t.amount)} không được duyệt`));
    }
    if (!data.some(t => t.status === 'pending')) stopPoll('topup');
  }, 8000, 60 * 60 * 1000);
}

    <div id="olist">${S.orders.map(o => { const p = S.cat.products.find(x => x.name === o.product_name) || { name: o.product_name };

const quickWarn = () => GI_isQuick(S.user) ? `<div class="qwarn"><span>Mật khẩu đang là mặc định (phần trước @ email). Đổi để giữ an toàn ví.</span><button class="btn sm" onclick="openChangePass()">Đổi ngay</button></div>` : '';
const TST = { 'Mới': 'unpaid', 'Đang xử lý': 'processing', 'Đã xử lý': 'done' };
const dshort = x => { if (!x) return ''; const d = new Date(x); return isNaN(d) ? String(x) : d.toLocaleString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
async function renewApi(action, payload, ms = 60000) {
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try {
    const r = await fetch(GI_CONFIG.RENEW_API + '?action=' + action, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload), signal: c.signal });
    return JSON.parse(await r.text());
  } finally { clearTimeout(t); }
}
async function loadPack(force) {
  if (!S.user || !S.me || !GI_CONFIG.RENEW_API) return;
  const mail = String(S.me.email || '').toLowerCase();
  if (!force && S.pack && S.pack.mail === mail && !S.pack.fail) return;
  S.pack = { mail, loading: true, warranty: S.pack && S.pack.mail === mail ? S.pack.warranty : null }; renderPack();
  try {
    const [d, mp] = await Promise.all([renewApi('checkStatus', { email: mail }), renewApi('checkMailPhuStatus', { primaryEmail: mail }).catch(() => null)]);
    S.pack = { mail, data: d, mailphu: mp && mp.success && mp.has_existing ? mp : null, warranty: S.pack.warranty };
  } catch (e) { S.pack = { mail, fail: true }; }
  if (S.view === 'pack') renderPack();
}
// Chưa đăng nhập: nhập email đã mua gói → vào thẳng (mật khẩu mặc định = phần trước @)
async function enterByEmail() {
  const inp = $('#pkmail'), btn = $('#pkgo'), err = $('#pkerr');
  const mail = String(inp.value || '').trim().toLowerCase();
  err.style.display = 'none';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(mail)) { err.textContent = 'Email chưa đúng'; err.style.display = ''; return; }
  btn.disabled = true; btn.textContent = 'Đang tra…';
  try {
    const d = await renewApi('checkStatus', { email: mail });
    if (!d || !d.success) { err.textContent = 'Email này chưa có gói tại shop. Kiểm tra lại email bạn đã đăng ký.'; err.style.display = ''; return; }
    const st = await GI_quickLogin(sb, mail);
    if (st === 'own') { toast('Email này đã đặt mật khẩu riêng, hãy đăng nhập'); openAuth('login'); setTimeout(() => { const u = document.getElementById('au_user'); if (u) u.value = mail; }, 60); return; }
    if (st !== 'in' && st !== 'new') { err.textContent = 'Chưa vào được, thử lại sau ít phút.'; err.style.display = ''; return; }
    S.pack = { mail, data: d };
    if (st === 'new') toast('Đã tạo tài khoản. Mật khẩu mặc định: ' + GI_quickPass(mail));
    await window.GI_onAuth();
    loadPack(true);
  } catch (e) { err.textContent = 'Lỗi kết nối, thử lại.'; err.style.display = ''; }
  finally { if (btn.isConnected) { btn.disabled = false; btn.textContent = 'Vào xem gói'; } }
}

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button class="btn" onclick="openReport()">Báo lỗi</button>
        <button class="btn ghost" onclick="loadPack(true)">Làm mới</button>

    </div>

    <div class="pk"><b>TK bảo hành tạm</b>
      ${w ? `<small style="color:var(--mute)">Dùng tạm trong lúc chờ xử lý. Đăng nhập YouTube bằng tài khoản này.</small>
        <div class="copyrow"><span>Email: <b class="mono">${esc(w.email)}</b></span><button onclick="copyText('${esc(w.email)}')">Copy</button></div>
        <div class="copyrow"><span>Mật khẩu: <b class="mono">${esc(w.pass)}</b></span><button onclick="copyText('${esc(w.pass)}')">Copy</button></div>
        ${w.mkp ? `<div class="copyrow"><span>Mail khôi phục: <b class="mono">${esc(w.mkp)}</b></span><button onclick="copyText('${esc(w.mkp)}')">Copy</button></div>` : ''}
        ${w.secret2fa ? `<div class="copyrow"><span>Mã 2FA: <b class="mono" id="totp" style="font-size:18px;letter-spacing:.1em">------</b> <small id="totpt" style="color:var(--dim)"></small></span><button onclick="copyText($('#totp').textContent)">Copy</button></div>` : ''}
        <small style="color:var(--dim)">Google hỏi xác minh → chọn "Xác minh bằng email khôi phục" rồi dán mail khôi phục ở trên.</small>`
      : `<small style="color:var(--mute)">YouTube lỗi, cần dùng ngay? Lấy tài khoản dùng tạm trong lúc shop xử lý.</small>
        <button class="btn ghost" id="wbtn" onclick="getWarranty()">Lấy TK bảo hành tạm</button>`}

    <div class="pk"><b>Đổi sang mail phụ</b>
      <small style="color:var(--mute)">Không muốn dùng chung TK bảo hành? Chuyển gói sang email phụ của riêng bạn.</small>
      ${mp ? `<div class="warn" style="background:#1E2A4A;color:#BFD0FF">Đã gửi yêu cầu đổi sang <b>${esc(mp.mail_phu)}</b> · ${esc(mp.status || 'Chờ xử lý')}. Gửi email khác bên dưới sẽ cập nhật lại.</div>` : ''}
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap"><input class="inp" id="mphu" type="email" placeholder="email-phu@gmail.com" style="flex:1 1 180px"><button class="btn sm" id="mpbtn" onclick="sendMailPhu()">Gửi yêu cầu</button></div>

      <small>Báo: ${esc(dshort(t.created_at))}${t.resolved_at ? ' · Xong: ' + esc(dshort(t.resolved_at)) : ''}</small>

    <p class="note" style="margin:0 16px 20px">Cần hỗ trợ gấp: Zalo 0398.057.191</p>`;
  if (w && w.secret2fa) startTotp(w.secret2fa); else stopPoll('totp');
}

  $('#sheet').innerHTML = `<h3>Báo lỗi YouTube</h3>
    <label class="fl">Lỗi gặp phải<textarea class="inp" id="rpmsg" rows="3" placeholder="vd: Mở YouTube không còn Premium / bị văng nhóm…"></textarea></label>
    <label class="fl">Số Zalo để shop báo khi xong<input class="inp" id="rpzalo" type="tel" inputmode="tel" value="${esc(me.zalo || me.phone || '')}" placeholder="09xx xxx xxx"></label>

// Mã 2FA (TOTP 30 giây) tính ngay trên máy
async function totpNow(secret) {
  const al = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', clean = String(secret).toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = 0, val = 0; const out = [];
  for (const ch of clean) { val = (val << 5) | al.indexOf(ch); bits += 5; if (bits >= 8) { out.push((val >>> (bits - 8)) & 255); bits -= 8; } }
  const now = Math.floor(Date.now() / 1000), ctr = Math.floor(now / 30), buf = new ArrayBuffer(8);
  new DataView(buf).setUint32(4, ctr, false);
  const key = await crypto.subtle.importKey('raw', new Uint8Array(out), { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
  const h = new Uint8Array(await crypto.subtle.sign('HMAC', key, buf)), o = h[19] & 15;
  const bin = ((h[o] & 127) << 24) | (h[o + 1] << 16) | (h[o + 2] << 8) | h[o + 3];
  return { code: String(bin % 1e6).padStart(6, '0'), left: 30 - (now % 30) };
}
function startTotp(secret) {
  const tick = async () => { const e = $('#totp'); if (!e) return stopPoll('totp'); try { const r = await totpNow(secret); e.textContent = r.code; $('#totpt').textContent = r.left + 's'; } catch { } };
  tick(); startPoll('totp', tick, 1000, 30 * 60 * 1000);
}

  banners();
  const { data } = await sb.auth.getSession(); S.user = data && data.session ? data.session.user : null;
  sb.auth.onAuthStateChange((_ev, session) => { const u = session ? session.user : null; if ((u && u.id) !== (S.user && S.user.id)) { S.user = u; refreshAll(); } });

  const h = location.hash.slice(1); if (VIEWS.includes(h)) go(h);
}
