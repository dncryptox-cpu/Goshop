<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin · GO INTELLIGENCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="app.css?v=13">
<style>
#app{padding-bottom:24px}
@media(min-width:1024px){#app{display:block;max-width:1240px}.views{padding:8px 24px 48px}}
#abody td .tag{white-space:nowrap}
.tag.ok{background:var(--accent-soft);color:var(--accent-text)}.tag.warn{background:#2A2310;color:var(--gold)}.tag.bad{background:#3A2414;color:#FDBA8C}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0 16px 16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.kpi small{display:block;font-size:12px;color:var(--mute)}.kpi b{font-size:22px}
.kpi.bad{border-color:#B91C1C;background:#2A1416}
td .inp{padding:7px 9px;font-size:13px;max-width:130px}
.row-act{display:flex;gap:6px;flex-wrap:wrap}
.rc{font-size:44px;font-weight:800}
</style>
</head>
<body>
<div id="app"><div class="views">
  <header class="top"><div class="brand"><i>GI</i>Admin</div><div id="who" style="font-size:13px;color:var(--mute)"></div></header>
  <div id="gate"></div>
  <div id="main" style="display:none">
    <div class="kpis" id="kpis"></div>
    <div class="chips" id="atabs"></div>
    <div id="abody"></div>
  </div>
</div></div>
<div class="toast" id="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js"></script>
<script src="config.js?v=13"></script>
<script src="common.js?v=13"></script>
<script>
const A = { user: null, me: null, tab: 'todo', topups: [], users: {}, products: [], orders: [], txs: [], rc: null, kp: null, kv: null, stock: [], cust: [], custSel: null, custLedger: [], wz: null };
const COLORS = ['#10A37F', '#1D4ED8', '#7C3AED', '#B91C1C', '#C2410C', '#0E7490', '#2B2B2B', '#3A2418'];
const vById = id => { for (const p of A.products) { const v = (p.variants || []).find(x => x.id === id); if (v) return { p, v }; } return {}; };
const call = async (fn, args) => { const { data, error } = await sb.rpc(fn, args); if (error) { toast(errText(error)); throw error; } return data; };

// ---------- tải dữ liệu ----------
async function loadTodo() {
  const [o, t, r, tp] = await Promise.all([
    sb.from('orders').select('*').in('status', ['processing', 'unpaid', 'expired']).order('created_at', { ascending: true }).limit(300),
    sb.from('bank_tx').select('*').eq('matched', 'none').order('created_at', { ascending: false }).limit(100),
    sb.rpc('admin_reconcile'),
    sb.from('topup_requests').select('*').eq('status', 'pending').order('created_at', { ascending: true }).limit(100)]);
  // Đơn hết giờ giữ hàng chỉ hiện trong 2 ngày gần nhất (khách có thể đã chuyển muộn)
  A.orders = (o.data || []).filter(x => x.status !== 'expired' || Date.now() - toDate(x.created_at) < 2 * DAY);
  A.txs = t.data || []; A.rc = r.data; A.topups = tp.data || [];
  const ids = [...new Set([...A.topups.map(x => x.user_id), ...A.orders.map(x => x.user_id)])];
  if (ids.length) { const { data: us } = await sb.from('profiles').select('id,email,zalo,pay_code').in('id', ids); A.users = Object.fromEntries((us || []).map(u => [u.id, u])); }
  document.title = (todoN() ? `(${todoN()}) ` : '') + 'Admin · GO INTELLIGENCE';
}
async function loadProducts() { A.products = (await call('admin_products')) || []; }
async function refresh() { try { await Promise.all([loadTodo(), loadProducts()]); } catch (e) { console.error(e); } render(); }

// ---------- khung ----------
function render() {
  const rc = A.rc || {}, proc = A.orders.filter(o => o.status === 'processing').length, unpaid = A.orders.filter(o => o.status === 'unpaid').length;
  $('#kpis').innerHTML = `
    <div class="kpi ${unpaid ? 'bad' : ''}"><small>Đơn chờ xác nhận tiền</small><b class="mono">${unpaid}</b></div>
    <div class="kpi ${A.topups.length ? 'bad' : ''}"><small>Nạp ví chờ duyệt</small><b class="mono">${A.topups.length}</b></div>
    <div class="kpi ${proc ? 'bad' : ''}"><small>Cần giao tay</small><b class="mono">${proc}</b></div>
    <div class="kpi ${Number(rc.diff) ? 'bad' : ''}"><small>Đối soát ví (phải = 0)</small><b class="mono">${vnd(rc.diff || 0)}</b></div>
    <div class="kpi"><small>Tổng số dư khách</small><b class="mono">${vnd(rc.sum_balance || 0)}</b></div>`;
  const todo = todoN();
  const tabs = [['todo', 'Việc cần làm', todo], ['orders', 'Đơn hàng'], ['report', 'Báo cáo'], ['topups', 'Lịch sử nạp'], ['customers', 'Khách'], ['products', 'Sản phẩm'], ['stock', 'Kho'], ['new', '+ Thêm sản phẩm']];
  $('#atabs').innerHTML = tabs.map(([k, l, n]) => `<button class="chip ${A.tab === k ? 'on' : ''}" onclick="tab('${k}')">${l}${n ? `<span class="n">${n}</span>` : ''}</button>`).join('');
  $('#abody').innerHTML = ({ todo: vTodo, products: vProducts, stock: vStock, new: vWizard, customers: vCustomers, orders: vOrders, topups: vTopups, report: vReport })[A.tab]();
  if (A.tab === 'new') wzMarginAll();
}
function tab(k) { if (k === 'topups') A.tpAll = null; if (k === 'orders' || k === 'report') A.ordAll = null; if (k === 'report') A.rep = null; if (k === 'customers' && !A.custLoaded) loadCustList(); A.tab = k; if (k === 'new' && !A.wz) wzReset(); if (k === 'stock') loadStock().then(render); else render(); }

// ---------- 1. Việc cần làm ----------
const todoN = () => A.orders.filter(o => o.status === 'processing' || o.status === 'unpaid').length + (A.topups || []).length + A.txs.length;
const who = id => { const u = (A.users || {})[id]; return u ? esc(u.email) + (u.zalo ? ' · Zalo ' + esc(u.zalo) : '') : ''; };
function vTodo() {
  const pr = A.orders.filter(o => o.status === 'processing'), un = A.orders.filter(o => o.status === 'unpaid' || o.status === 'expired');
  let h = '';
  h += `<div class="h2" style="margin-top:4px">Đơn chờ xác nhận tiền <small>${un.length} · mở app ngân hàng, thấy tiền có nội dung = mã đơn thì bấm</small></div>`;
  h += un.map(o => `<div class="acard"><div class="hd"><div><b class="mono" style="font-size:17px">${esc(o.code)}</b> · <b class="mono">${vnd(o.amount)}</b>${o.status === 'expired' ? ' <span class="tag fixed">quá giờ giữ hàng</span>' : ''}<br><small>${esc(o.product_name)} · ${esc(o.variant_label)} · tạo ${ftime(o.created_at)} · ${who(o.user_id)}</small></div>
    <div class="row-act"><button class="btn sm gold" onclick="markPaid(${o.id})">Đã nhận tiền</button><button class="btn sm ghost" onclick="cancelOrder(${o.id})">Huỷ</button></div></div></div>`).join('') || '<p class="sub">Không có.</p>';
  h += `<div class="h2">Nạp ví chờ duyệt <small>${A.topups.length} · nội dung CK = mã nạp của khách</small></div>`;
  h += A.topups.map(t => { const u = (A.users || {})[t.user_id] || {};
    return `<div class="acard"><div class="hd"><div><b class="mono" style="font-size:17px">${esc(u.pay_code || '')}</b> · khách báo <b class="mono">${vnd(t.amount)}</b><br><small>${who(t.user_id)} · ${ftime(t.created_at)}</small></div></div>
    <div class="act"><label style="font-size:13px;color:var(--mute)">Thực nhận</label><input class="inp mono" id="ta-${t.id}" type="number" step="1000" value="${t.amount}"><button class="btn sm" onclick="approveTopup(${t.id})">Duyệt & cộng ví</button><button class="btn sm ghost" onclick="rejectTopup(${t.id})">Không thấy tiền</button></div></div>`; }).join('') || '<p class="sub">Không có.</p>';
  h += `<div class="h2">Đơn cần giao tay <small>${pr.length}</small></div>`;
  h += pr.map(o => { const { v } = vById(o.variant_id); const kind = v ? v.kind : 'manual';
    return `<div class="acard"><div class="hd"><div><b>${esc(o.product_name)} · ${esc(o.variant_label)}</b><br><small class="mono">${esc(o.code)} · ${vnd(o.amount)} · ${o.pay_method === 'wallet' ? 'ví' : 'QR'} · ${ftime(o.paid_at)}${o.customer_email ? ' · <b style="color:var(--ink)">' + esc(o.customer_email) + '</b>' : ''}</small></div><span class="tag ${kind}">${KIND[kind].short}</span></div>
    ${o.customer_email ? `<div class="act"><span style="font-size:13px;color:var(--mute);flex:1">Nâng / mời email khách xong thì bấm:</span><button class="btn sm" onclick="deliver(${o.id},true)">Đã xử lý xong</button>`
      : `<div class="act"><input class="inp" id="dl-${o.id}" placeholder="Tài khoản" autocomplete="off"><input class="inp" id="dp-${o.id}" placeholder="Mật khẩu" autocomplete="off">${kind === 'fixed' ? `<input class="inp" id="de-${o.id}" type="date" aria-label="HSD">` : ''}<button class="btn sm" onclick="deliver(${o.id},false)">Giao</button>`}
      <button class="btn sm ghost" onclick="cancelOrder(${o.id})">Huỷ & hoàn ví</button></div></div>`; }).join('') || '<p class="sub">Không có đơn chờ giao.</p>';
  if (A.txs.length) {
    h += `<div class="h2">Tiền chưa khớp <small>${A.txs.length} · khách ghi sai nội dung</small></div>`;
    h += A.txs.map(t => `<div class="acard"><div class="hd"><div><b class="mono">${vnd(t.amount)}</b><br><small>"${esc(t.content)}" · ${ftime(t.received_at || t.created_at)} · ref ${esc(t.bank_ref)}</small></div></div>
      <div class="act"><input class="inp" id="to-${t.id}" placeholder="Mã đơn GI… hoặc email khách" autocomplete="off"><button class="btn sm" onclick="assignTx(${t.id},${t.amount})">Gán</button></div></div>`).join('');
  }
  h += `<p class="sub" style="margin-top:20px">Khách chuyển tiền nhưng không bấm/không ghi mã? Vào tab <b>Khách</b> → tìm email → "Điều chỉnh ví" để cộng tay.</p>`;
  return h;
}
async function deliver(id, isEmail) {
  const args = { p_order: id };
  if (!isEmail) {
    args.p_login = $('#dl-' + id).value.trim(); args.p_password = $('#dp-' + id).value.trim();
    const e = $('#de-' + id); if (e) args.p_expires = e.value || null;
  }
  await call('admin_deliver', args); toast('Đã giao · khách thấy ngay ở mục Đơn'); refresh();
}
async function approveTopup(id) {
  const amt = Math.round(Number($('#ta-' + id).value)); if (!(amt > 0)) return toast('Số tiền không hợp lệ');
  const r = await call('admin_approve_topup', { p_id: id, p_amount: amt }); toast(`Đã cộng ${vnd(r.credited)} (gồm thưởng)`); refresh();
}
async function rejectTopup(id) { const note = prompt('Lý do (khách sẽ thấy):', 'Chưa thấy tiền về, vui lòng liên hệ hỗ trợ'); if (!note) return; await call('admin_reject_topup', { p_id: id, p_note: note }); toast('Đã từ chối'); refresh(); }
async function cancelOrder(id) { const note = prompt('Lý do huỷ (khách sẽ thấy):', 'Hết hàng nguồn, đã hoàn tiền vào ví'); if (!note) return; await call('admin_cancel_order', { p_order: id, p_note: note }); toast('Đã huỷ, hoàn ví'); refresh(); }
async function markPaid(id, txId) { if (!txId && !confirm('Chắc chắn đã nhận đủ tiền cho đơn này?')) return; await call('admin_mark_paid', { p_order: id, p_bank_tx: txId || null }); toast('Đã xác nhận'); refresh(); }
async function assignTx(txId, amount) {
  const v = $('#to-' + txId).value.trim(); if (!v) return toast('Nhập mã đơn hoặc email');
  if (/^GI\d{6}$/i.test(v)) {
    const { data: o } = await sb.from('orders').select('*').eq('code', v.toUpperCase()).single();
    if (!o) return toast('Không thấy đơn ' + v);
    if (Number(amount) < Number(o.amount)) return toast(`Tiền ${vnd(amount)} < đơn ${vnd(o.amount)}: hãy cộng vào ví khách bằng email`);
    await markPaid(o.id, txId);
    if (Number(amount) > Number(o.amount)) { await call('admin_adjust_balance', { p_user: o.user_id, p_delta: Number(amount) - Number(o.amount), p_note: 'Chuyển dư cho đơn ' + o.code, p_bank_tx: null }); }
  } else {
    const { data: u } = await sb.from('profiles').select('id,email').ilike('email', v).maybeSingle();
    if (!u) return toast('Không thấy khách ' + v);
    await call('admin_adjust_balance', { p_user: u.id, p_delta: Number(amount), p_note: 'Nạp ví (gán tay giao dịch)', p_bank_tx: txId });
    toast('Đã cộng ' + vnd(amount) + ' vào ví ' + u.email); refresh();
  }
}

// ---------- 2. Sản phẩm ----------
function vProducts() {
  return `<p class="sub">Giá trả ví: khách trả bằng số dư ví thì tính giá này (bỏ trống = như giá bán). Luồng giao: <span class="tag auto">Giao ngay</span> <span class="tag fixed">HSD cố định</span> <span class="tag manual">Xử lý tay</span>. Sửa giá rồi bấm Lưu. Ẩn = khách không thấy.</p>
  <div class="tw"><table><thead><tr><th>Sản phẩm / gói</th><th>Luồng</th><th>Giá nhập</th><th>Giá bán</th><th>Giá trả ví</th><th>Lãi</th><th>Kho sẵn</th><th>Lô gần nhất</th><th></th></tr></thead><tbody>
  ${A.products.map(p => `<tr style="background:#15181D"><td colspan="8"><div style="display:flex;gap:10px;align-items:center">${logo(p, 'sm')}<b>${esc(p.name)}</b><small style="color:var(--dim)">${esc(p.category)}</small></div></td>
    <td><button class="sw-btn ${p.is_active ? 'on' : ''}" onclick="toggleProduct('${p.id}',${!p.is_active})">${p.is_active ? 'Đang bán' : 'Đã ẩn'}</button></td></tr>
    ${(p.variants || []).map(v => `<tr style="${v.is_active ? '' : 'opacity:.5'}"><td style="padding-left:48px">${esc(v.label)} <small style="color:var(--dim)">${v.days} ngày${v.require_email ? ' · cần email' : ''}</small></td>
      <td><span class="tag ${v.kind}">${KIND[v.kind].short}</span></td>
      <td><input class="inp mono" type="number" step="1000" id="c-${v.id}" value="${v.cost}" aria-label="Giá nhập"></td>
      <td><input class="inp mono" type="number" step="1000" id="p-${v.id}" value="${v.price}" aria-label="Giá bán"></td>
      <td><input class="inp mono" type="number" step="1000" id="w-${v.id}" value="${v.wallet_price ?? ''}" placeholder="như giá bán" aria-label="Giá khi trả bằng ví"></td>
      <td class="mono" style="color:${v.margin > 0 ? 'var(--accent-text)' : '#FDBA8C'}">${vnd(v.margin)}</td>
      <td class="mono">${v.kind === 'manual' ? '—' : v.stock_avail}${v.stock_hold ? ` <small style="color:var(--gold)">(+${v.stock_hold} giữ)</small>` : ''}</td>
      <td class="mono">${v.next_expiry ? fds(v.next_expiry) + ' · ' + daysLeft(v.next_expiry) + 'n' : '—'}</td>
      <td><div class="row-act"><button class="btn sm" onclick="saveVariant('${v.id}')">Lưu</button><button class="sw-btn ${v.is_active ? 'on' : ''}" onclick="toggleVariant('${v.id}',${!v.is_active})">${v.is_active ? 'Bán' : 'Ẩn'}</button></div></td></tr>`).join('')}`).join('')}
  </tbody></table></div>`;
}
async function toggleProduct(id, on) { const { error } = await sb.from('products').update({ is_active: on }).eq('id', id); if (error) return toast(errText(error)); await loadProducts(); render(); }
async function toggleVariant(id, on) { const { error } = await sb.from('variants').update({ is_active: on }).eq('id', id); if (error) return toast(errText(error)); await loadProducts(); render(); }
async function saveVariant(id) {
  const cost = Number($('#c-' + id).value), price = Number($('#p-' + id).value), wv = $('#w-' + id).value.trim();
  const wallet_price = wv === '' ? null : Number(wv);
  if (!(price > 0) || cost < 0) return toast('Giá không hợp lệ');
  if (wallet_price !== null && !(wallet_price > 0 && wallet_price <= price)) return toast('Giá trả ví phải > 0 và không cao hơn giá bán');
  const { error } = await sb.from('variants').update({ cost, price, wallet_price }).eq('id', id); if (error) return toast(errText(error));
  toast('Đã lưu giá'); await loadProducts(); render();
}

// ---------- 3. Kho ----------
const stockable = () => A.products.filter(p => (p.variants || []).some(v => v.kind !== 'manual'));
async function loadStock() {
  const ps = stockable(); if (!ps.length) { A.stock = []; return; }
  if (!ps.find(p => p.id === A.kp)) A.kp = ps[0].id;
  const p = ps.find(x => x.id === A.kp), vs = p.variants.filter(v => v.kind !== 'manual');
  if (!vs.find(v => v.id === A.kv)) A.kv = vs[0].id;
  const { data, error } = await sb.from('stock').select('*').in('variant_id', vs.map(v => v.id)).order('status').order('expires_at', { ascending: true }).limit(500);
  if (error) toast(errText(error)); A.stock = data || [];
}
function vStock() {
  const ps = stockable(); if (!ps.length) return '<p class="sub">Chưa có gói nào cần nhập kho.</p>';
  const p = ps.find(x => x.id === A.kp), vs = p.variants.filter(v => v.kind !== 'manual'), v = vs.find(x => x.id === A.kv);
  const ST = { avail: 'Sẵn', hold: 'Đang giữ', sold: 'Đã bán', void: 'Huỷ' };
  return `<div class="chips">${ps.map(x => `<button class="chip ${x.id === A.kp ? 'on' : ''}" onclick="A.kp='${x.id}';A.kv=null;loadStock().then(render)">${esc(x.name)}</button>`).join('')}</div>
   <div class="h2" style="margin-top:4px">Nhập thêm hàng</div>
   <div class="form">
     <div class="chips" style="padding:0">${vs.map(x => `<button class="chip ${x.id === A.kv ? 'on' : ''}" onclick="A.kv='${x.id}';render()">${esc(x.label)} <span class="tag ${x.kind}" style="margin-left:4px">${KIND[x.kind].short}</span></button>`).join('')}</div>
     <label class="fl">Dán danh sách, mỗi dòng 1 tài khoản<small>${v.kind === 'fixed' ? 'Định dạng: <span class="mono">tài_khoản|mật_khẩu|HSD dd/mm/yyyy</span> — bắt buộc có HSD' : 'Định dạng: <span class="mono">tài_khoản|mật_khẩu</span>'}</small>
       <textarea class="inp" id="imp" rows="5" placeholder="${v.kind === 'fixed' ? 'team01@mail.com|Pass123|08/11/2026' : 'acc01@mail.com|Pass123'}"></textarea></label>
     <button class="btn" style="max-width:240px" onclick="importStock('${v.id}')">Nhập kho vào "${esc(v.label)}"</button>
   </div>
   <div class="h2">Tồn kho ${esc(p.name)} <small>${A.stock.filter(s => s.status === 'avail').length} sẵn</small></div>
   <div class="tw"><table><thead><tr><th>Tài khoản</th><th>Gói</th><th>HSD</th><th>Còn</th><th>Trạng thái</th><th>Đơn</th></tr></thead><tbody>
   ${A.stock.map(s => { const vv = p.variants.find(x => x.id === s.variant_id) || {}; const dl = daysLeft(s.expires_at);
     return `<tr style="${s.status !== 'avail' ? 'opacity:.5' : ''}"><td class="mono">${esc(s.login)}</td><td>${esc(vv.label)}</td><td class="mono">${s.expires_at ? fd(s.expires_at) : '<span style="color:var(--dim)">từ lúc bán</span>'}</td>
     <td class="mono" style="${dl !== null && dl <= 0 ? 'color:#FDBA8C' : ''}">${dl !== null ? dl + '/' + vv.days : '—'}</td><td>${ST[s.status]}</td><td class="mono">${s.order_id || ''}</td></tr>`; }).join('') || '<tr><td colspan="6" style="color:var(--dim)">Chưa có hàng</td></tr>'}
   </tbody></table></div>`;
}
async function importStock(vid) {
  const r = await call('admin_import_stock', { p_variant: vid, p_lines: $('#imp').value });
  toast(`Đã nhập ${r.imported}${r.rejected.length ? ` · loại ${r.rejected.length} dòng sai/hết hạn` : ''}`);
  if (r.rejected.length) setTimeout(() => alert('Các dòng bị loại:\n' + r.rejected.join('\n')), 300);
  await Promise.all([loadProducts(), loadStock()]); render();
}

// ---------- 4. Thêm sản phẩm (wizard) ----------
function wzReset() { A.wz = { step: 1, name: '', cat: 'Chat AI', desc: '', mono: '', icon: '', bg: COLORS[2], v: [{ label: '1 tháng', days: 30, cost: '', price: '', kind: 'auto', email: false }], stock: {} }; }
function vWizard() {
  const w = A.wz, st = ['Thông tin', 'Gói & luồng giao', 'Nhập kho'];
  let h = `<div class="steps">${st.map((t, i) => `<div class="${w.step === i + 1 ? 'on' : w.step > i + 1 ? 'ok' : ''}"><b>${i + 1}. ${t}</b>${['Tên, danh mục, logo', 'Giá nhập/bán, kiểu giao', 'Dán tài khoản (nếu có)'][i]}</div>`).join('')}</div>`;
  if (w.step === 1) {

function wzMargin(i) { const v = A.wz.v[i], e = $('#mg-' + i); if (!e) return; if (v.price && v.cost !== '') { const m = v.price - v.cost; e.textContent = `Lãi ${vnd(m)}/đơn (${Math.round(m / v.price * 100)}%)`; e.style.color = m > 0 ? '' : '#FDBA8C'; } else e.textContent = ''; }

  else if (w.step === 2) { const bad = w.v.findIndex(v => !String(v.label).trim() || !(v.days > 0) || !(v.price > 0)); if (bad >= 0) return toast(`Gói ${bad + 1}: cần tên, số ngày, giá bán`); w.step = 3; }

async function wzFinish() {

    const { data: p, error: e1 } = await sb.from('products').insert({ name: w.name.trim(), category: w.cat.trim(), description: w.desc.trim(),
      logo_text: w.mono || null, icon_key: null, logo_color: w.bg, sort: 50 }).select('id').single();
    if (e1) throw e1;
    const rows = w.v.map((v, i) => ({ id: crypto.randomUUID(), product_id: p.id, label: String(v.label).trim(), days: +v.days, cost: +v.cost || 0, price: +v.price, wallet_price: (v.wallet !== undefined && String(v.wallet).trim() !== '' && +v.wallet > 0 && +v.wallet <= +v.price) ? +v.wallet : null, kind: v.kind, require_email: v.kind === 'manual' && !!v.email, sort: i + 1 }));

        ${o.admin_note ? `<div style="margin-top:6px;color:var(--mute)">Ghi chú: ${esc(o.admin_note)}</div>` : ''}
        <div class="row-act" style="margin-top:10px">
          ${o.status === 'unpaid' || o.status === 'expired' ? `<button class="btn sm gold" onclick="event.stopPropagation();markPaid(${o.id}).then(()=>{A.ordAll=null;render()})">Đã nhận tiền</button><button class="btn sm ghost" onclick="event.stopPropagation();cancelOrder(${o.id}).then(()=>{A.ordAll=null;render()})">Huỷ</button>` : ''}
          ${o.status === 'processing' ? `<button class="btn sm" onclick="event.stopPropagation();tab('todo')">Giao ở Việc cần làm</button><button class="btn sm ghost" onclick="event.stopPropagation();cancelOrder(${o.id}).then(()=>{A.ordAll=null;render()})">Huỷ & hoàn ví</button>` : ''}
          ${o.status === 'done' ? `<button class="btn sm" onclick="event.stopPropagation();copyText(orderMsg(A.ordAll.find(x=>x.id===${o.id})))">Copy tin gửi khách</button>` : ''}
          ${oZalo(o) ? `<a class="btn sm ghost" style="text-decoration:none" href="https://zalo.me/${esc(String(oZalo(o)).replace(/\D/g, ''))}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Mở Zalo khách</a>` : ''}
        </div></div></td></tr>` : ''}`; }).join('') || '<tr><td colspan="8"><p class="sub">Không có đơn.</p></td></tr>'}
    </tbody></table></div>${list.length > 300 ? `<p class="sub">Đang hiện 300/${list.length} đơn, gõ tìm để lọc.</p>` : ''}`;
}

// ---------- 7. Báo cáo ----------
async function loadReport() {
  const since = new Date(Date.now() - 120 * DAY).toISOString();
  const [o, t, l] = await Promise.all([
    A.ordAll ? { data: A.ordAll } : sb.from('orders').select('*, profiles(email, zalo, phone)').order('created_at', { ascending: false }).limit(1000),
    sb.from('topup_requests').select('amount, credited, status, decided_at, created_at').eq('status', 'approved').gte('created_at', since).limit(2000),
    sb.from('wallet_ledger').select('delta, kind, created_at').in('kind', ['bonus', 'cashback']).gte('created_at', since).limit(5000)]);
  A.ordAll = o.data || []; A.rep = { tops: t.data || [], gifts: l.data || [] }; render();
}
function vReport() {
  if (!A.rep) { loadReport(); return '<p class="sub">Đang tải…</p>'; }
  const per = A.rP || 'month', now = new Date();
  const start = per === 'today' ? new Date(now.getFullYear(), now.getMonth(), now.getDate()) : per === '7d' ? new Date(Date.now() - 7 * DAY) : per === 'month' ? new Date(now.getFullYear(), now.getMonth(), 1) : new Date(0);
  const inP = d => d && toDate(d) >= start;
  const sold = A.ordAll.filter(o => (o.status === 'done' || o.status === 'processing') && inP(o.paid_at || o.created_at));
  const cost = o => { const { v } = vById(o.variant_id); return v ? Number(v.cost || 0) : 0; };
  const rev = sold.reduce((x, o) => x + Number(o.amount), 0), gross = sold.reduce((x, o) => x + Number(o.amount) - cost(o), 0);
  const viaQr = sold.filter(o => o.pay_method === 'qr').reduce((x, o) => x + Number(o.amount), 0);
  const topIn = A.rep.tops.filter(t => inP(t.decided_at || t.created_at)).reduce((x, t) => x + Number(t.amount), 0);
  const gifts = A.rep.gifts.filter(g => inP(g.created_at)).reduce((x, g) => x + Number(g.delta), 0);
  const by = {}; sold.forEach(o => { const k = o.product_name + ' · ' + o.variant_label; const r = by[k] || (by[k] = { n: 0, rev: 0, gp: 0 }); r.n++; r.rev += Number(o.amount); r.gp += Number(o.amount) - cost(o); });
  const top = Object.entries(by).sort((a, b) => b[1].rev - a[1].rev);
  // sắp hết hạn / mới hết hạn: để nhắc gia hạn
  const exp = A.ordAll.filter(o => o.status === 'done' && o.expires_at).map(o => ({ o, d: daysLeft(o.expires_at) }));
  const soon = exp.filter(x => x.d >= 0 && x.d <= 7).sort((a, b) => a.d - b.d), late = exp.filter(x => x.d < 0 && x.d >= -14).sort((a, b) => b.d - a.d);
  const remind = x => `<tr><td>${esc(oEmail(x.o))}${oZalo(x.o) ? `<br><small class="mono" style="color:var(--dim)">${esc(oZalo(x.o))}</small>` : ''}</td><td>${esc(x.o.product_name)} · ${esc(x.o.variant_label)}</td><td class="mono">${fd(x.o.expires_at)}<br><small style="color:${x.d < 0 ? '#FDBA8C' : 'var(--gold)'}">${x.d < 0 ? 'hết ' + (-x.d) + ' ngày' : x.d === 0 ? 'hết hôm nay' : 'còn ' + x.d + ' ngày'}</small></td>
    <td><div class="row-act"><button class="btn sm" onclick="copyText(renewMsg(${x.o.id}))">Copy tin nhắc</button>${oZalo(x.o) ? `<a class="btn sm ghost" style="text-decoration:none" target="_blank" rel="noopener" href="https://zalo.me/${esc(String(oZalo(x.o)).replace(/\D/g, ''))}">Zalo</a>` : ''}</div></td></tr>`;
  return `<div class="form"><div style="display:flex;gap:8px;flex-wrap:wrap">${[['today', 'Hôm nay'], ['7d', '7 ngày'], ['month', 'Tháng này'], ['all', 'Tất cả']].map(([k, l]) => `<button class="chip ${per === k ? 'on' : ''}" onclick="A.rP='${k}';render()">${l}</button>`).join('')}<button class="btn sm" style="margin-left:auto" onclick="A.rep=null;A.ordAll=null;render()">Tải lại</button></div></div>
    <div class="kpis" style="margin:14px 16px">
      <div class="kpi"><small>Doanh thu bán hàng</small><b class="mono">${vnd(rev)}</b><small>${sold.length} đơn · QR ${vnd(viaQr)} · ví ${vnd(rev - viaQr)}</small></div>
      <div class="kpi"><small>Lãi gộp (bán − giá nhập)</small><b class="mono">${vnd(gross)}</b><small>${rev ? Math.round(gross / rev * 100) : 0}% doanh thu</small></div>
      <div class="kpi"><small>Đã tặng (thưởng nạp + hoàn ví)</small><b class="mono">${vnd(gifts)}</b><small>lãi sau tặng ≈ ${vnd(gross - gifts)}</small></div>
      <div class="kpi"><small>Tiền khách nạp ví</small><b class="mono">${vnd(topIn)}</b><small>tiền vào thật = QR + nạp ví = ${vnd(viaQr + topIn)}</small></div></div>
    <div class="h2" style="margin:6px 16px 8px">Bán chạy <small>theo doanh thu</small></div>
    <div class="tw"><table><thead><tr><th>Sản phẩm · gói</th><th>Số đơn</th><th>Doanh thu</th><th>Lãi gộp</th></tr></thead><tbody>
      ${top.map(([k, r]) => `<tr><td>${esc(k)}</td><td class="mono">${r.n}</td><td class="mono">${vnd(r.rev)}</td><td class="mono" style="color:${r.gp > 0 ? 'var(--accent-text)' : '#FDBA8C'}">${vnd(r.gp)}</td></tr>`).join('') || '<tr><td colspan="4"><p class="sub">Chưa có đơn trong khoảng này.</p></td></tr>'}</tbody></table></div>
    <div class="h2" style="margin:20px 16px 8px">Sắp hết hạn · nhắc gia hạn <small>${soon.length} đơn trong 7 ngày tới</small></div>
    <div class="tw"><table><thead><tr><th>Khách</th><th>Sản phẩm</th><th>Hạn dùng</th><th></th></tr></thead><tbody>${soon.map(remind).join('') || '<tr><td colspan="4"><p class="sub">Không có.</p></td></tr>'}</tbody></table></div>
    <div class="h2" style="margin:20px 16px 8px">Mới hết hạn · mời mua lại <small>${late.length} đơn trong 14 ngày qua</small></div>
    <div class="tw"><table><thead><tr><th>Khách</th><th>Sản phẩm</th><th>Hạn dùng</th><th></th></tr></thead><tbody>${late.map(remind).join('') || '<tr><td colspan="4"><p class="sub">Không có.</p></td></tr>'}</tbody></table></div>
    <p class="sub" style="margin-top:10px">Lãi gộp tính theo giá nhập hiện tại trong tab Sản phẩm. Doanh thu trả bằng ví là tiền khách đã nạp trước, nên "tiền vào thật" = QR + nạp ví.</p>`;
}
function renewMsg(id) {
  const o = A.ordAll.find(x => x.id === id); if (!o) return '';
  const d = daysLeft(o.expires_at);
  return `Chào bạn, gói ${o.product_name} (${o.variant_label}) của bạn ${d < 0 ? 'đã hết hạn ngày ' + fd(o.expires_at) : 'sẽ hết hạn ngày ' + fd(o.expires_at)}. Gia hạn nhanh tại godnc.com/gi (trả bằng ví rẻ hơn), hoặc nhắn shop để được hỗ trợ nhé!`;
}

async function init() {
  if (GI_INIT_ERROR) return fatal(GI_INIT_ERROR.message);
  const { data } = await sb.auth.getSession(); A.user = data && data.session ? data.session.user : null;
  if (!A.user) { $('#gate').innerHTML = `<div class="empty">Đăng nhập bằng tài khoản admin.<br><button class="btn" style="margin-top:14px;max-width:260px" onclick="openAuth('login')">Đăng nhập</button></div>`; return; }
  const { data: me } = await sb.from('profiles').select('*').eq('id', A.user.id).single(); A.me = me;
  $('#who').innerHTML = `${esc(A.user.email)} · <a href="#" onclick="sb.auth.signOut().then(()=>location.reload());return false">Đăng xuất</a>`;
  if (!me || me.role !== 'admin') { $('#gate').innerHTML = `<div class="empty">Tài khoản ${esc(A.user.email)} không có quyền admin.</div>`; return; }
  $('#main').style.display = ''; await refresh();
  setInterval(() => { if (A.tab === 'todo' && !document.activeElement.matches('input,textarea')) refresh(); }, 30000);
}
init().catch(e => { console.error(e); fatal(errText(e)); });
</script>
