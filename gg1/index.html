<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GG1 · Google One gia đình</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{color-scheme:light;--bg:#f3f5f9;--card:#fff;--ink:#111827;--mute:#6b7280;--faint:#9ca3af;--line:#e5e7eb;--soft:#f8fafc;--acc:#1a73e8;--acc-soft:#e8f0fe;
    --g:#10b981;--g-soft:#ecfdf5;--g-ink:#047857;--y:#f59e0b;--o:#f97316;--o-ink:#c2410c;--o-soft:#fff7ed;--r:#e11d48;--r-ink:#be123c;--r-soft:#fff1f2}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1115;--card:#171a21;--ink:#e5e7eb;--mute:#9ca3af;--faint:#6b7280;--line:#262b35;--soft:#1d212a;--acc:#8ab4f8;--acc-soft:#1f2a3d;
    --g:#34d399;--g-soft:#0f2a22;--g-ink:#6ee7b7;--y:#fbbf24;--o:#fb923c;--o-ink:#fdba74;--o-soft:#2d1d10;--r:#fb7185;--r-ink:#fda4af;--r-soft:#2d141a}}
  *{box-sizing:border-box}
  a{color:var(--acc)}
  body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit;color:inherit}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px}
  .wrap{max-width:1180px;margin:0 auto;padding:18px 20px 40px}
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
  .top h1{font-size:20px;font-weight:800;margin:0}
  .tag{font-size:11.5px;font-weight:700;color:var(--acc);background:var(--acc-soft);border-radius:6px;padding:2px 8px}
  .sp{flex:1}
  .mute{color:var(--mute)} .faint{color:var(--faint)}
  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 14px;font-weight:600;white-space:nowrap;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  @media (prefers-color-scheme: dark){.btn.pri{color:#0f1115}}
  .btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
  .btn.g{background:var(--g-soft);border-color:color-mix(in srgb,var(--g) 35%,transparent);color:var(--g-ink)}
  .btn.red{color:var(--r-ink)}
  .btn:disabled{opacity:.5;cursor:default}
  .ic{border:0;background:transparent;color:var(--faint);cursor:pointer;padding:3px 5px;border-radius:6px;font-size:14px;line-height:1}
  .ic:hover{background:var(--soft);color:var(--ink)}
  input,select{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 9px}
  input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 35%,transparent);outline-offset:0;border-color:var(--acc)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .cp{cursor:pointer;border-bottom:1px dotted var(--faint)}
  .err{color:var(--r-ink);background:var(--r-soft);border-radius:10px;padding:8px 12px;margin-bottom:12px}
  .okbox{background:var(--g-soft);color:var(--g-ink);padding:8px 12px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
  .form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:10px}
  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .kpi{padding:14px 16px}
  .kpi .k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
  .kpi .v{font-family:"JetBrains Mono",monospace;font-size:24px;font-weight:700;margin:4px 0 2px}
  .kpi .v small{font-size:13px;color:var(--faint);font-weight:500}
  .kpi .d{font-size:12.5px;color:var(--mute)}
  /* section */
  .sec{display:flex;align-items:center;gap:8px;margin:18px 0 10px;flex-wrap:wrap}
  .sec h2{font-size:15px;font-weight:800;margin:0}
  .cnt{font-size:12px;font-weight:700;background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:0 7px}
  /* cần xử lý */
  .todo{display:flex;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
  .todo:first-child{border-top:0}
  .pill{font-family:"JetBrains Mono",monospace;font-size:11.5px;font-weight:700;border-radius:7px;padding:2px 8px;white-space:nowrap;border:1px solid transparent}
  .p-g{background:var(--g-soft);color:var(--g-ink);border-color:color-mix(in srgb,var(--g) 30%,transparent)}
  .p-y{background:color-mix(in srgb,var(--y) 14%,transparent);color:var(--o-ink)}
  .p-o{background:var(--o-soft);color:var(--o-ink);border-color:color-mix(in srgb,var(--o) 30%,transparent)}
  .p-r{background:var(--r-soft);color:var(--r-ink);border-color:color-mix(in srgb,var(--r) 30%,transparent)}
  .p-b{background:var(--acc-soft);color:var(--acc)}
  .p-n{background:var(--soft);color:var(--mute);border-color:var(--line)}
  /* sơ đồ slot */
  .legend{display:flex;gap:10px;font-size:12px;color:var(--mute);align-items:center;flex-wrap:wrap}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fam{overflow:hidden}
  .fh{padding:12px 14px 10px;border-bottom:1px solid var(--line)}
  .fh .id{font-weight:800;font-size:15px}
  .fh .own{color:var(--r-ink);font-weight:700}
  .fh .meta{font-size:11.5px;color:var(--mute);margin-top:3px}
  .fh .otp{color:var(--g-ink);font-weight:700;letter-spacing:1px}
  .slot{display:flex;align-items:center;gap:10px;padding:7px 14px;min-height:46px}
  .slot .n{width:12px;color:var(--faint);font-size:12px;text-align:right;flex:none}
  .slot .bar{width:4px;align-self:stretch;border-radius:3px;flex:none}
  .slot .who{flex:1;min-width:0}
  .slot .who b{font-weight:700;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot .who .sub{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .slot.pend{opacity:.5;pointer-events:none}
  .slot.hit{background:color-mix(in srgb,var(--y) 12%,transparent)}
  .empty{flex:1;text-align:left;font-size:12px;font-weight:700;color:var(--faint);border:1px dashed var(--line);border-radius:9px;padding:6px 10px;background:transparent;cursor:pointer}
  .empty:hover{border-color:var(--g);color:var(--g-ink);background:var(--g-soft)}
  .addbox{flex:1;display:grid;gap:6px}
  .addbox input.em{width:100%;border-color:var(--g)}
  .addbox .opts{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
  .addbox .opts input,.addbox .opts select{padding:2px 6px;font-size:12px}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:7px;padding:1px 8px;cursor:pointer;font-size:12px;font-weight:600}
  .chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  .editor{margin:0 14px 10px 36px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
  .editor label{font-size:12px;color:var(--mute);display:inline-flex;align-items:center;gap:4px}
  .editor input,.editor select{padding:3px 7px;font-size:12.5px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-weight:600;font-size:13px;cursor:pointer}
  .tab.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
  @media (max-width:900px){.kpis{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}
  @media (max-width:480px){.wrap{padding:14px 12px 30px}.kpi .v{font-size:20px}.slot{padding:7px 10px;gap:8px}.editor{margin-left:10px;margin-right:10px}}
</style>
</head>
<body>
<div class="wrap" x-data="gg()" x-init="init()">
  <template x-if="!pass">
    <div class="card" style="max-width:380px;margin:60px auto;padding:16px">
      <b>Đăng nhập</b> <span class="mute">(mật khẩu như Thay Fam)</span>
      <div class="row" style="margin-top:8px"><input type="password" x-model="passInput" @keydown.enter="login()" style="flex:1"><button class="btn pri" @click="login()">Vào</button></div>
      <div class="err" style="margin-top:8px" x-show="error" x-text="error"></div>
    </div>
  </template>

  <template x-if="pass">
    <div>
      <div class="top">
        <h1>Google One gia đình</h1><span class="tag">GG1</span>
        <div class="sp"></div>
        <a class="btn sm" href="/thayfam/">← Thay Fam</a>
        <a class="btn sm" x-show="sheetUrl" :href="sheetUrl" target="_blank" rel="noopener">Xem sheet</a>
        <button class="btn sm" @click="load()" :disabled="loading" x-text="loading ? 'Đang tải…' : '↻ Làm mới'"></button>
        <button class="btn pri" @click="quickSell()" :disabled="!openFams().length">＋ Bán khách</button>
      </div>
      <div class="okbox" x-show="done"><span style="flex:1" x-text="done"></span><button class="btn sm" x-show="undo" @click="doUndo()" :disabled="busy">↶ Hoàn tác</button></div>
      <div class="err" x-show="error" x-text="error"></div>

      <!-- KPI -->
      <div class="kpis">
        <div class="card kpi"><div class="k">Slot trống</div><div class="v" style="color:var(--g)"><span x-text="freeSlots()"></span> <small x-text="'/ ' + openTotal()"></small></div><div class="d">Có thể bán ngay</div></div>
        <div class="card kpi"><div class="k" style="color:var(--acc)">Chờ vào</div><div class="v" style="color:var(--acc)"><span x-text="waitCount()"></span> <small>khách</small></div><div class="d">Đã mời, chưa xác nhận</div></div>
        <div class="card kpi"><div class="k" style="color:var(--r-ink)">Quá hạn (≤30 ngày)</div><div class="v" style="color:var(--r)"><span x-text="overdue().length"></span> <small>khách</small></div><div class="d">Gia hạn hoặc thu hồi slot</div></div>
        <div class="card kpi"><div class="k" style="color:var(--o-ink)">Hết hạn ≤7 ngày</div><div class="v" style="color:var(--o)"><span x-text="soon().length"></span> <small>khách</small></div><div class="d">Nhắn gia hạn</div></div>
      </div>

      <!-- CẦN XỬ LÝ -->
      <template x-if="todoCount()">
        <div>
          <div class="sec"><h2>Cần xử lý</h2><span class="cnt" x-text="todoCount()"></span></div>
          <div class="card">
            <template x-for="f in waitFams()" :key="'w' + f.id">
              <div class="todo">
                <span class="pill p-b">Chờ vào</span>
                <div style="flex:1;min-width:220px">
                  <div><b x-text="f.id"></b> <span class="mute" x-text="'· ' + pending(f).length + ' khách: '"></span><span class="mono" x-text="pending(f).map(c => c.email).join(', ')"></span></div>
                  <div class="mono faint" style="font-size:11.5px">Chủ <span class="cp" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span> · pass <span class="cp" @click="copy(f.pass, 'Đã copy pass')" x-text="f.pass || '—'"></span> · 2FA <b class="cp" style="color:var(--g-ink)" x-show="f.twofa" @click="copy(otp[f.id], 'Đã copy mã 2FA')" x-text="otp[f.id] || '······'"></b><span x-show="!f.twofa">không</span> · <a href="https://one.google.com/family" target="_blank" rel="noopener">mở Gia đình ↗</a></div>
                </div>
                <button class="btn sm" @click="copy(pending(f).map(c => c.email).join(', '), 'Đã copy email — dán vào ô mời của Google')">⧉ Copy email mời</button>
                <button class="btn sm g" @click="allJoined(f)" :disabled="busy">✓ Đã vào hết</button>
              </div>
            </template>
            <template x-for="x in overdue().concat(soon())" :key="'d' + x.c.row">
              <div class="todo">
                <span class="pill" :class="x.c.daysLeft < 0 ? 'p-r' : 'p-o'" x-text="x.c.daysLeft < 0 ? 'Quá ' + (-x.c.daysLeft) + 'd' : (x.c.daysLeft === 0 ? 'Hôm nay' : 'Còn ' + x.c.daysLeft + 'd')"></span>
                <div style="flex:1;min-width:220px">
                  <div><b class="mono" x-text="x.c.email"></b></div>
                  <div class="mono faint" style="font-size:11.5px" x-text="'HSD ' + x.c.hsd + ' · ' + x.f.id + ' · ' + (x.c.ctv || 'không CTV')"></div>
                </div>
                <button class="btn sm g" @click="copy(remindMsg(x.c), 'Đã copy tin nhắn nhắc gia hạn')">💬 Nhắn</button>
                <button class="btn sm" @click="openEd(x.c, true)">↻ Gia hạn</button>
              </div>
            </template>
          </div>
        </div>
      </template>

      <!-- SƠ ĐỒ SLOT -->
      <div class="sec">
        <h2>Sơ đồ slot</h2>
        <div class="tabs">
          <button class="tab" :class="view==='fam' && 'on'" @click="view='fam'" x-text="'Fam (' + fams.filter(f => f.status !== FULL).length + ')'"></button>
          <button class="tab" :class="view==='loose' && 'on'" @click="view='loose'" x-text="'Đã rời (' + loose.length + ')'"></button>
        </div>
        <div class="sp"></div>
        <div class="legend"><span><i style="background:var(--g)"></i>&gt;7 ngày</span><span><i style="background:var(--o)"></i>≤7</span><span><i style="background:var(--r)"></i>Quá hạn</span><span><i style="background:var(--acc)"></i>Chờ vào</span></div>
        <label class="legend"><input type="checkbox" x-model="onlyFree"> Chỉ fam còn trống</label>
        <input type="search" x-model="q" placeholder="Tìm email / mã GG…" style="width:190px">
        <button class="btn sm" @click="famForm = famForm ? null : blankFam()">＋ Thêm fam</button>
      </div>

      <template x-if="famForm">
        <div class="card" style="padding:14px;margin-bottom:14px">
          <b x-text="famForm.row ? 'Sửa ' + famForm.id : 'Thêm fam Google One'"></b>
          <div class="form" style="border-style:solid;background:color-mix(in srgb,var(--ok) 5%,transparent)">
            <input placeholder="Dán nhanh cả dòng: email  pass  mail khôi phục  2FA (copy từ sheet, cách nhau bằng tab / | / dấu cách)" style="flex:1;min-width:300px" class="mono" @paste.prevent="quickFam($event.clipboardData.getData('text'))" @change="quickFam($event.target.value); $event.target.value=''">
          </div>
          <div class="form" @paste="pasteSplit($event)">
            <input placeholder="Mã (để trống = tự đặt GGn)" x-model="famForm.id" style="width:150px" :disabled="!!famForm.row">
            <input placeholder="Email chủ fam" x-model="famForm.email" style="width:240px" class="mono">
            <input placeholder="Pass" x-model="famForm.pass" style="width:140px" class="mono">
            <input placeholder="Mail khôi phục" x-model="famForm.mkp" style="width:220px" class="mono">
            <input placeholder="2FA secret" x-model="famForm.twofa" style="width:260px" class="mono">
            <select x-model="famForm.plan"><option>2TB</option><option>5TB</option><option>1TB</option><option>500GB</option></select>
            <label class="mute" style="font-size:13px">Renew <input type="date" x-model="famForm.renewIso"></label>
            <select x-model="famForm.status"><option>Hoạt động</option><option>Bán full</option><option>Tạm dừng</option><option>Đã đóng</option></select>
            <input placeholder="Ghi chú" x-model="famForm.note" style="flex:1;min-width:160px">
            <button class="btn" style="color:var(--bad)" x-show="famForm.row" @click="delFam(famForm)" :disabled="busy" x-text="famForm.cf ? 'Bấm lần nữa để xoá' : 'Xoá fam'"></button>
            <button class="btn" @click="famForm = null">Huỷ</button>
            <button class="btn pri" @click="saveFam()" :disabled="busy" x-text="busy ? 'Đang lưu…' : 'Lưu'"></button>
          </div>
        </div>
      </template>


      <template x-if="view==='fam'">
        <div>
          <template x-if="!loading && !fams.length"><div class="card mute" style="padding:16px">Chưa có fam nào. Bấm <b>＋ Thêm fam</b>.</div></template>
          <div class="grid">
            <template x-for="f in shownFams().filter(f => f.status !== FULL && (!onlyFree || f.customers.length < max))" :key="f.id">
              <div class="card fam" :style="f.status !== 'Hoạt động' ? 'opacity:.6' : ''">
                <div class="fh">
                  <div class="row" style="gap:6px">
                    <span class="id" x-text="f.id"></span>
                    <span class="pill p-n" x-text="f.plan"></span>
                    <span class="mono own cp" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span>
                    <div class="sp"></div>
                    <span class="pill" :class="f.customers.length >= max ? 'p-n' : 'p-g'" x-text="f.customers.length >= max ? 'Đầy ' + max + '/' + max : 'Trống ' + (max - f.customers.length)"></span>
                  </div>
                  <div class="meta mono row" style="gap:4px 8px">
                    <span>pass <span class="cp" @click="copy(f.pass, 'Đã copy pass')" x-text="f.pass || '—'"></span></span>
                    <span>2FA <b class="otp" :class="f.twofa && 'cp'" @click="f.twofa && copy(otp[f.id], 'Đã copy mã 2FA')" x-text="f.twofa ? (otp[f.id] || '······') : 'không'"></b><span x-show="f.twofa" x-text="' · ' + otpLeft + 's'"></span></span>
                    <template x-if="f.renew"><span :style="f.renewDays !== null && f.renewDays <= 3 ? 'color:var(--o-ink)' : ''" x-text="'renew ' + f.renew"></span></template>
                    <span x-show="f.status !== 'Hoạt động'" x-text="f.status"></span>
                    <a href="https://one.google.com/family" target="_blank" rel="noopener">Gia đình ↗</a>
                    <div class="sp"></div>
                    <button class="ic" style="font-size:12px" x-show="f.status === 'Hoạt động' && !f.customers.length" @click="setFull(f, true)" :disabled="busy">Bán full</button>
                    <button class="ic" style="font-size:12px;color:var(--r-ink)" x-show="!f.customers.length" @click="delFam(f)" :disabled="busy" x-text="f.cf ? 'Bấm lần nữa' : 'Xoá fam'"></button>
                    <button class="ic" style="font-size:12px" @click="famForm = editFam(f); $nextTick(() => window.scrollTo({ top: 0, behavior: 'smooth' }))">✎ Sửa fam</button>
                  </div>
                  <div class="meta" x-show="f.note" x-text="f.note"></div>
                </div>
                <div style="padding:4px 0">
                  <template x-for="(c, i) in f.customers" :key="c.row || ('t' + c.tmp)">
                    <div>
                      <div class="slot" :id="c.row ? 'c' + c.row : null" :class="{ pend: !c.row, hit: hit(c) }">
                        <span class="n" x-text="i + 1"></span>
                        <span class="bar" :style="'background:' + barColor(c)"></span>
                        <div class="who">
                          <b class="mono cp" style="font-size:13px" @click="copy(c.email)" x-text="c.email"></b>
                          <div class="sub mono" x-text="[c.ctv || '—', 'HSD ' + (c.hsd || '—'), c.mailPhu && 'phụ ' + c.mailPhu, c.note].filter(Boolean).join(' · ')"></div>
                        </div>
                        <span class="pill" :class="pillCls(c)" x-text="pillTxt(c)"></span>
                        <button class="ic" x-show="isWait(c)" title="Khách đã vào fam" @click="setSt(c, 'Đang dùng')">✓</button>
                        <button class="ic" title="Copy tin nhắn nhắc gia hạn" @click="copy(remindMsg(c), 'Đã copy tin nhắn')">💬</button>
                        <button class="ic" title="Gia hạn" @click="openEd(c, true)">↻</button>
                        <button class="ic" title="Sửa / chuyển / rời fam / xoá" @click="openEd(c)">✎</button>
                      </div>
                      <template x-if="c.ed">
                        <div class="editor">
                          <div class="row">
                            <label>Trạng thái <select x-model="c.ed.status"><option>Đang dùng</option><option>Đã mời</option><option>Chờ mời</option></select></label>
                            <label>Mua <input type="date" x-model="c.ed.buyIso"></label>
                            <label>Tháng <input type="number" min="1" x-model.number="c.ed.months" style="width:56px"></label>
                            <label>CTV <input x-model="c.ed.ctv" list="ctvs" style="width:76px"></label>
                            <label>Mail phụ <input x-model="c.ed.mailPhu" class="mono" style="width:180px"></label>
                            <label>Ghi chú <input x-model="c.ed.note" style="width:140px"></label>
                            <button class="btn sm pri" @click="saveEd(c)" :disabled="busy">Lưu</button>
                          </div>
                          <div class="row">
                            <label><b>Gia hạn</b></label>
                            <template x-for="m in [1,3,6,12]" :key="m"><button class="chip" :class="c.ed?.rnM===m && 'on'" @click="c.ed && (c.ed.rnM=m)" x-text="'+' + m + 'th'"></button></template>
                            <label>tặng <input type="number" min="0" x-model.number="c.ed.bonus" style="width:52px"> ngày</label>
                            <label x-show="c.daysLeft !== null && c.daysLeft < 0"><input type="checkbox" x-model="c.ed.fromToday"> tính từ hôm nay</label>
                            <select x-model="c.ed.sku"><option value="">Không ghi TC</option><template x-for="s in skus" :key="s.sku"><option :value="s.sku" x-text="s.sku + ' · ' + s.price.toLocaleString('vi-VN') + 'đ'"></option></template></select>
                            <button class="btn sm pri" :disabled="!c.ed?.rnM || busy" @click="renew(c)">Ghi gia hạn</button>
                          </div>
                          <div class="row">
                            <label>Chuyển sang <select x-model="c.ed.to"><option value="">—</option><template x-for="x in fams.filter(x => x.id !== f.id && x.status === 'Hoạt động' && x.customers.length < max)" :key="x.id"><option :value="x.id" x-text="x.id + ' (trống ' + (max - x.customers.length) + ')'"></option></template></select></label>
                            <button class="btn sm" :disabled="!c.ed?.to || busy" @click="moveCus(c)">Chuyển</button>
                            <div class="sp"></div>
                            <button class="btn sm red" @click="leave(c)" :disabled="busy" x-text="c.cf ? 'Bấm lần nữa' : 'Rời fam'"></button>
                            <button class="btn sm red" @click="delCus(c)" :disabled="busy" x-text="c.dx ? 'Bấm lần nữa' : 'Xoá (nhập sai)'"></button>
                            <button class="btn sm" @click="c.ed = null">Đóng</button>
                          </div>
                        </div>
                      </template>
                    </div>
                  </template>
                  <template x-if="f.status === 'Hoạt động'">
                    <div>
                      <template x-for="k in Math.max(0, max - f.customers.length)" :key="'e' + f.id + k">
                        <div class="slot">
                          <span class="n" x-text="f.customers.length + k"></span>
                          <span class="bar" style="background:transparent"></span>
                          <template x-if="!(adding === f.id && k === 1)">
                            <button class="empty" @click="startAdd(f)">＋ Trống — thêm khách</button>
                          </template>
                          <template x-if="adding === f.id && k === 1">
                            <div class="addbox">
                              <input class="em mono" :id="'add-' + f.id" x-model="addText" placeholder="dán email khách (nhiều email = nhiều slot) rồi Enter" @keydown.enter.prevent="add(f)" @keydown.escape="adding = ''" @paste="$nextTick(() => /[\s,;]/.test(addText.trim()) && add(f))">
                              <div class="opts">
                                <input type="date" x-model="def.buyIso">
                                <template x-for="m in [1,3,6,12]" :key="m"><button class="chip" :class="def.months===m && 'on'" @click="def.months=m; saveDef()" x-text="m + 'th'"></button></template>
                                <input placeholder="CTV" x-model="def.ctv" @change="saveDef()" list="ctvs" style="width:70px">
                                <select x-model="def.sku" @change="saveDef()"><option value="">Không ghi TC</option><template x-for="s in skus" :key="s.sku"><option :value="s.sku" x-text="s.sku + ' · ' + s.price.toLocaleString('vi-VN') + 'đ'"></option></template></select>
                                <span class="faint" x-text="'HSD ' + hsdOf(def.buyIso, def.months)"></span>
                                <button class="ic" style="font-size:12px" @click="adding = ''">Huỷ</button>
                              </div>
                            </div>
                          </template>
                        </div>
                      </template>
                    </div>
                  </template>
                </div>
              </div>
            </template>
          </div>

          <template x-if="shownFams().some(f => f.status === FULL)">
            <div>
              <div class="sec"><h2>Bán full</h2><span class="cnt" x-text="fams.filter(f => f.status === FULL).length"></span><span class="mute" style="font-size:12.5px">bán nguyên fam, không theo dõi từng slot</span></div>
              <div class="card">
                <template x-for="f in shownFams().filter(f => f.status === FULL)" :key="'f' + f.id">
                  <div class="todo">
                    <b x-text="f.id"></b><span class="pill p-n" x-text="f.plan"></span>
                    <span class="mono own cp" style="color:var(--r-ink);font-weight:700" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span>
                    <span class="mute" x-show="f.note" x-text="f.note"></span>
                    <span class="faint mono" style="font-size:11.5px" x-show="f.renew" x-text="'renew ' + f.renew"></span>
                    <div class="sp"></div>
                    <button class="btn sm" @click="setFull(f, false)" :disabled="busy">Bỏ full</button>
                    <button class="btn sm" @click="famForm = editFam(f); $nextTick(() => window.scrollTo({ top: 0, behavior: 'smooth' }))">✎ Sửa fam</button>
                  </div>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <template x-if="view==='loose'">
        <div class="card">
          <template x-if="!loose.length"><div class="todo mute">Không có khách nào đã rời fam.</div></template>
          <template x-for="c in loose" :key="c.row">
            <div class="todo">
              <div style="flex:1;min-width:220px"><b class="mono" x-text="c.email"></b><div class="mono faint" style="font-size:11.5px" x-text="(c.fam || '—') + ' · ' + c.status + ' · HSD ' + (c.hsd || '—') + ' · ' + (c.ctv || 'không CTV')"></div></div>
              <select x-model="c.to"><option value="">Chọn fam để thêm lại</option><template x-for="x in fams.filter(x => x.customers.length < max && x.status === 'Hoạt động')" :key="x.id"><option :value="x.id" x-text="x.id + ' (trống ' + (max - x.customers.length) + ')'"></option></template></select>
              <button class="btn sm" :disabled="!c.to || busy" @click="rejoin(c)">Thêm lại</button>
              <button class="btn sm red" @click="delCus(c)" x-text="c.dx ? 'Bấm lần nữa' : 'Xoá'"></button>
            </div>
          </template>
        </div>
      </template>
      <datalist id="ctvs"><option>Dnc</option><option>Tuan</option><option>Vương</option><option>Lộc</option></datalist>
    </div>
  </template>
</div>

<script>
const DEL = 'Đã xoá', FULL = 'Bán full', WAIT = ['Đã mời', 'Chờ mời'];
const API_URL = 'https://script.google.com/macros/s/AKfycby2lwu9UYCAsbYMZtXnGTLMWlRE2aaO_FaBG312jiBEEjZdf5NotZsJ06I39TgG3Zjg/exec';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
const iso = s => { const p = String(s || '').split('/'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : ''; };
const dmy = s => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; };
const todayIso = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;

function gg() {
  return {
    FULL, pass: lsGet('thayfam_pass') || '', passInput: '', fams: [], loose: [], skus: [], max: 5, sheetUrl: '',
    loading: false, busy: false, error: '', done: '', undo: null, q: '', view: 'fam', famForm: null, otp: {},
    addText: '', adding: '', onlyFree: false, otpLeft: 30, def: { months: 12, ctv: '', sku: '', buyIso: todayIso() }, saving: 0, seq: 0, jobs: Promise.resolve(), needLoad: false,
    init() {
      try { Object.assign(this.def, JSON.parse(lsGet('gg1_def') || '{}')); } catch (e) {}
      this.def.buyIso = todayIso();
      if (this.pass) this.load();
      setInterval(() => { this.otpLeft = 30 - Math.floor(Date.now() / 1000) % 30; this.tickOtp(); }, 1000);
    },
    async api(body) {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, pass: this.pass }) }).then(x => x.json());
      if (!r.ok) throw new Error(r.error || 'Lỗi không rõ');
      return r;
    },
    async login() { this.pass = this.passInput; this.error = ''; await this.load(); if (!this.error) lsSet('thayfam_pass', this.pass); else this.pass = ''; },
    async load() {
      if (this.saving) { this.needLoad = true; return; }
      this.loading = true; this.error = '';
      try {
        const d = await this.api({ action: 'gg_list' });
        this.fams = d.fams.filter(f => f.status !== DEL); this.loose = d.loose.filter(c => c.status !== DEL);
        this.skus = d.skus || []; this.max = d.max; this.sheetUrl = d.sheetUrl;
      } catch (e) { this.error = e.message; }
      this.loading = false;
    },
    // ---- số liệu ----
    openFams() { return this.fams.filter(f => f.status === 'Hoạt động' && f.customers.length < this.max).sort((a, b) => (this.max - a.customers.length) - (this.max - b.customers.length) || a.id.localeCompare(b.id, undefined, { numeric: true })); },
    freeSlots() { return this.openFams().reduce((s, f) => s + this.max - f.customers.length, 0); },
    openTotal() { return this.fams.filter(f => f.status === 'Hoạt động').length * this.max; },
    isWait(c) { return WAIT.includes(c.status); },
    waitCount() { return this.fams.reduce((s, f) => s + this.pending(f).length, 0); },
    overdue() { return this.dueList().filter(x => x.c.daysLeft < 0); },
    soon() { return this.dueList().filter(x => x.c.daysLeft >= 0 && x.c.daysLeft <= 7); },
    todoCount() { return this.waitFams().length + this.overdue().length + this.soon().length; },
    barColor(c) { if (this.isWait(c)) return 'var(--acc)'; const d = c.daysLeft; return d === null ? 'var(--line)' : d < 0 ? 'var(--r)' : d <= 7 ? 'var(--o)' : 'var(--g)'; },
    pillCls(c) { if (this.isWait(c)) return 'p-b'; const d = c.daysLeft; return d === null ? 'p-n' : d < 0 ? 'p-r' : d <= 7 ? 'p-o' : 'p-g'; },
    pillTxt(c) { if (this.isWait(c)) return c.status; const d = c.daysLeft; return d === null ? '—' : d < 0 ? 'Quá ' + (-d) + 'd' : 'Còn ' + d + 'd'; },
    startAdd(f) { this.adding = f.id; this.addText = ''; this.$nextTick(() => { const el = document.getElementById('add-' + f.id); if (el) el.focus(); }); },
    quickSell() { const f = this.openFams()[0]; if (!f) return; this.view = 'fam'; this.onlyFree = false; this.startAdd(f); this.$nextTick(() => { const el = document.getElementById('add-' + f.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); },
    pending(f) { return f.customers.filter(c => WAIT.includes(c.status)); },
    waitFams() { return this.fams.filter(f => this.pending(f).length); },
    hit(c) { const q = this.q.trim().toLowerCase(); return q.length >= 3 && (c.email.toLowerCase().includes(q) || (c.mailPhu || '').toLowerCase().includes(q)); },
    shownFams() {
      const q = this.q.trim().toLowerCase();
      const list = q.length < 2 ? this.fams : this.fams.filter(f => f.id.toLowerCase() === q || f.email.toLowerCase().includes(q) || f.customers.some(c => this.hit(c)));
      return list.slice().sort((a, b) => (a.status === 'Hoạt động' ? 0 : 1) - (b.status === 'Hoạt động' ? 0 : 1) || a.id.localeCompare(b.id, undefined, { numeric: true }));
    },
    dueList() {
      const out = [];
      this.fams.forEach(f => f.customers.forEach(c => { if (c.row && !WAIT.includes(c.status) && c.daysLeft !== null && c.daysLeft <= 7 && c.daysLeft >= -30) out.push({ f, c }); }));
      return out.sort((a, b) => a.c.daysLeft - b.c.daysLeft);
    },
    remindMsg(c) { return 'Chào bạn, gói dịch vụ lưu trữ của email ' + c.email + (c.daysLeft < 0 ? ' đã hết hạn ngày ' : ' sẽ hết hạn ngày ') + c.hsd + '.\nBạn muốn gia hạn thì nhắn shop nhé, cảm ơn bạn!'; },
    hsdOf(buyIso, months) { const q = String(buyIso).split('-'); if (q.length !== 3) return ''; const d = new Date(+q[0], q[1] - 1, +q[2]); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + (+months || 0)); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); },
    daysTo(h) { const p = String(h || '').split('/'); if (p.length !== 3) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(+p[2], p[1] - 1, +p[0]) - t) / 864e5); },
    saveDef() { const d = this.def; lsSet('gg1_def', JSON.stringify({ months: d.months, ctv: d.ctv, sku: d.sku })); },
    flash(m) { this.done = m; this.undo = null; clearTimeout(this._ft); this._ft = setTimeout(() => { if (this.done === m) this.done = ''; }, 3000); },
    async run(fn, msg, undo) { this.busy = true; this.error = ''; this.done = ''; this.undo = null; try { const r = await fn(); this.done = typeof msg === 'function' ? msg(r) : msg; this.undo = undo || null; await this.load(); } catch (e) { this.error = e.message; } this.busy = false; },
    enqueue(fn) { this.saving++; this.jobs = this.jobs.then(fn).finally(() => { this.saving--; if (!this.saving && this.needLoad) { this.needLoad = false; this.load(); } }); },
    known() {
      const m = {};
      this.fams.forEach(f => f.customers.forEach(c => { m[c.email.toLowerCase()] = 'đã có ở ' + f.id; if (c.mailPhu && c.mailPhu.includes('@')) m[c.mailPhu.toLowerCase()] = m[c.mailPhu.toLowerCase()] || 'là mail phụ ở ' + f.id; }));
      this.loose.forEach(c => { const k = c.email.toLowerCase(); if (!m[k]) m[k] = 'từng ở ' + (c.fam || '—') + ' (xem tab Đã rời)'; });
      return m;
    },
    // ---- BÁN KHÁCH MỚI: hiện ngay, lưu nền; tự tràn sang fam kế khi fam đang chọn hết slot ----
    add(f0) {
      const all = [...new Set((this.addText.match(EMAIL_RE) || []).map(x => x.toLowerCase()))];
      if (!all.length) { this.error = 'Không thấy email hợp lệ'; return; }
      const kn = this.known(), skip = all.filter(e => kn[e]).map(e => e + ' ' + kn[e]);
      const d = { ...this.def }, buy = dmy(d.buyIso), hsd = this.hsdOf(d.buyIso, d.months), left = [], moved = [];
      this.error = '';
      all.filter(e => !kn[e]).forEach(em => {
        const f = f0.customers.length < this.max ? f0 : this.openFams()[0]; if (!f) { left.push(em); return; }
        if (f !== f0) moved.push(em + ' → ' + f.id);
        f.customers.push({ tmp: ++this.seq, row: 0, fam: f.id, email: em, ctv: d.ctv, buy, months: d.months, hsd, daysLeft: this.daysTo(hsd), status: 'Đã mời', mailPhu: '', note: '' });
        const c = f.customers[f.customers.length - 1];
        this.enqueue(async () => {
          try {
            const r = await this.api({ action: 'gg_cus', cus: { fam: f.id, email: em, buy, months: d.months, ctv: d.ctv, status: 'Đã mời', mailPhu: '', note: '' }, finance: d.sku });
            if (r.row) c.row = r.row; else this.needLoad = true;
            if (r.hsd) { c.hsd = r.hsd; c.daysLeft = this.daysTo(r.hsd); }
            this.flash('✓ ' + em + ' → ' + f.id + ' · mời xong bấm ✓ ở "Cần xử lý"');
          } catch (e) {
            const i = f.customers.indexOf(c); if (i >= 0) f.customers.splice(i, 1);
            this.error = em + ': ' + e.message;
          }
        });
      });
      this.addText = left.join(' ');
      this.adding = f0.customers.length < this.max ? f0.id : '';
      if (this.adding) this.$nextTick(() => { const el = document.getElementById('add-' + this.adding); if (el) el.focus(); });
      const msg = [skip.length && 'Bỏ qua: ' + skip.join(' · '), moved.length && f0.id + ' đầy, đã xếp: ' + moved.join(', '), left.length && 'Hết slot, chưa thêm: ' + left.join(', ') + ' — thêm fam mới'].filter(Boolean).join(' — ');
      if (msg) this.error = msg;
    },
    // ---- sửa khách ----
    openEd(c, rn) { this.view = 'fam'; if (c.ed && !rn) { c.ed = null; return; } c.ed = { status: c.status, buyIso: iso(c.buy), months: c.months, ctv: c.ctv, mailPhu: c.mailPhu, note: c.note, rnM: rn ? (c.months >= 12 ? 12 : c.months || 12) : 0, bonus: 0, fromToday: c.daysLeft !== null && c.daysLeft < -7, sku: this.def.sku, to: '' }; this.$nextTick(() => { const el = document.getElementById('c' + c.row); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }); },
    async saveEd(c) {
      const e = c.ed; this.busy = true; this.error = '';
      try {
        const r = await this.api({ action: 'gg_cus', cus: { row: c.row, fam: c.fam, email: c.email, buy: dmy(e.buyIso), months: e.months, ctv: e.ctv, status: e.status, mailPhu: e.mailPhu, note: e.note } });
        Object.assign(c, { status: e.status, buy: dmy(e.buyIso), months: e.months, ctv: e.ctv, mailPhu: e.mailPhu, note: e.note, ed: null });
        if (r.hsd) { c.hsd = r.hsd; c.daysLeft = this.daysTo(r.hsd); }
        this.flash('✓ Đã lưu ' + c.email + (r.hsd ? ' · HSD ' + r.hsd : ''));
      } catch (er) { this.error = c.email + ': ' + er.message; }
      this.busy = false;
    },
    async setSt(c, s) {
      const old = c.status; if (s === old) return;
      c.status = s; this.error = '';
      try { await this.api({ action: 'gg_set', row: c.row, email: c.email, status: s }); this.flash('✓ ' + c.email + ': ' + s); this.undo = { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ ' + c.email + ': ' + old }; }
      catch (e) { c.status = old; this.error = c.email + ': ' + e.message; }
    },
    allJoined(f) {
      const list = this.pending(f).filter(c => c.row);
      this.run(async () => { for (const c of list) await this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đang dùng' }); }, '✓ ' + f.id + ': ' + list.length + ' khách → Đang dùng',
        { fn: async () => { for (const c of list) await this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đã mời' }); }, msg: '↶ ' + f.id + ': trả ' + list.length + ' khách về Đã mời' });
    },
    renew(c) { const x = c.ed; this.run(() => this.api({ action: 'gg_renew', row: c.row, email: c.email, months: x.rnM, bonusDays: x.bonus || 0, base: x.fromToday ? 'today' : 'hsd', finance: x.sku }), r => '✓ Gia hạn ' + c.email + ': ' + (r.oldHsd || '?') + ' → ' + r.hsd + (r.finance ? ' · tài chính dòng ' + r.finance.row : '')); },
    moveCus(c) { const to = c.ed.to; this.run(() => this.api({ action: 'gg_cus', cus: { row: c.row, fam: to, email: c.email, buy: c.buy, months: c.months, ctv: c.ctv, status: c.status, mailPhu: c.mailPhu, note: c.note } }), '✓ ' + c.email + ' → ' + to); },
    leave(c) { if (!c.cf) { c.cf = true; setTimeout(() => { c.cf = false; }, 4000); return; } const old = c.status; this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Rời fam' }), '✓ ' + c.email + ' rời fam (giữ data, xem tab Đã rời)', { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ ' + c.email + ' đã quay lại fam' }); },
    delCus(c) { if (!c.dx) { c.dx = true; setTimeout(() => { c.dx = false; }, 4000); return; } const old = c.status; this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: DEL }), '✓ Đã xoá ' + c.email, { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ Đã khôi phục ' + c.email }); },
    rejoin(c) { this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đã mời', toFam: c.to }), '✓ ' + c.email + ' → ' + c.to + ' (Đã mời)'); },
    // ---- fam ----
    blankFam() { return { row: 0, id: '', email: '', pass: '', mkp: '', twofa: '', plan: '2TB', renewIso: '', status: 'Hoạt động', note: '' }; },
    editFam(f) { return { row: f.row, id: f.id, email: f.email, pass: f.pass, mkp: f.mkp, twofa: f.twofa, plan: f.plan, renewIso: iso(f.renew), status: f.status, note: f.note }; },
    famPayload(f, status) { return { row: f.row, id: f.id, email: f.email, pass: f.pass, mkp: f.mkp, twofa: f.twofa, plan: f.plan, renew: f.renew !== undefined ? f.renew : dmy(f.renewIso), status, note: f.note }; },
    saveFam() { const f = this.famForm; this.run(() => this.api({ action: 'gg_fam', fam: { ...f, renew: dmy(f.renewIso) } }), r => '✓ Đã lưu fam ' + r.id).then(() => { if (!this.error) this.famForm = null; }); },
    setFull(f, on) { const body = this.famPayload(f, on ? FULL : 'Hoạt động'); this.run(() => this.api({ action: 'gg_fam', fam: body }), on ? '✓ ' + f.id + ' → Bán full (ghi người mua ở Sửa fam › Ghi chú)' : '✓ ' + f.id + ' mở lại để bán lẻ', { fn: () => this.api({ action: 'gg_fam', fam: { ...body, status: f.status } }), msg: '↶ ' + f.id + ' về như cũ' }); },
    delFam(f) {
      const live = this.fams.find(x => x.row === f.row) || f;
      if (live.customers && live.customers.length) { this.error = live.id + ' còn ' + live.customers.length + ' khách — chuyển hoặc cho rời fam hết rồi mới xoá được.'; return; }
      if (!f.cf) { f.cf = true; setTimeout(() => { f.cf = false; }, 4000); return; }
      const old = live.status, body = this.famPayload(live, DEL);
      this.run(() => this.api({ action: 'gg_fam', fam: body }), '✓ Đã xoá fam ' + live.id, { fn: () => this.api({ action: 'gg_fam', fam: { ...body, status: old } }), msg: '↶ Đã khôi phục fam ' + live.id }).then(() => { if (!this.error) this.famForm = null; });
    },
    doUndo() { const u = this.undo; if (!u) return; this.run(u.fn, u.msg); },
    // Dán 1 dòng copy từ sheet → tự tách email chủ / pass / mail khôi phục / 2FA / ngày renew
    quickFam(txt) {
      const f = this.famForm; if (!f || !txt) return;
      let parts = String(txt).split(/\t|\||\n/).map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) parts = String(txt).trim().split(/\s+/);
      const isMail = x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x), isDate = x => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(x);
      const isB32 = x => /^[a-z2-7]{16,}$/i.test(x.replace(/\s+/g, ''));
      const out = []; let buf = [];
      parts.forEach(x => { if (/^[a-z2-7]{4}$/i.test(x)) buf.push(x); else { if (buf.length) { out.push(buf.join(' ')); buf = []; } out.push(x); } });
      if (buf.length) out.push(buf.join(' '));
      const mails = out.filter(isMail), rest = out.filter(x => !isMail(x));
      if (mails[0]) f.email = mails[0];
      if (mails[1]) f.mkp = mails[1];
      const tf = rest.find(x => isB32(x) && /\s/.test(x)) || rest.find(x => isB32(x) && x.length >= 26);
      if (tf) f.twofa = tf.toLowerCase();
      const d = rest.find(isDate); if (d) { const p = d.split('/'); f.renewIso = p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0'); }
      const pw = rest.find(x => x !== tf && x !== d); if (pw) f.pass = pw;
      this.done = '✓ Đã tách: ' + [f.email, f.pass && 'pass', f.mkp && 'mail KP', f.twofa && '2FA', d && 'renew'].filter(Boolean).join(' · ') + '. Kiểm tra lại rồi bấm Lưu.';
    },
    pasteSplit(e) { const t = e.clipboardData.getData('text'); if (/\t|\|/.test(t)) { e.preventDefault(); this.quickFam(t); } },
    copy(t, msg) { if (!t) return; try { navigator.clipboard.writeText(String(t)); } catch (e) {} this.flash(msg || 'Đã copy'); },
    async tickOtp() { const m = {}; for (const f of this.fams) if (f.twofa) m[f.id] = await totp(f.twofa); this.otp = m; },
  };
}
function base32(s) {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', c = String(s).toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '', out = [];
  for (const ch of c) bits += a.indexOf(ch).toString(2).padStart(5, '0');
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
async function totp(secret) {
  try {
    const key = base32(secret); if (!key.length) return '';
    const counter = Math.floor(Date.now() / 30000), buf = new ArrayBuffer(8), v = new DataView(buf);
    v.setUint32(0, Math.floor(counter / 2 ** 32)); v.setUint32(4, counter >>> 0);
    const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const h = new Uint8Array(await crypto.subtle.sign('HMAC', k, buf)), o = h[h.length - 1] & 15;
    return String(((h[o] & 127) << 24 | h[o + 1] << 16 | h[o + 2] << 8 | h[o + 3]) % 1e6).padStart(6, '0');
  } catch (e) { return ''; }
}
