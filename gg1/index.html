<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GG1 · Google One gia đình</title>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{color-scheme:light dark;--bg:#f6f6f3;--card:#fff;--ink:#1b1b18;--mute:#6d6d66;--line:#e4e3dc;--soft:#f1f0ea;--acc:#1f6f4a;--warn:#b4540a;--bad:#b42318;--ok:#1f6f4a;--chip:#efeee8;--blue:#2f6fd6}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141413;--card:#1d1d1b;--ink:#ecebe4;--mute:#9b9a92;--line:#2f2f2b;--soft:#242422;--acc:#3fa673;--warn:#e3913f;--bad:#ef6b5e;--ok:#57c08a;--chip:#262623;--blue:#6ea0f0}}
  *{box-sizing:border-box}
  a{color:var(--blue)}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  button,input,select{font:inherit}
  .wrap{max-width:980px;margin:0 auto;padding:16px}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  h1{font-size:21px;margin:0}
  h2{font-size:14px;margin:18px 0 8px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
  .sp{flex:1}
  .mute{color:var(--mute)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13.5px}
  .btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;white-space:nowrap;cursor:pointer;text-decoration:none;display:inline-block}
  .btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn.xs{padding:2px 8px;font-size:12.5px;border-radius:6px}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--mute)}
  .btn.ghost:hover{color:var(--ink);background:var(--soft)}
  .btn.red{color:var(--bad)}
  .btn:disabled{opacity:.5;cursor:default}
  input,select{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 9px}
  input:focus,select:focus{outline:2px solid color-mix(in srgb,var(--acc) 40%,transparent);outline-offset:0}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .chips{display:flex;gap:6px;flex-wrap:wrap}
  .chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 11px;cursor:pointer;color:var(--ink);font-size:13.5px}
  .chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .badge{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--chip);white-space:nowrap}
  .badge.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok);font-weight:600}
  .badge.warn{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
  .badge.blue{background:color-mix(in srgb,var(--blue) 15%,transparent);color:var(--blue);font-weight:600}
  .id{font-weight:700;font-size:17px}
  .cp{cursor:pointer;border-bottom:1px dotted var(--mute)}
  .err{color:var(--bad);margin:8px 0}
  .okbox{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok);padding:8px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
  .form{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px}
  /* ô bán khách mới */
  .sell{border:2px solid var(--acc);padding:14px}
  .sell input.big{width:100%;font-size:16px;padding:10px 12px}
  .famchip{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:13.5px;color:var(--ink)}
  .famchip.on{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,transparent);font-weight:600}
  .famchip small{color:var(--mute);font-weight:400}
  /* đăng nhập chủ fam */
  .login{font-size:13px;color:var(--mute);margin-top:4px}
  .login b.otp{color:var(--ink);font-size:14px;letter-spacing:1px}
  /* chờ vào */
  .todo{border-left:4px solid var(--warn)}
  /* danh sách khách */
  .slots{letter-spacing:2px;font-size:13px;color:var(--acc)}
  .cus{display:grid;grid-template-columns:minmax(0,1fr) 70px 150px 118px 56px;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .cus.pend{opacity:.55;pointer-events:none}
  .cus .em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cus .sub{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  select.st{font-size:12.5px;border-radius:10px;font-weight:600;padding:3px 6px;border-color:transparent}
  select.st.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 13%,transparent)}
  select.st.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 13%,transparent)}
  .editor{background:var(--soft);border-radius:8px;padding:10px;margin:2px 0 8px;display:grid;gap:8px}
  .editor .row label{font-size:12.5px;color:var(--mute);display:flex;align-items:center;gap:4px}
  .fullline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 0;border-top:1px solid var(--line)}
  @media (max-width:640px){
    .cus{grid-template-columns:minmax(0,1fr) auto;row-gap:2px}
    .cus .ctv{display:none}
    .cus .hsd{grid-column:1;font-size:12.5px;color:var(--mute)}
    .cus .stc{grid-column:2;grid-row:1}
    .cus .act{grid-column:2;grid-row:2;text-align:right}
  }
</style>
</head>
<body>
<div class="wrap" x-data="gg()" x-init="init()">
  <template x-if="!pass">
    <div class="card" style="max-width:380px;margin:60px auto">
      <b>Đăng nhập</b> <span class="mute">(mật khẩu như Thay Fam)</span>
      <div class="row" style="margin-top:8px"><input type="password" x-model="passInput" @keydown.enter="login()" style="flex:1"><button class="btn pri" @click="login()">Vào</button></div>
      <div class="err" x-show="error" x-text="error"></div>
    </div>
  </template>

  <template x-if="pass">
    <div>
      <header>
        <h1>GG1 · Google One</h1>
        <span class="mute" style="font-size:13px" x-text="stats()"></span>
        <div class="sp"></div>
        <a class="btn xs" href="/thayfam/">← Thay Fam</a>
        <a class="btn xs" x-show="sheetUrl" :href="sheetUrl" target="_blank" rel="noopener">Xem sheet</a>
        <button class="btn xs" @click="load()" :disabled="loading" x-text="loading ? 'Đang tải…' : 'Tải lại'"></button>
      </header>
      <div class="okbox row" x-show="done"><span style="flex:1" x-text="done"></span><button class="btn xs" x-show="undo" @click="doUndo()" :disabled="busy">↶ Hoàn tác</button></div>
      <div class="err" x-show="error" x-text="error"></div>

      <!-- 1. BÁN KHÁCH MỚI -->
      <div class="card sell" x-ref="sell">
        <div class="row" style="margin-bottom:8px"><b>Bán khách mới</b><span class="mute" style="font-size:13px">dán email (1 hoặc nhiều) rồi Enter</span></div>
        <input class="big mono" x-ref="addInput" x-model="addText" placeholder="email khách…" @keydown.enter.prevent="add()" @paste="$nextTick(() => /[\s,;]/.test(addText.trim()) && add())" :disabled="!openFams().length">
        <div class="row" style="margin-top:8px">
          <span class="mute" style="font-size:13px">Vào fam</span>
          <template x-for="f in openFams()" :key="f.id">
            <button class="famchip" :class="target() === f && 'on'" @click="pick = f.id; $refs.addInput.focus()"><span x-text="f.id"></span> <small x-text="'còn ' + (max - f.customers.length)"></small></button>
          </template>
          <span class="mute" style="font-size:13px" x-show="!openFams().length">Hết slot — bấm <b>+ Thêm fam</b> ở dưới.</span>
        </div>
        <div class="row" style="margin-top:8px;font-size:13px">
          <span class="mute">Mua</span><input type="date" x-model="def.buyIso" style="padding:3px 6px">
          <template x-for="m in [1,3,6,12]" :key="m"><button class="chip" style="padding:2px 9px" :class="def.months===m && 'on'" @click="def.months=m; saveDef()" x-text="m + 'th'"></button></template>
          <input placeholder="CTV" x-model="def.ctv" @change="saveDef()" list="ctvs" style="width:80px;padding:3px 6px">
          <select x-model="def.sku" @change="saveDef()" style="padding:3px 6px"><option value="">Không ghi tài chính</option><template x-for="s in skus" :key="s.sku"><option :value="s.sku" x-text="s.sku + ' · ' + s.price.toLocaleString('vi-VN') + 'đ'"></option></template></select>
          <span class="mute" x-show="saving" x-text="'đang lưu ' + saving + '…'"></span>
        </div>
      </div>

      <!-- 2. CẦN MỜI / CHỜ VÀO -->
      <template x-if="waitFams().length">
        <div>
          <h2 x-text="'Cần mời / chờ vào (' + waitFams().reduce((n, f) => n + pending(f).length, 0) + ')'"></h2>
          <template x-for="f in waitFams()" :key="'w' + f.id">
            <div class="card todo">
              <div class="row">
                <span class="id" x-text="f.id"></span>
                <span class="mute" style="font-size:13px" x-text="pending(f).length + ' khách chờ vào'"></span>
                <div class="sp"></div>
                <button class="btn xs" @click="copy(pending(f).map(c => c.email).join(', '), 'Đã copy ' + pending(f).length + ' email — dán vào ô mời')">Copy email mời</button>
                <button class="btn xs pri" @click="allJoined(f)" :disabled="busy">✓ Tất cả đã vào</button>
              </div>
              <div class="login">
                Chủ <span class="mono cp" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span>
                · Pass <span class="mono cp" @click="copy(f.pass, 'Đã copy pass')" x-text="f.pass || '—'"></span>
                · 2FA <b class="mono otp" :class="f.twofa && 'cp'" @click="f.twofa && copy(otp[f.id], 'Đã copy mã 2FA')" x-text="f.twofa ? (otp[f.id] || '······') : 'không'"></b>
                · <a href="https://one.google.com/family" target="_blank" rel="noopener">Mở trang Gia đình ↗</a>
              </div>
              <div class="row" style="margin-top:6px">
                <template x-for="c in pending(f)" :key="'p' + (c.row || c.tmp)">
                  <span class="row" style="gap:4px;background:var(--soft);border-radius:8px;padding:3px 4px 3px 9px" :style="!c.row && 'opacity:.55'">
                    <span class="mono cp" @click="copy(c.email)" x-text="c.email"></span>
                    <button class="btn xs ghost" :disabled="!c.row" title="Khách đã vào fam" @click="setSt(c, 'Đang dùng')">✓ vào</button>
                  </span>
                </template>
              </div>
            </div>
          </template>
        </div>
      </template>

      <!-- 3. DANH SÁCH -->
      <div class="row" style="margin-top:18px;margin-bottom:10px">
        <div class="chips">
          <button class="chip" :class="view==='fam' && 'on'" @click="view='fam'" x-text="'Fam (' + fams.length + ')'"></button>
          <button class="chip" :class="view==='due' && 'on'" @click="view='due'" x-text="'Sắp hết hạn (' + dueList().length + ')'"></button>
          <button class="chip" :class="view==='loose' && 'on'" @click="view='loose'" x-text="'Đã rời (' + loose.length + ')'"></button>
        </div>
        <input type="search" x-model="q" placeholder="Tìm email / mã GG…" style="flex:1;min-width:160px">
        <button class="btn" @click="famForm = famForm ? null : blankFam()">+ Thêm fam</button>
      </div>

      <template x-if="famForm">
        <div class="card">
          <b x-text="famForm.row ? 'Sửa ' + famForm.id : 'Thêm fam Google One'"></b>
          <div class="form" style="border-style:solid;background:color-mix(in srgb,var(--ok) 5%,transparent)">
            <input placeholder="Dán nhanh cả dòng: email  pass  mail khôi phục  2FA (copy từ sheet, cách nhau bằng tab / | / dấu cách)" style="flex:1;min-width:300px" class="mono" @paste.prevent="quickFam($event.clipboardData.getData('text'))" @change="quickFam($event.target.value); $event.target.value=''">
          </div>
          <div class="form" @paste="pasteSplit($event)">
            <input placeholder="Mã (để trống = tự đặt GGn)" x-model="famForm.id" style="width:150px" :disabled="!!famForm.row">
            <input placeholder="Email chủ fam" x-model="famForm.email" style="width:240px" class="mono">
            <input placeholder="Pass" x-model="famForm.pass" style="width:140px" class="mono">
            <input placeholder="Mail khôi phục" x-model="famForm.mkp" style="width:220px" class="mono">
            <input placeholder="2FA secret" x-model="famForm.twofa" style="width:260px" class="mono">
            <select x-model="famForm.plan"><option>2TB</option><option>5TB</option><option>1TB</option><option>500GB</option></select>
            <label class="mute" style="font-size:13px">Renew <input type="date" x-model="famForm.renewIso"></label>
            <select x-model="famForm.status"><option>Hoạt động</option><option>Bán full</option><option>Tạm dừng</option><option>Đã đóng</option></select>
            <input placeholder="Ghi chú" x-model="famForm.note" style="flex:1;min-width:160px">
            <button class="btn" style="color:var(--bad)" x-show="famForm.row" @click="delFam(famForm)" :disabled="busy" x-text="famForm.cf ? 'Bấm lần nữa để xoá' : 'Xoá fam'"></button>
            <button class="btn" @click="famForm = null">Huỷ</button>
            <button class="btn pri" @click="saveFam()" :disabled="busy" x-text="busy ? 'Đang lưu…' : 'Lưu'"></button>
          </div>
        </div>
      </template>


      <template x-if="view==='fam'">
        <div>
          <template x-if="!loading && !fams.length"><div class="card mute">Chưa có fam nào. Bấm <b>+ Thêm fam</b>.</div></template>
          <template x-for="f in shownFams().filter(f => f.status !== FULL)" :key="f.id">
            <div class="card" :style="f.status !== 'Hoạt động' ? 'opacity:.6' : ''">
              <div class="row">
                <span class="id" x-text="f.id"></span>
                <span class="badge blue" x-text="f.plan"></span>
                <span class="slots" :title="f.customers.length + '/' + max + ' khách'" x-text="'●'.repeat(Math.min(max, f.customers.length)) + '○'.repeat(Math.max(0, max - f.customers.length))"></span>
                <span class="badge" x-show="f.status !== 'Hoạt động'" x-text="f.status"></span>
                <span class="badge" :class="f.renewDays !== null && f.renewDays <= 3 ? 'warn' : ''" x-show="f.renew" x-text="'Renew ' + f.renew + (f.renewDays !== null ? ' · ' + f.renewDays + 'n' : '')"></span>
                <div class="sp"></div>
                <button class="btn xs" x-show="f.status === 'Hoạt động' && f.customers.length < max" @click="pick = f.id; $refs.sell.scrollIntoView({ behavior: 'smooth' }); $refs.addInput.focus()">+ Thêm khách</button>
                <button class="btn xs" x-show="f.status === 'Hoạt động' && !f.customers.length" @click="setFull(f, true)" :disabled="busy" title="Bán nguyên fam cho 1 khách">Bán full</button>
                <button class="btn xs red" x-show="!f.customers.length" @click="delFam(f)" :disabled="busy" x-text="f.cf ? 'Bấm lần nữa' : 'Xoá fam'"></button>
                <button class="btn xs" @click="famForm = editFam(f)">Sửa fam</button>
              </div>
              <div class="login">
                <span class="mono cp" style="color:var(--ink)" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span>
                · Pass <span class="mono cp" @click="copy(f.pass, 'Đã copy pass')" x-text="f.pass || '—'"></span>
                · 2FA <b class="mono otp" :class="f.twofa && 'cp'" @click="f.twofa && copy(otp[f.id], 'Đã copy mã 2FA')" x-text="f.twofa ? (otp[f.id] || '······') : 'không'"></b>
                · <a href="https://one.google.com/family" target="_blank" rel="noopener">Gia đình ↗</a>
                <span x-show="f.note" x-text="' · ' + f.note"></span>
              </div>
              <div style="margin-top:6px">
                <template x-for="c in f.customers" :key="c.row || ('t' + c.tmp)">
                  <div>
                    <div class="cus" :class="!c.row && 'pend'" :style="hit(c) ? 'background:color-mix(in srgb,var(--warn) 10%,transparent)' : ''">
                      <div style="min-width:0"><div class="em mono"><span class="cp" @click="copy(c.email)" x-text="c.email"></span></div><div class="sub" x-show="c.mailPhu || c.note" x-text="[c.mailPhu && 'phụ: ' + c.mailPhu, c.note].filter(Boolean).join(' · ')"></div></div>
                      <div class="ctv mute" x-text="c.ctv || '—'"></div>
                      <div class="hsd"><span x-text="c.hsd || '—'"></span> <span :style="c.daysLeft !== null && c.daysLeft < 0 ? 'color:var(--bad)' : (c.daysLeft !== null && c.daysLeft <= 10 ? 'color:var(--warn)' : 'color:var(--mute)')" x-text="c.daysLeft === null ? '' : (c.daysLeft < 0 ? '· hết ' + (-c.daysLeft) + 'n' : '· ' + c.daysLeft + 'n')"></span></div>
                      <div class="stc"><select class="st" :class="c.status === 'Đang dùng' ? 'ok' : 'warn'" :value="c.status" @change="setSt(c, $event.target.value)"><option>Đang dùng</option><option>Đã mời</option><option>Chờ mời</option></select></div>
                      <div class="act" style="text-align:right"><button class="btn xs" @click="toggleEd(c)" x-text="c.ed ? 'Đóng' : 'Sửa'"></button></div>
                    </div>
                    <template x-if="c.ed">
                      <div class="editor">
                        <div class="row">
                          <label>Mua <input type="date" x-model="c.ed.buyIso"></label>
                          <label>Tháng <input type="number" min="1" x-model.number="c.ed.months" style="width:60px"></label>
                          <label>CTV <input x-model="c.ed.ctv" list="ctvs" style="width:80px"></label>
                          <label>Mail phụ <input x-model="c.ed.mailPhu" class="mono" style="width:190px"></label>
                          <label>Ghi chú <input x-model="c.ed.note" style="width:150px"></label>
                          <button class="btn xs pri" @click="saveEd(c)" :disabled="busy">Lưu</button>
                        </div>
                        <div class="row">
                          <label>Gia hạn</label>
                          <template x-for="m in [1,3,6,12]" :key="m"><button class="chip" style="padding:2px 9px" :class="c.ed?.rnM===m && 'on'" @click="c.ed && (c.ed.rnM=m)" x-text="'+' + m + 'th'"></button></template>
                          <label>tặng <input type="number" min="0" x-model.number="c.ed.bonus" style="width:56px"> ngày</label>
                          <label x-show="c.daysLeft !== null && c.daysLeft < 0"><input type="checkbox" x-model="c.ed.fromToday"> tính từ hôm nay</label>
                          <select x-model="c.ed.sku" style="padding:3px 6px"><option value="">Không ghi TC</option><template x-for="s in skus" :key="s.sku"><option :value="s.sku" x-text="s.sku + ' · ' + s.price.toLocaleString('vi-VN') + 'đ'"></option></template></select>
                          <button class="btn xs pri" :disabled="!c.ed?.rnM || busy" @click="renew(c)">Ghi gia hạn</button>
                        </div>
                        <div class="row">
                          <label>Chuyển sang <select x-model="c.ed.to" style="padding:3px 6px"><option value="">—</option><template x-for="x in fams.filter(x => x.id !== f.id && x.status === 'Hoạt động' && x.customers.length < max)" :key="x.id"><option :value="x.id" x-text="x.id + ' (còn ' + (max - x.customers.length) + ')'"></option></template></select></label>
                          <button class="btn xs" :disabled="!c.ed.to || busy" @click="moveCus(c)">Chuyển</button>
                          <div class="sp"></div>
                          <button class="btn xs red" @click="leave(c)" :disabled="busy" x-text="c.cf ? 'Bấm lần nữa' : 'Rời fam'"></button>
                          <button class="btn xs red" @click="delCus(c)" :disabled="busy" x-text="c.dx ? 'Bấm lần nữa' : 'Xoá (nhập sai)'"></button>
                        </div>
                      </div>
                    </template>
                  </div>
                </template>
              </div>
            </div>
          </template>
          <template x-if="shownFams().some(f => f.status === FULL)">
            <div class="card">
              <b>Bán full</b> <span class="mute" style="font-size:13px">— bán nguyên fam, không theo dõi từng slot</span>
              <template x-for="f in shownFams().filter(f => f.status === FULL)" :key="'f' + f.id">
                <div class="fullline">
                  <span class="id" style="font-size:15px" x-text="f.id"></span>
                  <span class="badge blue" x-text="f.plan"></span>
                  <span class="mono cp" @click="copy(f.email, 'Đã copy email chủ')" x-text="f.email"></span>
                  <span class="mute" style="font-size:13px" x-show="f.note" x-text="f.note"></span>
                  <span class="badge" x-show="f.renew" x-text="'Renew ' + f.renew"></span>
                  <div class="sp"></div>
                  <button class="btn xs" @click="setFull(f, false)" :disabled="busy">Bỏ full</button>
                  <button class="btn xs" @click="famForm = editFam(f)">Sửa fam</button>
                </div>
              </template>
            </div>
          </template>
        </div>
      </template>

      <!-- SẮP HẾT HẠN -->
      <template x-if="view==='due'">
        <div>
          <template x-if="!dueList().length"><div class="card mute">Không có khách nào sắp hết hạn.</div></template>
          <template x-for="x in dueList()" :key="x.c.row">
            <div class="card row">
              <div style="flex:1;min-width:0"><div class="mono" x-text="x.c.email"></div><div class="mute" style="font-size:13px" x-text="x.f.id + ' · HSD ' + x.c.hsd + ' · CTV ' + (x.c.ctv || '—')"></div></div>
              <span class="badge" :class="x.c.daysLeft < 0 ? 'bad' : 'warn'" x-text="x.c.daysLeft < 0 ? 'Hết hạn ' + (-x.c.daysLeft) + ' ngày' : (x.c.daysLeft === 0 ? 'Hết hạn hôm nay' : 'Còn ' + x.c.daysLeft + ' ngày')"></span>
              <button class="btn xs" @click="copy(remindMsg(x.c), 'Đã copy tin nhắn')">Copy tin nhắn</button>
              <button class="btn xs" @click="view='fam'; q = x.c.email">Mở để gia hạn</button>
            </div>
          </template>
        </div>
      </template>

      <!-- RỜI FAM -->
      <template x-if="view==='loose'">
        <div>
          <template x-if="!loose.length"><div class="card mute">Không có.</div></template>
          <template x-for="c in loose" :key="c.row">
            <div class="card row">
              <div style="flex:1;min-width:0"><div class="mono" x-text="c.email"></div><div class="mute" style="font-size:13px" x-text="(c.fam || '—') + ' · ' + c.status + ' · HSD ' + (c.hsd || '—') + ' · CTV ' + (c.ctv || '—')"></div></div>
              <select x-model="c.to"><option value="">Chọn fam để thêm lại</option><template x-for="x in fams.filter(x => x.customers.length < max && x.status === 'Hoạt động')" :key="x.id"><option :value="x.id" x-text="x.id + ' (' + x.customers.length + '/' + max + ')'"></option></template></select>
              <button class="btn xs" :disabled="!c.to || busy" @click="rejoin(c)">Thêm lại (Đã mời)</button>
              <button class="btn xs" style="color:var(--bad)" @click="delCus(c)" x-text="c.dx ? 'Bấm lần nữa' : 'Xoá'"></button>
            </div>
          </template>
        </div>
      </template>
      <datalist id="ctvs"><option>Dnc</option><option>Tuan</option><option>Vương</option><option>Lộc</option></datalist>
    </div>
  </template>
</div>

<script>
const DEL = 'Đã xoá', FULL = 'Bán full', WAIT = ['Đã mời', 'Chờ mời'];
const API_URL = 'https://script.google.com/macros/s/AKfycby2lwu9UYCAsbYMZtXnGTLMWlRE2aaO_FaBG312jiBEEjZdf5NotZsJ06I39TgG3Zjg/exec';
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return ''; } }
function lsSet(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
const iso = s => { const p = String(s || '').split('/'); return p.length === 3 ? p[2] + '-' + p[1] + '-' + p[0] : ''; };
const dmy = s => { const p = String(s || '').split('-'); return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : ''; };
const todayIso = () => { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); };
const EMAIL_RE = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g;

function gg() {
  return {
    FULL, pass: lsGet('thayfam_pass') || '', passInput: '', fams: [], loose: [], skus: [], max: 5, sheetUrl: '',
    loading: false, busy: false, error: '', done: '', undo: null, q: '', view: 'fam', famForm: null, otp: {},
    addText: '', pick: '', def: { months: 12, ctv: '', sku: '', buyIso: todayIso() }, saving: 0, seq: 0, jobs: Promise.resolve(), needLoad: false,
    init() {
      try { Object.assign(this.def, JSON.parse(lsGet('gg1_def') || '{}')); } catch (e) {}
      this.def.buyIso = todayIso();
      if (this.pass) this.load();
      setInterval(() => this.tickOtp(), 1000);
    },
    async api(body) {
      const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, pass: this.pass }) }).then(x => x.json());
      if (!r.ok) throw new Error(r.error || 'Lỗi không rõ');
      return r;
    },
    async login() { this.pass = this.passInput; this.error = ''; await this.load(); if (!this.error) lsSet('thayfam_pass', this.pass); else this.pass = ''; },
    async load() {
      if (this.saving) { this.needLoad = true; return; }
      this.loading = true; this.error = '';
      try {
        const d = await this.api({ action: 'gg_list' });
        this.fams = d.fams.filter(f => f.status !== DEL); this.loose = d.loose.filter(c => c.status !== DEL);
        this.skus = d.skus || []; this.max = d.max; this.sheetUrl = d.sheetUrl;
      } catch (e) { this.error = e.message; }
      this.loading = false;
    },
    // ---- số liệu ----
    stats() {
      const n = this.fams.reduce((s, f) => s + f.customers.length, 0), full = this.fams.filter(f => f.status === FULL).length;
      const free = this.openFams().reduce((s, f) => s + this.max - f.customers.length, 0);
      return this.fams.length + ' fam' + (full ? ' (' + full + ' bán full)' : '') + ' · ' + n + ' khách · ' + free + ' slot trống';
    },
    openFams() { return this.fams.filter(f => f.status === 'Hoạt động' && f.customers.length < this.max).sort((a, b) => (this.max - a.customers.length) - (this.max - b.customers.length) || a.id.localeCompare(b.id, undefined, { numeric: true })); },
    target() { const o = this.openFams(); return o.find(f => f.id === this.pick) || o[0] || null; },
    pending(f) { return f.customers.filter(c => WAIT.includes(c.status)); },
    waitFams() { return this.fams.filter(f => this.pending(f).length); },
    hit(c) { const q = this.q.trim().toLowerCase(); return q.length >= 3 && (c.email.toLowerCase().includes(q) || (c.mailPhu || '').toLowerCase().includes(q)); },
    shownFams() {
      const q = this.q.trim().toLowerCase();
      const list = q.length < 2 ? this.fams : this.fams.filter(f => f.id.toLowerCase() === q || f.email.toLowerCase().includes(q) || f.customers.some(c => this.hit(c)));
      return list.slice().sort((a, b) => (a.status === 'Hoạt động' ? 0 : 1) - (b.status === 'Hoạt động' ? 0 : 1) || a.id.localeCompare(b.id, undefined, { numeric: true }));
    },
    dueList() {
      const out = [];
      this.fams.forEach(f => f.customers.forEach(c => { if (c.daysLeft !== null && c.daysLeft <= 10 && c.daysLeft >= -30) out.push({ f, c }); }));
      return out.sort((a, b) => a.c.daysLeft - b.c.daysLeft);
    },
    remindMsg(c) { return 'Chào bạn, gói dịch vụ lưu trữ của email ' + c.email + (c.daysLeft < 0 ? ' đã hết hạn ngày ' : ' sẽ hết hạn ngày ') + c.hsd + '.\nBạn muốn gia hạn thì nhắn shop nhé, cảm ơn bạn!'; },
    hsdOf(buyIso, months) { const q = String(buyIso).split('-'); if (q.length !== 3) return ''; const d = new Date(+q[0], q[1] - 1, +q[2]); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + (+months || 0)); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); },
    daysTo(h) { const p = String(h || '').split('/'); if (p.length !== 3) return null; const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((new Date(+p[2], p[1] - 1, +p[0]) - t) / 864e5); },
    saveDef() { const d = this.def; lsSet('gg1_def', JSON.stringify({ months: d.months, ctv: d.ctv, sku: d.sku })); },
    flash(m) { this.done = m; this.undo = null; clearTimeout(this._ft); this._ft = setTimeout(() => { if (this.done === m) this.done = ''; }, 3000); },
    async run(fn, msg, undo) { this.busy = true; this.error = ''; this.done = ''; this.undo = null; try { const r = await fn(); this.done = typeof msg === 'function' ? msg(r) : msg; this.undo = undo || null; await this.load(); } catch (e) { this.error = e.message; } this.busy = false; },
    enqueue(fn) { this.saving++; this.jobs = this.jobs.then(fn).finally(() => { this.saving--; if (!this.saving && this.needLoad) { this.needLoad = false; this.load(); } }); },
    known() {
      const m = {};
      this.fams.forEach(f => f.customers.forEach(c => { m[c.email.toLowerCase()] = 'đã có ở ' + f.id; if (c.mailPhu && c.mailPhu.includes('@')) m[c.mailPhu.toLowerCase()] = m[c.mailPhu.toLowerCase()] || 'là mail phụ ở ' + f.id; }));
      this.loose.forEach(c => { const k = c.email.toLowerCase(); if (!m[k]) m[k] = 'từng ở ' + (c.fam || '—') + ' (xem tab Đã rời)'; });
      return m;
    },
    // ---- BÁN KHÁCH MỚI: hiện ngay, lưu nền; tự tràn sang fam kế khi fam đang chọn hết slot ----
    add() {
      const all = [...new Set((this.addText.match(EMAIL_RE) || []).map(x => x.toLowerCase()))];
      if (!all.length) { this.error = 'Không thấy email hợp lệ'; return; }
      const kn = this.known(), skip = all.filter(e => kn[e]).map(e => e + ' ' + kn[e]);
      const d = { ...this.def }, buy = dmy(d.buyIso), hsd = this.hsdOf(d.buyIso, d.months), left = [];
      this.error = '';
      all.filter(e => !kn[e]).forEach(em => {
        const f = this.target(); if (!f) { left.push(em); return; }
        f.customers.push({ tmp: ++this.seq, row: 0, fam: f.id, email: em, ctv: d.ctv, buy, months: d.months, hsd, daysLeft: this.daysTo(hsd), status: 'Đã mời', mailPhu: '', note: '' });
        const c = f.customers[f.customers.length - 1];
        this.pick = f.id;
        this.enqueue(async () => {
          try {
            const r = await this.api({ action: 'gg_cus', cus: { fam: f.id, email: em, buy, months: d.months, ctv: d.ctv, status: 'Đã mời', mailPhu: '', note: '' }, finance: d.sku });
            if (r.row) c.row = r.row; else this.needLoad = true;
            if (r.hsd) { c.hsd = r.hsd; c.daysLeft = this.daysTo(r.hsd); }
            this.flash('✓ ' + em + ' → ' + f.id + ' · giờ mời trong khung "Cần mời"');
          } catch (e) {
            const i = f.customers.indexOf(c); if (i >= 0) f.customers.splice(i, 1);
            this.error = em + ': ' + e.message; this.addText = (this.addText + ' ' + em).trim();
          }
        });
      });
      this.addText = left.join(' ');
      const msg = [skip.length && 'Bỏ qua: ' + skip.join(' · '), left.length && 'Hết slot, chưa thêm: ' + left.join(', ') + ' — thêm fam mới'].filter(Boolean).join(' — ');
      if (msg) this.error = msg;
    },
    // ---- sửa khách ----
    toggleEd(c) { c.ed = c.ed ? null : { buyIso: iso(c.buy), months: c.months, ctv: c.ctv, mailPhu: c.mailPhu, note: c.note, rnM: 0, bonus: 0, fromToday: c.daysLeft !== null && c.daysLeft < -7, sku: this.def.sku, to: '' }; },
    async saveEd(c) {
      const e = c.ed; this.busy = true; this.error = '';
      try {
        const r = await this.api({ action: 'gg_cus', cus: { row: c.row, fam: c.fam, email: c.email, buy: dmy(e.buyIso), months: e.months, ctv: e.ctv, status: c.status, mailPhu: e.mailPhu, note: e.note } });
        Object.assign(c, { buy: dmy(e.buyIso), months: e.months, ctv: e.ctv, mailPhu: e.mailPhu, note: e.note, ed: null });
        if (r.hsd) { c.hsd = r.hsd; c.daysLeft = this.daysTo(r.hsd); }
        this.flash('✓ Đã lưu ' + c.email + (r.hsd ? ' · HSD ' + r.hsd : ''));
      } catch (er) { this.error = c.email + ': ' + er.message; }
      this.busy = false;
    },
    async setSt(c, s) {
      const old = c.status; if (s === old) return;
      c.status = s; this.error = '';
      try { await this.api({ action: 'gg_set', row: c.row, email: c.email, status: s }); this.flash('✓ ' + c.email + ': ' + s); this.undo = { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ ' + c.email + ': ' + old }; }
      catch (e) { c.status = old; this.error = c.email + ': ' + e.message; }
    },
    allJoined(f) {
      const list = this.pending(f).filter(c => c.row);
      this.run(async () => { for (const c of list) await this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đang dùng' }); }, '✓ ' + f.id + ': ' + list.length + ' khách → Đang dùng',
        { fn: async () => { for (const c of list) await this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đã mời' }); }, msg: '↶ ' + f.id + ': trả ' + list.length + ' khách về Đã mời' });
    },
    renew(c) { const x = c.ed; this.run(() => this.api({ action: 'gg_renew', row: c.row, email: c.email, months: x.rnM, bonusDays: x.bonus || 0, base: x.fromToday ? 'today' : 'hsd', finance: x.sku }), r => '✓ Gia hạn ' + c.email + ': ' + (r.oldHsd || '?') + ' → ' + r.hsd + (r.finance ? ' · tài chính dòng ' + r.finance.row : '')); },
    moveCus(c) { const to = c.ed.to; this.run(() => this.api({ action: 'gg_cus', cus: { row: c.row, fam: to, email: c.email, buy: c.buy, months: c.months, ctv: c.ctv, status: c.status, mailPhu: c.mailPhu, note: c.note } }), '✓ ' + c.email + ' → ' + to); },
    leave(c) { if (!c.cf) { c.cf = true; setTimeout(() => { c.cf = false; }, 4000); return; } const old = c.status; this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Rời fam' }), '✓ ' + c.email + ' rời fam (giữ data, xem tab Đã rời)', { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ ' + c.email + ' đã quay lại fam' }); },
    delCus(c) { if (!c.dx) { c.dx = true; setTimeout(() => { c.dx = false; }, 4000); return; } const old = c.status; this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: DEL }), '✓ Đã xoá ' + c.email, { fn: () => this.api({ action: 'gg_set', row: c.row, email: c.email, status: old }), msg: '↶ Đã khôi phục ' + c.email }); },
    rejoin(c) { this.run(() => this.api({ action: 'gg_set', row: c.row, email: c.email, status: 'Đã mời', toFam: c.to }), '✓ ' + c.email + ' → ' + c.to + ' (Đã mời)'); },
    // ---- fam ----
    blankFam() { return { row: 0, id: '', email: '', pass: '', mkp: '', twofa: '', plan: '2TB', renewIso: '', status: 'Hoạt động', note: '' }; },
    editFam(f) { return { row: f.row, id: f.id, email: f.email, pass: f.pass, mkp: f.mkp, twofa: f.twofa, plan: f.plan, renewIso: iso(f.renew), status: f.status, note: f.note }; },
    famPayload(f, status) { return { row: f.row, id: f.id, email: f.email, pass: f.pass, mkp: f.mkp, twofa: f.twofa, plan: f.plan, renew: f.renew !== undefined ? f.renew : dmy(f.renewIso), status, note: f.note }; },
    saveFam() { const f = this.famForm; this.run(() => this.api({ action: 'gg_fam', fam: { ...f, renew: dmy(f.renewIso) } }), r => '✓ Đã lưu fam ' + r.id).then(() => { if (!this.error) this.famForm = null; }); },
    setFull(f, on) { const body = this.famPayload(f, on ? FULL : 'Hoạt động'); this.run(() => this.api({ action: 'gg_fam', fam: body }), on ? '✓ ' + f.id + ' → Bán full (ghi người mua ở Sửa fam › Ghi chú)' : '✓ ' + f.id + ' mở lại để bán lẻ', { fn: () => this.api({ action: 'gg_fam', fam: { ...body, status: f.status } }), msg: '↶ ' + f.id + ' về như cũ' }); },
    delFam(f) {
      const live = this.fams.find(x => x.row === f.row) || f;
      if (live.customers && live.customers.length) { this.error = live.id + ' còn ' + live.customers.length + ' khách — chuyển hoặc cho rời fam hết rồi mới xoá được.'; return; }
      if (!f.cf) { f.cf = true; setTimeout(() => { f.cf = false; }, 4000); return; }
      const old = live.status, body = this.famPayload(live, DEL);
      this.run(() => this.api({ action: 'gg_fam', fam: body }), '✓ Đã xoá fam ' + live.id, { fn: () => this.api({ action: 'gg_fam', fam: { ...body, status: old } }), msg: '↶ Đã khôi phục fam ' + live.id }).then(() => { if (!this.error) this.famForm = null; });
    },
    doUndo() { const u = this.undo; if (!u) return; this.run(u.fn, u.msg); },
    // Dán 1 dòng copy từ sheet → tự tách email chủ / pass / mail khôi phục / 2FA / ngày renew
    quickFam(txt) {
      const f = this.famForm; if (!f || !txt) return;
      let parts = String(txt).split(/\t|\||\n/).map(x => x.trim()).filter(Boolean);
      if (parts.length < 2) parts = String(txt).trim().split(/\s+/);
      const isMail = x => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x), isDate = x => /^\d{1,2}\/\d{1,2}\/\d{4}$/.test(x);
      const isB32 = x => /^[a-z2-7]{16,}$/i.test(x.replace(/\s+/g, ''));
      const out = []; let buf = [];
      parts.forEach(x => { if (/^[a-z2-7]{4}$/i.test(x)) buf.push(x); else { if (buf.length) { out.push(buf.join(' ')); buf = []; } out.push(x); } });
      if (buf.length) out.push(buf.join(' '));
      const mails = out.filter(isMail), rest = out.filter(x => !isMail(x));
      if (mails[0]) f.email = mails[0];
      if (mails[1]) f.mkp = mails[1];
      const tf = rest.find(x => isB32(x) && /\s/.test(x)) || rest.find(x => isB32(x) && x.length >= 26);
      if (tf) f.twofa = tf.toLowerCase();
      const d = rest.find(isDate); if (d) { const p = d.split('/'); f.renewIso = p[2] + '-' + p[1].padStart(2, '0') + '-' + p[0].padStart(2, '0'); }
      const pw = rest.find(x => x !== tf && x !== d); if (pw) f.pass = pw;
      this.done = '✓ Đã tách: ' + [f.email, f.pass && 'pass', f.mkp && 'mail KP', f.twofa && '2FA', d && 'renew'].filter(Boolean).join(' · ') + '. Kiểm tra lại rồi bấm Lưu.';
    },
    pasteSplit(e) { const t = e.clipboardData.getData('text'); if (/\t|\|/.test(t)) { e.preventDefault(); this.quickFam(t); } },
    copy(t, msg) { if (!t) return; try { navigator.clipboard.writeText(String(t)); } catch (e) {} this.flash(msg || 'Đã copy'); },
    async tickOtp() { const m = {}; for (const f of this.fams) if (f.twofa) m[f.id] = await totp(f.twofa); this.otp = m; },
  };
}
function base32(s) {
  const a = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ234567', c = String(s).toUpperCase().replace(/[^A-Z2-7]/g, '');
  let bits = '', out = [];
  for (const ch of c) bits += a.indexOf(ch).toString(2).padStart(5, '0');
  for (let i = 0; i + 8 <= bits.length; i += 8) out.push(parseInt(bits.slice(i, i + 8), 2));
  return new Uint8Array(out);
}
async function totp(secret) {
  try {
    const key = base32(secret); if (!key.length) return '';
    const counter = Math.floor(Date.now() / 30000), buf = new ArrayBuffer(8), v = new DataView(buf);
    v.setUint32(0, Math.floor(counter / 2 ** 32)); v.setUint32(4, counter >>> 0);
    const k = await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-1' }, false, ['sign']);
    const h = new Uint8Array(await crypto.subtle.sign('HMAC', k, buf)), o = h[h.length - 1] & 15;
    return String(((h[o] & 127) << 24 | h[o + 1] << 16 | h[o + 2] << 8 | h[o + 3]) % 1e6).padStart(6, '0');
  } catch (e) { return ''; }
}
