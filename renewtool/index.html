<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go DNC — Renew Tool & Xử Lý Ticket Báo Lỗi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass-card {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(51, 65, 85, 0.8);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(71, 85, 105, 0.8);
            border-radius: 9999px;
        }
    </style>
</head>
<body x-data="renewToolApp()" x-init="init()" class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- LOGIN OVERLAY / MODAL IF NOT AUTHENTICATED -->
    <template x-if="!unlocked">
        <div class="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-card bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mx-auto text-indigo-400 shadow-lg shadow-indigo-500/10">
                        <i data-lucide="shield-lock" class="w-7 h-7"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-black tracking-tight text-white">Xác Thực Quản Trị</h2>
                    <p class="text-xs text-slate-400">Vui lòng đăng nhập tài khoản Quản trị / Nhân viên để truy cập RenewTool & Mật khẩu Chủ Fam.</p>
                </div>

                <form @submit.prevent="unlock()" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Tên đăng nhập</label>
                        <input type="text" x-model="username" required placeholder="Nhập tên đăng nhập (dnc / goshop)..."
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Mật khẩu</label>
                        <input type="password" x-model="password" required placeholder="Nhập mật khẩu..."
                               class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                    </div>

                    <button type="submit"
                            class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>Đăng Nhập RenewTool</span>
                    </button>
                </form>

                <p class="text-[11px] text-slate-500 text-center">Yêu cầu xác thực bảo mật thông tin tài khoản & 2FA khách hàng.</p>
            </div>
        </div>
    </template>

    <!-- MAIN APP DASHBOARD -->
    <div x-show="unlocked" x-cloak class="min-h-screen flex flex-col">

        <!-- HEADER -->
        <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-30 backdrop-blur-md px-4 py-3.5 sm:px-6 shadow-md">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-indigo-600 via-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-black text-xs tracking-wider">
                        DNC
                    </div>
                    <div>
                        <h1 class="font-black text-sm sm:text-base text-white flex items-center gap-2">
                            <span>RenewTool — Xử Lý Báo Lỗi & Hồ Sơ Fam</span>
                            <span class="text-[10px] uppercase font-bold px-2.5 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30" x-text="role === 'admin' ? 'Admin' : 'Staff'"></span>
                        </h1>
                        <p class="text-[11px] text-slate-400">Đọc SỐNG dữ liệu Kho TK & Ghi nhận hồ sơ xử lý cho khách</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <!-- BOT TELEGRAM TOGGLE BUTTON -->
                    <button @click="toggleTelegramBot()" :disabled="togglingBot"
                            :class="telegramBotEnabled ? 'bg-emerald-600/20 hover:bg-emerald-600/30 border-emerald-500/40 text-emerald-300' : 'bg-rose-600/20 hover:bg-rose-600/30 border-rose-500/40 text-rose-300'"
                            class="px-3.5 py-2 rounded-xl border text-xs font-bold transition-all flex items-center gap-2 cursor-pointer shadow-sm">
                        <i data-lucide="bot" class="w-4 h-4" :class="togglingBot ? 'animate-spin' : ''"></i>
                        <span class="hidden sm:inline" x-text="telegramBotEnabled ? 'Bot Telegram: BẬT' : 'Bot Telegram: TẮT'"></span>
                        <span class="sm:hidden" x-text="telegramBotEnabled ? 'Bot: BẬT' : 'Bot: TẮT'"></span>
                        <span class="w-2.5 h-2.5 rounded-full" :class="telegramBotEnabled ? 'bg-emerald-400 animate-pulse' : 'bg-rose-500'"></span>
                    </button>

                    <button @click="loadData(true)" :disabled="loading"
                            class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="loading ? 'animate-spin' : ''"></i>
                        <span class="hidden sm:inline">Làm mới</span>
                    </button>
                    <button @click="logout()"
                            class="px-3.5 py-2 rounded-xl bg-rose-600/10 hover:bg-rose-600/20 border border-rose-500/20 text-xs font-bold text-rose-400 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Đăng xuất</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 space-y-6">

            <!-- 2-TAB NAVIGATION BAR -->
            <div class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-4 border-b border-slate-800 pb-4">
                
                <!-- TAB BUTTONS -->
                <div class="flex items-center gap-2 bg-slate-900/90 p-1.5 rounded-2xl border border-slate-800">
                    <button @click="activeTab = 'pending'"
                            :class="activeTab === 'pending' ? 'bg-indigo-600 text-white font-black shadow-lg shadow-indigo-600/25' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-semibold'"
                            class="px-4 py-2.5 rounded-xl text-xs transition-all flex items-center gap-2 cursor-pointer">
                        <i data-lucide="clock" class="w-4 h-4"></i>
                        <span>⏳ Đang Chờ Xử Lý</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
                              :class="activeTab === 'pending' ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'"
                              x-text="pendingTickets.length"></span>
                    </button>

                    <button @click="activeTab = 'resolved'"
                            :class="activeTab === 'resolved' ? 'bg-emerald-600 text-white font-black shadow-lg shadow-emerald-600/25' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60 font-semibold'"
                            class="px-4 py-2.5 rounded-xl text-xs transition-all flex items-center gap-2 cursor-pointer">
                        <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                        <span>✅ Đã Xử Lý</span>
                        <span class="px-2 py-0.5 rounded-full text-[10px] font-black"
                              :class="activeTab === 'resolved' ? 'bg-white/20 text-white' : 'bg-slate-800 text-slate-400'"
                              x-text="resolvedTickets.length"></span>
                    </button>
                </div>

                <!-- SEARCH BAR -->
                <div class="relative min-w-[280px] sm:min-w-[340px]">
                    <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                        <i data-lucide="search" class="w-4 h-4"></i>
                    </div>
                    <input type="text" x-model="searchQuery" placeholder="Tìm STT nhóm (RN100), email khách, email chủ..."
                           class="w-full bg-slate-900 border border-slate-800 rounded-2xl pl-10 pr-4 py-2.5 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                </div>
            </div>

            <!-- LOADING SPINNER -->
            <div x-show="loading" class="py-16 text-center space-y-3">
                <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-xs text-slate-400 font-medium">Đang tải dữ liệu Ticket & đọc SỐNG từ Kho TK (STOCK / DATA)...</p>
            </div>

            <!-- TICKET CARDS CONTAINER -->
            <div x-show="!loading" class="space-y-4">

                <!-- TAB 1: ⏳ ĐANG CHỜ XỬ LÝ (PENDING TICKETS - OLDEST FIRST) -->
                <div x-show="activeTab === 'pending'" class="space-y-4">
                    <template x-for="(item, index) in filteredPendingTickets" :key="item.ticket_id">
                        <div class="bg-slate-900/90 border border-slate-800 hover:border-slate-700/90 rounded-2xl p-4 sm:p-5 shadow-xl transition-all space-y-4">
                            
                            <!-- CARD TOP HEADER -->
                            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-800">
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <span class="px-3 py-1 rounded-xl bg-indigo-600 text-white font-black text-sm tracking-wide shadow-md shadow-indigo-600/20" x-text="item.stt_group || 'N/A'"></span>
                                    
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 flex items-center gap-1">
                                        <i data-lucide="clock" class="w-3 h-3"></i>
                                        <span>Chờ xử lý</span>
                                    </span>

                                    <span x-show="item.live_snapshot && item.live_snapshot.status"
                                          class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700">
                                        Trạng thái Kho: <strong class="text-indigo-400" x-text="item.live_snapshot.status"></strong>
                                    </span>
                                </div>

                                <div class="flex items-center gap-3 text-xs text-slate-400 flex-wrap">
                                    <span>🕒 Báo lỗi: <strong class="text-slate-200" x-text="formatDate(item.created_at)"></strong></span>
                                    <span x-show="getCtvName(item)">👤 CTV: <strong class="text-emerald-400" x-text="getCtvName(item)"></strong></span>
                                </div>
                            </div>

                            <!-- CUSTOMER REPORT SUMMARY & EXPAND TOGGLE -->
                            <div class="flex flex-wrap items-center justify-between gap-3 bg-slate-950/60 p-3 rounded-xl border border-slate-800/80">
                                <div class="space-y-1 min-w-0 flex-1">
                                    <p class="text-xs font-bold text-slate-200 flex items-center gap-2 flex-wrap">
                                        <span>📧 Khách báo lỗi:</span>
                                        <span class="font-mono text-indigo-300 selection:bg-indigo-500" x-text="getReportedEmail(item)"></span>
                                        <button @click="copyText(getReportedEmail(item))" class="text-slate-500 hover:text-slate-300 p-0.5 cursor-pointer" title="Copy email khách">
                                            <i data-lucide="copy" class="w-3 h-3"></i>
                                        </button>
                                    </p>
                                    <p x-show="getReportMessage(item)" class="text-xs text-slate-400 line-clamp-2" x-text="'💬 ' + getReportMessage(item)"></p>
                                </div>

                                <button @click="toggleExpand(item.ticket_id)"
                                        class="px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 cursor-pointer"
                                        :class="isExpanded(item.ticket_id) ? 'bg-slate-800 text-indigo-300 border border-slate-700' : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-md shadow-indigo-600/20'">
                                    <i data-lucide="file-text" class="w-3.5 h-3.5"></i>
                                    <span x-text="isExpanded(item.ticket_id) ? 'Thu gọn' : 'Xem Chi Tiết & Fix'"></span>
                                </button>
                            </div>

                            <!-- EXPANDED DETAIL VIEW & FIX FORM -->
                            <div x-show="isExpanded(item.ticket_id)" x-collapse class="space-y-5 pt-2">

                                <!-- SECTION A: 🔑 THÔNG TIN TÀI KHOẢN CHỦ FAM (SNAPSHOT TỪ REPORTS) -->
                                <div class="bg-slate-950 border border-slate-800 rounded-2xl p-4 sm:p-5 space-y-4 shadow-inner">
                                    <div class="flex items-center justify-between gap-2 border-b border-slate-800/80 pb-2.5">
                                        <h4 class="text-xs font-black text-indigo-400 uppercase tracking-wider flex items-center gap-2">
                                            <i data-lucide="zap" class="w-4 h-4 text-amber-400"></i>
                                            1. Thông Tin Chủ Fam (Snapshot Báo Lỗi Mới Nhất)
                                        </h4>
                                        <span class="text-[10px] text-emerald-400 font-bold bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">⚡ Tải tức thì từ Snapshot</span>
                                    </div>

                                    <!-- 6 SNAPSHOT FIELDS -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                        
                                        <!-- Snapshot Status -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                                            <p class="text-[10px] text-slate-400 font-bold uppercase">Trạng Thái</p>
                                            <p class="text-xs font-bold text-white mt-1" x-text="item.live_snapshot?.status || 'N/A'"></p>
                                        </div>

                                        <!-- Snapshot Email -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <div class="min-w-0 flex-1">
                                                <p class="text-[10px] text-slate-400 font-bold uppercase">📧 Email Chủ</p>
                                                <p class="text-xs font-mono font-bold text-indigo-300 truncate mt-1" x-text="item.live_snapshot?.owner_email || '—'"></p>
                                            </div>
                                            <button @click="copyText(item.live_snapshot?.owner_email)" title="Copy Email"
                                                    class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all cursor-pointer shrink-0 border border-slate-700">
                                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>

                                        <!-- Snapshot Pass -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <div class="min-w-0 flex-1">
                                                <p class="text-[10px] text-slate-400 font-bold uppercase">🔒 Mật Khẩu</p>
                                                <p class="text-xs font-mono font-bold text-amber-300 truncate mt-1" x-text="item.live_snapshot?.owner_pass || '—'"></p>
                                            </div>
                                            <button @click="copyText(item.live_snapshot?.owner_pass)" title="Copy Mật khẩu"
                                                    class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all cursor-pointer shrink-0 border border-slate-700">
                                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>

                                        <!-- Snapshot Mail KP -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <div class="min-w-0 flex-1">
                                                <p class="text-[10px] text-slate-400 font-bold uppercase">📮 Mail Khôi Phục</p>
                                                <p class="text-xs font-mono font-bold text-slate-300 truncate mt-1" x-text="item.live_snapshot?.owner_mkp || '—'"></p>
                                            </div>
                                            <button @click="copyText(item.live_snapshot?.owner_mkp)" title="Copy Mail KP"
                                                    class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all cursor-pointer shrink-0 border border-slate-700">
                                                <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                            </button>
                                        </div>

                                        <!-- Snapshot 2FA & OTP -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex items-center justify-between gap-2">
                                            <div class="min-w-0 flex-1">
                                                <p class="text-[10px] text-slate-400 font-bold uppercase">🔐 2FA Secret</p>
                                                <p class="text-xs font-mono font-bold text-purple-300 truncate mt-1" x-text="item.live_snapshot?.owner_2fa || '—'"></p>
                                            </div>
                                            <div class="flex items-center gap-1 shrink-0">
                                                <button @click="copyText(item.live_snapshot?.owner_2fa)" title="Copy 2FA Secret"
                                                        class="p-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all cursor-pointer border border-slate-700">
                                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                                </button>
                                                <button x-show="item.live_snapshot?.owner_2fa" @click="fetch2faCode(item.live_snapshot?.owner_2fa)" title="Lấy mã OTP 6 số"
                                                        class="px-2.5 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 text-[10px] font-bold text-white transition-all cursor-pointer shadow-sm">
                                                    OTP 6 Số
                                                </button>
                                            </div>
                                        </div>

                                        <!-- Snapshot Date Renew -->
                                        <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                                            <p class="text-[10px] text-slate-400 font-bold uppercase">📅 Ngày Renew</p>
                                            <p class="text-xs font-bold text-emerald-400 mt-1" x-text="item.live_snapshot?.date_renew || '—'"></p>
                                        </div>

                                    </div>

                                    <!-- SNAPSHOT MEMBER EMAILS FROM REPORTS -->
                                    <div class="bg-slate-900/80 p-3.5 rounded-xl border border-slate-800 space-y-2">
                                        <div class="flex items-center justify-between gap-2">
                                            <p class="text-[11px] font-bold text-emerald-400 flex items-center gap-1.5 uppercase">
                                                <i data-lucide="users" class="w-3.5 h-3.5"></i>
                                                Danh Sách Email Mời Lại Về Nhóm (Snapshot)
                                            </p>
                                            <button @click="copyText(getLiveMemberEmails(item))"
                                                    class="px-2.5 py-1 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-[11px] font-bold text-emerald-300 transition-all flex items-center gap-1 cursor-pointer">
                                                <i data-lucide="copy" class="w-3 h-3"></i>
                                                <span>Copy Tất Cả Email Mời Lại</span>
                                            </button>
                                        </div>
                                        <div class="bg-slate-950 p-2.5 rounded-lg border border-slate-800 font-mono text-xs text-slate-300 whitespace-pre-line leading-relaxed selection:bg-emerald-500 selection:text-slate-950 max-h-36 overflow-y-auto custom-scrollbar"
                                             x-text="getLiveMemberEmails(item) || 'Chưa tìm thấy email thành viên trong tab DATA.'"></div>
                                    </div>

                                </div>

                                <!-- SECTION B: ✍️ FORM NHẬP HỒ SƠ CẤP MỚI / FIX CHO KHÁCH (6 FIELDS + RESOLVE ACTION) -->
                                <div class="bg-slate-900 border border-indigo-500/30 rounded-2xl p-4 sm:p-5 space-y-4 shadow-xl">
                                    <div class="flex items-center justify-between gap-2 border-b border-slate-800 pb-2.5">
                                        <h4 class="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-2">
                                            <i data-lucide="edit-3" class="w-4 h-4"></i>
                                            2. Điền Hồ Sơ Cấp Cho Khách & Xác Nhận Fix Ticket
                                        </h4>
                                        <span class="text-[10px] text-amber-400 font-bold">⚠️ Chỉ lưu vào tab REPORTS để quản lý hồ sơ, KHÔNG sửa tab STOCK</span>
                                    </div>

                                    <form @submit.prevent="submitFixProfile(item)" class="space-y-4">
                                        
                                        <!-- 6 FIX INPUT FIELDS -->
                                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                            
                                            <!-- Field 1: Status -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">1. Trạng Thái Mới</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).status_snapshot" placeholder="Hoạt động / FULL / Banned / NK Plus..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                                            </div>

                                            <!-- Field 2: Email -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">2. Email Mới (Chủ Fam)</label>
                                                <input type="email" x-model="getFixForm(item.ticket_id).owner_email" placeholder="Email chủ mới..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                                            </div>

                                            <!-- Field 3: Pass -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">3. Mật Khẩu Mới</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).owner_pass" placeholder="Pass mới..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500 font-mono">
                                            </div>

                                            <!-- Field 4: Mail KP -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">4. Mail Khôi Phục Mới</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).owner_mkp" placeholder="Mail khôi phục..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500 font-mono">
                                            </div>

                                            <!-- Field 5: 2FA -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">5. 2FA Secret Mới</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).owner_2fa" placeholder="Mã 2FA Secret..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500 font-mono">
                                            </div>

                                            <!-- Field 6: Date Renew -->
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">6. Ngày Renew Mới (dd/MM/yyyy)</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).date_renew_snapshot" placeholder="Ví dụ: 15/10/2026..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                                            </div>

                                        </div>

                                        <!-- ADDITIONAL RESOLUTION FIELDS -->
                                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-1 border-t border-slate-800">
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">Loại Khắc Phục</label>
                                                <select x-model="getFixForm(item.ticket_id).resolution_type"
                                                        class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all">
                                                    <option value="Fix thường">Fix thường / Cấp lại link</option>
                                                    <option value="Dùng TK bảo hành">Dùng TK Bảo Hành</option>
                                                    <option value="Đổi mail phụ">Đổi Mail Phụ</option>
                                                    <option value="Tạo nhóm mới">Tạo Nhóm Mới</option>
                                                </select>
                                            </div>
                                            <div>
                                                <label class="block text-[11px] font-bold text-slate-300 mb-1">Ghi Chú Xử Lý (Nhân viên)</label>
                                                <input type="text" x-model="getFixForm(item.ticket_id).note" placeholder="Nhập ghi chú xử lý..."
                                                       class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                                            </div>
                                        </div>

                                        <!-- EMAIL CHECKBOX & SUBMIT BUTTON -->
                                        <div class="flex flex-wrap items-center justify-between gap-3 pt-2">
                                            <label class="flex items-center gap-2 cursor-pointer text-xs font-bold text-slate-300">
                                                <input type="checkbox" x-model="getFixForm(item.ticket_id).send_email" class="w-4 h-4 rounded text-emerald-600 bg-slate-950 border-slate-700 focus:ring-emerald-500">
                                                <span>📧 Tự động gửi email thông báo đã fix cho khách hàng</span>
                                            </label>

                                            <button type="submit" :disabled="submittingTicketId === item.ticket_id"
                                                    class="py-3 px-6 rounded-xl bg-emerald-600 hover:bg-emerald-500 font-bold text-xs text-white shadow-lg shadow-emerald-600/30 transition-all flex items-center gap-2 cursor-pointer disabled:opacity-50">
                                                <i data-lucide="check-circle" class="w-4 h-4" :class="submittingTicketId === item.ticket_id ? 'animate-spin' : ''"></i>
                                                <span x-text="submittingTicketId === item.ticket_id ? 'Đang lưu hồ sơ & gửi mail...' : '🚀 XÁC NHẬN ĐÃ FIX'"></span>
                                            </button>
                                        </div>

                                    </form>
                                </div>

                            </div>

                        </div>
                    </template>

                    <div x-show="filteredPendingTickets.length === 0" class="py-16 text-center text-slate-500 space-y-2">
                        <i data-lucide="check-circle-2" class="w-10 h-10 mx-auto opacity-40 text-emerald-500"></i>
                        <p class="text-xs font-bold text-slate-400">Không có ticket nào đang chờ xử lý 🎉</p>
                    </div>
                </div>

                <!-- TAB 2: ✅ ĐÃ XỬ LÝ (RESOLVED TICKETS - NEWEST FIRST) -->
                <div x-show="activeTab === 'resolved'" class="space-y-4">
                    <template x-for="item in filteredResolvedTickets" :key="item.ticket_id">
                        <div class="bg-slate-900/70 border border-slate-800 rounded-2xl p-4 sm:p-5 shadow-lg space-y-4">
                            
                            <!-- CARD HEADER -->
                            <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-800">
                                <div class="flex items-center gap-2.5 flex-wrap">
                                    <span class="px-3 py-1 rounded-xl bg-emerald-600 text-white font-black text-sm tracking-wide shadow-md shadow-emerald-600/20" x-text="item.stt_group || 'N/A'"></span>
                                    
                                    <span class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 flex items-center gap-1">
                                        <i data-lucide="check-check" class="w-3 h-3"></i>
                                        <span>Đã xử lý</span>
                                    </span>

                                    <span x-show="item.resolution_type" class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700" x-text="item.resolution_type"></span>
                                </div>

                                <div class="flex items-center gap-3 text-xs text-slate-400 flex-wrap">
                                    <span>📅 Ngày fix: <strong class="text-slate-200" x-text="formatDate(item.resolved_at || item.updated_at)"></strong></span>
                                    <span>👤 Người xử lý: <strong class="text-indigo-400" x-text="item.resolved_by || 'Admin'"></strong></span>
                                </div>
                            </div>

                            <!-- SAVED FIX PROFILE SNAPSHOT FROM REPORTS -->
                            <div class="bg-slate-950/80 p-4 rounded-xl border border-slate-800/80 space-y-3">
                                <h4 class="text-xs font-bold text-slate-300 flex items-center gap-1.5 uppercase">
                                    <i data-lucide="folder-check" class="w-3.5 h-3.5 text-emerald-400"></i>
                                    Hồ Sơ Tài Khoản Ghi Nhận Tại Thời Điểm Fix
                                </h4>

                                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">Trạng Thái Ghi Nhận</p>
                                        <p class="text-xs font-bold text-white mt-0.5" x-text="getSavedReport(item)?.status_snapshot || '—'"></p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">📧 Email Chủ Cấp Khách</p>
                                        <p class="text-xs font-mono font-bold text-indigo-300 mt-0.5 truncate" x-text="getSavedReport(item)?.owner_email || '—'"></p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">🔒 Mật Khẩu Cấp Khách</p>
                                        <p class="text-xs font-mono font-bold text-amber-300 mt-0.5 truncate" x-text="getSavedReport(item)?.owner_pass || '—'"></p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">📮 Mail Khôi Phục</p>
                                        <p class="text-xs font-mono font-bold text-slate-300 mt-0.5 truncate" x-text="getSavedReport(item)?.owner_mkp || '—'"></p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">🔐 2FA Secret</p>
                                        <p class="text-xs font-mono font-bold text-purple-300 mt-0.5 truncate" x-text="getSavedReport(item)?.owner_2fa || '—'"></p>
                                    </div>
                                    <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">📅 Ngày Renew Ghi Nhận</p>
                                        <p class="text-xs font-bold text-emerald-400 mt-0.5" x-text="getSavedReport(item)?.date_renew_snapshot || '—'"></p>
                                    </div>
                                </div>

                                <p x-show="item.note" class="text-xs text-slate-400 pt-1" x-text="'📝 Ghi chú: ' + item.note"></p>
                            </div>

                        </div>
                    </template>

                    <div x-show="filteredResolvedTickets.length === 0" class="py-16 text-center text-slate-500 space-y-2">
                        <i data-lucide="inbox" class="w-10 h-10 mx-auto opacity-40"></i>
                        <p class="text-xs">Chưa có lịch sử ticket đã xử lý.</p>
                    </div>
                </div>

            </div>

        </main>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div x-show="toast.show" x-cloak x-transition
         class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 shadow-2xl text-xs font-bold text-white flex items-center gap-2.5">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span x-text="toast.message"></span>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwWQkopYjL131FKXIN1A_UU5VykUaj8YRL_rP0ZVVmqeqYo_hVyi7JdpmcCIX1eJzd1/exec';

        function renewToolApp() {
            return {
                unlocked: false,
                role: 'staff',
                username: '',
                password: '',
                tickets: [],
                loading: false,
                activeTab: 'pending', // 'pending' | 'resolved'
                searchQuery: '',
                expandedTickets: {},
                fixForms: {},
                telegramBotEnabled: true,
                togglingBot: false,
                submittingTicketId: null,
                toast: { show: false, message: '' },

                init() {
                    const savedAuth = localStorage.getItem('fam_admin_unlocked');
                    if (savedAuth === 'true') {
                        this.unlocked = true;
                        this.role = localStorage.getItem('fam_admin_role') || 'staff';
                        this.loadData();
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                unlock() {
                    const u = String(this.username || '').trim();
                    const p = String(this.password || '').trim();

                    if (u === 'dnc' && p === 'dnc1m@') {
                        this.role = 'admin';
                        this.unlocked = true;
                        localStorage.setItem('fam_admin_unlocked', 'true');
                        localStorage.setItem('fam_admin_role', 'admin');
                        this.loadData();
                        this.showToast('👑 Đăng nhập Quản Trị thành công!');
                    } else if (u === 'goshop' && p === 'goshop') {
                        this.role = 'staff';
                        this.unlocked = true;
                        localStorage.setItem('fam_admin_unlocked', 'true');
                        localStorage.setItem('fam_admin_role', 'staff');
                        this.loadData();
                        this.showToast('👤 Đăng nhập Nhân Viên thành công!');
                    } else {
                        alert('❌ Sai Tên đăng nhập hoặc Mật khẩu!');
                    }
                },

                logout() {
                    this.unlocked = false;
                    localStorage.removeItem('fam_admin_unlocked');
                    localStorage.removeItem('fam_admin_role');
                },

                async loadData(isRefresh = false) {
                    this.loading = true;
                    try {
                        const res = await fetch(`${API_URL}?action=getRenewToolData`);
                        const data = await res.json();
                        if (data.success && data.tickets) {
                            this.tickets = data.tickets;
                            if (data.telegram_bot_enabled !== undefined) {
                                this.telegramBotEnabled = Boolean(data.telegram_bot_enabled);
                            }
                            if (isRefresh) this.showToast('Đã làm mới dữ liệu Ticket & Kho TK!');
                        }
                    } catch (e) {
                        console.error('Fetch error:', e);
                        this.showToast('Không thể kết nối máy chủ API Kho TK');
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async toggleTelegramBot() {
                    this.togglingBot = true;
                    try {
                        const targetState = !this.telegramBotEnabled;
                        const res = await fetch(`${API_URL}?action=toggleTelegramBotStatus&enabled=${targetState}`);
                        const data = await res.json();
                        if (data.success) {
                            this.telegramBotEnabled = data.enabled;
                            this.showToast(data.message || (data.enabled ? '🤖 Đã BẬT Bot Telegram gửi nhóm!' : '⏸️ Đã TẮT Bot Telegram gửi nhóm!'));
                        } else {
                            alert('❌ Lỗi khi đổi trạng thái Bot Telegram: ' + (data.message || 'Chưa rõ'));
                        }
                    } catch (e) {
                        console.error('Toggle bot error:', e);
                        alert('❌ Lỗi kết nối API!');
                    } finally {
                        this.togglingBot = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                get pendingTickets() {
                    return this.tickets.filter(t => t.status !== 'Đã xử lý').sort((a, b) => {
                        return new Date(a.created_at || 0).getTime() - new Date(b.created_at || 0).getTime();
                    });
                },

                get resolvedTickets() {
                    return this.tickets.filter(t => t.status === 'Đã xử lý').sort((a, b) => {
                        const tA = new Date(a.resolved_at || a.created_at || 0).getTime();
                        const tB = new Date(b.resolved_at || b.created_at || 0).getTime();
                        return tB - tA;
                    });
                },

                get filteredPendingTickets() {
                    if (!this.searchQuery.trim()) return this.pendingTickets;
                    const q = this.searchQuery.toLowerCase().trim();
                    return this.pendingTickets.filter(t => this.matchSearch(t, q));
                },

                get filteredResolvedTickets() {
                    if (!this.searchQuery.trim()) return this.resolvedTickets;
                    const q = this.searchQuery.toLowerCase().trim();
                    return this.resolvedTickets.filter(t => this.matchSearch(t, q));
                },

                matchSearch(t, q) {
                    const stt = String(t.stt_group || '').toLowerCase();
                    const reported = String(this.getReportedEmail(t) || '').toLowerCase();
                    const liveOwner = String(t.live_snapshot?.owner_email || '').toLowerCase();
                    const liveMembers = String(this.getLiveMemberEmails(t) || '').toLowerCase();
                    return stt.includes(q) || reported.includes(q) || liveOwner.includes(q) || liveMembers.includes(q);
                },

                isExpanded(ticketId) {
                    return !!this.expandedTickets[ticketId];
                },

                toggleExpand(ticketId) {
                    this.expandedTickets[ticketId] = !this.expandedTickets[ticketId];
                    if (this.expandedTickets[ticketId]) {
                        this.initFixForm(ticketId);
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                initFixForm(ticketId) {
                    if (this.fixForms[ticketId]) return;
                    const item = this.tickets.find(t => t.ticket_id === ticketId);
                    const live = item?.live_snapshot || {};
                    this.fixForms[ticketId] = {
                        status_snapshot: live.status || 'Hoạt động',
                        owner_email: live.owner_email || '',
                        owner_pass: live.owner_pass || '',
                        owner_mkp: live.owner_mkp || '',
                        owner_2fa: live.owner_2fa || '',
                        date_renew_snapshot: live.date_renew || '',
                        resolution_type: 'Fix thường',
                        note: '',
                        send_email: true
                    };
                },

                getFixForm(ticketId) {
                    if (!this.fixForms[ticketId]) {
                        this.initFixForm(ticketId);
                    }
                    return this.fixForms[ticketId];
                },

                getReportedEmail(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].customer_email) {
                        return item.reports[0].customer_email;
                    }
                    if (item.reported_emails && item.reported_emails.length > 0) {
                        return item.reported_emails[0];
                    }
                    return item.owner_email || 'Chưa rõ';
                },

                getReportMessage(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].message) {
                        return item.reports[0].message;
                    }
                    return '';
                },

                getCtvName(item) {
                    if (item.fam_all_members && item.fam_all_members.length > 0 && item.fam_all_members[0].ctv) {
                        return item.fam_all_members[0].ctv;
                    }
                    return '';
                },

                getLiveMemberEmails(item) {
                    if (item.live_snapshot && Array.isArray(item.live_snapshot.group_emails) && item.live_snapshot.group_emails.length > 0) {
                        return item.live_snapshot.group_emails.join('\n');
                    }
                    if (item.fam_all_members && item.fam_all_members.length > 0) {
                        return item.fam_all_members.map(m => m.email).join('\n');
                    }
                    return (item.reported_emails || []).join('\n');
                },

                getSavedReport(item) {
                    if (item.reports && item.reports.length > 0) {
                        return item.reports[0];
                    }
                    return null;
                },

                formatDate(dateStr) {
                    if (!dateStr) return '—';
                    try {
                        const d = new Date(dateStr);
                        if (isNaN(d.getTime())) return String(dateStr);
                        return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' +
                               d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    } catch (e) {
                        return String(dateStr);
                    }
                },

                async submitFixProfile(item) {
                    const ticketId = item.ticket_id;
                    const form = this.getFixForm(ticketId);

                    this.submittingTicketId = ticketId;
                    try {
                        const payload = {
                            action: 'resolveTicketWithFixProfile',
                            ticket_id: ticketId,
                            resolved_by: this.role === 'admin' ? 'Admin' : 'Staff',
                            note: form.note || 'Đã xử lý và cấp hồ sơ mới trên RenewTool',
                            resolution_type: form.resolution_type || 'Fix RenewTool',
                            send_email: form.send_email,
                            status_snapshot: form.status_snapshot,
                            date_renew_snapshot: form.date_renew_snapshot,
                            owner_email: form.owner_email,
                            owner_pass: form.owner_pass,
                            owner_mkp: form.owner_mkp,
                            owner_2fa: form.owner_2fa,
                            group_emails: this.getLiveMemberEmails(item)
                        };

                        const res = await fetch(API_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain' },
                            body: JSON.stringify(payload)
                        });

                        const result = await res.json();
                        if (result.success) {
                            this.showToast('🚀 Đã lưu hồ sơ fix & gửi mail báo khách thành công!');
                            await this.loadData();
                            this.activeTab = 'resolved';
                        } else {
                            alert('❌ Lỗi khi xác nhận fix: ' + (result.message || 'Không rõ nguyên nhân'));
                        }
                    } catch (err) {
                        console.error('Submit fix error:', err);
                        alert('❌ Lỗi kết nối máy chủ!');
                    } finally {
                        this.submittingTicketId = null;
                    }
                },

                async fetch2faCode(secret) {
                    if (!secret) return;
                    try {
                        const res = await fetch(`${API_URL}?action=getTOTPCode&secret=${encodeURIComponent(secret)}`);
                        const data = await res.json();
                        if (data.success && data.code) {
                            alert(`🔐 Mã 2FA (OTP): ${data.code}\n(Đã tự động copy vào bộ nhớ tạm)`);
                            this.copyText(data.code);
                        } else {
                            alert('Không thể tạo mã 2FA từ secret này.');
                        }
                    } catch (e) {
                        alert('Lỗi kết nối API 2FA.');
                    }
                },

                copyText(text) {
                    if (!text) return;
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast(`Đã copy: ${text.substring(0, 32)}...`);
                    }).catch(err => {
                        console.error('Copy error:', err);
                    });
                },

                showToast(msg) {
                    this.toast = { show: true, message: msg };
                    setTimeout(() => { this.toast.show = false; }, 3500);
                }
            };
        }
    </script>
