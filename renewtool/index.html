<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go DNC — Renew Tool & Owner Account Lookup</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        [x-cloak] { display: none !important; }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(226, 232, 240, 0.8);
        }
    </style>
</head>
<body x-data="renewToolApp()" x-init="init()" class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- LOGIN OVERLAY / MODAL IF NOT AUTHENTICATED -->
    <template x-if="!unlocked">
        <div class="fixed inset-0 z-50 bg-slate-950/90 backdrop-blur-md flex items-center justify-center p-4">
            <div class="glass-card bg-slate-900 border border-slate-800 rounded-3xl p-6 sm:p-8 max-w-md w-full shadow-2xl space-y-6">
                <div class="text-center space-y-2">
                    <div class="w-14 h-14 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mx-auto text-indigo-400">
                        <i data-lucide="shield-lock" class="w-7 h-7"></i>
                    </div>
                    <h2 class="text-xl sm:text-2xl font-black tracking-tight text-white">Xác Thực Quản Trị</h2>
                    <p class="text-xs text-slate-400">Vui lòng đăng nhập tài khoản Quản trị / Nhân viên để truy cập Renew Tool & Mật khẩu Chủ Fam.</p>
                </div>

                <form @submit.prevent="unlock()" class="space-y-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Tên đăng nhập</label>
                        <input type="text" x-model="username" required placeholder="Nhập tên đăng nhập..."
                               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-300 mb-1">Mật khẩu</label>
                        <input type="password" x-model="password" required placeholder="Nhập mật khẩu..."
                               class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                    </div>

                    <button type="submit"
                            class="w-full py-3.5 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 font-bold text-sm text-white shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 cursor-pointer">
                        <i data-lucide="log-in" class="w-4 h-4"></i>
                        <span>Đăng Nhập Quản Trị</span>
                    </button>
                </form>

                <p class="text-[11px] text-slate-500 text-center">Trang web yêu cầu xác thực bảo mật thông tin mật khẩu & 2FA khách hàng.</p>
            </div>
        </div>
    </template>

    <!-- MAIN APP DASHBOARD -->
    <div x-show="unlocked" x-cloak class="min-h-screen flex flex-col">

        <!-- HEADER -->
        <header class="bg-slate-900/80 border-b border-slate-800 sticky top-0 z-30 backdrop-blur-md px-4 py-3 sm:px-6">
            <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-600 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/20 text-white font-black text-xs">
                        DNC
                    </div>
                    <div>
                        <h1 class="font-black text-sm sm:text-base text-white flex items-center gap-2">
                            <span>Renew Tool & Owner Lookup</span>
                            <span class="text-[10px] uppercase font-bold px-2 py-0.5 rounded-full bg-indigo-500/20 text-indigo-400 border border-indigo-500/30" x-text="role === 'admin' ? 'Admin' : 'Staff'"></span>
                        </h1>
                        <p class="text-[11px] text-slate-400">Tra cứu nhanh Mật khẩu Chủ Fam & Danh sách Email mời lại</p>
                    </div>
                </div>

                <div class="flex items-center gap-2 sm:gap-3">
                    <button @click="loadData(true)" :disabled="loading"
                            class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" :class="loading ? 'animate-spin' : ''"></i>
                        <span class="hidden sm:inline">Làm mới</span>
                    </button>
                    <button @click="logout()"
                            class="px-3.5 py-2 rounded-xl bg-rose-600/20 hover:bg-rose-600/30 border border-rose-500/30 text-xs font-bold text-rose-400 transition-all flex items-center gap-1.5 cursor-pointer">
                        <i data-lucide="log-out" class="w-3.5 h-3.5"></i>
                        <span class="hidden sm:inline">Đăng xuất</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- CONTENT -->
        <main class="flex-1 max-w-7xl mx-auto w-full px-4 py-6 space-y-6">

            <!-- SEARCH & FILTERS -->
            <div class="bg-slate-800/60 border border-slate-800 rounded-2xl p-4 space-y-4">
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-3">
                    <!-- Search Input -->
                    <div class="sm:col-span-6 lg:col-span-8 relative">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </div>
                        <input type="text" x-model="searchQuery" placeholder="Tìm theo STT nhóm (RN100, PL394), email khách, email chủ fam..."
                               class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-xs sm:text-sm text-white focus:border-indigo-500 focus:outline-none transition-all placeholder-slate-500">
                    </div>

                    <!-- Filter Status -->
                    <div class="sm:col-span-6 lg:col-span-4 flex items-center gap-1.5 bg-slate-900 p-1 rounded-xl border border-slate-700">
                        <button @click="statusFilter = 'all'"
                                :class="statusFilter === 'all' ? 'bg-indigo-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'"
                                class="flex-1 py-1.5 text-[11px] rounded-lg transition-all text-center">Tất cả</button>
                        <button @click="statusFilter = 'active'"
                                :class="statusFilter === 'active' ? 'bg-emerald-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'"
                                class="flex-1 py-1.5 text-[11px] rounded-lg transition-all text-center">🟢 Hoạt động</button>
                        <button @click="statusFilter = 'inactive'"
                                :class="statusFilter === 'inactive' ? 'bg-rose-600 text-white font-bold' : 'text-slate-400 hover:text-slate-200'"
                                class="flex-1 py-1.5 text-[11px] rounded-lg transition-all text-center">🔴 Không HĐ</button>
                    </div>
                </div>
            </div>

            <!-- STATS COUNTER -->
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4">
                <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-slate-400 font-medium">Tổng số Nhóm Fam</p>
                    <p class="text-xl sm:text-2xl font-black text-white mt-1" x-text="filteredTickets.length"></p>
                </div>
                <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-emerald-400 font-medium">🟢 Đang hoạt động</p>
                    <p class="text-xl sm:text-2xl font-black text-emerald-400 mt-1" x-text="filteredTickets.filter(t => t.activity_status === 'Đang hoạt động').length"></p>
                </div>
                <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-rose-400 font-medium">🔴 Không hoạt động</p>
                    <p class="text-xl sm:text-2xl font-black text-rose-400 mt-1" x-text="filteredTickets.filter(t => t.activity_status === 'Không hoạt động').length"></p>
                </div>
                <div class="bg-slate-800/40 border border-slate-800 rounded-2xl p-4">
                    <p class="text-xs text-amber-400 font-medium">⏳ Chưa phân loại</p>
                    <p class="text-xl sm:text-2xl font-black text-amber-400 mt-1" x-text="filteredTickets.filter(t => !t.activity_status).length"></p>
                </div>
            </div>

            <!-- LOADING SPINNER -->
            <div x-show="loading" class="py-12 text-center space-y-3">
                <div class="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <p class="text-xs text-slate-400 font-medium">Đang tải dữ liệu nhóm & tài khoản từ Kho TK...</p>
            </div>

            <!-- TICKET & SNAPSHOT CARDS LIST -->
            <div x-show="!loading" class="space-y-4">
                <template x-for="item in filteredTickets" :key="item.ticket_id">
                    <div class="bg-slate-800/60 border border-slate-700/80 rounded-2xl p-5 shadow-lg space-y-4">
                        
                        <!-- CARD HEADER -->
                        <div class="flex flex-wrap items-center justify-between gap-3 pb-3 border-b border-slate-700/60">
                            <div class="flex items-center gap-2.5 flex-wrap">
                                <span class="px-3 py-1 rounded-xl bg-indigo-600 text-white font-black text-sm tracking-wide" x-text="item.stt_group"></span>
                                
                                <span x-show="item.activity_status === 'Đang hoạt động'"
                                      class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-emerald-500/20 text-emerald-300 border border-emerald-500/30">
                                    🟢 Đang hoạt động
                                </span>
                                <span x-show="item.activity_status === 'Không hoạt động'"
                                      class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-rose-500/20 text-rose-300 border border-rose-500/30">
                                    🔴 Không hoạt động
                                </span>
                                <span x-show="!item.activity_status"
                                      class="px-2.5 py-0.5 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/30">
                                    ⏳ Chưa phân loại
                                </span>
                            </div>

                            <div class="text-xs text-slate-400 flex items-center gap-2">
                                <span>📅 Date Renew: <strong class="text-white" x-text="item.date_renew_snapshot || item.ngay_renew || '—'"></strong></span>
                            </div>
                        </div>

                        <!-- 🔑 TÀI KHOẢN CHỦ FAM (OWNER ACCOUNT) -->
                        <div class="bg-slate-900/80 border border-slate-700 rounded-xl p-4 space-y-3">
                            <div class="flex items-center justify-between">
                                <h4 class="text-xs font-black text-indigo-400 uppercase tracking-wider flex items-center gap-1.5">
                                    <i data-lucide="key-round" class="w-4 h-4"></i>
                                    Tài Khoản Chủ Fam (Master Account)
                                </h4>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-2.5">
                                <!-- Email -->
                                <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">📧 Email</p>
                                        <p class="text-xs font-mono font-bold text-white truncate" x-text="getOwnerEmail(item) || 'Chưa có'"></p>
                                    </div>
                                    <button @click="copyText(getOwnerEmail(item))" title="Copy Email"
                                            class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all cursor-pointer shrink-0">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                                <!-- Pass -->
                                <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">🔒 Mật Khẩu</p>
                                        <p class="text-xs font-mono font-bold text-amber-300 truncate" x-text="getOwnerPass(item) || '—'"></p>
                                    </div>
                                    <button @click="copyText(getOwnerPass(item))" title="Copy Pass"
                                            class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all cursor-pointer shrink-0">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                                <!-- Mail KP -->
                                <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">📮 Mail Khôi Phục</p>
                                        <p class="text-xs font-mono font-bold text-slate-300 truncate" x-text="getOwnerMkp(item) || '—'"></p>
                                    </div>
                                    <button @click="copyText(getOwnerMkp(item))" title="Copy Mail KP"
                                            class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all cursor-pointer shrink-0">
                                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    </button>
                                </div>

                                <!-- 2FA Secret & OTP Code -->
                                <div class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 flex items-center justify-between gap-2">
                                    <div class="min-w-0 flex-1">
                                        <p class="text-[10px] text-slate-400 font-bold uppercase">🔐 2FA Secret / Mã OTP</p>
                                        <p class="text-xs font-mono font-bold text-purple-300 truncate" x-text="getOwner2fa(item) || '—'"></p>
                                    </div>
                                    <div class="flex items-center gap-1 shrink-0">
                                        <button @click="copyText(getOwner2fa(item))" title="Copy 2FA Secret"
                                                class="p-1.5 rounded-lg bg-slate-700 hover:bg-slate-600 text-slate-300 transition-all cursor-pointer">
                                            <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                        </button>
                                        <button x-show="getOwner2fa(item)" @click="fetch2faCode(getOwner2fa(item))" title="Lấy Mã OTP 6 Số"
                                                class="px-2 py-1 rounded-lg bg-purple-600 hover:bg-purple-500 text-[10px] font-bold text-white transition-all cursor-pointer">
                                            Mã 6 Số
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 👥 DANH SÁCH EMAIL MỜI LẠI (MEMBER EMAILS) -->
                        <div class="bg-slate-900/60 border border-slate-700/60 rounded-xl p-4 space-y-2.5">
                            <div class="flex items-center justify-between gap-2 flex-wrap">
                                <h4 class="text-xs font-black text-emerald-400 uppercase tracking-wider flex items-center gap-1.5">
                                    <i data-lucide="users" class="w-4 h-4"></i>
                                    Danh Sách Email Mời Lại Về Nhóm Gia Đình
                                </h4>
                                <button @click="copyText(getGroupEmailsFormatted(item))"
                                        class="px-3 py-1.5 rounded-lg bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/30 text-xs font-bold text-emerald-300 transition-all flex items-center gap-1.5 cursor-pointer">
                                    <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                                    <span>Copy Tất Cả Email Mời Lại</span>
                                </button>
                            </div>

                            <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 font-mono text-xs text-slate-300 whitespace-pre-line leading-relaxed selection:bg-emerald-500 selection:text-slate-950"
                                 x-text="getGroupEmailsFormatted(item) || 'Chưa có email thành viên nào.'"></div>
                        </div>

                    </div>
                </template>

                <div x-show="filteredTickets.length === 0" class="py-12 text-center text-slate-500 space-y-2">
                    <i data-lucide="inbox" class="w-8 h-8 mx-auto opacity-50"></i>
                    <p class="text-xs">Không tìm thấy nhóm Fam nào khớp với từ khóa tìm kiếm.</p>
                </div>
            </div>

        </main>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div x-show="toast.show" x-cloak x-transition
         class="fixed bottom-5 right-5 z-50 px-4 py-3 rounded-2xl bg-slate-800 border border-slate-700 shadow-2xl text-xs font-bold text-white flex items-center gap-2.5">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span x-text="toast.message"></span>
    </div>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwWQkopYjL131FKXIN1A_UU5VykUaj8YRL_rP0ZVVmqeqYo_hVyi7JdpmcCIX1eJzd1/exec';

        function renewToolApp() {
            return {
                unlocked: false,
                role: 'staff',
                username: '',
                password: '',
                tickets: [],
                loading: false,
                searchQuery: '',
                statusFilter: 'all',
                toast: { show: false, message: '' },

                init() {
                    const savedAuth = localStorage.getItem('fam_admin_unlocked');
                    if (savedAuth === 'true') {
                        this.unlocked = true;
                        this.role = localStorage.getItem('fam_admin_role') || 'staff';
                        this.loadData();
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                unlock() {
                    const u = String(this.username || '').trim();
                    const p = String(this.password || '').trim();

                    if (u === 'dnc' && p === 'dnc1m@') {
                        this.role = 'admin';
                        this.unlocked = true;
                        localStorage.setItem('fam_admin_unlocked', 'true');
                        localStorage.setItem('fam_admin_role', 'admin');
                        this.loadData();
                        this.showToast('👑 Đăng nhập Quản Trị thành công!');
                    } else if (u === 'goshop' && p === 'goshop') {
                        this.role = 'staff';
                        this.unlocked = true;
                        localStorage.setItem('fam_admin_unlocked', 'true');
                        localStorage.setItem('fam_admin_role', 'staff');
                        this.loadData();
                        this.showToast('👤 Đăng nhập Nhân Viên thành công!');
                    } else {
                        alert('❌ Sai Tên đăng nhập hoặc Mật khẩu!');
                    }
                },

                logout() {
                    this.unlocked = false;
                    localStorage.removeItem('fam_admin_unlocked');
                    localStorage.removeItem('fam_admin_role');
                },

                async loadData(isRefresh = false) {
                    this.loading = true;
                    try {
                        const res = await fetch(`${API_URL}?action=getRenewToolData`);
                        const data = await res.json();
                        if (data.success && data.tickets) {
                            this.tickets = data.tickets;
                            if (isRefresh) this.showToast('Đã làm mới dữ liệu nhóm & Kho TK!');
                        }
                    } catch (e) {
                        console.error('Fetch error:', e);
                        this.showToast('Không thể kết nối máy chủ API Kho TK');
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                get filteredTickets() {
                    let list = this.tickets;
                    if (this.statusFilter === 'active') {
                        list = list.filter(t => t.activity_status === 'Đang hoạt động');
                    } else if (this.statusFilter === 'inactive') {
                        list = list.filter(t => t.activity_status === 'Không hoạt động');
                    }

                    if (!this.searchQuery.trim()) return list;
                    const q = this.searchQuery.toLowerCase().trim();

                    return list.filter(t => {
                        const stt = String(t.stt_group || '').toLowerCase();
                        const owner = String(this.getOwnerEmail(t) || '').toLowerCase();
                        const members = String(this.getGroupEmailsFormatted(t) || '').toLowerCase();
                        const reported = String(t.reported_emails || []).join(' ').toLowerCase();
                        return stt.includes(q) || owner.includes(q) || members.includes(q) || reported.includes(q);
                    });
                },

                getOwnerEmail(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].owner_email) return item.reports[0].owner_email;
                    return item.owner_email || '';
                },

                getOwnerPass(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].owner_pass) return item.reports[0].owner_pass;
                    return item.owner_pass || '';
                },

                getOwnerMkp(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].owner_mkp) return item.reports[0].owner_mkp;
                    return item.owner_mkp || '';
                },

                getOwner2fa(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].owner_2fa) return item.reports[0].owner_2fa;
                    return item.owner_2fa || '';
                },

                getGroupEmailsFormatted(item) {
                    if (item.reports && item.reports.length > 0 && item.reports[0].group_emails) {
                        return item.reports[0].group_emails;
                    }
                    if (item.fam_all_members && item.fam_all_members.length > 0) {
                        return item.fam_all_members.map(m => m.email).join('\n');
                    }
                    return (item.reported_emails || []).join('\n');
                },

                async fetch2faCode(secret) {
                    if (!secret) return;
                    try {
                        const res = await fetch(`${API_URL}?action=getTOTPCode&secret=${encodeURIComponent(secret)}`);
                        const data = await res.json();
                        if (data.success && data.code) {
                            alert(`🔐 Mã 2FA (OTP): ${data.code}\n(Đã tự động copy vào bộ nhớ tạm)`);
                            this.copyText(data.code);
                        } else {
                            alert('Không thể tạo mã 2FA từ secret này.');
                        }
                    } catch (e) {
                        alert('Lỗi kết nối API 2FA.');
                    }
                },

                copyText(text) {
                    if (!text) return;
                    navigator.clipboard.writeText(text).then(() => {
                        this.showToast(`Đã copy: ${text.substring(0, 30)}...`);
                    }).catch(err => {
                        console.error('Copy error:', err);
                    });
                },

                showToast(msg) {
                    this.toast = { show: true, message: msg };
                    setTimeout(() => { this.toast.show = false; }, 3500);
                }
            };
        }
    </script>
</body>
</html>
