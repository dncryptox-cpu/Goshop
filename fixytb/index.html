<!doctype html>
<html lang="vi">
<head>
  <!-- PWA: icon & add-to-home-screen -->
  <link rel="apple-touch-icon" href="/fixytb/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/fixytb/icon-192.png">
  <link rel="manifest" href="/fixytb/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="FixYTB">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FixYTB · Go DNC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Một cột cho điện thoại. Mỗi màn hình: 1 dòng trạng thái lớn + 1 việc cần làm + 1 nút chính. */
:root{
  --bg:#f3f5f4; --card:#ffffff; --sunk:#eef2f0; --ink:#111a17; --mute:#5b6a64; --line:#dce3e0;
  --acc:#0b6b5f; --acc-ink:#ffffff; --acc-soft:#e1f1ee;
  --ok:#137a3a; --ok-soft:#e3f4e9; --warn:#9a5300; --warn-soft:#fcf0dc; --bad:#b3123a; --bad-soft:#fde7ec; --info:#1d4fc0; --info-soft:#e6edfc;
  --g-blue:#1a73e8; --g-red:#d93025;
  --f:"Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1311; --card:#151e1b; --sunk:#1b2622; --ink:#e7eeeb; --mute:#97a8a1; --line:#2a3632;
  --acc:#35c6b3; --acc-ink:#04201b; --acc-soft:#123029;
  --ok:#5fd38a; --ok-soft:#142a1d; --warn:#f2b45a; --warn-soft:#2d2312; --bad:#ff7d96; --bad-soft:#341720; --info:#93b4ff; --info-soft:#18223b;
  --g-blue:#8ab4f8; --g-red:#f28b82; color-scheme:dark; }}
:root[data-theme="dark"]{
  --bg:#0d1311; --card:#151e1b; --sunk:#1b2622; --ink:#e7eeeb; --mute:#97a8a1; --line:#2a3632;
  --acc:#35c6b3; --acc-ink:#04201b; --acc-soft:#123029;
  --ok:#5fd38a; --ok-soft:#142a1d; --warn:#f2b45a; --warn-soft:#2d2312; --bad:#ff7d96; --bad-soft:#341720; --info:#93b4ff; --info-soft:#18223b;
  --g-blue:#8ab4f8; --g-red:#f28b82; color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:14px 48px;-webkit-text-size-adjust:100%}
.wrap{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3,p{margin:0}
h1,h2{text-wrap:balance;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--acc)}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px;border-radius:8px}

.top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--mute);font-weight:600}
.logo{width:26px;height:26px;border-radius:7px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;font-size:10px;font-weight:800}

.lookup{display:flex;flex-direction:column;gap:12px;padding-top:12px}
.lookup h1{font-size:26px;font-weight:800}
.lookup p{color:var(--mute)}
input[type=email],input[type=text]{width:100%;min-width:0;font:inherit;font-size:18px;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px}
input:focus{border-color:var(--acc);outline:none}
.err{color:var(--bad);font-size:15px}

.who{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 14px;font-size:15px}
.who b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:0;border-radius:14px;padding:16px;font-weight:700;font-size:17px;background:var(--acc);color:var(--acc-ink);text-decoration:none;min-height:56px}
.btn:disabled{opacity:.6}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.soft{background:var(--acc-soft);color:var(--acc)}
.btn.ok{background:var(--ok);color:var(--card)}
.btn.small{width:auto;min-height:0;padding:8px 12px;font-size:14px;border-radius:10px}
.link{background:none;border:0;color:var(--acc);font-weight:600;padding:8px 0;text-align:center;font-size:15px}

.hero{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:20px;border-radius:20px;background:var(--card);border:1px solid var(--line)}
.hero .ic{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.hero .ic svg{width:28px;height:28px}
.hero h2{font-size:23px;font-weight:800}
.hero p{color:var(--mute);font-size:16px}
.hero p b{color:var(--ink)}
.t-ok .ic{background:var(--ok-soft);color:var(--ok)} .t-warn .ic{background:var(--warn-soft);color:var(--warn)}
.t-bad .ic{background:var(--bad-soft);color:var(--bad)} .t-info .ic{background:var(--info-soft);color:var(--info)}
.t-act .ic{background:var(--acc-soft);color:var(--acc)}
.facts{display:flex;flex-wrap:wrap;gap:6px}
.fact{font-size:13px;background:var(--sunk);border-radius:999px;padding:3px 10px;color:var(--mute)}
.fact b{color:var(--ink);font-weight:600}

.track{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tr{display:grid;grid-template-columns:24px 1fr;gap:12px;position:relative;padding-bottom:16px}
.tr:last-child{padding-bottom:0}
.tr .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--acc-ink)}
.tr.done .dot{background:var(--acc);border-color:var(--acc)}
.tr.now .dot{border-color:var(--warn);background:var(--warn-soft)}
.tr:not(:last-child)::after{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:2px;background:var(--line)}
.tr.done:not(:last-child)::after{background:var(--acc)}
.tr b{display:block;font-size:16px}
.tr span{font-size:14px;color:var(--mute)}
@media (prefers-reduced-motion:no-preference){ .tr.now .dot{animation:pulse 1.6s ease-in-out infinite} @keyframes pulse{50%{box-shadow:0 0 0 6px var(--warn-soft)}} }

.alert{border-radius:14px;padding:14px 16px;font-size:15px;display:flex;gap:10px;align-items:flex-start;color:var(--ink)}
.alert svg{flex:none;width:22px;height:22px;margin-top:1px}
.alert.bad{background:var(--bad-soft)} .alert.bad svg{color:var(--bad)}
.alert.warn{background:var(--warn-soft)} .alert.warn svg{color:var(--warn)}
.alert.info{background:var(--info-soft)} .alert.info svg{color:var(--info)}

.stepper{display:flex;gap:6px}
.stepper i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.stepper i.on{background:var(--acc)}
.step{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.step .k{font-size:13px;font-weight:700;color:var(--acc);letter-spacing:.06em;text-transform:uppercase}
.step h3{font-size:22px;font-weight:800;line-height:1.25}
.step p{color:var(--mute);font-size:16px}
.step p b{color:var(--ink)}

.mock{border:1px solid var(--line);border-radius:14px;background:var(--sunk);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.mock .bar{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.mock .bar i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.mock .scr{background:var(--card);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.mock .t{font-weight:700;font-size:15px}
.mock .m{color:var(--mute);font-size:13px}
.mock .gbtn{align-self:flex-start;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;border:1px solid var(--line);color:var(--g-blue);background:var(--card)}
.mock .gbtn.red{color:var(--g-red)}
.mock .gbtn.fill{background:var(--g-blue);color:var(--card);border-color:var(--g-blue)}
.mock .hl{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--acc)}
.mock .cap{font-size:12px;color:var(--mute);text-align:center}
.av{display:flex;align-items:center;gap:8px}
.av span{width:26px;height:26px;border-radius:50%;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font-size:12px;font-weight:700}
.yt{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px}
.yt svg{width:26px;height:18px}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px}
.choice[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.choice .r{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);margin-top:2px;background:var(--card)}
.choice[aria-pressed="true"] .r{border:7px solid var(--acc)}
.choice b{display:block;font-size:16px}
.choice span{font-size:14px;color:var(--mute)}

.more{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.more>button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;padding:14px 16px;text-align:left}
.more>*+button{border-top:1px solid var(--line)}
.more>button b{display:block;font-size:16px}
.more>button span{font-size:14px;color:var(--mute)}
.more>button .chev{margin-left:auto;color:var(--mute);transition:transform .15s;display:grid}
.more>button[aria-expanded="true"] .chev{transform:rotate(90deg)}
.more .em{width:40px;height:40px;border-radius:12px;background:var(--sunk);display:grid;place-items:center;flex:none}
.more .em svg{width:22px;height:22px;color:var(--acc)}
.panel{padding:4px 16px 16px;display:flex;flex-direction:column;gap:10px}
.cred{background:var(--sunk);border-radius:12px;padding:12px;display:grid;gap:6px;font-size:15px}
.cred div{display:flex;justify-content:space-between;gap:10px}
.cred span{color:var(--mute)}
.cred b{font-weight:600;word-break:break-all;text-align:right}
.otp{font-size:28px;font-weight:800;letter-spacing:.12em;text-align:center;font-variant-numeric:tabular-nums}
.sec-title{font-size:14px;font-weight:700;color:var(--mute);margin-top:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:12px;font-size:15px;max-width:calc(100% - 32px);z-index:9}
.dbg{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--sunk);border-radius:10px;padding:10px;color:var(--mute);word-break:break-all}
.spin{width:18px;height:18px;border:2.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:13px;color:var(--mute);padding-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="logo">DNC</div>Go DNC · YouTube Premium</div>
  <main id="app" class="wrap" style="width:100%"></main>
  <footer>© 2026 Go DNC</footer>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
  const API = "https://script.google.com/macros/s/AKfycbwWQkopYjL131FKXIN1A_UU5VykUaj8YRL_rP0ZVVmqeqYo_hVyi7JdpmcCIX1eJzd1/exec";
  const FAMILY_URL = "https://myaccount.google.com/family/details";
  const YT_URL = "https://www.youtube.com/";
  const RECENT_DAYS = 7;
  const SOURCE = "Khách (fixytb)";
  const MIN = 60 * 1000;
  const params = new URLSearchParams(location.search);
  const DEBUG = params.get("debug") === "1";

  let R = null, V = null, email = "", ui = {}, loading = false, lookErr = "", totpTimer = null;

  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v).trim());
  const T = v => { if (!v) return 0; const t = new Date(v).getTime(); return isNaN(t) ? 0 : t; };
  const ago = t => { const m = Math.max(0, Math.round((Date.now()-t)/MIN)); if (m < 1) return "vừa xong"; if (m < 60) return m+" phút trước"; const h = Math.floor(m/60); if (h < 24) return h+" giờ trước"; return Math.floor(h/24)+" ngày trước"; };
  const clock = t => { const d = new Date(t); return d.toLocaleTimeString("vi-VN",{hour:"2-digit",minute:"2-digit"})+" "+d.toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"}); };
  const dmy = v => { if (!v) return ""; const s = String(v).trim(); if (/^\d{1,2}[\/.-]\d{1,2}[\/.-]\d{2,4}$/.test(s)) return s; const t = T(v); return t ? new Date(t).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"}) : s; };
  const mask = e => { const [u,d] = String(e).split("@"); return d ? u.slice(0,4)+"•••@"+d : e; };
  const digits = v => String(v||"").replace(/\D+/g,"");
  function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,3000); }

  const ICON = {
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    arrow:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
    stop:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8 8l8 8"/></svg>',
    warn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9.5 17H2.5z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
    info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.01"/></svg>',
    mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6l8.5 7 8.5-7"/></svg>',
    key:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="M11 12l9-9M17 6l3 3M15 8l2 2"/></svg>',
    redo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>',
    chev:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>',
    ext:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    yt:'<svg viewBox="0 0 28 20"><rect width="28" height="20" rx="5" fill="#ff0033"/><path d="M11 6l7 4-7 4z" fill="#fff"/></svg>',
  };

  async function api(action, payload, timeoutMs = 60000){
    const url = new URL(API); url.searchParams.append("action", action);
    const ctl = new AbortController(); const to = setTimeout(() => ctl.abort(), timeoutMs);
    try {
      const res = await fetch(url.toString(), { method:"POST", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify(payload), signal: ctl.signal });
      const text = await res.text();
      try { return JSON.parse(text); } catch(e){ throw new Error("Hệ thống đang bảo trì, thử lại sau ít phút."); }
    } catch(e){
      if (e.name === "AbortError") throw new Error("Mạng chậm. Đợi một chút rồi thử lại, đừng bấm nhiều lần.");
      throw e;
    } finally { clearTimeout(to); }
  }

  /* ---------- suy ra trạng thái ---------- */
  function resolve(r){
    const tf = r.thayfam || null, rj = r.rejoin || null, fam = r.fam || null;
    const open = r.has_ticket && r.status !== "Đã xử lý";
    const ticketAt = T(r.created_at);
    const rjAfter = t => rj && T(rj.created_at) >= t;
    const base = { rn: r.stt_group, ctv: r.ctv || "", hsd: dmy(r.ngay_renew), act: r.activity_status || "" };
    const fromRejoin = (extra) => {
      if (rj.type === "da_vao") return { ...base, ...extra, kind:"joined", joinedAt:T(rj.created_at), why:"REJOIN da_vao" };
      if (rj.status === "Đã mời lại") return { ...base, ...extra, kind:"invited", at:T(rj.handled_at)||T(rj.created_at), resent:true, why:"REJOIN Đã mời lại" };
      return { ...base, ...extra, kind:"reinvite", reqAt:T(rj.created_at), reason:rj.reason||"Không thấy lời mời", why:"REJOIN moi_lai "+(rj.status||"Mới") };
    };
    if (fam && fam.due) return { ...base, kind:"pending", due:true, famRenew: fam.renew, act:"Không hoạt động", why:"STOCK đến hạn " + fam.renew };
    if (tf){
      const at = T(tf.at), extra = { at, newOwner: tf.new_owner, legacy:false };
      if (open && ticketAt > at) return { ...base, kind:"pending", why:"Ticket mở mới hơn lần thay fam" };
      if (!tf.invited){
        // Chưa được mời: hết hạn thật → báo gia hạn; còn hạn (vd vừa gia hạn / vừa chuyển fam) → đang xếp nhóm
        const m = String(tf.hsd || base.hsd || "").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
        const exp = m ? new Date(+m[3], +m[2]-1, +m[1], 23, 59).getTime() : 0;
        if (exp && exp >= Date.now()) return { ...base, kind:"pending", act:"Không hoạt động", why:"THAYFAM_LOG chưa mời, HSD còn " + (tf.hsd||base.hsd) };
        return { ...base, ...extra, kind:"expired", why:"THAYFAM_LOG chưa mời, hết hạn" };
      }
      if (rjAfter(at)) return fromRejoin(extra);
      return { ...base, ...extra, kind:"invited", why:"THAYFAM_LOG đã mời" };
    }
    if (open) return { ...base, kind:"pending", why:"Ticket " + r.status };
    const resolvedAt = T(r.resolved_at);
    if (r.has_ticket && resolvedAt && Date.now() - resolvedAt < RECENT_DAYS*24*60*MIN){
      const extra = { at: resolvedAt, newOwner:"", legacy:true };
      if (rjAfter(resolvedAt)) return fromRejoin(extra);
      return { ...base, ...extra, kind:"invited", why:"Ticket Đã xử lý gần đây" };
    }
    return { ...base, kind:"ok", why: r.has_ticket ? "Ticket cũ đã đóng" : "Chưa có ticket" };
  }

  /* ---------- tra cứu ---------- */
  async function lookup(raw, quiet){
    const em = String(raw||"").trim().toLowerCase();
    lookErr = "";
    if (!isEmail(em)){ lookErr = "Email chưa đúng. Ví dụ: tenban@gmail.com"; render(); return; }
    if (!quiet){ loading = true; render(); }
    try {
      let res = await api("checkStatusV2", { email: em });
      if (res && !res.success && /Action không hợp lệ/.test(res.message||"")) res = await api("checkStatus", { email: em });
      if (!res || !res.success){ lookErr = (res && res.message) || "Không tìm thấy email này."; if (!quiet){ R = null; V = null; email = ""; } return; }
      const prevKind = (email === em && V) ? V.kind : null;
      if (email !== em) ui = { typed: em };
      email = em; R = res; V = resolve(res);
      if (prevKind && prevKind !== V.kind){ ui = {}; if (quiet) toast("Trạng thái đã thay đổi."); }
      try { history.replaceState(null, "", location.pathname + "?email=" + encodeURIComponent(em) + (DEBUG ? "&debug=1" : "")); } catch(e){}
    } catch(e){ lookErr = e.message; }
    finally { loading = false; render(); }
  }

  /* ---------- khung ---------- */
  function render(){
    if (totpTimer){ clearInterval(totpTimer); totpTimer = null; }
    const app = $("#app");

  /* ---------- TOTP ---------- */
  function b32(str){ const a="ABCDEFGHIJKLMNOPQRSTUVWXYZ234567"; const c=String(str).toUpperCase().replace(/[^A-Z2-7]/g,""); let bits=0,val=0,out=[]; for(const ch of c){ val=(val<<5)|a.indexOf(ch); bits+=5; if(bits>=8){ out.push((val>>>(bits-8))&255); bits-=8; } } return new Uint8Array(out); }
  async function totp(secret){
    const key = await crypto.subtle.importKey("raw", b32(secret), {name:"HMAC", hash:"SHA-1"}, false, ["sign"]);
    const stp = Math.floor(Date.now()/30000); const buf = new ArrayBuffer(8); new DataView(buf).setUint32(4, stp);
    const h = new Uint8Array(await crypto.subtle.sign("HMAC", key, buf)); const o = h[h.length-1] & 15;
    const n = ((h[o]&127)<<24 | h[o+1]<<16 | h[o+2]<<8 | h[o+3]) % 1e6;
    return { code: String(n).padStart(6,"0"), left: 30 - Math.floor(Date.now()/1000) % 30 };
  }
  function startTotp(){
    const tick = async () => { try { const r = await totp(ui.bh.secret2fa); const c=$("#totpCode"), s=$("#totpSec"); if(c) c.textContent = r.code.slice(0,3)+" "+r.code.slice(3); if(s) s.textContent = r.left; } catch(e){} };
    tick(); totpTimer = setInterval(tick, 1000);
  }
  async function copy(text){
    try { await navigator.clipboard.writeText(text); toast("Đã sao chép."); }
    catch(e){ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("Đã sao chép."); }catch(_){} ta.remove(); }
  }

  /* ---------- hành động ---------- */
  async function run(key, fn){ if (ui.busy) return; ui.busy = key; render(); try { await fn(); } catch(e){ toast(e.message); } finally { ui.busy = null; render(); } }
  const toTop = () => window.scrollTo({ top: 0, behavior: "smooth" });

  document.addEventListener("submit", e => { if (e.target.id === "lookupForm"){ e.preventDefault(); ui.typed = $("#email").value; lookup($("#email").value); } });
  document.addEventListener("input", e => { if (e.target.id === "zalo") ui.zalo = e.target.value; });

  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const a = b.dataset.act;

    if (a === "change"){ V = null; R = null; ui = { typed: email }; email = ""; lookErr = ""; render(); try { history.replaceState(null, "", location.pathname + (DEBUG ? "?debug=1" : "")); } catch(_){} return; }
    if (a === "next"){ ui.step = (ui.step||0) + 1; render(); toTop(); return; }
    if (a === "back"){ ui.step = Math.max(0, (ui.step||0) - 1); render(); toTop(); return; }
    if (a === "problem"){ ui.mode = "problem"; render(); toTop(); return; }
    if (a === "stillActive"){ ui.mode = "problem"; ui.reason = "Nhóm cũ vẫn hoạt động"; render(); toTop(); return; }
    if (a === "cancelProblem"){ ui.mode = null; render(); return; }
    if (a === "reason"){ ui.reason = b.dataset.v; render(); return; }
    if (a === "openReport"){ ui.report = true; render(); toTop(); return; }
    if (a === "closeReport"){ ui.report = false; render(); return; }
    if (a === "sym"){ ui.sym = b.dataset.v; render(); return; }
    if (a === "reportAgain"){ V = { ...V, kind:"ok" }; ui = { report:true }; render(); toTop(); return; }

    if (a === "joined") return run(a, async () => {
      const r = await api("submitRejoin", { email, type:"da_vao" });
      if (!r.success) throw new Error(r.message || "Không gửi được.");
      toast("Cảm ơn bạn!"); await lookup(email, true);
    });

    if (a === "sendNF") return run(a, async () => {
      const r = await api("submitRejoin", { email, type:"moi_lai", reason: ui.reason || "Không thấy lời mời", zalo: digits(ui.zalo) });
      if (!r.success) throw new Error(r.message || "Không gửi được.");
      ui.mode = null; toast("Đã gửi yêu cầu mời lại."); await lookup(email, true); toTop();
    });

    if (a === "report") return run(a, async () => {
      ui.reportErr = null;
      const act = ui.sym;
      const r = await api("submitReport", { email, message:"[fixytb] " + (act === "Đang hoạt động" ? "Mất Premium, nhóm vẫn hiện bình thường" : "Nhóm báo không hoạt động"), submitted_by: SOURCE, zalo_phone: digits(ui.zalo), activity_status: act });
      if (!r.success){ ui.reportErr = r.message || "Không gửi được báo lỗi."; return; }
      toast(r.is_duplicate ? "Báo lỗi đã được ghi nhận trước đó." : "Đã gửi báo lỗi."); await lookup(email, true); toTop();
    });

    if (a === "panel"){
      ui.panel = ui.panel === b.dataset.p ? null : b.dataset.p; render();
      if (ui.panel === "mp" && ui.mpExisting === undefined){
        try { const r = await api("checkMailPhuStatus", { primaryEmail: email }); ui.mpExisting = r && r.has_existing ? r : null; } catch(_){ ui.mpExisting = null; }
        render();
      }
      return;
    }

    if (a === "getBH") return run(a, async () => {
      ui.bhErr = null;
      const r = await api("assignWarrantyAccount", { customerEmail: email, ctvName: SOURCE });
      if (!r.success){ ui.bhErr = r.message || "Không cấp được tài khoản tạm."; return; }
      ui.bh = r;
    });

    if (a === "copyBH"){
      const w = ui.bh; let code = ""; try { if (w.secret2fa) code = (await totp(w.secret2fa)).code; } catch(_){}
      copy(["Email: "+w.email, "Mật khẩu: "+w.pass, w.mkp ? "Mail khôi phục: "+w.mkp : "", w.secret2fa ? "Mã 2FA (secret): "+w.secret2fa : "", code ? "Mã hiện tại: "+code : "", "Tài khoản tạm, KHÔNG đổi mật khẩu hay bất kỳ thông tin nào."].filter(Boolean).join("\n"));
      return;
    }

    if (a === "sendMP"){
      const mp = (($("#mpEmail")||{}).value||"").trim();
      if (!isEmail(mp)){ ui.mpErr = "Email chưa đúng. Ví dụ: emailkhac@gmail.com"; render(); return; }
      if (mp.toLowerCase() === email){ ui.mpErr = "Email này phải khác email hiện tại."; render(); return; }
      return run(a, async () => {
        ui.mpErr = null;
        const r = await api("submitMailPhuRequest", { primaryEmail: email, mailPhu: mp });
        if (!r.success){ ui.mpErr = r.message || "Không gửi được yêu cầu."; return; }
        ui.mpDone = r.message; ui.mpExisting = { mail_phu: r.mail_phu, status: "Mới" };
      });
    }
  });

  // Tự kiểm tra lại khi khách đang chờ
  setInterval(() => {
    if (document.hidden || !email || !V || ui.busy || ui.mode || ui.panel || ui.report) return;
    if (V.kind === "pending" || V.kind === "reinvite") lookup(email, true);
  }, 60000);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && email && V && (V.kind === "pending" || V.kind === "reinvite") && !ui.busy && !ui.panel) lookup(email, true);
  });

  render();
  const q = params.get("email");
  if (q){ ui.typed = q; render(); lookup(q); }
})();
</script>
</body>
</html>
