<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hôm nay · DNC</title>
<meta name="theme-color" content="#F2F2F7">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23007AFF'/%3E%3Ccircle cx='32' cy='38' r='13' fill='%23ffffff'/%3E%3Crect x='10' y='44' width='44' height='6' rx='3' fill='%23007AFF'/%3E%3C/svg%3E">
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
<style>
  :root{--bg:#F2F2F7;--card:#fff;--ink:#1C1C1E;--mute:#8A8A8E;--line:rgba(60,60,67,.14);--chip:#F2F2F7;
    --acc:#007AFF;--acc-soft:rgba(0,122,255,.12);--bad:#FF3B30;--bad-soft:rgba(255,59,48,.12);--warn:#C67A00;--warn-soft:rgba(255,149,0,.14);--ok:#248A3D;--ok-soft:rgba(52,199,89,.14);
    --s-gap:#FF3B30;--s-nay:#FF9500;--s-tuan:#8A8A8E;--s-done:#34C759}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1C1C1E;--ink:#F2F2F7;--mute:#98989F;--line:rgba(84,84,88,.45);--chip:#2C2C2E;
    --acc:#0A84FF;--acc-soft:rgba(10,132,255,.2);--bad:#FF453A;--bad-soft:rgba(255,69,58,.18);--warn:#FF9F0A;--warn-soft:rgba(255,159,10,.18);--ok:#30D158;--ok-soft:rgba(48,209,88,.18);
    --s-gap:#FF453A;--s-nay:#FF9F0A;--s-tuan:#98989F;--s-done:#30D158}}
  /* Nhúng trong Desk: dùng màu Desk, bỏ nền/khoảng trống ngoài */
  :root.embed:not(#x){--bg:transparent}
  /* Nhúng trong Desk bản navy */
  :root.navy:not(#x){--card:#121A2E;--ink:#E6ECF8;--mute:#A9B4CE;--line:#22304F;--chip:#1A2747;
    --acc:#4FD1C5;--acc-soft:rgba(79,209,197,.14);--bad:#FF7A7A;--bad-soft:rgba(255,122,122,.14);--warn:#F2B544;--warn-soft:rgba(242,181,68,.15);--ok:#5BD38A;--ok-soft:rgba(91,211,138,.15);
    --s-gap:#FF7A7A;--s-nay:#F2B544;--s-tuan:#8D9AB8;--s-done:#5BD38A;color-scheme:dark}
  html.navy body{font-family:"Be Vietnam Pro",system-ui,sans-serif}
  html.navy .card{border:1px solid var(--line)}
  html.navy nav:not(#x){background:#0E1528;border:1px solid var(--line);-webkit-backdrop-filter:none;backdrop-filter:none}
  html.navy nav button.on:not(#x){background:#16223F;box-shadow:inset 0 0 0 1px #2F4A7A}
  html.navy .pri,html.navy .chip.on{background:#13302F;color:#8FE6DD;box-shadow:inset 0 0 0 1px #4FD1C5}
  html.navy button,html.navy .btn{color:#8FE6DD}
  html.navy .login input{background:#0B1020}
  html.embed .wrap{padding:12px 0 24px;max-width:none} html.embed nav{top:0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
  [x-cloak]{display:none!important}
  .wrap{max-width:760px;margin:0 auto;padding:14px 16px 80px}
  header{display:flex;align-items:flex-end;gap:10px;margin:6px 0 12px}
  h1{font-size:28px;margin:0;letter-spacing:-.022em;line-height:1.1;font-weight:700}
  .sub{color:var(--mute);font-size:13px}
  .big{font-size:13px;color:var(--mute)} .big b{font-size:28px;color:var(--ink);letter-spacing:-.022em;line-height:1;font-weight:700}
  button,.btn{font:inherit;font-size:13px;font-weight:500;border:0;background:var(--chip);color:var(--acc);border-radius:99px;padding:6px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
  button:hover,.btn:hover{filter:brightness(.97)}
  button:active,.btn:active{transform:scale(.97);transition:transform .1s ease-out}
  @media (prefers-reduced-motion:reduce){button:active,.btn:active{transform:none}}
  button:disabled{opacity:.5;cursor:default}
  .pri{background:var(--acc);border-color:var(--acc);color:#fff}
  .task.done input{accent-color:var(--s-done)}
  .ghost{border-color:transparent;background:transparent;color:var(--mute)}
  .src{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px}
  .dot{font-size:12px;padding:2px 2px;color:var(--mute)}
  .dot.ok::before{content:"● ";color:var(--ok)} .dot.err::before{content:"● ";color:var(--bad)} .dot.ld::before{content:"○ ";color:var(--warn)}
  nav{display:flex;gap:2px;background:color-mix(in srgb,var(--chip) 80%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);padding:2px;border-radius:10px;margin-bottom:14px;position:sticky;top:6px;z-index:5}
  nav button{flex:1;border:0;background:transparent;padding:7px 6px;border-radius:8px;font-weight:600;color:var(--ink);justify-content:center}
  nav button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button.on{background:#636366}}
  .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:var(--bad);color:#fff;font-size:11px;line-height:18px;text-align:center}
  .card{background:var(--card);border:0;border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .task{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:start}
  .task.done{opacity:.45} .task.done .tt{text-decoration:line-through}
  .task input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--acc)}
  .tt{font-weight:600}
  .tag,.p{white-space:nowrap}
  .tag{font-size:12px;font-weight:600;margin-right:8px}
  .tag::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:currentColor;margin-right:5px;vertical-align:1px}
  .t-gap{color:var(--s-gap)} .t-nay{color:var(--s-nay)} .t-tuan{color:var(--s-tuan)}
  .p{font-size:12px;font-weight:500;color:var(--mute);margin-right:6px}
  .det{font-size:13px;color:var(--mute);margin-top:2px}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
  .pill{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--chip);font-variant-numeric:tabular-nums}
  .pill.bad{background:var(--bad-soft);color:var(--bad)}
  .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
  .chips{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
  .chip{font-size:13px;padding:5px 12px;border-radius:99px;border:0;background:var(--card);cursor:pointer;color:var(--ink)}
  .chip.on{background:var(--acc);color:#fff}
  .grp{display:flex;align-items:center;gap:8px;margin:2px 0 8px}
  .grp h3{font-size:15px;margin:0;flex:1}
  .row{display:grid;grid-template-columns:20px 1fr auto;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:0}
  .row.done{opacity:.45}
  .em{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-all;cursor:copy}
  .meta{font-size:12px;color:var(--mute)}
  .dl{font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px;white-space:nowrap}
  .dl{padding:0!important} .dl.late{color:var(--s-gap)} .dl.today{color:var(--s-nay)} .dl.soon{color:var(--mute)}
  .prod{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  .prod .card{margin:0}
  .stat{display:flex;gap:14px;margin:8px 0 10px}
  .stat div{font-size:12px;color:var(--mute)} .stat b{display:block;font-size:20px;color:var(--ink)}
  .stat .bad b{color:var(--bad)} .stat .soon b{color:var(--warn)}
  .empty{color:var(--mute);font-size:14px;padding:14px 0;text-align:center}
  .err{background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:10px}
  .login{max-width:360px;margin:12vh auto;text-align:center}
  .login input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);margin:12px 0}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:20}
  .foot{font-size:12px;color:var(--mute);text-align:center;margin-top:18px}
  @media (max-width:520px){
    .prod{grid-template-columns:1fr}
    .task{grid-template-columns:22px 1fr}
    .task .acts{grid-column:2;justify-content:flex-start;margin-top:4px}
    .row{grid-template-columns:20px 1fr}
    .row .acts{grid-column:2;justify-content:flex-start}
  }
</style>
</head>
<body>
<div class="wrap" x-data="app()" x-init="init()" x-cloak>

  <!-- Đăng nhập: dùng chung mật khẩu Thay Fam -->
  <template x-if="!pass">
    <div class="login">
      <h1>Hôm nay</h1>
      <div class="sub">Dùng mật khẩu trang Thay Fam</div>
      <input type="password" x-model="passInput" @keydown.enter="login()" placeholder="Mật khẩu">
      <button class="pri" @click="login()">Vào</button>
    </div>
  </template>

  <template x-if="pass">
  <div>
    <header>
      <div style="flex:1">
        <h1 x-text="dayName()"></h1>
        <div class="sub" x-text="loading ? 'Đang gom dữ liệu…' : (stamp ? 'Cập nhật ' + stamp : '')"></div>
      </div>
      <div class="big" style="text-align:right"><b x-text="tasksLeft()"></b><br>việc sáng nay</div>
    </header>

    <div class="src">
      <template x-for="s in srcList()" :key="s.k">
        <span class="dot" :class="s.st" :title="s.err || ''" x-text="s.label + (s.st==='err' ? ' lỗi' : '')"></span>
      </template>
      <button class="ghost" style="margin-left:auto;padding:2px 6px" @click="loadAll(true)" :disabled="loading" x-text="loading ? 'Đang tải…' : '↻ Tải lại'"></button>
    </div>

    <div class="err" x-show="authErr" x-text="authErr"></div>

    <nav>
      <button :class="tab==='todo' && 'on'" @click="tab='todo'">Sáng nay <span class="n" x-show="tasksLeft()" x-text="tasksLeft()"></span></button>
      <button :class="tab==='remind' && 'on'" @click="tab='remind'">Nhắc khách <span class="n" x-show="remindLeft()" x-text="remindLeft()"></span></button>
      <button :class="tab==='prod' && 'on'" @click="tab='prod'">Sản phẩm</button>
    </nav>

    <!-- ===== TAB 1: SÁNG NAY ===== -->
    <section x-show="tab==='todo'">
      <template x-if="!tasks().length && !loading"><div class="card empty">Không còn việc gì gấp. Sáng nay rảnh 🌤</div></template>
      <template x-for="t in tasks()" :key="t.id">
        <div class="card task" :class="isDone(t.id) && 'done'">
          <input type="checkbox" :checked="isDone(t.id)" @change="toggleDone(t.id)" title="Xong">
          <div style="min-width:0">
            <div class="tt"><span class="tag" :class="'t-' + t.lv" x-text="LV[t.lv]"></span><template x-for="p in t.prods" :key="p"><span class="p" :class="'p-' + p" x-text="PN[p]"></span></template><span x-text="t.title"></span></div>
            <div class="det" x-show="t.det" x-text="t.det"></div>
            <div class="pills" x-show="t.pills && t.pills.length">
              <template x-for="(x, i) in (t.pills || []).slice(0, 14)" :key="i"><span class="pill" :class="x.bad && 'bad'" x-text="x.t"></span></template>
              <span class="pill" x-show="(t.pills || []).length > 14" x-text="'+' + ((t.pills || []).length - 14)"></span>
            </div>
          </div>
          <div class="acts">
            <button x-show="t.copy" @click="copy(t.copy(), t.copyMsg || 'Đã copy')" x-text="t.copyLabel || 'Copy'"></button>
            <button x-show="t.goRemind" @click="goRemind(t.goRemind)">Xem</button>
            <a class="btn" x-show="t.href" :href="t.href" target="_blank" rel="noopener" x-text="t.hrefLabel || 'Mở'"></a>
          </div>
        </div>
      </template>
    </section>

    <!-- ===== TAB 2: NHẮC KHÁCH ===== -->
    <section x-show="tab==='remind'">
      <div class="chips">
        <button class="chip" :class="rWin==='am' && 'on'" @click="rWin='am'">Sáng nay (quá ≤7n → còn ≤3n)</button>
        <button class="chip" :class="rWin==='wk' && 'on'" @click="rWin='wk'">7 ngày tới</button>
        <label class="chip" style="cursor:pointer"><input type="checkbox" x-model="hideDone" style="vertical-align:-2px"> Ẩn đã nhắc</label>
      </div>
      <div class="chips">
        <button class="chip" :class="!rProd && 'on'" @click="rProd=''">Tất cả</button>
        <template x-for="p in PRODS" :key="p"><button class="chip" :class="rProd===p && 'on'" @click="rProd=p" x-text="PN[p] + ' ' + remindPool().filter(x => x.prod===p).length"></button></template>
      </div>
      <template x-if="!remindGroups().length"><div class="card empty">Không có khách nào cần nhắc trong khoảng này.</div></template>
      <template x-for="g in remindGroups()" :key="g.ctv">
        <div class="card">
          <div class="grp">
            <h3 x-text="g.ctv + ' · ' + g.items.filter(x => !x.done).length + '/' + g.items.length"></h3>
            <button x-show="g.ctv !== 'Dnc'" @click="copy(ctvBlock(g), 'Đã copy danh sách gửi ' + g.ctv)">Copy gửi <span x-text="g.ctv"></span></button>
            <button x-show="g.ctv !== 'Dnc' && g.items.some(x => !x.done)" @click="markGroup(g)">Đã gửi hết</button>
          </div>
          <template x-for="c in g.items" :key="c.key">
            <div class="row" :class="c.done && 'done'">
              <input type="checkbox" :checked="c.done" :disabled="busyKey===c.key" @change="setReminded(c, $event.target.checked)" title="Đã nhắc">
              <div style="min-width:0">
                <div><span class="p" :class="'p-' + c.prod" x-text="PN[c.prod]"></span><span class="em" @click="copy(c.email || c.name, 'Đã copy')" x-text="c.email || c.name"></span></div>
                <div class="meta">
                  <span class="dl" :class="c.days < 0 ? 'late' : (c.days === 0 ? 'today' : 'soon')" x-text="c.days < 0 ? 'hết ' + (-c.days) + 'n' : (c.days === 0 ? 'hôm nay' : 'còn ' + c.days + 'n')"></span>
                  <span x-text="' HSD ' + c.hsd + (c.where ? ' · ' + c.where : '') + (c.name && c.email ? ' · ' + c.name : '')"></span>
                  <span x-show="c.done && c.doneAt" x-text="' · nhắc ' + c.doneAt"></span>
                </div>
              </div>
              <div class="acts">
                <button @click="copy(msgFor(c), 'Đã copy tin nhắn')">Copy tin</button>
                <a class="btn" x-show="c.zalo" :href="'https://zalo.me/' + c.zalo" target="_blank" rel="noopener" @click="copy(msgFor(c), 'Đã copy tin — dán vào Zalo')">Zalo</a>
              </div>
            </div>
          </template>
        </div>
      </template>
      <div class="foot">YouTube: tick "đã nhắc" ghi chung với Thay Fam. Sản phẩm khác: ghi trên máy này.</div>
    </section>

    <!-- ===== TAB 3: SẢN PHẨM ===== -->
    <section x-show="tab==='prod'">
      <div class="prod">
        <template x-for="p in PRODS" :key="p">
          <div class="card">
            <div class="grp"><h3><span class="p" :class="'p-' + p" x-text="PN[p]"></span> <span x-text="PFULL[p]"></span></h3>
              <span class="dot" :class="src[p].st" x-text="src[p].st==='ok' ? 'ok' : (src[p].st==='err' ? 'lỗi' : '…')"></span></div>
            <div class="stat">
              <div><b x-text="pstat(p).active"></b>đang dùng</div>
              <div class="soon"><b x-text="pstat(p).soon"></b>hết ≤7n</div>
              <div class="bad"><b x-text="pstat(p).late"></b>quá hạn ≤7n</div>
            </div>
            <div class="det" x-show="pextra(p)" x-text="pextra(p)" style="margin-bottom:8px"></div>
            <div class="det" x-show="src[p].st==='err'" style="color:var(--bad);margin-bottom:8px" x-text="src[p].err"></div>
            <div class="acts" style="justify-content:flex-start">
              <template x-for="l in LINKS[p]" :key="l[1]"><a class="btn" :href="l[1]" target="_blank" rel="noopener" x-text="l[0]"></a></template>
            </div>
          </div>
        </template>
      </div>
      <div class="foot">Trang này chỉ đọc + đánh dấu "đã nhắc". Mọi sửa dữ liệu vẫn làm ở trang gốc.<br>
        <a href="#" @click.prevent="logout()" style="color:var(--mute)">Thoát</a></div>
    </section>

    <div class="toast" x-show="toast" x-transition x-text="toast"></div>
  </div>
  </template>
</div>

<script>
const EMBED = /[?&]embed=1/.test(location.search) && window.parent !== window;
if (EMBED) document.documentElement.classList.add('embed');
if (EMBED && /[?&]theme=navy/.test(location.search)) {
  document.documentElement.classList.add('navy');
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap'; document.head.appendChild(l);
}
/* ===== Nguồn dữ liệu (dùng lại API các trang sẵn có, không thêm backend) ===== */
const TF_API  = 'https://script.google.com/macros/s/AKfycby2lwu9UYCAsbYMZtXnGTLMWlRE2aaO_FaBG312jiBEEjZdf5NotZsJ06I39TgG3Zjg/exec'; // Thay Fam + GG1
const MOD_API = 'https://script.google.com/macros/s/AKfycbySu9evgLmqMVKSc-Z1cKUIzcfqJH9_pEFDdzOERQ1yP8uLy1hvLqJgNRkOlwDJEOba/exec'; // Netflix / ChatGPT (admin)
const FIN_SHEET = '1-EgeNWztGQsY2rmLYp00yKDjgHR5WYoqzzhAkSnvJjc'; // Tài chính Goshop (CapCut)
const SB_URL = 'https://pxkwjxmrlucpoehpjbja.supabase.co', SB_KEY = 'sb_publishable_GPVgOD3U3O_9yytoRnXv6w_jiiBibnH', SB_LS = 'dnc_desk_auth'; // Desk
const YT_PRICES = [['1 tháng', '30k'], ['3 tháng', '80k'], ['6 tháng', '150k'], ['12 tháng', '280k']];
const ZL = '0398057191';

const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} };
const pad = n => String(n).padStart(2, '0');
const dmy = d => pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear();
function parseDate(s) {
  if (!s) return null; s = String(s).trim();
  let p = s.split('/'); if (p.length === 3) { let y = +p[2]; if (y < 100) y += 2000; const d = new Date(y, p[1] - 1, +p[0]); return isNaN(d) ? null : d; }
  p = s.split('-'); if (p.length === 3 && p[0].length === 4) return new Date(+p[0], p[1] - 1, +String(p[2]).slice(0, 2));
  const d = new Date(s); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function addMonths(d, m) { const x = new Date(d); const day = x.getDate(); x.setDate(1); x.setMonth(x.getMonth() + (+m || 0)); x.setDate(Math.min(day, new Date(x.getFullYear(), x.getMonth() + 1, 0).getDate())); return x; }
function daysTo(d) { if (!d) return null; const t = new Date(); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0); return Math.round((x - t) / 864e5); }
const EMAIL = /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/;
function normCtv(c) {
  const s = String(c || '').trim(); const k = s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd');
  if (!k || k === 'admin' || k === 'dnc' || k === '(trong)') return 'Dnc';
  if (k.startsWith('tuan')) return 'Tuấn';
  if (k.startsWith('vuong')) return 'Vương';
  if (k === 'loc') return 'Lộc';
  return s;
}
function parseCSV(text) {
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cur); cur = ''; }
    else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
    else if (c !== '\r') cur += c;
  }
  if (cur || row.length) { row.push(cur); rows.push(row); }
  return rows;
}
async function getJSON(url, opt, ms = 45000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { ...(opt || {}), signal: ctl.signal }); return await r.json(); }
  catch (e) { throw new Error(e.name === 'AbortError' ? 'quá thời gian' : e.message); }
  finally { clearTimeout(t); }
}

      }
      const rank = { gap: 0, nay: 1, tuan: 2 };
      return T.sort((a, b) => (this.isDone(a.id) - this.isDone(b.id)) || rank[a.lv] - rank[b.lv]);
    },
    // báo cho Desk: chiều cao khung + số việc (badge trên tab)
    postUp() { if (!EMBED) return; requestAnimationFrame(() => { try { window.parent.postMessage({ src: 'homnay', h: document.querySelector('.wrap').offsetHeight + 4, n: this.pass ? this.tasksLeft() : null, gap: this.tasks().some(t => t.lv === 'gap' && !this.isDone(t.id)) }, location.origin); } catch (e) {} }); },
    tasksLeft() { return this.tasks().filter(t => !this.isDone(t.id) && t.lv !== 'tuan').length; },
    isDone(id) { return !!this.done[id]; },
    toggleDone(id) { const d = { ...this.done }; d[id] ? delete d[id] : (d[id] = 1); this.done = d; lsSet('homnay_done_' + this.todayKey(), JSON.stringify(d)); this.postUp(); },

    // ---- Thẻ sản phẩm ----
    pool(p) { return p === 'ytb' ? this.ytbRemind() : p === 'gg1' ? ((this.gg && this.gg.rows) || []) : this[p]; },
    pstat(p) {
      const l = this.pool(p) || [];
      return { active: p === 'ytb' ? '—' : l.filter(c => c.days >= 0).length, soon: l.filter(c => c.days >= 0 && c.days <= 7).length, late: l.filter(c => c.days < 0 && c.days >= -7).length };
    },
    pextra(p) {
      if (p === 'ytb' && this.ytb) return this.ytb.reported.length + ' fam báo lỗi · ' + this.ytb.due.length + ' fam đến hạn 2 ngày · ' + (this.wk ? (this.wk.frReady || 0) + ' FR sẵn' : this.ytb.frs + ' FR');
      if (p === 'gg1' && this.gg) return this.gg.fams + ' fam hoạt động · ' + this.gg.wait.length + ' khách chờ vào';
      return '';
    },

    async copy(t, m) { try { await navigator.clipboard.writeText(t); } catch (e) { const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); document.execCommand('copy'); a.remove(); } this.flash(m || 'Đã copy'); },
    flash(m) { this.toast = m; clearTimeout(this._t); this._t = setTimeout(() => this.toast = '', 2200); },
  };
}
</script>
