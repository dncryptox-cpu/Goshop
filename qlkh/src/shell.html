<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Go Shop OS · Quản lý khách hàng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://docs.google.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v={{VERSION}}">
    <!-- Thư viện ghim phiên bản cố định (bản cũ dùng @latest / 3.x.x nên có thể vỡ bất cứ lúc nào) -->
    <script src="https://cdn.jsdelivr.net/npm/lucide@1.58.0/dist/umd/lucide.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/otpauth@9.5.2/dist/otpauth.umd.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"></script>
    <script defer src="js/app.js?v={{VERSION}}"></script>
{{MODULE_SCRIPTS}}
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body x-data="app()" x-init="initApp()" class="antialiased bg-[#f4f7fe] text-gray-800">

    <!-- Màn hình chờ trước khi Alpine chạy -->
    <div id="qlkh-boot" class="fixed inset-0 flex items-center justify-center bg-[#f4f7fe] z-[200]" x-show="false">
        <div class="w-8 h-8 border-[3px] border-indigo-200 border-t-indigo-600 rounded-full animate-spin"></div>
    </div>

    <!-- Đăng nhập -->
    <template x-if="!isLoggedIn">
        <div class="min-h-screen flex items-center justify-center p-4 bg-[#0B0F19]"
             style="background: radial-gradient(circle at top right, rgba(24,144,255,.12), transparent 45%), radial-gradient(circle at bottom left, rgba(99,102,241,.08), transparent 40%), #0B0F19;">
            <div class="w-full max-w-sm bg-gray-900/70 border border-white/10 backdrop-blur-xl rounded-2xl p-8 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-[3px] bg-gradient-to-r from-primary to-indigo-400"></div>
                <div class="text-center mb-8">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-primary to-indigo-500 flex items-center justify-center text-white mx-auto mb-4 shadow-lg font-black text-lg">G</div>
                    <h1 class="text-xl font-extrabold text-white">Go Shop · Quản lý khách hàng</h1>
                    <p class="text-xs text-gray-400 mt-2">Đăng nhập bằng tài khoản trong tab <b>Login</b> của sheet.</p>
                </div>
                <form @submit.prevent="login()" class="space-y-4">
                    <div>
                        <label for="qlkh-user" class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Tên đăng nhập</label>
                        <input id="qlkh-user" x-model="loginForm.username" type="text" required autocomplete="username" autocapitalize="off"
                               class="w-full bg-gray-950/60 border border-white/10 rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label for="qlkh-pass" class="block text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Mật khẩu</label>
                        <input id="qlkh-pass" x-model="loginForm.password" type="password" required autocomplete="current-password"
                               class="w-full bg-gray-950/60 border border-white/10 rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-primary">
                    </div>
                    <p x-show="loginError" x-text="loginError" class="text-xs font-semibold text-red-300 bg-red-500/10 border border-red-500/20 rounded-lg p-3"></p>
                    <button type="submit" :disabled="isLoggingIn"
                            class="w-full bg-primary hover:bg-blue-600 disabled:opacity-60 text-white py-3 rounded-xl text-sm font-bold transition-all flex items-center justify-center gap-2">
                        <span x-show="isLoggingIn" class="w-4 h-4 border-2 border-white/40 border-t-white rounded-full animate-spin"></span>
                        <span x-text="isLoggingIn ? 'Đang kiểm tra…' : 'Đăng nhập'"></span>
                    </button>
                </form>
            </div>
        </div>
    </template>

    <!-- Ứng dụng -->
    <template x-if="isLoggedIn">
    <div class="flex h-screen overflow-hidden">
        <div x-show="sidebarOpen" @click="sidebarOpen = false" x-cloak class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm z-40 lg:hidden"></div>

        <aside :class="sidebarOpen ? 'translate-x-0 w-64' : '-translate-x-full lg:translate-x-0 lg:w-[72px]'"
               class="fixed inset-y-0 left-0 lg:relative bg-white border-r border-gray-200 transition-all duration-200 flex flex-col z-50 shrink-0">
            <div class="h-16 flex items-center px-5 border-b border-gray-100 justify-between shrink-0">
                <div class="flex items-center gap-3 min-w-0">
                    <div class="w-8 h-8 bg-primary rounded-lg flex items-center justify-center text-white font-bold shrink-0">G</div>
                    <span x-show="sidebarOpen" class="font-bold text-base tracking-tight truncate">Go Shop OS</span>
                </div>
                <button @click="sidebarOpen = false" class="lg:hidden p-1 text-gray-400 hover:text-gray-600 rounded-lg" aria-label="Đóng menu">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>

            <nav class="flex-1 py-4 overflow-y-auto">
                <template x-for="group in [{ title: 'Điều hướng', items: menuItems }, { title: 'Quản lý', items: managementItems }]" :key="group.title">
                    <div class="px-3 mb-5">
                        <p x-show="sidebarOpen" class="text-[10px] font-bold text-gray-400 uppercase tracking-widest px-3 mb-2" x-text="group.title"></p>
                        <template x-for="item in group.items" :key="item.id">
                            <a :href="item.href || ('#' + item.id)" x-show="isModuleAllowed(item.id)"
                               @click="if (item.href) return; $event.preventDefault(); activeModule = item.id;"
                               :title="item.name"
                               :class="activeModule === item.id ? 'sidebar-item-active' : 'text-gray-500 hover:bg-gray-50 hover:text-gray-800'"
                               class="flex items-center gap-3 px-3 py-2.5 rounded-lg transition-colors mb-0.5">
                                <span class="w-5 h-5 shrink-0 flex items-center justify-center"><i :data-lucide="item.icon" class="w-5 h-5"></i></span>
                                <span x-show="sidebarOpen" class="font-medium text-sm truncate" x-text="item.name"></span>
                                <i x-show="sidebarOpen && item.href" data-lucide="arrow-up-right" class="w-3.5 h-3.5 ml-auto text-gray-300"></i>
                            </a>
                        </template>
                    </div>
                </template>
            </nav>

            <div class="p-3 border-t border-gray-100 space-y-1 shrink-0">
                <div x-show="sidebarOpen" class="px-3 py-2 text-xs text-gray-500 truncate">
                    <span class="font-bold text-gray-800" x-text="currentUsername"></span>
                    <span class="ml-1 px-1.5 py-0.5 rounded text-[10px] font-bold uppercase"
                          :class="currentUserRole === 'admin' ? 'bg-indigo-50 text-indigo-600' : 'bg-gray-100 text-gray-500'"
                          x-text="currentUserRole === 'admin' ? 'Admin' : 'Nhân viên'"></span>
                </div>
                <button @click="logout()" class="w-full flex items-center gap-3 px-3 py-2.5 text-red-500 hover:bg-red-50 rounded-lg text-sm font-semibold" title="Đăng xuất">
                    <i data-lucide="log-out" class="w-5 h-5 shrink-0"></i><span x-show="sidebarOpen">Đăng xuất</span>
                </button>
                <button @click="sidebarOpen = !sidebarOpen" class="hidden lg:flex w-full items-center justify-center p-2 text-gray-400 hover:bg-gray-50 rounded-lg" aria-label="Thu gọn menu">
                    <i data-lucide="panel-left" class="w-5 h-5"></i>
                </button>
            </div>
        </aside>

        <div class="flex-1 flex flex-col h-screen min-w-0">
            <header class="h-16 bg-white border-b border-gray-200 flex items-center gap-3 px-4 md:px-6 z-30 shrink-0">
                <button @click="sidebarOpen = !sidebarOpen" class="lg:hidden p-2 -ml-1 text-gray-500 hover:bg-gray-100 rounded-lg" aria-label="Mở menu">
                    <i data-lucide="menu" class="w-5 h-5"></i>
                </button>
                <h2 class="hidden md:block text-sm font-bold text-gray-900 whitespace-nowrap" x-text="moduleTitle"></h2>

                <div class="relative flex-1 max-w-md md:ml-4" @click.outside="showSearchResults = false">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"></i>
                    <input x-model.debounce.250ms="searchQuery" @focus="onSearchFocus()" @keydown.escape="showSearchResults = false; $el.blur()"
                           x-ref="globalSearch" type="search" placeholder="Tìm email khách… (Ctrl + K)"
                           @keydown.window.ctrl.k.prevent="$refs.globalSearch.focus()" @keydown.window.meta.k.prevent="$refs.globalSearch.focus()"
                           class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2 pl-9 pr-3 text-sm focus:outline-none focus:border-primary focus:bg-white">
                    <div x-show="showSearchResults && searchQuery.trim().length >= 2" x-cloak
                         class="absolute top-full mt-2 w-full md:w-[480px] bg-white rounded-xl shadow-2xl border border-gray-100 z-50 max-h-96 overflow-y-auto">
                        <div x-show="isFetchingDataGoc && !searchResults.length" class="p-4 text-sm text-gray-400 text-center">Đang tải dữ liệu…</div>
                        <div x-show="!isFetchingDataGoc && !searchResults.length" class="p-4 text-sm text-gray-500 text-center">Không tìm thấy khách</div>
                        <template x-for="c in searchResults" :key="c.id || c.email">
                            <button type="button" @click="openSearchResult(c)" class="w-full text-left px-4 py-3 hover:bg-gray-50 border-b border-gray-50 last:border-0">
                                <div class="flex items-center justify-between gap-2">
                                    <span class="text-sm font-bold text-gray-900 truncate" x-text="c.email"></span>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full font-bold shrink-0"
                                          :class="c.daysLeft === null ? 'bg-gray-100 text-gray-500' : (c.daysLeft < 0 ? 'bg-red-50 text-red-600' : (c.daysLeft <= 15 ? 'bg-amber-50 text-amber-700' : 'bg-emerald-50 text-emerald-700'))"
                                          x-text="c.daysLeft === null ? '—' : (c.daysLeft < 0 ? 'Quá hạn' : 'Còn ' + c.daysLeft + ' ngày')"></span>
                                </div>
                                <div class="flex gap-3 text-xs text-gray-500 mt-1">
                                    <span x-text="c.product || ''"></span>
                                    <span x-text="'CTV: ' + (c.staff || '—')"></span>
                                    <span x-text="'HSD: ' + (c.expiryDate || '—')"></span>
                                </div>
                            </button>
                        </template>
                    </div>
                </div>

                <div class="flex items-center gap-1.5 ml-auto">
                    <button x-show="currentUserRole === 'admin'" @click="toggleMaintenanceMode()"
                            :class="isMaintenanceMode ? 'bg-red-500 text-white' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'"
                            class="hidden sm:flex px-3 py-1.5 rounded-lg text-xs font-bold items-center gap-1.5" title="Chế độ bảo trì cổng khách">
                        <i data-lucide="power" class="w-4 h-4"></i>
                        <span x-text="isMaintenanceMode ? 'ĐANG BẢO TRÌ' : 'Bảo trì'"></span>
                    </button>
                    <a href="../" class="hidden xl:flex items-center gap-1.5 text-xs font-bold text-gray-600 hover:text-primary py-1.5 px-3 rounded-lg border border-gray-200">
                        <i data-lucide="external-link" class="w-4 h-4"></i><span>Cổng khách</span>
                    </a>
                    <button @click="refreshCurrentModule()" :disabled="isLoading" class="p-2 text-gray-400 hover:bg-gray-50 hover:text-gray-700 rounded-lg" title="Tải lại dữ liệu trang này">
                        <i data-lucide="refresh-cw" class="w-5 h-5" :class="(isLoading || isLoadingAny) && 'animate-spin'"></i>
                    </button>
                    <div class="relative" x-show="currentUserRole === 'admin'" @click.outside="showNotifications = false">
                        <button @click="showNotifications = !showNotifications" title="Thông báo" class="relative p-2 text-gray-400 hover:bg-gray-50 rounded-lg">
                            <i data-lucide="bell" class="w-5 h-5"></i>
                            <span x-show="notifications.length > 0" class="absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full border border-white"></span>
                        </button>
                        <div x-show="showNotifications" x-cloak class="absolute top-full right-0 mt-2 w-80 bg-white rounded-xl shadow-2xl border border-gray-100 z-50 max-h-96 flex flex-col">
                            <div class="p-3 border-b border-gray-100 flex items-center justify-between">
                                <h3 class="text-xs font-bold text-gray-900 uppercase tracking-widest">Đơn gần đây</h3>
                                <button @click="clearNotifications()" x-show="notifications.length > 0" class="text-[10px] text-gray-500 hover:text-red-500">Xóa tất cả</button>
                            </div>
                            <div class="p-2 overflow-y-auto flex-1">
                                <div x-show="notifications.length === 0" class="text-center py-6 text-gray-400 text-xs">Chưa có thông báo</div>
                                <template x-for="(notif, idx) in notifications" :key="idx">
                                    <button type="button" @click="const mail = getNotifEmail(notif); if (mail) copyToClipboard(mail, 'email');"
                                            class="w-full p-3 hover:bg-gray-50 rounded-lg border-b border-gray-50 last:border-0 text-left" title="Bấm để copy email">
                                        <p class="text-xs text-gray-700 leading-relaxed" x-html="notif.message"></p>
                                        <p class="text-[10px] text-gray-400 mt-1" x-text="getNotifTimeDisplay(notif)"></p>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Thanh trạng thái tải dữ liệu -->
            <div class="h-0.5 bg-transparent relative overflow-hidden shrink-0">
                <div x-show="isLoading || isLoadingAny" class="absolute inset-y-0 w-1/3 bg-primary qlkh-progress"></div>
            </div>

            <main id="qlkh-main" class="flex-1 min-h-0 overflow-y-auto p-4 sm:p-6 lg:p-8">
{{MODULES}}
            </main>
        </div>
    </div>
    </template>

{{MODALS}}

    <!-- Toast -->
    <div class="fixed bottom-6 right-6 z-[150] flex flex-col gap-2 items-end pointer-events-none" aria-live="polite">
        <template x-for="t in toasts" :key="t.id">
            <div x-transition.opacity class="pointer-events-auto max-w-sm px-4 py-3 rounded-xl shadow-2xl text-sm font-medium text-white flex items-start gap-2"
                 :class="t.kind === 'error' ? 'bg-red-600' : (t.kind === 'warn' ? 'bg-amber-600' : 'bg-gray-900')">
                <span x-text="t.message" class="whitespace-pre-line"></span>
            </div>
        </template>
    </div>
</body>
</html>
