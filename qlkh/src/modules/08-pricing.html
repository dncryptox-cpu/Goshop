                <div x-show="activeModule === 'pricing_catalog' && isModuleAllowed('pricing_catalog')" x-cloak>
                    <div class="mb-8 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">Bảng Giá SP Khác</h1>
                            <p class="text-sm text-gray-500 mt-1">Quản lý danh sách sản phẩm và giá bán/giá vốn. Dữ liệu được lưu trên trình duyệt của bạn.</p>
                        </div>
                        <button @click="saveProductCatalog()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-2.5 px-5 rounded-xl transition-all shadow-lg shadow-emerald-500/20 flex items-center justify-center gap-2 shrink-0">
                            <i data-lucide="save" class="w-4 h-4"></i> Lưu Thay Đổi
                        </button>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-3 gap-8">
                        <!-- Add New Form -->
                        <div class="bg-white rounded-xl border border-gray-100 card-shadow p-6 h-fit">
                            <h2 class="font-bold text-gray-900 mb-6 flex items-center gap-2">
                                <i data-lucide="plus-circle" class="w-5 h-5 text-primary"></i>
                                Thêm Sản Phẩm Mới
                            </h2>
                            <form @submit.prevent="addNewProductToCatalog()" class="space-y-5">
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Tên SP (VD: Canva)</label>
                                    <input type="text" x-model="newProduct.product" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary font-medium text-gray-900">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Thời Gian (Tháng)</label>
                                    <input type="number" x-model="newProduct.duration" required min="1" class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary font-medium text-gray-900">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Giá Bán (VNĐ)</label>
                                    <input type="number" x-model="newProduct.price" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary font-medium text-gray-900">
                                </div>
                                <div>
                                    <label class="block text-xs font-bold text-gray-500 uppercase tracking-widest mb-2">Giá Vốn (VNĐ)</label>
                                    <input type="number" x-model="newProduct.cost" required class="w-full bg-gray-50 border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:border-primary font-medium text-gray-900">
                                </div>
                                <button type="submit" class="w-full bg-primary hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-primary/20 flex items-center justify-center gap-2 mt-4">
                                    <i data-lucide="plus" class="w-5 h-5"></i> Thêm Vào Bảng Giá
                                </button>
                            </form>
                        </div>

                        <!-- Catalog Table -->
                        <div class="xl:col-span-2 bg-white rounded-xl border border-gray-100 card-shadow overflow-hidden flex flex-col h-[700px]">
                            <div class="overflow-x-auto overflow-y-auto flex-1">
                                <table class="w-full text-left">
                                    <thead class="bg-gray-50 text-[10px] font-bold text-gray-400 uppercase tracking-widest sticky top-0 z-10 shadow-sm">
                                        <tr>
                                            <th class="px-6 py-4">Sản Phẩm</th>
                                            <th class="px-6 py-4 text-center">Gói (Tháng)</th>
                                            <th class="px-6 py-4 text-right">Giá Bán (đ)</th>
                                            <th class="px-6 py-4 text-right">Giá Vốn (đ)</th>
                                            <th class="px-6 py-4 text-center w-16">Xóa</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-100">
                                        <template x-for="(p, index) in productCatalog" :key="index">
                                            <tr class="hover:bg-gray-50 transition-all group">
                                                <td class="px-6 py-3">
                                                    <input type="text" x-model="p.product" @change="updateProductKey(p)" class="w-full bg-transparent border-b border-transparent hover:border-gray-300 focus:border-primary focus:outline-none text-sm font-bold text-gray-900 transition-colors">
                                                </td>
                                                <td class="px-6 py-3 text-center">
                                                    <input type="number" x-model.number="p.duration" @change="updateProductKey(p)" class="w-16 bg-transparent border-b border-transparent hover:border-gray-300 focus:border-primary focus:outline-none text-sm font-medium text-center mx-auto transition-colors">
                                                </td>
                                                <td class="px-6 py-3 text-right">
                                                    <input type="number" x-model.number="p.price" class="w-24 bg-transparent border-b border-transparent hover:border-blue-300 focus:border-blue-500 focus:outline-none text-sm text-right text-blue-600 font-bold transition-colors ml-auto">
                                                </td>
                                                <td class="px-6 py-3 text-right">
                                                    <input type="number" x-model.number="p.cost" class="w-24 bg-transparent border-b border-transparent hover:border-orange-300 focus:border-orange-500 focus:outline-none text-sm text-right text-orange-600 font-bold transition-colors ml-auto">
                                                </td>
                                                <td class="px-6 py-3 text-center">
                                                    <button @click="productCatalog.splice(index, 1)" class="text-gray-300 hover:text-red-500 hover:bg-red-50 p-2 rounded-lg transition-all mx-auto block opacity-0 group-hover:opacity-100">
                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                    </button>
                                                </td>
                                            </tr>
                                        </template>
                                        <template x-if="productCatalog.length === 0">
                                            <tr>
                                                <td colspan="5" class="px-6 py-12 text-center text-gray-400">
                                                    <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center mx-auto mb-3">
                                                        <i data-lucide="package-open" class="w-6 h-6"></i>
                                                    </div>
                                                    <p class="text-sm font-medium">Bảng giá trống.</p>
                                                </td>
                                            </tr>
                                        </template>
                                    </tbody>
                                </table>
                            </div>
                            <div class="p-4 border-t border-gray-100 bg-gray-50 flex items-center justify-between shrink-0">
                                <p class="text-xs font-medium text-gray-500 flex items-center gap-1">
                                    <i data-lucide="info" class="w-3.5 h-3.5"></i>
                                    Bạn có thể click trực tiếp vào chữ để sửa đổi.
                                </p>
                                <span class="text-xs font-bold text-primary bg-primary-light px-3 py-1 rounded-full" x-text="productCatalog.length + ' sản phẩm'"></span>
                            </div>
                        </div>
                    </div>
                </div>
