                <!-- Module: Hôm Nay — việc cần làm trong ngày, gom mọi sản phẩm -->
                <div x-show="activeModule === 'today'" x-cloak class="space-y-6">
                    <div class="flex flex-wrap items-end justify-between gap-3">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">Hôm Nay</h1>
                            <p class="text-sm text-gray-500 mt-1">Khách cần nhắn gia hạn và khách vừa hết hạn — tất cả sản phẩm.</p>
                        </div>
                        <p x-show="productLoadErrors.length" x-cloak class="text-xs text-red-600 bg-red-50 border border-red-100 rounded-lg px-3 py-2"
                           x-text="'Không tải được: ' + productLoadErrors.join(' · ')"></p>
                    </div>

                    <!-- 1. Khách: chọn sản phẩm + loại việc -->
                    <div class="bg-white rounded-2xl border border-gray-100 card-shadow overflow-hidden">
                        <div class="p-4 border-b border-gray-100 flex flex-wrap items-center gap-2">
                            <template x-for="p in ['all', ...TODAY_PRODUCTS]" :key="p">
                                <button @click="todayProduct = p"
                                        :class="todayProduct === p ? 'bg-gray-900 text-white' : 'bg-gray-50 text-gray-600 hover:bg-gray-100'"
                                        class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5">
                                    <span x-text="p === 'all' ? 'Tất cả' : (p === 'YTB' ? 'YouTube' : p)"></span>
                                    <span class="px-1.5 rounded-full text-[10px]"
                                          :class="todayProduct === p ? 'bg-white/20' : (todayCount(p, 'all') ? 'bg-amber-100 text-amber-700' : 'bg-gray-200 text-gray-500')"
                                          x-text="todayCount(p, 'all')"></span>
                                </button>
                            </template>
                        </div>
                        <div class="px-4 py-3 border-b border-gray-100 flex flex-wrap items-center gap-2">
                            <button @click="todayKind = 'all'" :class="todayKind === 'all' ? 'ring-2 ring-gray-900' : ''"
                                    class="px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-50 text-gray-700">Tất cả</button>
                            <button @click="todayKind = 'due'" :class="todayKind === 'due' ? 'ring-2 ring-amber-500' : ''"
                                    class="px-3 py-1.5 rounded-lg text-xs font-bold bg-amber-50 text-amber-700">
                                Nhắn gia hạn · <span x-text="todayCount(todayProduct, 'due')"></span>
                            </button>
                            <button @click="todayKind = 'overdue'" :class="todayKind === 'overdue' ? 'ring-2 ring-red-500' : ''"
                                    class="px-3 py-1.5 rounded-lg text-xs font-bold bg-red-50 text-red-700">
                                Cứu khách · <span x-text="todayCount(todayProduct, 'overdue')"></span>
                            </button>
                            <div class="relative ml-auto w-full sm:w-64">
                                <i data-lucide="search" class="w-3.5 h-3.5 text-gray-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                                <input x-model.debounce.200ms="todaySearch" type="search" placeholder="Tìm email, tên, CTV…"
                                       class="w-full pl-8 pr-3 py-1.5 bg-gray-50 border border-gray-200 rounded-lg text-xs focus:outline-none focus:border-primary focus:bg-white">
                            </div>
                        </div>

                        <div class="divide-y divide-gray-50 max-h-[60vh] overflow-y-auto">
                            <template x-if="(isFetchingDataGoc || dataStatus('products') === 'loading') && !todayList.length">
                                <div class="py-12 text-center text-gray-400 text-sm">Đang tải…</div>
                            </template>
                            <template x-if="!isFetchingDataGoc && dataStatus('products') !== 'loading' && !todayList.length">
                                <div class="py-12 text-center text-gray-400 text-sm">Không có khách nào cần xử lý 🎉</div>
                            </template>
                            <template x-for="(c, i) in todayList" :key="c.product + c.email + c.name + i">
                                <div class="px-4 py-3 flex items-center gap-3 hover:bg-gray-50/70">
                                    <span class="w-20 shrink-0 text-[10px] font-black uppercase px-1.5 py-0.5 rounded text-center"
                                          :class="{ 'bg-red-600 text-white': c.product === 'YTB', 'bg-emerald-600 text-white': c.product === 'ChatGPT', 'bg-black text-white': c.product === 'Netflix', 'bg-blue-600 text-white': c.product === 'Google One', 'bg-green-500 text-white': c.product === 'Spotify' }"
                                          x-text="c.product === 'YTB' ? 'YouTube' : c.product"></span>
                                    <div class="min-w-0 flex-1">
                                        <button type="button" @click="copyToClipboard(c.email || c.name, 'email')" title="Bấm để copy"
                                                class="block max-w-full truncate text-sm font-bold text-gray-900 hover:text-primary text-left"
                                                x-text="c.email || c.name || '—'"></button>
                                        <p class="text-[11px] text-gray-500 truncate">
                                            <span x-show="c.name && c.email" x-text="c.name + ' · '"></span>
                                            <span x-text="'CTV: ' + (c.staff || '—')"></span>
                                            <span x-show="c.sub" x-text="' · ' + c.sub"></span>
                                        </p>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <p class="text-xs font-bold text-gray-700" x-text="c.expiryDate || '—'"></p>
                                        <p class="text-[11px] font-bold"
                                           :class="c.daysLeft < 0 ? 'text-red-600' : (c.daysLeft === 0 ? 'text-red-600' : 'text-amber-600')"
                                           x-text="c.daysLeft < 0 ? 'Quá hạn ' + (-c.daysLeft) + ' ngày' : (c.daysLeft === 0 ? 'Hết hạn hôm nay' : 'Còn ' + c.daysLeft + ' ngày')"></p>
                                    </div>
                                    <button @click="todayOpen(c)" class="shrink-0 p-2 text-gray-400 hover:text-primary hover:bg-primary-light rounded-lg" title="Mở để gia hạn">
                                        <i data-lucide="arrow-right" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </template>
                        </div>
                    </div>

                    <!-- 2. Fam YouTube -->
                    <div>
                        <h2 class="text-xs font-extrabold text-gray-400 uppercase tracking-widest mb-3">Fam YouTube</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                            <button @click="goFam('loi')" class="text-left p-4 rounded-xl bg-white border border-gray-100 card-shadow hover:ring-2 hover:ring-rose-400">
                                <p class="text-[11px] font-bold text-rose-600 uppercase">Fam lỗi</p>
                                <p class="text-2xl font-black text-gray-900 mt-1" x-text="famHealth.ready ? famHealth.loi : '…'"></p>
                                <p class="text-[11px] text-gray-500 mt-1">Ver / Lỗi Pay / Banned / Lỗi BH chưa hết hạn</p>
                            </button>
                            <button @click="goFam('urgent')" class="text-left p-4 rounded-xl bg-white border border-gray-100 card-shadow hover:ring-2 hover:ring-orange-400">
                                <p class="text-[11px] font-bold text-orange-600 uppercase">Cần xử lý gấp</p>
                                <p class="text-2xl font-black text-gray-900 mt-1" x-text="famHealth.ready ? famHealth.urgent : '…'"></p>
                                <p class="text-[11px] text-gray-500 mt-1">sắp hết bảo hành / hết hạn hôm nay–mai</p>
                            </button>
                            <button @click="goFam('stock')" class="text-left p-4 rounded-xl border card-shadow hover:ring-2 hover:ring-indigo-400"
                                    :class="famHealth.stockShort ? 'bg-red-50 border-red-200' : 'bg-white border-gray-100'">
                                <p class="text-[11px] font-bold uppercase" :class="famHealth.stockShort ? 'text-red-600' : 'text-indigo-600'"
                                   x-text="famHealth.stockShort ? 'Thiếu kho dự phòng' : 'Kho dự phòng'"></p>
                                <p class="text-2xl font-black text-gray-900 mt-1" x-text="famHealth.ready ? famHealth.stockReady + ' / ' + famHealth.famDue7 : '…'"></p>
                                <p class="text-[11px] text-gray-500 mt-1">sẵn sàng / fam đến hạn 7 ngày</p>
                            </button>
                        </div>
                    </div>

                    <!-- 3. Tiền & sức khoẻ (admin) -->
                    <div x-show="currentUserRole === 'admin'" x-cloak>
                        <h2 class="text-xs font-extrabold text-gray-400 uppercase tracking-widest mb-3">Tiền & sức khoẻ shop</h2>
                        <template x-if="!moneyHealth">
                            <div class="p-4 rounded-xl bg-white border border-gray-100 text-sm text-gray-400">Đang tải sheet tài chính…</div>
                        </template>
                        <template x-if="moneyHealth">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                                <button @click="activeModule = 'pnl_calculator'" class="text-left p-4 rounded-xl bg-white border border-gray-100 card-shadow hover:ring-2 hover:ring-emerald-400">
                                    <p class="text-[11px] font-bold text-emerald-600 uppercase">CTV phải nộp (tháng này)</p>
                                    <p class="text-2xl font-black text-gray-900 mt-1" x-text="moneyHealth.ctvDebt.toLocaleString('vi-VN') + 'đ'"></p>
                                    <div class="mt-2 space-y-0.5">
                                        <template x-for="[n, v] in moneyHealth.debtList" :key="n">
                                            <p class="text-xs text-gray-600 flex justify-between"><span x-text="n"></span><b x-text="v.toLocaleString('vi-VN') + 'đ'"></b></p>
                                        </template>
                                    </div>
                                    <p class="text-[10px] text-gray-400 mt-2">= giá bán − hoa hồng các đơn CTV trong tháng (chưa trừ phần đã nộp)</p>
                                </button>
                                <div class="p-4 rounded-xl bg-white border border-gray-100 card-shadow">
                                    <p class="text-[11px] font-bold text-gray-500 uppercase">Tỷ lệ gia hạn YouTube 30 ngày</p>
                                    <p class="text-2xl font-black mt-1"
                                       :class="moneyHealth.renewRate >= 70 ? 'text-emerald-600' : (moneyHealth.renewRate >= 50 ? 'text-amber-600' : 'text-red-600')"
                                       x-text="moneyHealth.renewRate === null ? '—' : moneyHealth.renewRate + '%'"></p>
                                    <div class="mt-2 h-2 bg-gray-100 rounded-full overflow-hidden">
                                        <div class="h-full rounded-full" :class="moneyHealth.renewRate >= 70 ? 'bg-emerald-500' : (moneyHealth.renewRate >= 50 ? 'bg-amber-500' : 'bg-red-500')"
                                             :style="'width:' + (moneyHealth.renewRate || 0) + '%'"></div>
                                    </div>
                                    <p class="text-xs text-gray-500 mt-2"><b class="text-gray-800" x-text="moneyHealth.renewed"></b> khách đã gia hạn · <b class="text-gray-800" x-text="moneyHealth.lost"></b> khách hết hạn chưa quay lại</p>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
