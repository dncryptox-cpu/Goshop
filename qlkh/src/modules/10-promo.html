                <div x-show="activeModule === 'promocodes' && isModuleAllowed('promocodes')" x-cloak>
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-8">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">Quản Lý Mã Giảm Giá</h1>
                            <p class="text-sm text-gray-500 mt-1">Cấu hình mã ưu đãi giảm giá khi gia hạn dịch vụ của khách hàng.</p>
                        </div>
                        <button @click="openAddPromoModal()" class="self-start sm:self-auto bg-primary hover:bg-orange-600 text-white px-5 py-2.5 rounded-lg text-sm font-bold shadow-lg shadow-orange-500/20 flex items-center gap-2 transition-all">
                            <i data-lucide="ticket" class="w-4 h-4"></i>
                            <span>Thêm Mã Mới</span>
                        </button>
                    </div>

                    <!-- Search Filter Card -->
                    <div class="bg-white rounded-xl border border-gray-100 card-shadow p-5 mb-6 flex flex-col sm:flex-row gap-4 items-center justify-between">
                        <div class="relative w-full sm:max-w-xs">
                            <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                            <input x-model.debounce.300ms="promoSearch" type="text" placeholder="Tìm kiếm mã..." class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2 pl-9 pr-4 text-xs focus:outline-none focus:border-primary transition-all">
                        </div>
                        <div class="text-xs text-gray-400 font-medium">
                            Tổng số mã: <span class="font-bold text-gray-900" x-text="promoList.length"></span>
                        </div>
                    </div>

                    <!-- Promo Codes Table Card -->
                    <div class="bg-white rounded-xl border border-gray-100 card-shadow overflow-hidden">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-gray-50 border-b border-gray-100">
                                        <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Mã Ưu Đãi</th>
                                        <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Mức Giảm</th>
                                        <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest">Trạng Thái</th>
                                        <th class="px-6 py-4 text-xs font-bold text-gray-400 uppercase tracking-widest text-right">Thao Tác</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-50">
                                    <template x-for="promo in promoList.filter(p => p.code.toLowerCase().includes(promoSearch.toLowerCase()))" :key="promo.code">
                                        <tr class="hover:bg-gray-50/50 transition-colors">
                                            <td class="px-6 py-4">
                                                <div class="flex items-center gap-3">
                                                    <div class="w-8 h-8 rounded-lg bg-orange-50 flex items-center justify-center text-primary">
                                                        <i data-lucide="ticket" class="w-4 h-4"></i>
                                                    </div>
                                                    <span class="font-mono font-bold text-gray-900 text-sm tracking-wider" x-text="promo.code"></span>
                                                </div>
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="font-extrabold text-green-600 text-sm" x-text="promo.discount.toLocaleString('vi-VN') + 'đ'"></span>
                                            </td>
                                            <td class="px-6 py-4">
                                                <span class="inline-flex items-center gap-1 text-[10px] font-bold bg-green-50 text-green-700 px-2 py-0.5 rounded border border-green-100">
                                                    <span class="w-1.5 h-1.5 rounded-full bg-green-500"></span>
                                                    Hoạt động
                                                </span>
                                            </td>
                                            <td class="px-6 py-4 text-right">
                                                <div class="flex items-center justify-end gap-2">
                                                    <button @click="openEditPromoModal(promo)" class="p-1.5 hover:bg-gray-100 text-gray-500 hover:text-gray-900 rounded transition-all" title="Chỉnh sửa">
                                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                                    </button>
                                                    <button @click="deletePromoCode(promo.code)" class="p-1.5 hover:bg-red-50 text-gray-400 hover:text-red-600 rounded transition-all" title="Xóa">
                                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                                    </button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                    <template x-if="promoList.filter(p => p.code.toLowerCase().includes(promoSearch.toLowerCase())).length === 0">
                                        <tr>
                                            <td colspan="4" class="px-6 py-12 text-center text-gray-400">
                                                <div class="w-12 h-12 rounded-full bg-gray-50 flex items-center justify-center mx-auto mb-3 text-gray-300">
                                                    <i data-lucide="ticket" class="w-6 h-6"></i>
                                                </div>
                                                <p class="text-sm font-medium">Không tìm thấy mã giảm giá nào phù hợp.</p>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
