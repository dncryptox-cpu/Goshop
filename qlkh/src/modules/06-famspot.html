                <div x-show="activeModule === 'fam_spot'" x-cloak>
                    <div class="mb-8 flex items-end justify-between">
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900">Quản Lý Fam Spot</h1>
                            <p class="text-sm text-gray-500 mt-1">Theo dõi tình trạng slot, ngày gia hạn và danh sách thành viên trong các Family.</p>
                        </div>
                        <div class="bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-2 flex items-center gap-3">
                            <i data-lucide="users" class="w-5 h-5 text-indigo-500"></i>
                            <div>
                                <p class="text-xs font-bold text-indigo-400 uppercase">Tổng số Fam</p>
                                <p class="text-lg font-bold text-indigo-700" x-text="familiesSpot.length"></p>
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-6">
                        <template x-for="(fam, index) in familiesSpot" :key="index">
                            <div class="bg-white rounded-xl border border-gray-100 card-shadow flex flex-col overflow-hidden hover:shadow-lg transition-all border-t-4" :class="fam.isExpired ? 'border-t-red-600 bg-red-50/10' : (fam.status.toLowerCase().includes('còn') ? 'border-t-emerald-500' : 'border-t-orange-500')">
                                <!-- Fam Header -->
                                <div class="p-4 border-b border-gray-100 flex justify-between items-start" :class="fam.isExpired ? 'bg-red-50/40' : ''">
                                    <div class="overflow-hidden">
                                        <div class="flex items-center gap-2 mb-1">
                                            <div :class="fam.isExpired ? 'bg-red-100 text-red-600' : 'bg-indigo-100 text-indigo-600'" class="w-8 h-8 rounded-full flex items-center justify-center shrink-0">
                                                <i data-lucide="users" class="w-4 h-4"></i>
                                            </div>
                                            <h3 @click.stop="copyToClipboard(fam.chuFam, 'Chủ Fam')" class="font-bold text-gray-900 text-lg truncate cursor-pointer hover:text-indigo-600 transition-colors" x-text="fam.chuFam || '(Trống Chủ Fam)'" title="Bấm để copy"></h3>
                                        </div>
                                        <div class="flex items-center gap-3 mt-2 pl-10">
                                            <span x-show="fam.isExpired" class="px-2 py-0.5 rounded border border-red-200 bg-red-100 text-red-700 text-[10px] uppercase font-bold tracking-wider animate-pulse shadow-sm">QUÁ HẠN</span>
                                            <span x-show="!fam.isExpired" :class="fam.status.toLowerCase().includes('còn') ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-orange-100 text-orange-700 border-orange-200'" class="px-2 py-0.5 rounded border text-[10px] uppercase font-bold tracking-wider" x-text="fam.status || 'Chưa rõ'"></span>
                                            <div class="text-xs text-gray-500 flex items-center gap-1.5 font-medium">
                                                <i data-lucide="calendar" class="w-3.5 h-3.5 text-gray-400"></i>
                                                <span>Ngày GH: <b :class="fam.isExpired ? 'text-red-600' : 'text-gray-800'" x-text="fam.dateGh || '-'"></b></span>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="flex flex-col items-end shrink-0 pl-3">
                                        <div :class="fam.isRenewed ? 'bg-indigo-50 border-indigo-200 text-indigo-700' : 'bg-gray-50 border-gray-200 text-gray-400'" class="px-2.5 py-1 rounded-md border flex items-center gap-1.5 mb-1 cursor-help" :title="fam.isRenewed ? 'Đã thanh toán/gia hạn tháng này' : 'Chưa thanh toán tháng này'">
                                            <i data-lucide="check-circle-2" class="w-4 h-4" x-show="fam.isRenewed"></i>
                                            <i data-lucide="circle" class="w-4 h-4" x-show="!fam.isRenewed"></i>
                                            <span class="text-[10px] font-bold uppercase" x-text="fam.isRenewed ? 'Đã Đóng' : 'Chưa Đóng'"></span>
                                        </div>
                                        <p class="text-xs font-medium text-gray-500 mt-1"><b class="text-gray-900 text-sm" x-text="fam.members.length"></b>/6 slots</p>
                                    </div>
                                </div>

                                <!-- Fam Members -->
                                <div class="p-4 flex-1 bg-gray-50/30">
                                    <div class="space-y-2">
                                        <template x-for="(member, mIdx) in fam.members" :key="mIdx">
                                            <div class="flex justify-between items-center p-2.5 rounded-lg border border-gray-200 bg-white hover:border-indigo-300 transition-all group relative shadow-sm">
                                                <div class="flex items-center gap-3 overflow-hidden">
                                                    <div :class="mIdx === 0 ? 'bg-amber-100 text-amber-600 border-amber-200' : 'bg-gray-100 text-gray-500 border-gray-200'" class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold shrink-0 border">
                                                        <i data-lucide="crown" class="w-3.5 h-3.5" x-show="mIdx === 0"></i>
                                                        <span x-show="mIdx !== 0" x-text="mIdx + 1"></span>
                                                    </div>
                                                    <div class="truncate flex flex-col justify-center">
                                                        <p @click.stop="copyToClipboard(member.email, 'Email')" :class="member.email ? 'text-gray-800 cursor-pointer hover:text-indigo-600 font-bold' : 'text-gray-400 italic'" class="text-sm truncate transition-colors" x-text="member.email || '(Không có email)'" title="Bấm để copy"></p>
                                                        <div class="flex items-center gap-2 mt-0.5" x-show="member.email">
                                                            <span class="text-[9px] font-bold text-gray-500 uppercase bg-gray-100 px-1.5 py-0.5 rounded border border-gray-200 flex items-center gap-1"><i data-lucide="user" class="w-2.5 h-2.5 text-gray-400"></i> <span x-text="member.ctv || '--'"></span></span>
                                                            <span class="text-[10px] text-gray-400 font-medium">Vào: <span x-text="member.purchaseDate || '--'"></span></span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div class="text-right shrink-0 pl-2">
                                                    <div class="text-[11px] font-bold px-2 py-0.5 rounded border inline-block shadow-sm" :class="[member.note ? 'mb-0.5' : '', member.isExpired ? 'bg-red-50 text-red-700 border-red-200 animate-pulse' : (member.hsd ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-gray-100 text-gray-500 border-gray-200')]">HSD: <span x-text="member.hsd || 'Chưa nhập'"></span></div>
                                                    <p class="text-[10px] text-orange-500 font-medium truncate max-w-[80px]" x-show="member.note" x-text="member.note" :title="member.note"></p>
                                                </div>
                                            </div>
                                        </template>
                                        
                                        <!-- Empty slots filler -->
                                        <template x-for="i in (6 - fam.members.length)">
                                            <div class="flex items-center gap-3 p-2.5 rounded-lg border border-dashed border-gray-300 bg-gray-50/50 opacity-70">
                                                <div class="w-7 h-7 rounded-full bg-gray-100 border border-gray-200 flex items-center justify-center text-xs font-bold text-gray-400 shrink-0" x-text="fam.members.length + i"></div>
                                                <p class="text-sm font-medium text-gray-400 italic">Slot trống</p>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
