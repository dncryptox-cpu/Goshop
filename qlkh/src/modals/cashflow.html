    <!-- Cashflow Settlement Modal -->
    <div x-show="showCashflowModal" class="fixed inset-0 z-50 overflow-y-auto" style="display: none;">
        <div class="flex items-center justify-center min-h-screen px-4 pt-4 pb-20 text-center sm:block sm:p-0">
            <div x-show="showCashflowModal" @click="showCashflowModal = false" class="fixed inset-0 transition-opacity bg-gray-500 bg-opacity-75"></div>
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen">&#8203;</span>
            <div x-show="showCashflowModal" class="inline-block align-bottom bg-white rounded-xl text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg w-full card-shadow border border-gray-100">
                <div class="px-6 py-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                    <h3 class="text-lg leading-6 font-bold text-gray-900">
                        Chốt sổ Dòng Tiền (Cash Flow)
                    </h3>
                    <button @click="showCashflowModal = false" class="text-gray-400 hover:text-gray-500">
                        <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                </div>
                <div class="px-6 py-5">
                    <p class="text-sm text-gray-500 mb-6">
                        Dữ liệu dòng tiền của tài khoản <span class="font-bold text-gray-900">MBB01</span> dựa trên khoảng thời gian đang chọn: <span class="font-bold text-indigo-600" x-text="globalProfitFilter.type === 'month' ? 'Tháng ' + globalProfitReport.month : 'Tùy chọn'"></span>.
                    </p>
                    
                    <!-- DNC Revenue -->
                    <div class="flex items-center justify-between p-4 bg-emerald-50 rounded-lg mb-3">
                        <div>
                            <p class="text-xs font-bold text-emerald-800 uppercase tracking-wider mb-1">Thu: Bán lẻ DNC</p>
                            <p class="text-lg font-bold text-emerald-600" x-text="new Intl.NumberFormat('vi-VN').format(globalProfitReport.cashflow?.dncRevenue || 0) + ' đ'"></p>
                        </div>
                        <template x-if="isSynced('Doanh thu bán lẻ DNC (' + globalProfitReport.month + ')')">
                            <span class="text-xs font-bold text-emerald-600 flex items-center gap-1"><i data-lucide="check-circle" class="w-4 h-4"></i> Đã chốt</span>
                        </template>
                        <template x-if="!isSynced('Doanh thu bán lẻ DNC (' + globalProfitReport.month + ')')">
                            <button @click="syncSpecificCashflow('Thu', globalProfitReport.cashflow.dncRevenue, 'Doanh thu bán lẻ', 'Doanh thu bán lẻ DNC (' + globalProfitReport.month + ')', $event)" :disabled="isCheckingSync" class="bg-emerald-600 text-white px-3 py-1.5 rounded-md text-xs font-bold hover:bg-emerald-700 transition-all disabled:opacity-50">
                                Đồng bộ
                            </button>
                        </template>
                    </div>
                    
                    <!-- Total Capital Cost -->
                    <div class="flex items-center justify-between p-4 bg-red-50 rounded-lg mb-3">
                        <div>
                            <p class="text-xs font-bold text-red-800 uppercase tracking-wider mb-1">Chi: Phí vốn nhập hàng</p>
                            <p class="text-lg font-bold text-red-600" x-text="new Intl.NumberFormat('vi-VN').format(globalProfitReport.cashflow?.totalCost || 0) + ' đ'"></p>
                            <p class="text-[10px] text-red-500 mt-1">Cost của tất cả đơn (DNC + CTV)</p>
                        </div>
                        <template x-if="isSynced('Vốn nhập hàng Go Shop (' + globalProfitReport.month + ')')">
                            <span class="text-xs font-bold text-red-600 flex items-center gap-1"><i data-lucide="check-circle" class="w-4 h-4"></i> Đã chốt</span>
                        </template>
                        <template x-if="!isSynced('Vốn nhập hàng Go Shop (' + globalProfitReport.month + ')')">
                            <button @click="syncSpecificCashflow('Chi', globalProfitReport.cashflow.totalCost, 'Chi phí vốn', 'Vốn nhập hàng Go Shop (' + globalProfitReport.month + ')', $event)" :disabled="isCheckingSync" class="bg-red-600 text-white px-3 py-1.5 rounded-md text-xs font-bold hover:bg-red-700 transition-all disabled:opacity-50">
                                Đồng bộ
                            </button>
                        </template>
                    </div>
                    
                    <!-- CTV Debts -->
                    <div class="mt-6">
                        <h4 class="text-xs font-bold text-gray-500 uppercase tracking-wider mb-3">Thu: Quyết toán công nợ CTV</h4>
                        <template x-for="(debt, staff) in globalProfitReport.cashflow?.ctvDebts || {}" :key="staff">
                            <div class="flex items-center justify-between p-3 border border-gray-100 rounded-lg mb-2">
                                <div>
                                    <p class="text-sm font-bold text-gray-900" x-text="'CTV ' + staff"></p>
                                    <p class="text-xs text-indigo-600 font-bold" x-text="new Intl.NumberFormat('vi-VN').format(debt) + ' đ'"></p>
                                </div>
                                <template x-if="isSynced('Quyết toán CTV ' + staff + ' (' + globalProfitReport.month + ')')">
                                    <span class="text-xs font-bold text-indigo-600 flex items-center gap-1"><i data-lucide="check-circle" class="w-4 h-4"></i> Đã chốt</span>
                                </template>
                                <template x-if="!isSynced('Quyết toán CTV ' + staff + ' (' + globalProfitReport.month + ')')">
                                    <button @click="syncSpecificCashflow('Thu', debt, 'Doanh thu sỉ (CTV)', 'Quyết toán CTV ' + staff + ' (' + globalProfitReport.month + ')', $event)" :disabled="isCheckingSync" class="bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-md text-xs font-bold hover:bg-indigo-100 transition-all disabled:opacity-50">
                                        Chốt
                                    </button>
                                </template>
                            </div>
                        </template>
                        <template x-if="Object.keys(globalProfitReport.cashflow?.ctvDebts || {}).length === 0">
                            <p class="text-sm text-gray-400 italic">Không có giao dịch CTV trong khoảng thời gian này.</p>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </div>
