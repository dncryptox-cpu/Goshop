    <!-- Promo Code Add/Edit Modal -->
    <div x-show="showPromoModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div @click="showPromoModal = false" class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm"></div>
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">
            
            <div class="p-6 border-b border-gray-100 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900" x-text="promoForm.isEdit ? 'Chỉnh Sửa Mã Giảm Giá' : 'Thêm Mã Giảm Giá Mới'"></h2>
                    <p class="text-xs text-gray-500 mt-1" x-text="promoForm.isEdit ? 'Cập nhật lại giá trị mức giảm giá của mã.' : 'Nhập thông tin mã giảm giá mới.'"></p>
                </div>
                <button @click="showPromoModal = false" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form @submit.prevent="submitPromoForm()" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Tên Mã Giảm Giá</label>
                    <div class="relative">
                        <i data-lucide="ticket" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input x-model="promoForm.code" type="text" required placeholder="GOSHOP100" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-primary transition-all font-mono uppercase tracking-wider">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Số Tiền Giảm (VNĐ)</label>
                    <div class="relative">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-sm text-gray-400 font-bold">₫</span>
                        <input x-model.number="promoForm.discount" type="number" min="1000" step="1000" required placeholder="50000" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-8 pr-4 text-sm focus:outline-none focus:border-primary transition-all font-bold text-green-600">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" @click="showPromoModal = false" class="px-5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg transition-all">Hủy</button>
                    <button type="submit" class="bg-primary hover:bg-orange-600 text-white px-6 py-2 rounded-lg text-sm font-bold transition-all shadow-lg shadow-orange-500/25 flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span x-text="promoForm.isEdit ? 'Cập Nhật' : 'Tạo Mới'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- TwoFA Add/Edit Modal -->
    <div x-show="showTwofaModal" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
        <div @click="showTwofaModal = false" class="absolute inset-0 bg-gray-900/50 backdrop-blur-sm"></div>
        <div class="bg-white rounded-2xl w-full max-w-md shadow-2xl relative overflow-hidden" 
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="opacity-0 scale-95"
             x-transition:enter-end="opacity-100 scale-100">
            
            <div class="p-6 border-b border-gray-100 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-gray-900" x-text="isEditingTwofa ? 'Chỉnh Sửa Thông Tin 2FA' : 'Thêm 2FA Mới'"></h2>
                </div>
                <button @click="showTwofaModal = false" class="text-gray-400 hover:text-gray-600">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <form @submit.prevent="saveTwofa()" class="p-6 space-y-4">
                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">ID Tài Khoản</label>
                    <div class="relative">
                        <input x-model="twofaForm.id" type="text" disabled class="w-full bg-gray-100 border border-gray-200 rounded-lg py-2.5 px-4 text-sm font-mono text-gray-500">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Tên/Email Tài Khoản Gốc</label>
                    <div class="relative">
                        <i data-lucide="user" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input x-model="twofaForm.email" type="text" required placeholder="vidu@gmail.com" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-primary transition-all font-medium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Secret Key 2FA</label>
                    <div class="relative">
                        <i data-lucide="key" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400"></i>
                        <input x-model="twofaForm.secret" type="text" required placeholder="JBSWY3DPEHPK3PXP" class="w-full bg-gray-50 border border-gray-200 rounded-lg py-2.5 pl-10 pr-4 text-sm focus:outline-none focus:border-primary transition-all font-mono uppercase">
                    </div>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" @click="showTwofaModal = false" class="px-5 py-2 text-sm font-medium text-gray-600 hover:bg-gray-50 rounded-lg transition-all">Hủy</button>
                    <button type="submit" class="bg-primary hover:bg-orange-600 text-white px-6 py-2 rounded-lg text-sm font-bold transition-all shadow-lg shadow-primary/25 flex items-center gap-2">
                        <i data-lucide="check" class="w-4 h-4"></i>
                        <span x-text="isEditingTwofa ? 'Cập Nhật' : 'Tạo Mới'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
