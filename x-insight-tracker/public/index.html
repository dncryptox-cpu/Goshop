<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>X Insight Tracker | Thống Kê & Theo Dõi Ý Kiến Người Dùng</title>
  <meta name="description" content="Công cụ theo dõi insight từ người dùng thật trên X cho Tread.fi, HIP-3 và các dự án crypto">
  <!-- Google Fonts: Fraunces & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header Navbar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <h1 class="logo-text">X Insight Tracker</h1>
        <span class="version-tag">v1.0 • Read-only</span>
      </div>
      
      <div class="header-actions">
        <div class="rate-limit-badge" id="rateLimitBadge">
          <span class="badge-dot"></span>
          <span id="apiStatusText">X API: 98/100 calls</span>
        </div>
        <button class="btn btn-outline" id="btnManageProjects">⚙️ Quản lý Dự án</button>
        <button class="btn btn-primary" id="btnScanNow">⚡ Quét ngay</button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <!-- Project Tabs Navigation -->
    <nav class="project-tabs" id="projectTabs">
      <button class="tab-btn active" data-project="All">Tất cả dự án</button>
      <button class="tab-btn" data-project="Tread.fi">Tread.fi</button>
      <button class="tab-btn" data-project="HIP-3">HIP-3</button>
      <button class="tab-btn" data-project="HIP-4">HIP-4</button>
    </nav>

    <!-- Controls & Filter Toolbar -->
    <section class="filter-toolbar">
      <div class="filter-group">
        <label for="sourceTypeFilter">Nguồn:</label>
        <select id="sourceTypeFilter" class="select-input">
          <option value="all">Tất cả nguồn</option>
          <option value="user">🧡 Người dùng thật (#c98a4b)</option>
          <option value="analyst">💙 Phân tích (#9fb4cc)</option>
          <option value="reliable">💚 Dữ liệu tin cậy (#7a9a7e)</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="startDate">Từ ngày:</label>
        <input type="date" id="startDate" class="date-input">
        <label for="endDate">Đến:</label>
        <input type="date" id="endDate" class="date-input">
      </div>

      <div class="filter-group search-box">
        <input type="text" id="searchInput" placeholder="Tìm theo nội dung, @username..." class="text-input">
      </div>

      <div class="filter-group toggle-group">
        <label class="checkbox-label">
          <input type="checkbox" id="notableOnlyCheck">
          <span>⭐ Chỉ bản ghi đáng chú ý</span>
        </label>
      </div>
    </section>

    <!-- Scan Status Banner -->
    <div id="statusBanner" class="status-banner hidden">
      <span id="statusBannerText">Đang tiến hành quét dữ liệu...</span>
    </div>

    <!-- Insights Display Grid -->
    <section class="insights-grid" id="insightsGrid">
      <div class="loading-spinner">Đang tải dữ liệu insight...</div>
    </section>
  </main>

  <!-- Project Management Modal Drawer -->
  <div class="modal-overlay hidden" id="projectModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2>Quản lý Dự án & Từ khoá</h2>
        <button class="close-btn" id="btnCloseModal">&times;</button>
      </div>
      <div class="modal-body">
        <form id="addProjectForm" class="project-form">
          <h3>Thêm dự án theo dõi mới</h3>
          <div class="form-group">
            <label>Tên dự án *</label>
            <input type="text" id="newProjName" placeholder="ví dụ: HIP-5 / Hyperliquid" required class="text-input">
          </div>
          <div class="form-group">
            <label>Từ khoá tìm kiếm (phân cách bằng dấu phẩy) *</label>
            <input type="text" id="newProjKeywords" placeholder="HIP-5, HIP5, @HyperliquidX" required class="text-input">
          </div>
          <div class="form-group">
            <label>Tài khoản chính thức cần LỌC BỎ (phân cách bằng phẩy)</label>
            <input type="text" id="newProjOfficial" placeholder="HyperliquidX, Hyperliquid_App" class="text-input">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%;">+ Thêm dự án</button>
        </form>

        <hr class="divider">

        <h3>Danh sách dự án hiện tại</h3>
        <div id="activeProjectsList" class="projects-list">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </div>

  <footer class="app-footer">
    <p>X Insight Tracker • Không lưu trữ full-text bài viết • Dữ liệu tóm tắt phục vụ nghiên cứu cá nhân</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
