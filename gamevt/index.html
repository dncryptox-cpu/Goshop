<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vườn Thiền: game ghép hoa thư giãn trên hồ sen.">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>Vườn Thiền</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,500;0,700;1,500&family=Be+Vietnam+Pro:wght@400;500;600&display=swap">
<style>
/* Layout: a lotus pond at dusk fills the page; a quiet control column sits to its left (below it on phones). */
:root {
  color-scheme: dark;
  --pond-a: #17463f; --pond-b: #0b2428;
  --ink: #eef3e4; --ink-soft: #a9c0b2;
  --panel: #0d2c2dcc; --line: #ffffff1f;
  --lotus: #f4a3b8; --gold: #f2c65a;
  --display: "Alegreya", Georgia, serif;
  --body: "Be Vietnam Pro", system-ui, sans-serif;
}
:root[data-season="1"] { --pond-a: #0f4a55; --pond-b: #07232f; --panel: #0a2b35cc; }
:root[data-season="2"] { --pond-a: #47401f; --pond-b: #1e1c10; --panel: #27230fcc; }
:root[data-season="3"] { --pond-a: #2a3c58; --pond-b: #11182a; --panel: #151f33cc; }
html, body { height: 100%; }
body {
  background: radial-gradient(120% 90% at 62% 40%, var(--pond-a), var(--pond-b));
  background-color: var(--pond-b);
  color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5;
  overflow: hidden; transition: background-color .8s;
}
button { font: inherit; color: inherit; cursor: pointer; background: none; border: 0; }
button:focus-visible, canvas:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#app {
  height: 100%; display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 16px;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#side { display: flex; flex-direction: column; gap: 18px; min-height: 0; overflow-y: auto; }
#head h1 { font: italic 500 40px/1 var(--display); margin: 0; letter-spacing: .01em; }
#where { margin-top: 12px; }
#where b { font: 700 21px/1.2 var(--display); display: block; }
#where span { color: var(--ink-soft); font-size: 13px; }
#stats { display: flex; gap: 24px; font-variant-numeric: tabular-nums; margin-top: 10px; }
#stats small, .lbl { display: block; color: var(--ink-soft); font-size: 12px; letter-spacing: .03em; }
#stats strong { font-size: 20px; font-weight: 600; }
#goal { display: flex; gap: 4px 6px; min-height: 30px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
#goal i { width: 18px; height: 18px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); border: 1.5px solid var(--lotus); display: block; box-sizing: border-box; margin: 3px; }
#goal i.on { background: var(--lotus); }
.chip { font-size: 12.5px; padding: 2px 9px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); background: var(--panel); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.done { color: var(--gold); border-color: #f2c65a55; }
.chip.warn { border-color: #d9a25a88; }
#tray { display: grid; grid-template-columns: auto auto 1fr; gap: 14px; align-items: end; }
.slot { display: flex; flex-direction: column; gap: 4px; align-items: center; }
.slot canvas { display: block; background: #ffffff0d; border-radius: 50%; }
#hold { padding: 0; border-radius: 50%; display: block; }
#hold canvas { outline: 1.5px dashed var(--line); outline-offset: -1.5px; }
#hold:hover canvas { background: #ffffff1c; }
#nexts { display: flex; gap: 6px; }
#actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { padding: 8px 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); font-size: 14px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.main { background: var(--gold); border-color: var(--gold); color: #2b2308; font-weight: 600; }
#msg { color: var(--ink-soft); min-height: 44px; font-size: 14px; }
#ladder { display: flex; align-items: center; gap: 4px; color: var(--ink-soft); font-size: 13px; margin-top: auto; }
#ladder canvas { display: block; }
#stage { position: relative; min-width: 0; min-height: 0; }
#board { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; display: block; }
.veil { position: fixed; inset: 0; z-index: 20; background: #05141ab8; display: flex; align-items: center; justify-content: center; padding: 16px; overflow-y: auto; }
.card { background: #10312f; border: 1px solid var(--line); border-radius: 18px; padding: 24px; width: min(500px, 100%); max-height: 100%; overflow-y: auto; box-sizing: border-box; }
.card h2 { font: italic 500 30px/1.1 var(--display); margin: 0 0 10px; text-wrap: balance; }
.card p { margin: 0 0 12px; }
.card ul { margin: 0 0 16px; padding-left: 20px; display: grid; gap: 8px; }
.intro { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
.intro canvas { flex: none; background: #ffffff10; border-radius: 50%; }
.row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.stars { font-size: 30px; letter-spacing: 4px; color: var(--gold); line-height: 1.2; }
.stars span { opacity: .22; }
.starnote { color: var(--ink-soft); font-size: 13px; margin-bottom: 12px; }
.gift { border: 1px solid #f2c65a55; border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; color: var(--gold); }
.season { font: italic 500 18px var(--display); color: var(--ink-soft); margin: 14px 0 6px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.season small { font: 12px var(--body); }
.pick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.pick button { padding: 10px 6px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; line-height: 1.3; min-width: 0; }
.pick button:hover:not(:disabled) { border-color: var(--ink-soft); }
.pick button:disabled { opacity: .35; cursor: default; }
.pick button.now { border-color: var(--gold); }
.pick em { display: block; font-style: normal; color: var(--gold); font-size: 12px; min-height: 16px; }
.pick em.soft { color: var(--ink-soft); }
.decor { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; font-size: 13px; }
.decor span { color: var(--ink-soft); }
.decor b { font-weight: 500; color: var(--ink); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
@media (max-width: 760px), (max-height: 520px) and (max-width: 900px) {
  #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr) auto; gap: 8px; padding-block: 10px; }
  #side { display: contents; }
  #head { grid-row: 1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 2px 12px; }
  #head h1 { display: none; }
  #where { margin: 0; }
  #where b { font-size: 18px; display: inline; }
  #where span { display: block; font-size: 12px; }
  #stats { gap: 14px; margin: 0; }
  #stats strong { font-size: 16px; }
  #goal { min-height: 0; width: 100%; margin: 0; }
  #goal i { width: 13px; height: 13px; margin: 2px; }
  .chip { font-size: 12px; padding: 1px 8px; }
  #stage { grid-row: 2; }
  #bottom { grid-row: 3; display: flex; flex-direction: column; gap: 8px; }
  #msg { min-height: 20px; font-size: 13px; line-height: 1.35; }
  #ladder { display: none; }
  #actions { gap: 6px; flex-wrap: nowrap; }
  .btn { padding: 6px 8px; font-size: 12.5px; }
  #actions .btn { flex: 1 1 auto; min-width: 0; padding-inline: 4px; overflow: hidden; text-overflow: ellipsis; }
}
@media (min-width: 761px) { #bottom { display: flex; flex-direction: column; gap: 16px; flex: 1; } }
@media (prefers-reduced-motion: reduce) { body { transition: none; } }
</style>

</head>
<body>
<div id="app">
  <div id="side">
    <div id="head">
      <h1>Vườn Thiền</h1>
      <div id="where"><b id="gName"></b><span id="gSeason"></span></div>
      <div id="stats">
        <div><small>Điểm</small><strong id="score">0</strong></div>
        <div><small>Lượt đặt</small><strong id="moves">0</strong></div>
      </div>
      <div id="goal" role="img"></div>
    </div>
    <div id="bottom">
      <div id="tray">
        <div class="slot"><span class="lbl">Đang cầm</span><canvas id="cur" style="width:84px;height:84px"></canvas></div>
        <div class="slot"><span class="lbl">Giỏ</span><button id="hold" aria-label="Cất cây đang cầm vào giỏ hoặc đổi với cây trong giỏ"><canvas id="holdC" style="width:60px;height:60px"></canvas></button></div>
        <div class="slot" style="align-items:flex-start"><span class="lbl">Kế tiếp</span><div id="nexts"><canvas id="n1" style="width:48px;height:48px"></canvas><canvas id="n2" style="width:36px;height:36px;align-self:end"></canvas></div></div>
      </div>
      <div id="msg"></div>
      <div id="actions">
        <button class="btn" id="undo"></button>
        <button class="btn" id="gardens">Các vườn</button>
        <button class="btn" id="help">Luật chơi</button>
        <button class="btn" id="snd"></button>
      </div>
      <div id="ladder" aria-hidden="true"></div>
    </div>
  </div>
  <div id="stage"><canvas id="board" tabindex="0" aria-label="Hồ sen. Dùng phím mũi tên để chọn lá sen, Enter để đặt cây, H để dùng giỏ, Z để hoàn tác."></canvas></div>
</div>
<div class="sr" aria-live="polite" id="live"></div>
<div id="veil" class="veil" hidden><div class="card" id="card" role="dialog" aria-modal="true"></div></div>

<script>
//#LOGIC-START
const DIRS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
const MAX_ST = 2;
const hexKeys = r => { const o = []; for (let q=-r;q<=r;q++) for (let s=-r;s<=r;s++) if (Math.abs(q+s)<=r) o.push(q+','+s); return o; };
const R1 = ['1,0','1,-1','0,-1','-1,0','-1,1','0,1'];
const RING1 = ['0,0',...R1];
const R2 = ['2,0','0,2','-2,2','-2,0','0,-2','2,-2'];
const R2E = ['1,1','-1,2','-2,1','-1,-1','1,-2','2,-1'];
const R3C = ['3,0','0,3','-3,3','-3,0','0,-3','3,-3'];
const R3E = ['3,-1','3,-2','2,1','1,2','-1,3','-2,3','-3,2','-3,1','-2,-1','-1,-2','1,-3','2,-3'];
const R4C = ['4,0','0,4','-4,4','-4,0','0,-4','4,-4'];
const G = (n, s, o = {}) => ({n, s, r:3, sp:3, rel:1, spread:0, holes:[], stones:[], weeds:[], ice:[], lan:[], ...o,
  w: {bud:.25, dew:.05, stone:0, bee:0, ...(o.w || {})}});
const GARDENS = [
  G('Giọt Đầu Mùa',0,{r:2,sp:2,w:{bud:.22}}),
  G('Bờ Tre',0,{holes:R3C,sp:2,rel:2,w:{bud:.22}}),
  G('Ao Rêu',0,{stones:['0,0','2,-1','-2,1']}),
  G('Ong Về',0,{rel:2,intro:'bee',w:{bee:.08}}),
  G('Vườn Mận',0,{rel:2,stones:R2,w:{bee:.06}}),
  G('Mưa Xuân',0,{rel:3,w:{stone:.04,bee:.05}}),
  G('Cỏ Hè',1,{intro:'weed',weeds:['2,-1','-2,1','0,2']}),
  G('Cầu Đá',1,{stones:['0,-1','0,0','0,1'],weeds:['2,-2','-2,2'],spread:7}),
  G('Ruộng Ven',1,{rel:2,weeds:['3,-3','-3,3','0,-3','0,3'],spread:4,w:{bee:.03}}),
  G('Nắng Gắt',1,{rel:2,sp:4,weeds:['2,0','-2,0','0,2'],spread:5,w:{stone:.03,bee:.05}}),
  G('Mưa Rào',1,{rel:2,sp:4,weeds:['0,0','3,-3','-3,3'],spread:5,w:{bee:.05}}),
  G('Đầm Lầy',1,{sp:4,rel:2,weeds:['2,0','-2,0','0,2','0,-2'],spread:5,w:{bee:.05}}),
  G('Đêm Trung Thu',2,{intro:'lan',lan:['1,0','-1,0']}),
  G('Lá Vàng',2,{sp:4,lan:['2,-1','-2,1','0,0'],w:{bee:.04,dew:.07}}),
  G('Gió Heo May',2,{holes:RING1,rel:2,lan:['2,0','-2,0','0,2'],w:{dew:.08,bud:.28}}),
  G('Trăng Rằm',2,{sp:4,rel:2,stones:R2,lan:['3,-3','-3,3','0,0'],w:{bee:.04}}),
  G('Rằm Tháng Tám',2,{rel:3,sp:4,lan:R2E,weeds:['3,0','-3,0'],spread:5,w:{bee:.05}}),
  G('Phố Đèn',2,{sp:4,rel:2,stones:['2,0','-2,2','0,-2'],lan:R3C,w:{bee:.05}}),
  G('Sương Muối',3,{intro:'ice',ice:['1,1','-2,1','1,-2','-1,-1']}),
  G('Hồ Đóng Băng',3,{rel:2,sp:4,ice:[...R2,...R2E],w:{bee:.05}}),
  G('Sương Sớm',3,{holes:R3C,rel:2,ice:RING1,w:{stone:.04,bee:.04}}),
  G('Đá Lạnh',3,{sp:4,rel:2,stones:R2,ice:R3E,w:{bee:.05}}),
  G('Bão Tuyết',3,{sp:4,rel:2,ice:[...R3C,...R2E],weeds:['0,0'],spread:5,w:{bee:.05}}),
  G('Tuyết Đầu Năm',3,{r:4,holes:R4C,sp:4,rel:4,stones:[...R2E,...R3C],ice:R1,lan:['0,0','3,-1','-3,1','1,2'],weeds:['4,-4','-4,4','2,2','-2,-2'],spread:5,w:{bee:.05}}),
];
const ENDLESS = G('Hồ Vô Tận',1,{rel:-1,w:{stone:.04,bee:.04}});
function dailyDef(ds) { // same garden for everyone on a given date
  const t = {rng: +ds}, pick = a => a[Math.floor(rand(t)*a.length)];
  const shuf = a => { a = [...a]; for (let i=a.length-1;i>0;i--) { const j = Math.floor(rand(t)*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  const mech = pick(['bee','weed','lan','ice']), o = {rel:2, w:{stone:.02}, daily:ds};
  if (mech==='bee') { o.stones = shuf(R2).slice(0,3); o.rel = 3; o.w.bee = .07; }
  if (mech==='weed') { o.weeds = shuf(R3E).slice(0,3); o.spread = 7; }
  if (mech==='lan') o.lan = shuf([...R2,...R2E]).slice(0,3);
  if (mech==='ice') o.ice = shuf([...R3C,...R3E]).slice(0,8);
  return G('Vườn Hôm Nay', Math.floor(rand(t)*4), o);
}

function rand(st) { // mulberry32 keeps its seed in the state so undo cannot reroll the deck
  st.rng = (st.rng + 0x6D2B79F5) | 0; let t = st.rng;
  t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const free = (st, k) => st.keys.includes(k) && !st.grid[k] && !st.ice[k];
const empties = st => st.keys.filter(k => free(st, k)).length;
const weedsLeft = st => st.keys.filter(k => st.grid[k] && st.grid[k].k==='w').length;
const iceLeft = st => Object.keys(st.ice).length;
const lanLit = st => Object.values(st.lan).filter(v => v).length;
function draw(st) {
  const w = st.g.w, x = rand(st), sp = Math.floor(rand(st) * st.g.sp);
  let a = w.stone; if (x < a && empties(st) > 4) return {k:'s'};
  a += w.bee; if (x < a) return {k:'b'};
  a += w.dew; if (x < a) return {k:'d'};
  a += w.bud; if (x < a) return {k:'f',sp,st:1};
  return {k:'f',sp,st:0};
}
function newGame(def, idx, seed) {
  const holes = new Set(def.holes);
  const st = {idx, g:def, rng:seed|0, keys:hexKeys(def.r).filter(k => !holes.has(k)), grid:{}, ice:{}, lan:{},
    score:0, moves:0, released:0, undos:3, usedUndo:false, hold:null, status:'play', next:[], needWeeds:def.weeds.length>0};
  const ok = k => st.keys.includes(k);
  def.stones.filter(ok).forEach(k => st.grid[k] = {k:'s'});
  def.weeds.filter(ok).forEach(k => st.grid[k] = {k:'w'});
  def.ice.filter(ok).forEach(k => st.ice[k] = 1);
  def.lan.filter(ok).forEach(k => st.lan[k] = 0);
  st.cur = draw(st); st.next = [draw(st), draw(st)];
  return st;
}
const neigh = (st, k) => { const [q,r] = k.split(',').map(Number); return DIRS.map(d => (q+d[0])+','+(r+d[1])).filter(n => st.keys.includes(n)); };
function group(st, grid, k) {
  const p = grid[k]; if (!p || p.k !== 'f') return [];
  const seen = new Set([k]), todo = [k];
  while (todo.length) for (const n of neigh(st, todo.pop())) {
    const o = grid[n];
    if (o && o.k==='f' && o.sp===p.sp && o.st===p.st && !seen.has(n)) { seen.add(n); todo.push(n); }
  }
  return [...seen];
}
const beeTargets = st => st.keys.filter(k => st.grid[k] && st.grid[k].k==='f' && st.grid[k].st < MAX_ST);
function canPlace(st, k, p = st.cur) {
  if (p.k==='b') { const t = beeTargets(st); return t.length ? t.includes(k) : free(st, k); }
  return free(st, k);
}
function resolveDew(st, k) { // dew becomes whichever flower gives the biggest merge here
  const n = st.g.sp, grid = {...st.grid};
  for (let s = MAX_ST; s >= 0; s--) for (let sp = 0; sp < n; sp++) {
    grid[k] = {k:'f',sp,st:s};
    if (group(st, grid, k).length >= 3) return grid[k];
  }
  const adj = neigh(st, k).map(a => st.grid[a]).filter(p => p && p.k==='f').sort((a,b) => a.st-b.st)[0];
  return adj ? {k:'f',sp:adj.sp,st:adj.st} : {k:'f',sp:st.moves % n,st:0};
}
function previewOf(st, k) { // what would happen if the held piece landed on k
  if (!canPlace(st, k)) return null;
  let p = st.cur;
  if (p.k==='b') {
    const t = st.grid[k]; if (!t) return {piece:p, cells:[], away:true};
    p = {k:'f',sp:t.sp,st:t.st+1};
  } else if (p.k==='d') p = resolveDew(st, k);
  if (p.k !== 'f') return {piece:st.cur, cells:[]};
  const grid = {...st.grid, [k]:p}, g = group(st, grid, k);
  return {piece: st.cur.k==='b' ? st.cur : p, cells: g.length >= 3 ? g : [], grown: st.cur.k==='b' ? p : null};
}
function won(st) {
  return st.g.rel > 0 && st.released >= st.g.rel && (!st.needWeeds || !weedsLeft(st)) && !iceLeft(st) && lanLit(st) === Object.keys(st.lan).length;
}
const hasMove = st => st.keys.some(k => canPlace(st, k)) || (st.hold && st.keys.some(k => canPlace(st, k, st.hold)));
function place(st, k) {
  if (st.status !== 'play' || !canPlace(st, k)) return null;
  const events = []; let grow = true;
  if (st.cur.k==='b') {
    const t = st.grid[k];
    if (t) { st.grid[k] = {k:'f',sp:t.sp,st:t.st+1}; st.score += 15; events.push({t:'bee',k,from:t,p:st.grid[k]}); }
    else { events.push({t:'beeAway',k}); grow = false; }
  } else {
    const p = st.cur.k==='d' ? resolveDew(st, k) : st.cur;
    st.grid[k] = p; events.push({t:'place',k,p,dew:st.cur.k==='d'});
  }
  let chain = 0;
  while (grow && st.grid[k] && st.grid[k].k === 'f') {
    const q = st.grid[k], g = group(st, st.grid, k);
    if (g.length < 3) break;
    chain++;
    const touch = [...new Set(g.flatMap(c => neigh(st, c)))].filter(c => !g.includes(c));
    const melted = touch.filter(c => st.ice[c]); melted.forEach(c => delete st.ice[c]);
    const lit = g.filter(c => st.lan[c] === 0); lit.forEach(c => st.lan[c] = 1);
    const extra = melted.length * 25 + lit.length * 100;
    if (q.st < MAX_ST) {
      const pulled = touch.filter(c => st.grid[c] && st.grid[c].k==='w'); pulled.forEach(c => delete st.grid[c]);
      const gain = [10,40][q.st] * g.length * chain + pulled.length * 20 + extra;
      g.forEach(c => delete st.grid[c]);
      st.grid[k] = {k:'f',sp:q.sp,st:q.st+1};
      st.score += gain;
      events.push({t:'merge',cells:g,to:k,from:q,p:st.grid[k],gain,chain,pulled,melted,lit});
    } else {
      g.forEach(c => delete st.grid[c]);
      const swept = touch.filter(c => st.grid[c]).map(c => ({k:c,p:st.grid[c]}));
      swept.forEach(c => delete st.grid[c.k]);
      const gain = (400 + swept.length * 15) * chain + extra;
      st.score += gain; st.released++; st.undos++;
      events.push({t:'release',cells:g,from:q,swept,gain,to:k,chain,melted,lit});
      break;
    }
  }
  st.moves++;

function showLost() {
  const g = state.g, key = progKey(state);
  if (g.rel < 0) { const prev = store.progress[key] || {stars:0,best:0}; store.progress[key] = {stars:0,best:Math.max(prev.best,state.score)}; save(); }
  const best = store.progress[key] && store.progress[key].best;
  const missing = [];
  if (g.rel > 0 && state.released < g.rel) missing.push(`nở rộ ${state.released} trên ${g.rel} lần`);
  if (state.needWeeds && weedsLeft(state)) missing.push(`còn ${weedsLeft(state)} cỏ dại`);
  if (iceLeft(state)) missing.push(`còn ${iceLeft(state)} lá băng`);
  const lt = Object.keys(state.lan).length; if (lt && lanLit(state) < lt) missing.push(`mới sáng ${lanLit(state)} trên ${lt} đèn`);
  const canUndo = state.undos && hist.length;
  openVeil(`<h2>Hồ đã kín chỗ</h2>
    <p>${g.rel < 0 ? `Lần này có ${state.released} lần nở rộ và ${state.score.toLocaleString('vi-VN')} điểm${best?`. Kỷ lục của bạn là ${best.toLocaleString('vi-VN')}`:''}.` : `Không còn chỗ để đặt cây. Vườn đang ${missing.join(', ')}.`}</p>
    <div class="row">${canUndo?`<button class="btn main" data-act="undo">Hoàn tác (${state.undos})</button>`:''}<button class="btn${canUndo?'':' main'}" data-go="${state.idx}">Trồng lại</button><button class="btn" data-act="gardens">Các vườn</button></div>`);
}
function showGardens() {
  let unlocked = 0; GARDENS.forEach((_,i) => { if (store.progress[i] && store.progress[i].stars) unlocked = Math.max(unlocked,i+1); });
  const ts = totalStars();
  let html = `<h2>Bốn mùa, hai mươi bốn vườn</h2>`;
  const dk = 'd' + today(), dp = store.progress[dk], ep = store.progress.endless;
  html += `<div class="pick" style="grid-template-columns:repeat(2,minmax(0,1fr))">
    <button data-go="daily" class="${state.g.daily?'now':''}">Vườn hôm nay<em class="${dp?'':'soft'}">${dp ? '★'.repeat(dp.stars) + ' · ' + dp.best.toLocaleString('vi-VN') : 'Đổi mỗi ngày'}</em></button>
    <button data-go="endless" class="${state.idx==='endless'?'now':''}">${ENDLESS.n}<em class="${ep&&ep.best?'':'soft'}">${ep&&ep.best ? 'Kỷ lục ' + ep.best.toLocaleString('vi-VN') : 'Chơi đến khi kín hồ'}</em></button></div>`;
  SEASONS.forEach((s,si) => {
    html += `<div class="season">${s}<small>${SEASON_NOTE[si]}</small></div><div class="pick">`;
    GARDENS.forEach((g,i) => { if (g.s!==si) return; const p = store.progress[i];
      html += `<button data-go="${i}" class="${state.idx===i?'now':''}" ${i>unlocked?'disabled':''}>${i+1}. ${g.n}<em class="${p&&p.stars?'':'soft'}">${p&&p.stars?'★'.repeat(p.stars):i>unlocked?'Chưa mở':''}</em></button>`; });
    html += '</div>';
  });
  html += `<div class="season">Hồ của bạn<small>${ts} trên ${GARDENS.length*3} sao</small></div><div class="decor">`;
  DECOR.forEach(d => { html += ts >= d.need ? `<b>${d.n}</b>` : `<span>${d.n}: cần ${d.need} sao</span>`; });
  html += '</div><div class="row" style="margin-top:16px"><button class="btn" data-act="close">Đóng</button></div>';
  openVeil(html);
}
function showHelp() {
  openVeil(`<h2>Trồng thong thả, không có đồng hồ</h2><ul>
    <li>Chạm vào một lá sen trống để đặt cây đang cầm.</li>
    <li>Ba cây cùng loài, cùng tuổi nằm sát nhau sẽ gộp thành một cây lớn hơn ngay ô bạn vừa đặt: mầm thành nụ, nụ thành hoa. Gộp nối tiếp nhau thành chuỗi được nhân điểm.</li>
    <li>Ba hoa cùng loài nở rộ rồi bay đi, cuốn theo mọi thứ sát bên kể cả đá và cỏ. Mỗi lần như vậy bạn được thêm 1 hoàn tác.</li>
    <li>Giọt sương tự hoá thành cây hợp nhất. Ong làm một cây lớn thêm một tuổi. Đá thì không gộp được.</li>
    <li>Mùa hạ có cỏ dại lan dần, mùa thu có đèn lồng cần thắp, mùa đông có băng cần làm tan. Gộp cây ngay sát hoặc ngay trên chúng để xử lý.</li>
    <li>Giỏ giữ một cây để dùng sau, đổi lúc nào cũng được.</li>
    <li>Sao kiếm được sẽ mở thêm cá koi, chuồn chuồn, đom đóm và hoa đăng cho hồ.</li>
    </ul><p style="color:var(--ink-soft);font-size:13px">Phím tắt: mũi tên để chọn lá, Enter để đặt, H để dùng giỏ, Z để hoàn tác.</p>
    <div class="row"><button class="btn main" data-act="close">Trồng tiếp</button></div>`);
}
$('card').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.go!==undefined) { const v = b.dataset.go; startGarden(/^\d+$/.test(v) ? +v : v); }
  else if (b.dataset.act==='close') closeVeil();
  else if (b.dataset.act==='undo') undo();
  else if (b.dataset.act==='gardens') showGardens();
});
$('veil').addEventListener('click', e => { if (e.target===$('veil') && state.status==='play') closeVeil(); });

/* ---------- input ---------- */
function cellAt(ev) {
  const b = cv.getBoundingClientRect(), x = ev.clientX-b.left, y = ev.clientY-b.top;
  let best = null, bd = size*size*1.05;
  for (const k of state.keys) { const dx=cellXY[k][0]-x, dy=cellXY[k][1]-y, d=dx*dx+dy*dy; if (d<bd) { bd=d; best=k; } }
  return best;
}
cv.addEventListener('pointermove', e => { kbd = false; hover = cellAt(e); });
cv.addEventListener('pointerleave', () => { if (!kbd) hover = null; });
cv.addEventListener('pointerdown', e => { kbd = false; hover = cellAt(e); });
cv.addEventListener('pointerup', e => {
  const k = cellAt(e);
  if (k && !busy && state.status==='play' && !canPlace(state,k)) say(state.ice[k] ? 'Lá này đang đóng băng. Gộp cây ngay sát để làm tan.' : state.cur.k==='b' ? 'Ong chỉ đậu lên mầm hoặc nụ.' : 'Lá này đã có cây.');
  if (k) act(k);
  if (e.pointerType!=='mouse') hover = null;
});
function hold() { if (busy) return; swapHold(state); refresh(); save(); tone(2,0,.05,.4); }
$('hold').addEventListener('click', hold);
$('undo').addEventListener('click', undo);
$('gardens').addEventListener('click', showGardens);
$('help').addEventListener('click', showHelp);
$('snd').addEventListener('click', () => { store.sound = !store.sound; refresh(); save(); tone(4,0,.08,.5); });
const ARROW = {ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]};
addEventListener('keydown', e => {
  if (!$('veil').hidden) { if (e.key==='Escape' && state.status==='play') closeVeil(); return; }
  if (e.key==='z'||e.key==='Z') return undo();
  if (e.key==='h'||e.key==='H') return hold();
  if (document.activeElement!==cv) return;
  if (ARROW[e.key]) {
    e.preventDefault(); kbd = true;
    if (!hover) { hover = state.keys.find(k=>k==='0,0') || state.keys[0]; return; }
    const [dx,dy] = ARROW[e.key], [x,y] = cellXY[hover]; let best = null, bs = Infinity;
    for (const k of state.keys) { if (k===hover) continue; const ax=cellXY[k][0]-x, ay=cellXY[k][1]-y, along=ax*dx+ay*dy; if (along<=size*.4) continue; const s=along+Math.abs(ax*dy-ay*dx)*2; if (s<bs) { bs=s; best=k; } }
    if (best) hover = best;
  } else if ((e.key==='Enter'||e.key===' ') && hover) { e.preventDefault(); act(hover); }
});
new ResizeObserver(() => { layout(); }).observe($('stage'));
document.fonts && document.fonts.ready && document.fonts.ready.then(() => layout());

/* ---------- boot ---------- */
function buildLadder() {
  const steps = [{k:'f',sp:0,st:0},{k:'f',sp:0,st:1},{k:'f',sp:0,st:2}], d = Math.min(devicePixelRatio||1,2.5), box = $('ladder');
  steps.forEach((p,i) => {
    const c = document.createElement('canvas'); c.width = c.height = 34*d; c.style.width = c.style.height = '34px';
    const x = c.getContext('2d'); x.scale(d,d); drawPiece(x,17,17,14,p); box.append(c);
    const t = document.createElement('span'); t.textContent = i<2 ? '3 →' : '3 → bay đi'; box.append(t);
  });
}
function start(data) {
  load(); buildLadder();
  let saved = (data && data.state) || store.current;
  if (saved && saved.g && saved.g.daily && saved.g.daily !== today()) saved = null; // yesterday's garden expires
  if (saved && saved.status === 'play' && saved.g) startGarden(saved.idx, saved);
  else if (saved && saved.g) startGarden(saved.idx);
  else { state = newGame(GARDENS[0], 0, 20261107); startGarden(0, state); }
  window.claude?.hot?.snapshot?.(() => ({state}));
  requestAnimationFrame(frame);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
<script src="/appnav.js" defer></script>
