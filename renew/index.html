<script>
// Trang này giữ nguyên địa chỉ nhưng chạy app chung ở /gi/.
// Luôn tải bản mới nhất của /gi/index.html → sửa code ở /gi/ là trang này tự cập nhật theo.
// Bản cũ của trang này: /renew/cu.html
(function () {
  var DEF = 'pack';
  var MAP = { 'check-status': 'pack', 'status': 'pack', 'ytb-status': 'pack', 'fam-issues': 'pack', 'lookup_status': 'pack', 'checkstatus': 'pack' };
  var h = location.hash.slice(1), t = MAP[h] || h || DEF;
  if (t) history.replaceState(null, '', location.pathname + location.search + '#' + t);
  fetch('/gi/index.html', { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function (html) {
      html = html.replace('<head>', '<head><base href="/gi/">');
      document.open(); document.write(html); document.close();
    })
    .catch(function () { location.replace('/gi/' + location.search + location.hash); });
})();
</script>
