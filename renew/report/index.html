<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Báo Lỗi Fam Subscription - Go DNC</title>
    <meta name="description" content="Trang gửi báo lỗi sự cố nhóm tài khoản Fam (RN) tự động cho khách hàng Go DNC.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a13;
            color: #f3f4f6;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="reportPageApp()" x-init="init()" class="antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden"
      style="background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 50%), radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 50%), #070a13;">

    <!-- Top Accent Line -->
    <div class="h-1.5 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

    <!-- Header -->
    <header class="py-5 px-4 max-w-4xl mx-auto w-full flex items-center justify-between z-10">
        <a href="https://godnc.com/" class="flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
                <span class="font-black text-white text-lg tracking-wider">DNC</span>
            </div>
            <div>
                <div class="font-extrabold text-white text-base md:text-lg tracking-tight flex items-center gap-2">
                    Fam Issue Tracker
                    <span class="text-[10px] font-bold uppercase tracking-wider bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 px-2 py-0.5 rounded-full">Báo Lỗi</span>
                </div>
            </div>
        </a>

        <a href="../status/" class="flex items-center gap-1.5 text-xs bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 px-3.5 py-2 rounded-xl transition-all font-semibold">
            <i data-lucide="search" class="w-3.5 h-3.5"></i>
            <span>Tra cứu trạng thái</span>
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12 z-10">
        <div class="w-full max-w-lg mx-auto">

            <div class="bg-gray-900/70 border border-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-6 md:p-8 relative overflow-hidden">
                <div class="absolute -top-24 -right-24 w-48 h-48 bg-indigo-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Page Header -->
                <div class="text-center mb-8">
                    <div class="w-12 h-12 rounded-2xl bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">Gửi Báo Lỗi Nhóm (Fam)</h1>
                    <p class="text-xs md:text-sm text-gray-400 mt-2">
                        Nhập Email nhận slot của bạn. Trạng thái báo lỗi sẽ áp dụng chung cho <strong class="text-indigo-300 font-semibold">toàn bộ 5 thành viên</strong> trong nhóm.
                    </p>
                </div>

                <!-- Inline Form Feedback / Error Message (Hiển thị ngay trong khung form) -->
                <div x-show="formMessage.text" x-transition x-cloak class="mb-5 p-4 rounded-2xl border text-xs font-medium flex items-start gap-2.5"
                     :class="{
                         'bg-rose-950/60 border-rose-500/50 text-rose-200': formMessage.type === 'error',
                         'bg-amber-950/60 border-amber-500/50 text-amber-200': formMessage.type === 'warning',
                         'bg-emerald-950/60 border-emerald-500/50 text-emerald-200': formMessage.type === 'success'
                     }">
                    <i :data-lucide="formMessage.icon || 'alert-circle'" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
                    <span x-text="formMessage.text"></span>
                </div>

                <!-- Form Section (Khi chưa submit thành công) -->
                <template x-if="!reportResult">
                    <form @submit.prevent="submitReportForm()" class="space-y-5">
                        <div>
                            <label for="report-email" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                                Email đăng ký nhận slot *
                            </label>
                            <div class="relative">
                                <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                                    <i data-lucide="mail" class="w-4 h-4"></i>
                                </div>
                                <input type="email" id="report-email" x-model="form.email" required placeholder="vidu@gmail.com"
                                       class="w-full bg-gray-950/60 border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm placeholder-gray-500">
                            </div>
                        </div>

                        <div>
                            <label for="report-msg" class="block text-xs font-semibold text-gray-300 uppercase tracking-wider mb-2">
                                Mô tả sự cố (không bắt buộc)
                            </label>
                            <textarea id="report-msg" x-model="form.message" rows="3" placeholder="Ví dụ: Tài khoản bị văng nhóm / Bị mất Premium / Cần cấp lại slot..."
                                      class="w-full bg-gray-950/60 border border-gray-800 rounded-xl px-4 py-3 text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm placeholder-gray-500"></textarea>
                        </div>

                        <button type="submit" :disabled="loading"
                                class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-500 hover:to-purple-500 text-white font-bold py-3.5 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2 text-sm disabled:opacity-50">
                            <template x-if="!loading">
                                <div class="flex items-center gap-2">
                                    <i data-lucide="send" class="w-4 h-4"></i>
                                    <span>Gửi Báo Lỗi Ngay</span>
                                </div>
                            </template>
                            <template x-if="loading">
                                <div class="flex items-center gap-2">
                                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span>Đang ghi nhận...</span>
                                </div>
                            </template>
                        </button>
                    </form>
                </template>

                <!-- Result Card (Thay thế Form sau khi gửi thành công) -->
                <template x-if="reportResult">
                    <div class="space-y-5">
                        <div class="p-5 rounded-2xl border bg-gray-950/80 border-gray-800 space-y-4">
                            <div class="flex items-start justify-between gap-3 border-b border-gray-800 pb-3">
                                <div>
                                    <span class="text-xs text-gray-400 block">Mã nhóm Fam của bạn:</span>
                                    <span class="text-3xl font-black text-indigo-400 font-mono tracking-tight" x-text="reportResult.stt_group"></span>
                                </div>
                                <span class="px-3 py-1.5 rounded-full text-xs font-bold border flex items-center gap-1.5"
                                      :class="getStatusBadgeClass(reportResult.status)">
                                    <span class="w-2 h-2 rounded-full animate-ping bg-amber-400"></span>
                                    <span x-text="reportResult.status"></span>
                                </span>
                            </div>

                            <p class="text-sm text-gray-200" x-text="reportResult.message"></p>

                            <!-- Recurring Banner -->
                            <div x-show="reportResult.is_recurring" class="p-3 bg-rose-950/50 border border-rose-500/40 rounded-xl text-rose-200 text-xs flex items-start gap-2.5">
                                <i data-lucide="zap" class="w-4 h-4 text-rose-400 flex-shrink-0 mt-0.5"></i>
                                <div>
                                    <strong class="font-semibold text-rose-300">Cảnh báo tái phát (Lần thứ <span x-text="reportResult.recur_count"></span>):</strong>
                                    <span> Sự cố vừa xảy ra lại trong 24h. Đội ngũ kỹ thuật sẽ ưu tiên kiểm tra dứt điểm.</span>
                                </div>
                            </div>

                            <div class="p-3 bg-gray-900/60 rounded-xl text-[11px] text-gray-400 flex items-center gap-2">
                                <i data-lucide="users" class="w-4 h-4 text-indigo-400 flex-shrink-0"></i>
                                <span>Trạng thái này áp dụng đồng bộ cho cả 5 thành viên trong nhóm Fam <strong class="text-gray-200" x-text="reportResult.stt_group"></strong>.</span>
                            </div>
                        </div>

                        <!-- Forward Button to Status Page -->
                        <a :href="'../status/?email=' + encodeURIComponent(form.email)"
                           class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="search" class="w-4 h-4"></i>
                            <span>Tra Cứu Trạng Thái Chi Tiết</span>
                        </a>

                        <button @click="reportResult = null; formMessage = { text: '', type: '', icon: '' }"
                                class="w-full bg-white/5 hover:bg-white/10 text-gray-400 hover:text-white font-medium py-2.5 rounded-xl text-xs transition-all">
                            Gửi báo lỗi cho tài khoản khác
                        </button>
                    </div>
                </template>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-4 text-center border-t border-white/5 text-xs text-gray-500 z-10">
        <p>© 2026 Go DNC — Fam Issue Tracker System (RN Groups). All rights reserved.</p>
    </footer>

    <script>
        function reportPageApp() {
            return {
                webAppUrl: localStorage.getItem('FAM_TRACKER_WEBAPP_URL') || '',
                useMock: !localStorage.getItem('FAM_TRACKER_WEBAPP_URL'),
                loading: false,
                form: { email: '', message: '' },
                formMessage: { text: '', type: '', icon: '' },
                reportResult: null,

                init() {
                    setTimeout(() => lucide.createIcons(), 50);
                },

                getStatusBadgeClass(status) {
                    switch (status) {
                        case 'Mới': return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                        case 'Đang xử lý': return 'bg-blue-500/20 text-blue-300 border-blue-500/40';
                        case 'Đã xử lý': return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
                        default: return 'bg-gray-500/20 text-gray-300 border-gray-500/40';
                    }
                },

                async submitReportForm() {
                    if (!this.form.email) return;
                    this.loading = true;
                    this.formMessage = { text: '', type: '', icon: '' };
                    this.reportResult = null;

                    const emailClean = this.form.email.trim().toLowerCase();

                    try {
                        let res;
                        if (this.useMock) {
                            res = await this.mockSubmit(emailClean, this.form.message);
                        } else {
                            res = await this.callApi('submitReport', { email: emailClean, message: this.form.message });
                        }

                        if (res.success) {
                            this.reportResult = res;
                            this.formMessage = { text: res.message, type: 'success', icon: 'check-circle-2' };
                        } else {
                            // Hiện thông báo lỗi ngay trong khung form
                            this.formMessage = { 
                                text: res.message || 'Không tìm thấy tài khoản với email này.', 
                                type: 'error', 
                                icon: 'alert-triangle' 
                            };
                        }
                    } catch (err) {
                        this.formMessage = { 
                            text: err.message || 'Hệ thống phản hồi chậm, vui lòng thử lại.', 
                            type: 'error', 
                            icon: 'wifi-off' 
                        };
                    } finally {
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 50);
                    }
                },

                async callApi(action, payload) {
                    const url = new URL(this.webAppUrl);
                    url.searchParams.append('action', action);

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000); // 15s timeout

                    try {
                        const response = await fetch(url.toString(), {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        return await response.json();
                    } catch (err) {
                        clearTimeout(timeoutId);
                        if (err.name === 'AbortError') {
                            throw new Error('Hệ thống phản hồi chậm, vui lòng thử lại. Nếu tiếp tục xảy ra, liên hệ admin.');
                        }
                        throw err;
                    }
                },

                async mockSubmit(email, msg) {
                    await new Promise(r => setTimeout(r, 400));
                    const mockCache = JSON.parse(localStorage.getItem('MOCK_FAM_CACHE') || '{"khach1@gmail.com":"RN34","khach2@gmail.com":"RN34","admin@godnc.com":"RN34"}');
                    const sttGroup = mockCache[email];
                    if (!sttGroup) {
                        return {
                            success: false,
                            error: 'email_not_found',
                            message: 'Không tìm thấy tài khoản với email này. Có thể dữ liệu chưa được đồng bộ, vui lòng thử lại sau ít phút hoặc liên hệ CTV.'
                        };
                    }
                    return {
                        success: true,
                        stt_group: sttGroup,
                        status: 'Mới',
                        is_recurring: false,
                        recur_count: 0,
                        message: `Đã tạo báo cáo sự cố thành công cho Fam ${sttGroup}.`
                    };
                }
            };
        }
    </script>
</body>
</html>
