<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Trạng Thái Fam Subscription - Go DNC</title>
    <meta name="description" content="Hệ thống tra cứu trạng thái xử lý và lịch sử khắc phục sự cố nhóm tài khoản Fam (RN) tự động cho khách hàng Go DNC.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            color: #0f172a;
        }
        [x-cloak] { display: none !important; }
        .card-shadow {
            box-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
        }
    </style>
</head>
<body x-data="customerStatusApp()" x-init="init()" class="antialiased min-h-screen flex flex-col justify-between relative">

    <!-- Top Accent Line -->
    <div class="h-1.5 w-full bg-gradient-to-r from-blue-600 via-indigo-600 to-purple-600"></div>

    <!-- Header -->
    <header class="bg-white/80 backdrop-blur-md border-b border-gray-200 py-3.5 px-4 shadow-sm z-10 sticky top-0">
        <div class="max-w-4xl mx-auto w-full flex items-center justify-between">
            <a href="https://godnc.com/" class="flex items-center gap-3 group">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-600 flex items-center justify-center shadow-md shadow-blue-500/20 group-hover:scale-105 transition-transform">
                    <span class="font-black text-white text-base tracking-wider">DNC</span>
                </div>
                <div>
                    <div class="font-extrabold text-gray-900 text-base md:text-lg tracking-tight flex items-center gap-2">
                        Fam Issue Tracker
                        <span class="text-[10px] font-bold uppercase tracking-wider bg-blue-100 text-blue-700 border border-blue-200 px-2 py-0.5 rounded-full">RN Status System</span>
                    </div>
                    <p class="text-xs text-gray-500">Tra cứu tiến độ & Lịch sử khắc phục sự cố Fam</p>
                </div>
            </a>

            <div class="flex items-center gap-2">
                <a href="../../ctv/renew/" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 text-blue-700 border border-blue-200 rounded-xl text-xs font-bold transition-all flex items-center gap-1.5 shadow-sm">
                    <i data-lucide="users" class="w-3.5 h-3.5"></i>
                    <span>Khu Vực CTV</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-6 md:py-10 z-10">
        <div class="w-full max-w-xl mx-auto space-y-6">

            <div class="bg-white border border-gray-200 rounded-3xl card-shadow p-6 md:p-8 relative overflow-hidden space-y-6">
                
                <div class="text-center mb-6">
                    <div class="w-12 h-12 rounded-2xl bg-blue-50 text-blue-600 border border-blue-100 flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="search" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-black text-gray-900 tracking-tight">Tra Cứu Trạng Thái Fam</h1>
                    <p class="text-xs md:text-sm text-gray-500 mt-2">
                        Nhập email đăng ký để kiểm tra trạng thái gia hạn, tiến độ xử lý và lịch sử fix của nhóm Fam (RN).
                    </p>
                </div>

                <!-- Form Search Email -->
                <form @submit.prevent="checkStatus()" class="space-y-4">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                            </div>
                            <input type="email" x-model="statusEmail" required placeholder="Nhập email của bạn..."
                                   class="w-full bg-gray-50 border border-gray-200 rounded-xl pl-10 pr-4 py-3 text-gray-900 focus:bg-white focus:border-blue-600 focus:outline-none transition-all text-sm font-semibold placeholder-gray-400">
                        </div>
                        <button type="submit" :disabled="loading"
                                class="bg-blue-600 hover:bg-blue-700 text-white font-extrabold py-3 px-6 rounded-xl shadow-lg shadow-blue-600/20 transition-all flex items-center justify-center gap-2 text-sm whitespace-nowrap disabled:opacity-50">
                            <template x-if="!loading">
                                <div class="flex items-center gap-1.5">
                                    <i data-lucide="search" class="w-4 h-4"></i>
                                    <span>Tra Cứu</span>
                                </div>
                            </template>
                            <template x-if="loading">
                                <div class="flex items-center gap-1.5">
                                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span>Đang kiểm tra...</span>
                                </div>
                            </template>
                        </button>
                    </div>
                </form>

                <!-- Error Alert Message -->
                <div x-show="errorMessage" x-transition x-cloak class="p-4 rounded-2xl bg-rose-50 border border-rose-200 text-rose-800 text-xs font-bold flex items-start gap-2.5">
                    <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0 mt-0.5 text-rose-600"></i>
                    <span x-text="errorMessage"></span>
                </div>

                <!-- KẾT QUẢ TRA CỨU TRẠNG THÁI -->
                <div x-show="statusResult" x-transition x-cloak class="mt-6 space-y-5">
                    
                    <template x-if="statusResult && !statusResult.has_ticket">
                        <div class="p-6 bg-blue-50/60 border border-blue-200 rounded-2xl space-y-4">
                            <div class="flex items-center justify-between border-b border-blue-200/80 pb-3 gap-3">
                                <div class="flex items-center gap-3">
                                    <div class="w-10 h-10 rounded-xl bg-blue-100 text-blue-700 flex items-center justify-center font-bold flex-shrink-0">
                                        <i data-lucide="info" class="w-5 h-5"></i>
                                    </div>
                                    <div>
                                        <span class="text-xs text-gray-500 block font-medium">Mã nhóm Fam đối chiếu:</span>
                                        <span class="text-2xl font-black text-blue-600 font-mono tracking-tight" x-text="statusResult.stt_group"></span>
                                    </div>
                                </div>
                                <div>
                                    <span class="px-3 py-1 bg-gray-100 text-gray-700 border border-gray-300 rounded-full text-xs font-bold">Chưa ghi nhận sự cố mở</span>
                                </div>
                            </div>

                            <div class="space-y-2 text-xs text-gray-700 font-medium leading-relaxed">
                                <p>
                                    Email của bạn thuộc nhóm Fam <strong class="text-blue-700 font-mono" x-text="statusResult.stt_group"></strong>. Dữ liệu hệ thống đối chiếu ghi nhận <strong>hiện tại không có báo lỗi sự cố nào đang mở</strong> cho nhóm này từ phía CTV hoặc Admin.
                                </p>
                            </div>

                            <div class="p-3.5 bg-white rounded-xl border border-blue-200 text-xs text-gray-700 space-y-1.5 font-medium shadow-2xs">
                                <strong class="text-blue-900 block text-xs font-bold">⚠️ Nếu tài khoản của bạn đang gặp sự cố (mất Premium / văng nhóm):</strong>
                                <p class="text-[11px] text-gray-600">Vui lòng liên hệ báo ngay cho Cộng Tác Viên (CTV) / Đơn vị bán hàng cho bạn để CTV tạo ticket báo lỗi trên hệ thống cho Đội ngũ Kỹ thuật tiếp nhận xử lý dứt điểm.</p>
                            </div>
                        </div>
                    </template>

                    <template x-if="statusResult && statusResult.has_ticket">
                        <div class="space-y-5">
                            
                            <!-- Card Header Info -->
                            <div class="bg-gray-50 border border-gray-200 rounded-2xl p-5 space-y-4">
                                <div class="flex items-center justify-between border-b border-gray-200 pb-3">
                                    <div>
                                        <span class="text-xs text-gray-500 block font-medium">Mã nhóm Fam (5 người):</span>
                                        <span class="text-3xl font-black text-blue-600 font-mono tracking-tight" x-text="statusResult.stt_group"></span>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-xs text-gray-500 block mb-1 font-medium">Trạng thái</span>
                                        <span class="px-3.5 py-1.5 rounded-full text-xs font-bold border inline-flex items-center gap-1.5 shadow-xs"
                                              :class="getStatusBadgeClass(statusResult.status)">
                                            <span class="w-2 h-2 rounded-full" :class="getStatusDotClass(statusResult.status)"></span>
                                            <span x-text="statusResult.status"></span>
                                        </span>
                                    </div>
                                </div>

                                <!-- THÔNG BÁO HƯỚNG DẪN KHI ĐÃ ĐƯỢC FIX XONG (NẾU STATUS === 'Đã xử lý') -->
                                <template x-if="statusResult.status === 'Đã xử lý'">
                                    <div class="p-4 bg-emerald-50 border border-emerald-300 rounded-2xl text-emerald-900 space-y-3 shadow-sm">
                                        <div class="flex items-center gap-2 text-sm font-black text-emerald-800">
                                            <i data-lucide="check-circle-2" class="w-5 h-5 text-emerald-600 flex-shrink-0"></i>
                                            <span>🎉 SỰ CỐ FAM ĐÃ ĐƯỢC KỸ THUẬT XỬ LÝ HOÀN TẤT!</span>
                                        </div>
                                        <p class="text-xs text-emerald-900 font-medium leading-relaxed">
                                            Tài khoản Fam <strong><span x-text="statusResult.stt_group"></span></strong> đã được kỹ thuật khắc phục xong lúc <strong><span x-text="formatDate(statusResult.resolved_at)"></span></strong>.
                                        </p>
                                        
                                        <!-- Hướng dẫn thao tác cho khách -->
                                        <div class="p-3 bg-white rounded-xl border border-emerald-200 text-xs text-emerald-900 space-y-1.5 font-medium shadow-2xs">
                                            <strong class="text-emerald-800 font-bold block text-xs">👉 HƯỚNG DẪN KIỂM TRA CHO KHÁCH HÀNG:</strong>
                                            <div class="space-y-1 text-[11px] text-gray-700">
                                                <p>1. Vui lòng mở lại ứng dụng (YouTube App / Website) để kiểm tra xem đã có trạng thái Premium chưa.</p>
                                                <p>2. Nếu chưa thấy Premium, bạn hãy <strong>ĐĂNG XUẤT tài khoản ra rồi ĐĂNG NHẬP LẠI</strong> (hoặc xóa cache ứng dụng) để làm mới dữ liệu.</p>
                                                <p>3. Nếu đã đăng nhập lại mà vẫn chưa được, vui lòng báo lại cho CTV chăm sóc để được cấp lại slot mới.</p>
                                            </div>
                                        </div>
                                    </div>
                                </template>

                                <!-- THÔNG BÁO KHI ĐANG XỬ LÝ -->
                                <template x-if="statusResult.status !== 'Đã xử lý'">
                                    <div class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-amber-900 text-xs space-y-1">
                                        <div class="flex items-center gap-2 font-bold text-amber-800">
                                            <i data-lucide="clock" class="w-4 h-4 text-amber-600"></i>
                                            <span>⏳ Kỹ thuật viên đang tiến hành kiểm tra & khắc phục cho nhóm Fam <strong x-text="statusResult.stt_group"></strong>.</span>
                                        </div>
                                        <p class="text-amber-800 text-[11px]">Vui lòng chờ trong ít phút, trạng thái sẽ tự động cập nhật ngay khi hoàn tất.</p>
                                    </div>
                                </template>

                                <!-- Grid 2 thông tin thời gian -->
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                    <div class="bg-white p-3 rounded-xl border border-gray-200 space-y-1 shadow-2xs">
                                        <span class="text-gray-500 block font-medium">📅 Thời gian báo lỗi</span>
                                        <span class="text-gray-900 font-bold block" x-text="formatDate(statusResult.created_at || statusResult.updated_at)"></span>
                                        <span class="text-[10px] text-blue-600 block font-bold" x-text="formatRelativeTime(statusResult.created_at || statusResult.updated_at)"></span>
                                    </div>
                                    <div class="bg-white p-3 rounded-xl border border-gray-200 space-y-1 shadow-2xs">
                                        <span class="text-gray-500 block font-medium">🔄 Cập nhật gần nhất</span>
                                        <span class="text-gray-900 font-bold block" x-text="formatDate(statusResult.updated_at)"></span>
                                        <span class="text-[10px] text-gray-500 block flex items-center gap-1">
                                            <i data-lucide="users" class="w-3.5 h-3.5 text-blue-600"></i>
                                            <span class="font-bold text-gray-900" x-text="statusResult.report_count"></span> thành viên đã báo
                                        </span>
                                    </div>
                                </div>

                                <div x-show="statusResult.is_recurring" class="p-3.5 bg-rose-50 border border-rose-200 rounded-xl text-rose-800 text-xs space-y-1">
                                    <div class="flex items-center gap-2 font-bold text-rose-900">
                                        <i data-lucide="alert-triangle" class="w-4 h-4 text-rose-600"></i>
                                        ⚡ Sự cố tái phát (Lần thứ <span x-text="statusResult.recur_count"></span> — Báo lại lúc <span x-text="formatDate(statusResult.updated_at)"></span>)
                                    </div>
                                </div>
                            </div>

                            <!-- LỊCH SỬ FIX & BÁO LỖI (FIX HISTORY TIMELINE) -->
                            <div x-show="statusResult.history_tickets && statusResult.history_tickets.length > 0" class="bg-white border border-gray-200 rounded-2xl p-5 space-y-3 card-shadow">
                                <h3 class="text-xs font-extrabold text-gray-900 uppercase tracking-wider flex items-center gap-2 border-b border-gray-100 pb-3">
                                    <i data-lucide="history" class="w-4 h-4 text-blue-600"></i>
                                    <span>Lịch Sử Xử Lý & Khắc Phục Của Fam (<span x-text="statusResult.stt_group"></span>)</span>
                                </h3>

                                <div class="space-y-2.5 pt-1">
                                    <template x-for="(ht, idx) in (statusResult.history_tickets || [])" :key="ht.ticket_id || idx">
                                        <div class="p-3 rounded-xl border text-xs space-y-1.5 transition-all"
                                             :class="ht.status === 'Đã xử lý' ? 'bg-green-50/50 border-green-200' : 'bg-gray-50 border-gray-200'">
                                            <div class="flex items-center justify-between font-bold">
                                                <div class="flex items-center gap-2">
                                                    <span class="px-2 py-0.5 rounded text-[10px] uppercase font-bold border"
                                                          :class="getStatusBadgeClass(ht.status)" x-text="ht.status"></span>
                                                    <span class="font-mono text-gray-700 text-[11px]" x-text="ht.ticket_id"></span>
                                                </div>
                                                <span class="text-[10px] text-gray-500" x-text="formatDate(ht.created_at)"></span>
                                            </div>

                                            <div class="text-[11px] text-gray-700 flex flex-wrap items-center justify-between gap-2 pt-0.5">
                                                <template x-if="ht.status === 'Đã xử lý'">
                                                    <div class="text-green-800 font-semibold flex items-center gap-1">
                                                        <i data-lucide="check-circle-2" class="w-3.5 h-3.5 text-green-600"></i>
                                                        <span>Xử lý xong lúc <strong x-text="formatDate(ht.resolved_at)"></strong> <span class="text-gray-500 font-normal" x-text="calcDuration(ht.created_at, ht.resolved_at)"></span></span>
                                                    </div>
                                                </template>
                                                <template x-if="ht.status !== 'Đã xử lý'">
                                                    <div class="text-amber-800 font-medium flex items-center gap-1">
                                                        <i data-lucide="clock" class="w-3.5 h-3.5 text-amber-600"></i>
                                                        <span>Đang xử lý...</span>
                                                    </div>
                                                </template>

                                                <template x-if="ht.note">
                                                    <div class="text-[10px] text-gray-600 font-mono bg-white px-2 py-0.5 rounded border border-gray-200">
                                                        Ghi chú: <span x-text="ht.note"></span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </template>
                                </div>
                            </div>

                        </div>
                    </template>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-4 text-center border-t border-gray-200 text-xs text-gray-400 bg-white">
        <p>© 2026 Go DNC — Fam Issue Tracker System. All rights reserved.</p>
    </footer>

    <script>
        function customerStatusApp() {
            return {
                webAppUrl: localStorage.getItem('FAM_TRACKER_WEBAPP_URL') || '',
                useMock: !localStorage.getItem('FAM_TRACKER_WEBAPP_URL'),
                statusEmail: '',
                errorMessage: '',
                statusResult: null,
                loading: false,

                init() {
                    const urlParams = new URLSearchParams(window.location.search);
                    const emailParam = urlParams.get('email');
                    if (emailParam) {
                        this.statusEmail = emailParam.trim();
                        this.checkStatus();
                    }
                    setTimeout(() => lucide.createIcons(), 50);
                },

                formatDate(isoStr) {
                    if (!isoStr) return '---';
                    try {
                        const d = new Date(isoStr);
                        if (isNaN(d.getTime())) return isoStr;
                        return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' +
                               d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit' });
                    } catch (e) { return isoStr; }
                },

                formatRelativeTime(isoStr) {
                    if (!isoStr) return '---';
                    try {
                        const d = new Date(isoStr);
                        if (isNaN(d.getTime())) return isoStr;
                        const now = Date.now();
                        const diffMs = now - d.getTime();
                        if (diffMs < 0) return 'Vừa xong';
                        const diffMins = Math.floor(diffMs / 60000);
                        if (diffMins < 1) return 'Vừa xong';
                        if (diffMins < 60) return `${diffMins} phút trước`;
                        const diffHours = Math.floor(diffMins / 60);
                        if (diffHours < 24) return `${diffHours} giờ trước`;
                        const diffDays = Math.floor(diffHours / 24);
                        return `${diffDays} ngày trước`;
                    } catch (e) { return isoStr; }
                },

                calcDuration(startIso, endIso) {
                    if (!startIso || !endIso) return '';
                    try {
                        const s = new Date(startIso).getTime();
                        const e = new Date(endIso).getTime();
                        if (isNaN(s) || isNaN(e) || e <= s) return '';
                        const diffMins = Math.round((e - s) / 60000);
                        if (diffMins < 60) return ` (sau ${diffMins} phút)`;
                        const hrs = Math.floor(diffMins / 60);
                        const mins = diffMins % 60;
                        return ` (sau ${hrs}h ${mins}m)`;
                    } catch (err) { return ''; }
                },

                getStatusBadgeClass(status) {
                    switch (status) {
                        case 'Mới': return 'bg-amber-100 text-amber-800 border-amber-300';
                        case 'Đang xử lý': return 'bg-blue-100 text-blue-800 border-blue-300';
                        case 'Đã xử lý': return 'bg-green-100 text-green-800 border-green-300';
                        default: return 'bg-gray-100 text-gray-700 border-gray-300';
                    }
                },

                getStatusDotClass(status) {
                    switch (status) {
                        case 'Mới': return 'bg-amber-500';
                        case 'Đang xử lý': return 'bg-blue-600 animate-pulse';
                        case 'Đã xử lý': return 'bg-green-600';
                        default: return 'bg-gray-400';
                    }
                },

                async checkStatus() {
                    if (!this.statusEmail || !this.statusEmail.trim()) {
                        this.errorMessage = 'Vui lòng nhập email đăng ký để tra cứu.';
                        return;
                    }

                    this.loading = true;
                    this.errorMessage = '';
                    this.statusResult = null;

                    try {
                        const payload = { email: this.statusEmail.trim().toLowerCase() };
                        let res;
                        if (this.useMock) {
                            res = await this.mockCheckStatus(payload);
                        } else {
                            res = await this.callApi('checkStatus', payload);
                        }

                        if (res.success) {
                            this.statusResult = res;
                        } else {
                            this.errorMessage = res.message || 'Không tìm thấy dữ liệu nhóm Fam cho email này.';
                        }
                    } catch (err) {
                        this.errorMessage = 'Lỗi kết nối máy chủ: ' + err.message;
                    } finally {
                        this.loading = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async callApi(action, payload) {
                    const url = new URL(this.webAppUrl);
                    url.searchParams.append('action', action);

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    try {
                        const response = await fetch(url.toString(), {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        return await response.json();
                    } catch (err) {
                        clearTimeout(timeoutId);
                        throw err;
                    }
                },

                async mockCheckStatus(payload) {
                    await new Promise(r => setTimeout(r, 450));
                    return {
                        success: true,
                        has_ticket: true,
                        stt_group: 'RN14',
                        ticket_id: 'TK-1786873436812-483',
                        status: 'Đã xử lý',
                        created_at: new Date(Date.now() - 19800000).toISOString(),
                        updated_at: new Date(Date.now() - 1800000).toISOString(),
                        resolved_at: new Date(Date.now() - 1800000).toISOString(),
                        resolved_by: 'Admin',
                        is_recurring: true,
                        recur_count: 1,
                        report_count: 5,
