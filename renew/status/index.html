<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tra Cứu Trạng Thái Xử Lý Fam - Go DNC</title>
    <meta name="description" content="Trang tra cứu trạng thái khắc phục sự cố nhóm tài khoản Fam (RN) tự động cho khách hàng Go DNC.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #070a13;
            color: #f3f4f6;
        }
        [x-cloak] { display: none !important; }
    </style>
</head>
<body x-data="statusPageApp()" x-init="init()" class="antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden"
      style="background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.15), transparent 50%), radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 50%), #070a13;">

    <!-- Top Accent Line -->
    <div class="h-1.5 w-full bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500"></div>

    <!-- Header -->
    <header class="py-5 px-4 max-w-4xl mx-auto w-full flex items-center justify-between z-10">
        <a href="https://godnc.com/" class="flex items-center gap-2.5 group">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/25 group-hover:scale-105 transition-transform">
                <span class="font-black text-white text-lg tracking-wider">DNC</span>
            </div>
            <div>
                <div class="font-extrabold text-white text-base md:text-lg tracking-tight flex items-center gap-2">
                    Fam Issue Tracker
                    <span class="text-[10px] font-bold uppercase tracking-wider bg-purple-500/20 text-purple-300 border border-purple-500/30 px-2 py-0.5 rounded-full">Tra Cứu</span>
                </div>
            </div>
        </a>

        <a href="../report/" class="flex items-center gap-1.5 text-xs bg-white/5 hover:bg-white/10 text-gray-300 hover:text-white border border-white/10 px-3.5 py-2 rounded-xl transition-all font-semibold">
            <i data-lucide="alert-circle" class="w-3.5 h-3.5"></i>
            <span>Gửi báo lỗi mới</span>
        </a>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow flex items-center justify-center px-4 py-8 md:py-12 z-10">
        <div class="w-full max-w-lg mx-auto">

            <div class="bg-gray-900/70 border border-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-6 md:p-8 relative overflow-hidden">
                
                <!-- Page Header -->
                <div class="text-center mb-8">
                    <div class="w-12 h-12 rounded-2xl bg-purple-500/20 text-purple-400 border border-purple-500/30 flex items-center justify-center mx-auto mb-3">
                        <i data-lucide="search" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-extrabold text-white tracking-tight">Tra Cứu Tiến Độ Xử Lý</h1>
                    <p class="text-xs md:text-sm text-gray-400 mt-2">
                        Nhập Email để kiểm tra xem báo lỗi của nhóm bạn đã được ghi nhận và xử lý tới đâu.
                    </p>
                </div>

                <!-- Inline Error Message -->
                <div x-show="errorMessage" x-transition x-cloak class="mb-5 p-4 rounded-2xl border bg-rose-950/60 border-rose-500/50 text-rose-200 text-xs font-medium flex items-start gap-2.5">
                    <i data-lucide="alert-triangle" class="w-4 h-4 flex-shrink-0 mt-0.5"></i>
                    <span x-text="errorMessage"></span>
                </div>

                <!-- Search Form -->
                <form @submit.prevent="checkStatus()" class="space-y-4">
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-500">
                                <i data-lucide="mail" class="w-4 h-4"></i>
                            </div>
                            <input type="email" x-model="email" required placeholder="Nhập email của bạn..."
                                   class="w-full bg-gray-950/60 border border-gray-800 rounded-xl pl-10 pr-4 py-3 text-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition-all text-sm placeholder-gray-500">
                        </div>
                        <button type="submit" :disabled="loading"
                                class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all flex items-center justify-center gap-2 text-sm whitespace-nowrap disabled:opacity-50">
                            <template x-if="!loading">
                                <div class="flex items-center gap-1.5">
                                    <i data-lucide="search" class="w-4 h-4"></i>
                                    <span>Tra Cứu</span>
                                </div>
                            </template>
                            <template x-if="loading">
                                <div class="flex items-center gap-1.5">
                                    <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                                    </svg>
                                    <span>Kiểm tra...</span>
                                </div>
                            </template>
                        </button>
                    </div>
                </form>

                <!-- Status Result Display -->
                <div x-show="result" x-transition x-cloak class="mt-6">
                    <template x-if="result && !result.has_ticket">
                        <div class="p-6 bg-gray-950/60 border border-gray-800 rounded-2xl text-center space-y-3">
                            <i data-lucide="check-circle-2" class="w-10 h-10 text-emerald-400 mx-auto"></i>
                            <h3 class="text-base font-bold text-white">Fam <span class="font-mono text-indigo-300" x-text="result.stt_group"></span> hiện không có báo lỗi mở</h3>
                            <p class="text-xs text-gray-400" x-text="result.message"></p>
                            <a href="../report/" class="mt-3 px-4 py-2.5 bg-indigo-600/30 hover:bg-indigo-600/50 text-indigo-200 border border-indigo-500/40 rounded-xl text-xs font-semibold inline-flex items-center gap-1.5 transition-all">
                                <i data-lucide="plus-circle" class="w-4 h-4"></i> Gửi báo lỗi cho Fam này
                            </a>
                        </div>
                    </template>

                    <template x-if="result && result.has_ticket">
                        <div class="bg-gray-950/80 border border-gray-800 rounded-2xl p-6 space-y-4">
                            <div class="flex items-center justify-between border-b border-gray-800 pb-4">
                                <div>
                                    <span class="text-xs text-gray-400 block">Mã nhóm Fam (5 người):</span>
                                    <span class="text-3xl font-black text-indigo-400 font-mono tracking-tight" x-text="result.stt_group"></span>
                                </div>
                                <div class="text-right">
                                    <span class="text-xs text-gray-400 block mb-1">Trạng thái</span>
                                    <span class="px-3.5 py-1.5 rounded-full text-xs font-bold border inline-flex items-center gap-1.5"
                                          :class="getStatusBadgeClass(result.status)">
                                        <span class="w-2 h-2 rounded-full" :class="getStatusDotClass(result.status)"></span>
                                        <span x-text="result.status"></span>
                                    </span>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
                                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800/60">
                                    <span class="text-gray-500 block mb-1">Cập nhật gần nhất</span>
                                    <span class="text-gray-200 font-medium" x-text="formatDate(result.updated_at)"></span>
                                </div>
                                <div class="bg-gray-900/60 p-3 rounded-xl border border-gray-800/60">
                                    <span class="text-gray-500 block mb-1">Số khách đã báo</span>
                                    <span class="text-gray-200 font-medium flex items-center gap-1.5">
                                        <i data-lucide="users" class="w-4 h-4 text-indigo-400"></i>
                                        <span class="font-bold text-white" x-text="result.report_count"></span> thành viên nhóm
                                    </span>
                                </div>
                            </div>

                            <!-- Recurring Banner -->
                            <div x-show="result.is_recurring" class="p-3.5 bg-amber-950/40 border border-amber-500/40 rounded-xl text-amber-200 text-xs space-y-1">
                                <div class="flex items-center gap-2 font-bold text-amber-300">
                                    <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400"></i>
                                    Sự cố tái phát (Lần thứ <span x-text="result.recur_count"></span>)
                                </div>
                                <p class="text-amber-200/80">Sự cố này đã xảy ra lại gần đây. Đội ngũ kỹ thuật đang ưu tiên kiểm tra tận gốc để khắc phục dứt điểm.</p>
                            </div>

                            <div class="text-[11px] text-gray-500 text-center pt-2">
                                Mã Ticket: <span class="font-mono text-gray-400" x-text="result.ticket_id"></span>
                            </div>
                        </div>
                    </template>
                </div>

            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 px-4 text-center border-t border-white/5 text-xs text-gray-500 z-10">
        <p>© 2026 Go DNC — Fam Issue Tracker System (RN Groups). All rights reserved.</p>
    </footer>

    <script>
        function statusPageApp() {
            return {
                webAppUrl: localStorage.getItem('FAM_TRACKER_WEBAPP_URL') || '',
                useMock: !localStorage.getItem('FAM_TRACKER_WEBAPP_URL'),
                loading: false,
                email: '',
                errorMessage: '',
                result: null,

                init() {
                    // Tự đọc query param `?email=...` từ URL nếu có
                    const urlParams = new URLSearchParams(window.location.search);
                    const emailParam = urlParams.get('email');
                    if (emailParam) {
                        this.email = emailParam.trim();
                        this.checkStatus();
                    }
                    setTimeout(() => lucide.createIcons(), 50);
                },

                formatDate(isoStr) {
                    if (!isoStr) return '---';
                    try {
                        const d = new Date(isoStr);
                        if (isNaN(d.getTime())) return isoStr;
                        return d.toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) + ' ' +
                               d.toLocaleDateString('vi-VN', { day: '2-digit', month: '2-digit', year: 'numeric' });
                    } catch (e) { return isoStr; }
                },

                getStatusBadgeClass(status) {
                    switch (status) {
                        case 'Mới': return 'bg-amber-500/20 text-amber-300 border-amber-500/40';
                        case 'Đang xử lý': return 'bg-blue-500/20 text-blue-300 border-blue-500/40';
                        case 'Đã xử lý': return 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40';
                        default: return 'bg-gray-500/20 text-gray-300 border-gray-500/40';
                    }
                },

                getStatusDotClass(status) {
                    switch (status) {
                        case 'Mới': return 'bg-amber-400';
                        case 'Đang xử lý': return 'bg-blue-400';
                        case 'Đã xử lý': return 'bg-emerald-400';
                        default: return 'bg-gray-400';
                    }
                },

                async checkStatus() {
                    if (!this.email) return;
                    this.loading = true;
                    this.errorMessage = '';
                    this.result = null;

                    const emailClean = this.email.trim().toLowerCase();

                    try {
                        let res;
                        if (this.useMock) {
                            res = await this.mockCheckStatus(emailClean);
                        } else {
                            res = await this.callApi('checkStatus', { email: emailClean });
                        }

                        if (res.success) {
                            this.result = res;
                        } else {
                            this.errorMessage = res.message || 'Không tìm thấy thông tin tài khoản.';
                        }
                    } catch (err) {
                        this.errorMessage = err.message || 'Không thể kết nối máy chủ.';
                    } finally {
                        this.loading = false;
                        setTimeout(() => lucide.createIcons(), 50);
                    }
                },

                async callApi(action, payload) {
                    const url = new URL(this.webAppUrl);
                    url.searchParams.append('action', action);

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 15000);

                    try {
                        const response = await fetch(url.toString(), {
                            method: 'POST',
                            mode: 'cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload),
                            signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        return await response.json();
                    } catch (err) {
                        clearTimeout(timeoutId);
                        if (err.name === 'AbortError') {
                            throw new Error('Hệ thống phản hồi chậm, vui lòng thử lại. Nếu tiếp tục xảy ra, liên hệ admin.');
                        }
                        throw err;
                    }
                },

                async mockCheckStatus(email) {
                    await new Promise(r => setTimeout(r, 400));
                    const mockCache = JSON.parse(localStorage.getItem('MOCK_FAM_CACHE') || '{"khach1@gmail.com":"RN34","khach2@gmail.com":"RN34","admin@godnc.com":"RN34"}');
                    const sttGroup = mockCache[email];
                    if (!sttGroup) {
                        return {
                            success: false,
                            error: 'email_not_found',
                            message: 'Không tìm thấy tài khoản với email này. Có thể dữ liệu chưa được đồng bộ, vui lòng thử lại sau ít phút hoặc liên hệ CTV.'
                        };
                    }
                    return {
                        success: true,
                        has_ticket: true,
                        stt_group: sttGroup,
                        status: 'Đang xử lý',
                        ticket_id: 'TK-1001',
                        created_at: new Date(Date.now() - 3600000).toISOString(),
                        updated_at: new Date(Date.now() - 1800000).toISOString(),
                        resolved_at: '',
                        is_recurring: true,
                        recur_count: 2,
                        report_count: 3
                    };
                }
            };
        }
    </script>
</body>
</html>
