<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accumulate Trading OS - Đăng nhập</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <!-- Loading State -->
  <div id="loading-container" class="container text-center">
    <p>Đang tải dữ liệu...</p>
  </div>

  <!-- Auth Container -->
  <div id="auth-container" class="container hidden">
    <h1 id="auth-title">Đăng Nhập</h1>
    
    <form id="auth-form">
      <div id="display-name-group" class="form-group hidden">
        <label for="display-name">Tên hiển thị</label>
        <input type="text" id="display-name" placeholder="Ví dụ: John Doe">
      </div>
      
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required placeholder="nhap@email.com">
      </div>
      
      <div class="form-group">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>
      
      <button type="submit" id="auth-submit">Đăng Nhập</button>
      <div id="auth-error" class="error-message hidden"></div>
    </form>
    
    <button type="button" id="toggle-auth" class="toggle-link">Chưa có tài khoản? Đăng ký ngay</button>
  </div>

  <!-- Dashboard Container -->
  <div id="dashboard-container" class="container hidden">
    <h1>Accumulate OS</h1>
    
    <div class="dashboard-card">
      <p id="welcome-message">Chào <strong id="user-name">...</strong> — tài khoản của bạn đã sẵn sàng.</p>
      <p style="margin-top: 10px;">Gói hiện tại: <span id="user-plan" class="badge">Đang tải...</span></p>
    </div>
    
    <button id="logout-btn" class="btn-secondary">Đăng Xuất</button>
  </div>

  <!-- App logic -->
  <script src="app.js"></script>
</body>
</html>
