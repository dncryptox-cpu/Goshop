<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Sang Mail Phụ — CTV Portal Go DNC</title>
    <meta name="description" content="Khu vực dành cho CTV gửi yêu cầu đổi sang email phụ của khách hàng.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Alpine.js -->
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; }
        [x-cloak] { display: none !important; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.01); }
    </style>
</head>
<body x-data="ctvFamApp()" x-init="initApp()" class="antialiased min-h-screen flex flex-col justify-between">

    <!-- LOGIN SCREEN IF NOT LOGGED IN -->
    <div x-show="!isLoggedIn" x-cloak class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-3xl card-shadow p-6 sm:p-8 w-full max-w-sm border border-slate-200 space-y-6">
            <div class="w-14 h-14 bg-purple-600 rounded-2xl flex items-center justify-center text-white font-bold shadow-lg shadow-purple-600/30 mx-auto">
                <i data-lucide="mail-plus" class="w-7 h-7"></i>
            </div>
            <div class="text-center space-y-1">
                <h2 class="text-xl font-black text-slate-900">CTV Đăng Nhập</h2>
                <p class="text-xs text-slate-500">Cổng Đổi Sang Mail Phụ</p>
            </div>

            <form @submit.prevent="login()" class="space-y-4">
                <div x-show="loginError" x-cloak class="bg-red-50 text-red-600 px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 border border-red-200">
                    <i data-lucide="alert-circle" class="w-4 h-4"></i>
                    <span x-text="loginError"></span>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Tên Đăng Nhập</label>
                    <input type="text" x-model="loginForm.username" required placeholder="Nhập tên đăng nhập CTV..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3.5 text-xs font-bold focus:outline-none focus:border-purple-600 focus:bg-white transition-all text-slate-900">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase tracking-wider mb-1.5">Mật Khẩu</label>
                    <input type="password" x-model="loginForm.password" required placeholder="Nhập mật khẩu..."
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl py-2.5 px-3.5 text-xs font-bold focus:outline-none focus:border-purple-600 focus:bg-white transition-all text-slate-900">
                </div>
                <button type="submit"
                    class="w-full bg-purple-600 hover:bg-purple-700 text-white py-3 rounded-xl font-black text-xs transition-all flex items-center justify-center gap-2 shadow-lg shadow-purple-600/20 active:scale-95 cursor-pointer">
                    <span>Đăng Nhập CTV</span>
                    <i data-lucide="arrow-right" class="w-4 h-4"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SCREEN (WHEN LOGGED IN) -->
    <div x-show="isLoggedIn" x-cloak class="flex-grow flex flex-col justify-between">
        
        <!-- SLEEK UNIFIED TOP HEADER BAR -->
        <header class="bg-slate-900 text-white border-b border-slate-800 sticky top-0 z-50 shadow-md">
            <div class="max-w-6xl mx-auto px-4 py-2.5 flex items-center justify-between gap-3">
                <div class="flex items-center gap-2.5 min-w-0">
                    <div class="w-8 h-8 rounded-xl bg-purple-600 flex items-center justify-center text-white font-bold shadow-md shadow-purple-600/30 flex-shrink-0">
                        <i data-lucide="mail-plus" class="w-4 h-4"></i>
                    </div>
                    <div class="min-w-0">
                        <h1 class="font-black text-xs sm:text-sm tracking-tight text-white flex items-center gap-1.5 truncate">
                            <span>CTV Portal</span>
                            <span class="text-[10px] bg-purple-500/30 text-purple-200 border border-purple-400/40 px-2 py-0.2 rounded-full font-bold">Mail Phụ</span>
                        </h1>
                        <p class="text-[10px] sm:text-[11px] text-slate-400 truncate">CTV: <strong class="text-amber-300 font-bold" x-text="currentUser?.name"></strong></p>
                    </div>
                </div>

                <!-- TOP ROUTE SEGMENT TABS -->
                <div class="flex items-center gap-1 bg-slate-800 p-1 rounded-2xl border border-slate-700 text-xs font-bold">
                    <a href="/ctv/renew/" class="px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700 transition-all flex items-center gap-1.5 whitespace-nowrap">
                        <i data-lucide="search" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span>Tra Cứu Gói</span>
                    </a>
                    <a href="/ctv/renew/baoloi/" class="px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700 transition-all flex items-center gap-1.5 whitespace-nowrap">
                        <i data-lucide="layers" class="w-3.5 h-3.5 text-blue-400"></i>
                        <span class="hidden sm:inline">Báo Lỗi Fam</span>
                        <span class="sm:hidden">Báo Lỗi</span>
                    </a>
                    <a href="/ctv/renew/captam/" class="px-3 py-1.5 rounded-xl text-slate-300 hover:text-white hover:bg-slate-700 transition-all flex items-center gap-1.5 whitespace-nowrap">
                        <i data-lucide="shield-check" class="w-3.5 h-3.5 text-indigo-400"></i>
                        <span class="hidden sm:inline">Cấp TK Tạm</span>
                        <span class="sm:hidden">Cấp Tạm</span>
                    </a>
                    <a href="/ctv/renew/mailphu/" class="px-3 py-1.5 rounded-xl bg-purple-600 text-white font-black shadow-sm flex items-center gap-1.5 whitespace-nowrap">
                        <i data-lucide="mail-plus" class="w-3.5 h-3.5"></i>
                        <span>Mail Phụ</span>
                    </a>
                    <button @click="logout()" class="p-1.5 text-slate-400 hover:text-red-400 rounded-lg transition-colors ml-1" title="Đăng xuất">
                        <i data-lucide="log-out" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-6xl mx-auto w-full p-3 sm:p-6 space-y-5 flex-grow">

            <!-- KHU ĐỔI SANG MAIL PHỤ -->
            <div class="bg-white border border-slate-200/80 rounded-2xl p-4 sm:p-6 card-shadow space-y-4">
                <div class="flex items-center gap-3 border-b border-slate-100 pb-3">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white shadow-md">
                        <i data-lucide="mail-plus" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h2 class="text-xs sm:text-sm font-black uppercase tracking-wider text-slate-900 flex items-center gap-2">
                            <span>Yêu Cầu Đổi Sang Mail Phụ</span>
                        </h2>
                        <p class="text-xs text-slate-500 font-medium">Không muốn dùng chung tài khoản bảo hành? Đổi sang email phụ của riêng bạn.</p>
                    </div>
                </div>

                <!-- FORM ĐỔI MAIL PHỤ -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Email hiện tại (email gặp sự cố):</label>
                        <input type="email" x-model="mailPhuPrimaryEmail" @input.debounce.400ms="checkExistingMailPhuRequest()" @change="checkExistingMailPhuRequest()" placeholder="vd: nguyenvanA@gmail.com"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-900 focus:bg-white focus:border-purple-600 focus:outline-none transition-all">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-1">Email phụ muốn đổi sang:</label>
                        <input type="email" x-model="mailPhuSecondaryEmail" placeholder="vd: emailphucuanhan@gmail.com"
                               class="w-full bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-xs font-semibold text-slate-900 focus:bg-white focus:border-purple-600 focus:outline-none transition-all">
                    </div>
                </div>

                <!-- THÔNG BÁO NẾU ĐÃ TỪNG GỬI YÊU CẦU ĐỔI MAIL PHỤ -->
                <template x-if="existingMailPhuInfo">
                    <div class="bg-amber-50 border border-amber-300/80 rounded-xl p-3.5 text-xs text-amber-950 space-y-1 font-medium card-shadow">
                        <div class="flex items-center justify-between font-bold text-amber-900 border-b border-amber-200/80 pb-1.5">
                            <span class="flex items-center gap-1.5">
                                <i data-lucide="info" class="w-4 h-4 text-amber-600 flex-shrink-0"></i>
                                <span>Email này đã có yêu cầu đổi sang Mail Phụ trước đó!</span>
                            </span>
                            <span class="px-2 py-0.5 rounded text-[10px] font-black uppercase bg-amber-200/80 text-amber-900 border border-amber-400/60" x-text="existingMailPhuInfo.status"></span>
                        </div>
                        <div class="pt-1 text-slate-800">
                            • Mail phụ hiện tại đã gửi: <strong class="font-mono text-purple-900 font-extrabold select-all" x-text="existingMailPhuInfo.mail_phu"></strong>
                        </div>
                        <div class="text-[11px] text-amber-800 italic pt-0.5">
                            💡 Nếu bạn muốn đổi sang mail phụ khác, hãy điền email mới vào ô bên phải và bấm nút bên dưới để cập nhật lại cho Admin.
                        </div>
                    </div>
                </template>

                <div class="flex flex-col sm:flex-row items-center justify-between gap-3">
                    <button @click="submitMailPhuRequest()"
                            :disabled="isSubmittingMailPhu || !mailPhuPrimaryEmail.trim() || !mailPhuSecondaryEmail.trim()"
                            class="w-full sm:w-auto px-5 py-2.5 bg-gradient-to-r from-purple-600 to-indigo-600 hover:from-purple-500 hover:to-indigo-500 text-white font-extrabold text-xs rounded-xl shadow-md transition-all flex items-center justify-center gap-2 cursor-pointer disabled:opacity-50">
                        <template x-if="!isSubmittingMailPhu">
                            <span class="flex items-center gap-2">
                                <i data-lucide="send" class="w-4 h-4"></i>
                                <span x-text="existingMailPhuInfo ? '🔄 Cập Nhật Sang Mail Phụ Mới' : '🚀 Gửi Yêu Cầu Đổi Mail Phụ'"></span>
                            </span>
                        </template>
                        <template x-if="isSubmittingMailPhu">
                            <span class="flex items-center gap-2">
                                <svg class="animate-spin h-4 w-4 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                                <span>Đang gửi yêu cầu...</span>
                            </span>
                        </template>
                    </button>
                </div>

                <!-- KHỐI KẾT QUẢ / PHẢN HỒI KHI THÀNH CÔNG -->
                <template x-if="mailPhuSuccessResult">
                    <div class="bg-gradient-to-br from-purple-950 via-slate-900 to-indigo-950 border border-purple-500/40 rounded-xl p-4 text-white space-y-2 text-xs shadow-lg">
                        <div class="flex items-center gap-2 text-emerald-400 font-extrabold text-sm border-b border-white/10 pb-2">
                            <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
                            <span>🎉 ĐÃ GHI NHẬN YÊU CẦU ĐỔI MAIL PHỤ THÀNH CÔNG!</span>
                        </div>
                        <div class="space-y-1 text-slate-200">
                            <div>• Email chính: <strong class="font-mono text-amber-300" x-text="mailPhuSuccessResult.primary_email"></strong> | Nhóm: <strong class="font-mono text-purple-300" x-text="mailPhuSuccessResult.stt_group"></strong></div>
                            <div>• Hạn gia hạn (HSD): <strong class="font-mono font-bold" :class="mailPhuSuccessResult.ngay_het_han ? 'text-emerald-300 font-extrabold' : 'text-amber-300/90'" x-text="formatDateOnly(mailPhuSuccessResult.ngay_het_han) || 'Đang cập nhật HSD từ Kho TK...'"></strong></div>
                            <div>• Email phụ cần đổi sang: <strong class="font-mono text-emerald-400 text-sm bg-white/10 px-2 py-0.5 rounded border border-emerald-400/30" x-text="mailPhuSuccessResult.mail_phu"></strong></div>
                        </div>
                        <p class="text-[11px] text-slate-300 italic pt-1 border-t border-white/10">
                            💬 Đội ngũ kỹ thuật viên sẽ mời email phụ trên vào nhóm Fam trong thời gian sớm nhất.
                        </p>
                    </div>
                </template>

                <template x-if="mailPhuError">
                    <div class="bg-rose-50 border border-rose-200 text-rose-700 p-3 rounded-xl text-xs font-semibold flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-4 h-4 text-rose-500 flex-shrink-0"></i>
                        <span x-text="mailPhuError"></span>
                    </div>
                </template>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
            <p>© 2026 Go DNC — CTV Portal (Đổi Sang Mail Phụ). All rights reserved.</p>
        </footer>
    </div>

    <!-- Toast Component -->
    <div x-show="toast.show" x-cloak
         class="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-4 py-3 rounded-2xl shadow-2xl border border-slate-800 text-xs font-bold flex items-center gap-2">
        <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
        <span x-text="toast.message"></span>
    </div>

    <script>
        function ctvFamApp() {
            return {
                ctvAccounts: {
                    'tuan': { username: 'tuan', password: '123', name: 'Tuan', role: 'ctv' },
                    'vuong': { username: 'vuong', password: '123', name: 'Vương', role: 'ctv' },
                    'dnc': { username: 'dnc', password: 'dnc1m@', name: 'Dnc', role: 'admin' },
                    'loc': { username: 'loc', password: '123', name: 'Lộc', role: 'ctv' },
                    'admin': { username: 'admin', password: 'dnc1m@', name: 'all', role: 'admin' }
                },
                isLoggedIn: false,
                loginForm: { username: '', password: '' },
                loginError: '',
                currentUser: null,
                toast: { show: false, message: '' },

                mailPhuPrimaryEmail: '',
                mailPhuSecondaryEmail: '',
                isSubmittingMailPhu: false,
                mailPhuError: '',
                mailPhuSuccessResult: null,
                existingMailPhuInfo: null,
                isCheckingExistingMailPhu: false,

                showToast(msg) {
                    this.toast = { show: true, message: msg };
                    setTimeout(() => { this.toast.show = false; }, 2500);
                },

                copyText(text) {
                    if (!text || text === '--') return;
                    if (navigator.clipboard && window.isSecureContext) {
                        navigator.clipboard.writeText(text).then(() => {
                            this.showToast('Đã sao chép: ' + text);
                        }).catch(() => { this.fallbackCopyText(text); });
                    } else { this.fallbackCopyText(text); }
                },

                fallbackCopyText(text) {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    try { document.execCommand('copy'); this.showToast('Đã sao chép: ' + text); } catch (e) {}
                    document.body.removeChild(textarea);
                },

                async initApp() {
                    const savedUser = localStorage.getItem('goshop_ctv_user');
                    if (savedUser) {
                        this.currentUser = JSON.parse(savedUser);
                        this.isLoggedIn = true;
                    }
                    this.$nextTick(() => lucide.createIcons());
                },

                login() {
                    const uname = this.loginForm.username.trim().toLowerCase();
                    const acc = this.ctvAccounts[uname];
                    if (acc && acc.password === this.loginForm.password) {
                        this.isLoggedIn = true;
                        this.currentUser = acc;
                        this.loginError = '';
                        localStorage.setItem('goshop_ctv_user', JSON.stringify(acc));
                        this.$nextTick(() => lucide.createIcons());
                    } else {
                        this.loginError = 'Sai tên đăng nhập hoặc mật khẩu CTV';
                    }
                },

                logout() {
                    this.isLoggedIn = false;
                    this.currentUser = null;
                    localStorage.removeItem('goshop_ctv_user');
                },

                formatDateOnly(rawStr) {
                    if (!rawStr) return '';
                    const str = String(rawStr).trim();
                    if (!str) return '';
                    try {
                        const d = new Date(str);
                        if (isNaN(d.getTime())) return str;
                        const day = String(d.getDate()).padStart(2, '0');
                        const month = String(d.getMonth() + 1).padStart(2, '0');
                        const year = d.getFullYear();
                        return `${day}/${month}/${year}`;
                    } catch (e) { return str; }
                },

                async callFamApi(action, payload, timeoutMs = 15000) {
                    const webAppUrl = localStorage.getItem('FAM_TRACKER_WEBAPP_URL') || 'https://script.google.com/macros/s/AKfycbwWQkopYjL131FKXIN1A_UU5VykUaj8YRL_rP0ZVVmqeqYo_hVyi7JdpmcCIX1eJzd1/exec';
                    const url = new URL(webAppUrl);
                    url.searchParams.append('action', action);

                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), timeoutMs);

                    try {
                        const response = await fetch(url.toString(), {
                            method: 'POST', mode: 'cors',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify(payload), signal: controller.signal
                        });
                        clearTimeout(timeoutId);
                        const text = await response.text();
                        return JSON.parse(text);
                    } catch (err) {
                        clearTimeout(timeoutId);
                        throw err;
                    }
                },

                async checkExistingMailPhuRequest() {
                    const email = String(this.mailPhuPrimaryEmail || '').trim().toLowerCase();
                    if (!email || !email.includes('@')) {
                        this.existingMailPhuInfo = null;
                        return;
                    }
                    this.isCheckingExistingMailPhu = true;
                    try {
                        const res = await this.callFamApi('checkMailPhuStatus', { primaryEmail: email });
                        if (res && res.success && res.has_existing) {
                            this.existingMailPhuInfo = res;
                        } else {
                            this.existingMailPhuInfo = null;
                        }
                    } catch (err) {
                        console.error('Lỗi kiểm tra mail phụ:', err);
                    } finally {
                        this.isCheckingExistingMailPhu = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                },

                async submitMailPhuRequest() {
                    if (!this.mailPhuPrimaryEmail || !this.mailPhuPrimaryEmail.trim() || !this.mailPhuSecondaryEmail || !this.mailPhuSecondaryEmail.trim()) {
                        this.mailPhuError = 'Vui lòng nhập đầy đủ Email hiện tại và Email phụ.';
                        return;
                    }

                    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                    if (!emailRegex.test(this.mailPhuSecondaryEmail.trim())) {
                        this.mailPhuError = 'Email phụ không hợp lệ (cần chứa ký tự @ và tên miền domain).';
                        return;
                    }

                    this.isSubmittingMailPhu = true;
                    this.mailPhuError = '';
                    this.mailPhuSuccessResult = null;

                    try {
                        const res = await this.callFamApi('submitMailPhuRequest', {
                            primaryEmail: this.mailPhuPrimaryEmail.trim(),
                            mailPhu: this.mailPhuSecondaryEmail.trim()
                        });

                        if (res && res.success) {
                            this.mailPhuSuccessResult = res;
                            this.showToast('🎉 Gửi yêu cầu đổi mail phụ thành công!');
                        } else {
                            this.mailPhuError = res ? (res.message || 'Không thể xử lý yêu cầu.') : 'Lỗi kết nối server.';
                        }
                    } catch (err) {
                        this.mailPhuError = 'Lỗi gửi yêu cầu: ' + err.message;
                    } finally {
                        this.isSubmittingMailPhu = false;
                        this.$nextTick(() => lucide.createIcons());
                    }
                }
            };
        }
    </script>
</body>
</html>
