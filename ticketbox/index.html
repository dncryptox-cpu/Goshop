<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ticketbox</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#14130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23d97706'/%3E%3Cpath d='M14 22a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v5a5 5 0 0 0 0 10v5a4 4 0 0 1-4 4H18a4 4 0 0 1-4-4v-5a5 5 0 0 0 0-10z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="../trading/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#f5f3ee; --panel:#fffefb; --ink:#1d1c19; --muted:#6e6a61; --line:#e5e0d5; --hover:#efebe2;
  --accent:#d97706; --accent-ink:#fff; --accent-soft:#fdf0dc;
  --ok:#0f766e; --ok-soft:#ddf1ee; --err:#b42318; --khach:#ffffff; --bot:#f1efe9; --admin:#d97706; --admin-ink:#fff;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14130f; --panel:#1c1b17; --ink:#ecebe5; --muted:#a29e93; --line:#2e2d27; --hover:#25241f;
  --accent:#f59e0b; --accent-ink:#1a1204; --accent-soft:#3b2a0c;
  --ok:#2dd4bf; --ok-soft:#133631; --err:#ff8a7a; --khach:#26251f; --bot:#1f1e1a; --admin:#f59e0b; --admin-ink:#1a1204;
}}
:root[data-theme="dark"]{
  --bg:#14130f; --panel:#1c1b17; --ink:#ecebe5; --muted:#a29e93; --line:#2e2d27; --hover:#25241f;
  --accent:#f59e0b; --accent-ink:#1a1204; --accent-soft:#3b2a0c;
  --ok:#2dd4bf; --ok-soft:#133631; --err:#ff8a7a; --khach:#26251f; --bot:#1f1e1a; --admin:#f59e0b; --admin-ink:#1a1204;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--hover)}
.btn.ghost.on{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.btn.danger{background:transparent;border:1px solid var(--line);color:var(--err)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);outline:none}
.input:focus{border-color:var(--accent)}
.err{color:var(--err);font-size:14px;margin:0}
[hidden]{display:none!important}
/* login */
.login{max-width:360px;margin:12vh auto 0;padding:0 16px}
.login h1{font-size:24px;margin:16px 0 4px}
.login p{color:var(--muted);margin:0 0 20px}
.login form{display:flex;flex-direction:column;gap:10px}
.logo{width:44px;height:44px;border-radius:12px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink);flex:none}
.logo svg{width:24px;height:24px}
/* layout */
.shell{height:100dvh;display:grid;grid-template-columns:360px 1fr;grid-template-rows:auto 1fr}
.top{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.top .logo{width:34px;height:34px;border-radius:9px}.top .logo svg{width:18px;height:18px}
.top h1{font-size:17px;margin:0;flex:1}
.top .me{color:var(--muted);font-size:13px}
.side{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:var(--panel)}
.tabs{display:flex;gap:4px;padding:10px 12px 0;overflow-x:auto}
.tab{border:0;background:transparent;padding:7px 10px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;white-space:nowrap}
.tab.on{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-size:12px;min-width:20px;padding:0 6px;border-radius:99px;background:var(--line);color:var(--ink);text-align:center}
.tab.on .n{background:var(--accent);color:var(--accent-ink)}
.search{padding:10px 12px}
.list{flex:1;overflow-y:auto}
.item{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.item:hover{background:var(--hover)}
.item.sel{background:var(--accent-soft)}
.item .l1{display:flex;gap:8px;align-items:baseline}
.item .em{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tm{font-size:12px;color:var(--muted);flex:none}
.item .l2{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.item .l3{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.item.unread .em::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--accent);margin-right:6px;vertical-align:1px}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--line);color:var(--muted)}
.tag.wait{background:var(--accent-soft);color:var(--accent)}
.tag.bot{background:var(--ok-soft);color:var(--ok)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
/* thread */
.main{display:flex;flex-direction:column;min-height:0;min-width:0}
.thead{padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.thead .info{flex:1;min-width:200px}
.thead .info b{font-size:16px;word-break:break-all}
.thead .info div{font-size:13px;color:var(--muted)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.reason{margin:10px 16px 0;padding:9px 12px;border-radius:10px;background:var(--accent-soft);color:var(--ink);font-size:14px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
.m{max-width:78%;display:flex;flex-direction:column}
.m.khach{align-self:flex-start}
.m.bot,.m.admin{align-self:flex-end;align-items:flex-end}
.m .who{font-size:12px;color:var(--muted);margin:0 4px 2px}
.m .b{padding:9px 13px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.m.khach .b{background:var(--khach);border:1px solid var(--line)}
.m.bot .b{background:var(--bot);border:1px dashed var(--line)}
.m.admin .b{background:var(--admin);color:var(--admin-ink)}
.m .b a{color:inherit;font-weight:600}
.sys{align-self:center;font-size:12.5px;color:var(--muted);text-align:center;max-width:90%}
.reply{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel);align-items:flex-end}
.reply textarea{flex:1;resize:none;min-height:44px;max-height:160px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);outline:none;line-height:1.4}
.reply textarea:focus{border-color:var(--accent)}
.note{font-size:12px;color:var(--muted);padding:0 14px 8px;background:var(--panel)}
.placeholder{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:20px}
.kb{flex:1;display:flex;flex-direction:column;padding:16px;gap:10px;min-height:0}
.kb textarea{flex:1;min-height:300px;resize:vertical;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--panel);outline:none;line-height:1.55;font-size:14.5px}
.kb p{margin:0;color:var(--muted);font-size:14px}
.back{display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:14px;z-index:9;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);font-weight:700;cursor:pointer;padding:0}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .side{border-right:0}
  .shell.open .side{display:none}
  .shell:not(.open) .main{display:none}
  .back{display:inline-flex}
  .top .me{display:none}
  .m{max-width:88%}
}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast" hidden></div>
<script>
(() => {
  const SB_URL = "https://pxkwjxmrlucpoehpjbja.supabase.co";
  const SB_KEY = "sb_publishable_GPVgOD3U3O_9yytoRnXv6w_jiiBibnH";
  const sb = window.__MOCK_SB || window.supabase.createClient(SB_URL, SB_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: "dnc_trading_auth" } });
  const toLoginEmail = u => String(u).trim().toLowerCase() + "@users.dnctrading.xyz";
  const toAuthPw = p => "dnc_" + String(p);
  const TICKET_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2.2a2 2 0 0 0 0 3.6V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2.2a2 2 0 0 0 0-3.6z"/></svg>';
  const TABS = [
    { id: "cho_nguoi", label: "Cần người" },
    { id: "bot", label: "Bot đang lo" },
    { id: "dong", label: "Đã đóng" },
  ];
  const STATUS = { cho_nguoi: ["wait", "Cần người"], bot: ["bot", "Bot đang lo"], dong: ["", "Đã đóng"] };
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
  const linkify = s => esc(s).replace(/https?:\/\/[^\s<]+[^\s<.,;:!?)]/g, u => `<a href="${u}" target="_blank" rel="noopener">${u.replace(/^https?:\/\//, "")}</a>`);
  const ago = v => { const d = (Date.now() - new Date(v)) / 60000; if (d < 1) return "vừa xong"; if (d < 60) return Math.floor(d) + " phút"; if (d < 1440) return Math.floor(d / 60) + " giờ"; return new Date(v).toLocaleDateString("vi-VN", { day: "2-digit", month: "2-digit" }); };
  const hm = v => new Date(v).toLocaleString("vi-VN", { hour: "2-digit", minute: "2-digit", day: "2-digit", month: "2-digit" });

  let S = { tab: "cho_nguoi", tickets: [], sel: null, msgs: [], q: "", draft: {}, kb: null, kbDirty: false, user: "" };
  let channel = null;

  function toast(text, undo) {
    const el = $("#toast"); el.innerHTML = esc(text) + (undo ? ' <button type="button">Hoàn tác</button>' : ""); el.hidden = false;
    if (undo) el.querySelector("button").onclick = () => { el.hidden = true; undo(); };
    clearTimeout(toast.t); toast.t = setTimeout(() => el.hidden = true, undo ? 6000 : 3000);
  }
  const fail = e => toast("Lỗi: " + (e?.message || e));

  /* ---------- đăng nhập (tài khoản admin Trading OS) ---------- */
  function renderLogin(err) {
    $("#root").innerHTML = `<div class="login"><div class="logo">${TICKET_ICON}</div><h1>Ticketbox</h1><p>Đăng nhập bằng tài khoản admin.</p>
      <form id="lf"><input class="input" id="lu" placeholder="Tên đăng nhập" autocomplete="username"><input class="input" id="lp" type="password" placeholder="Mật khẩu" autocomplete="current-password">
      ${err ? `<p class="err">${esc(err)}</p>` : ""}<button class="btn" style="justify-content:center">Đăng nhập</button></form></div>`;
    $("#lu").focus();
    $("#lf").onsubmit = async e => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithPassword({ email: toLoginEmail($("#lu").value), password: toAuthPw($("#lp").value) });
      if (error) return renderLogin("Sai tên đăng nhập hoặc mật khẩu.");
      boot();
    };
  }
  async function boot() {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) return renderLogin();
    const { data: isAdmin } = await sb.rpc("is_admin");
    if (!isAdmin) { await sb.auth.signOut(); return renderLogin("Tài khoản này không phải admin."); }
    S.user = (session.user.email || "").split("@")[0];
    await loadTickets();
    const id = location.hash.slice(1);
    if (id && S.tickets.some(t => t.id === id)) { const t = S.tickets.find(x => x.id === id); S.tab = t.status; await openTicket(id); }
    else render();
    subscribe();
  }

  /* ---------- dữ liệu ---------- */
  async function loadTickets() {
    const { data, error } = await sb.from("support_tickets").select("*").eq("deleted", false).order("updated_at", { ascending: false }).limit(500);
    if (error) return fail(error);
    S.tickets = data || [];
  }
  async function loadMsgs(id) {
    const { data, error } = await sb.from("support_messages").select("*").eq("ticket_id", id).order("id", { ascending: true });
    if (error) return fail(error);
    S.msgs = data || [];
  }
  function subscribe() {
    if (channel || !sb.channel) return;
    channel = sb.channel("ticketbox")
      .on("postgres_changes", { event: "*", schema: "public", table: "support_tickets" }, p => {
        const row = p.new; if (!row || !row.id) return;
        const i = S.tickets.findIndex(t => t.id === row.id);
        if (row.deleted) { if (i >= 0) S.tickets.splice(i, 1); }
        else if (i >= 0) S.tickets[i] = row; else S.tickets.unshift(row);
        S.tickets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at));
        if (S.sel === row.id && row.admin_unread) markRead(row.id);
        renderSide(); if (S.sel === row.id) renderHead();
      })
      .on("postgres_changes", { event: "INSERT", schema: "public", table: "support_messages" }, p => {
        if (p.new.ticket_id !== S.sel || S.msgs.some(m => m.id === p.new.id)) return;
        S.msgs.push(p.new); renderMsgs();
      })
      .subscribe();
  }
  const sel = () => S.tickets.find(t => t.id === S.sel);
  async function setTicket(id, patch) {
    const t = S.tickets.find(x => x.id === id); const old = t ? { ...t } : null;
    if (t) Object.assign(t, patch);
    render();
    const { error } = await sb.from("support_tickets").update(patch).eq("id", id);
    if (error) { if (t && old) Object.assign(t, old); render(); fail(error); return false; }
    return old;
  }
  async function markRead(id) { const t = S.tickets.find(x => x.id === id); if (t) t.admin_unread = false; await sb.from("support_tickets").update({ admin_unread: false }).eq("id", id); }

  /* ---------- thao tác ---------- */
  async function openTicket(id) {
    S.sel = id; renderMsgs.done = false; history.replaceState(null, "", "#" + id);
    await loadMsgs(id); render();
    const t = sel(); if (t?.admin_unread) { await markRead(id); renderSide(); }
  }
  async function sendReply() {
    const t = sel(); const text = (S.draft[t.id] || "").trim(); if (!text) return;
    S.draft[t.id] = ""; render();
    const { data, error } = await sb.from("support_messages").insert({ ticket_id: t.id, role: "admin", body: text }).select("*").single();
    if (error) { S.draft[t.id] = text; render(); return fail(error); }
    if (data && !S.msgs.some(m => m.id === data.id)) S.msgs.push(data);
    if (t.status !== "cho_nguoi") await setTicket(t.id, { status: "cho_nguoi" }); // người đã nhảy vào → bot im
    else render();
  }
  async function changeStatus(status, label) {
    const t = sel(); const prev = t.status;
    const ok = await setTicket(t.id, { status, ...(status === "bot" ? { ly_do: "" } : {}) });
    if (ok) toast(label, () => setTicket(t.id, { status: prev, ly_do: ok.ly_do }));
  }
  async function removeTicket() {
    const t = sel(); if (!confirm("Xoá cuộc chat của " + t.email + "?")) return;
    const ok = await setTicket(t.id, { deleted: true });
    if (!ok) return;
    S.tickets = S.tickets.filter(x => x.id !== t.id); S.sel = null; history.replaceState(null, "", location.pathname); render();
    toast("Đã xoá cuộc chat.", async () => {
      const { error } = await sb.from("support_tickets").update({ deleted: false }).eq("id", t.id);
      if (error) return fail(error);
      S.tickets.push({ ...ok, deleted: false }); S.tickets.sort((a, b) => new Date(b.updated_at) - new Date(a.updated_at)); render();
    });
  }
  async function loadKb() {
    const { data, error } = await sb.from("site_settings").select("value").eq("key", "support_kb").maybeSingle();
    if (error) return fail(error);
    S.kb = data?.value?.text || ""; S.kbSaved = S.kb; render();
  }
  async function saveKb() {
    const prev = S.kbSaved;
    const { error } = await sb.from("site_settings").upsert({ key: "support_kb", value: { text: S.kb }, updated_at: new Date().toISOString() });
    if (error) return fail(error);
    S.kbSaved = S.kb; render();
    toast("Đã lưu. Bot dùng ngay từ tin nhắn tiếp theo.", async () => { S.kb = prev; await saveKb(); });
  }

  /* ---------- giao diện ---------- */
  function filtered() {
    const q = S.q.trim().toLowerCase();
    return S.tickets.filter(t => (q ? (t.email.includes(q) || (t.last_text || "").toLowerCase().includes(q)) : t.status === S.tab));
  }
  const count = st => S.tickets.filter(t => t.status === st).length;

  function render() {
    if (!$("#shell")) {
      $("#root").innerHTML = `<div class="shell" id="shell">
        <header class="top"><div class="logo">${TICKET_ICON}</div><h1>Ticketbox</h1><span class="me">${esc(S.user)}</span>
          <button class="btn ghost sm" id="kbBtn">Kiến thức bot</button><button class="btn ghost sm" id="logout">Thoát</button></header>
        <aside class="side"><nav class="tabs" id="tabs"></nav><div class="search"><input class="input" id="q" type="search" placeholder="Tìm email hoặc nội dung…"></div><div class="list" id="list"></div></aside>
        <section class="main" id="main"></section></div>`;
      $("#logout").onclick = async () => { await sb.auth.signOut(); location.reload(); };
      $("#q").oninput = e => { S.q = e.target.value; renderSide(); };
      $("#kbBtn").onclick = () => { S.tab = "kb"; S.q = ""; $("#q").value = ""; S.sel = null; history.replaceState(null, "", location.pathname); if (S.kb === null) loadKb(); render(); };
    }
    $("#shell").classList.toggle("open", !!S.sel || S.tab === "kb");
    $("#kbBtn").classList.toggle("on", S.tab === "kb");
    renderSide(); renderMain();
  }
  function renderSide() {
    $("#tabs").innerHTML = TABS.map(t => `<button class="tab ${S.tab === t.id && !S.q ? "on" : ""}" data-tab="${t.id}">${t.label}<span class="n">${count(t.id)}</span></button>`).join("");
    document.querySelectorAll("[data-tab]").forEach(b => b.onclick = () => {
      if (S.tab === "kb" && b.dataset.tab !== "kb" && S.kb !== S.kbSaved && !confirm("Kiến thức bot chưa lưu. Bỏ thay đổi?")) return;
      S.tab = b.dataset.tab; S.q = ""; $("#q").value = ""; S.sel = null; history.replaceState(null, "", location.pathname);
      render();
    });
    const list = filtered();
    $("#list").innerHTML = S.tab === "kb" && !S.q ? `<div class="empty">Kiến thức bot là phần bot dựa vào để trả lời khách. Sửa ở khung bên cạnh.</div>`
      : list.length ? list.map(t => `<button class="item ${t.id === S.sel ? "sel" : ""} ${t.admin_unread && t.status !== "dong" ? "unread" : ""}" data-id="${t.id}">
        <div class="l1"><span class="em">${esc(t.email)}</span><span class="tm">${ago(t.updated_at)}</span></div>
        <div class="l2">${esc(t.last_text || "—")}</div>
        <div class="l3">${S.q ? `<span class="tag ${STATUS[t.status][0]}">${STATUS[t.status][1]}</span>` : ""}${t.ctv ? `<span class="tag">CTV ${esc(t.ctv)}</span>` : ""}${t.status === "cho_nguoi" && t.ly_do ? `<span class="tag wait">${esc(t.ly_do.slice(0, 40))}</span>` : ""}</div></button>`).join("")
      : `<div class="empty">${S.q ? "Không tìm thấy." : S.tab === "cho_nguoi" ? "Không có khách nào đang chờ. 🎉" : "Trống."}</div>`;
    document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openTicket(b.dataset.id));
  }
  function renderMain() {
    const main = $("#main");
    if (S.tab === "kb" && !S.sel) {
      main.innerHTML = `<div class="thead"><button class="btn ghost sm back" id="back">‹ Danh sách</button><div class="info"><b>Kiến thức bot</b><div>Sản phẩm, link tự lấy mã, cách xử lý từng tình huống. Bot đọc phần này trước mỗi câu trả lời.</div></div>
        <div class="acts"><button class="btn" id="kbSave" ${S.kb === S.kbSaved ? "disabled" : ""}>${S.kb === S.kbSaved ? "Đã lưu" : "Lưu"}</button></div></div>
        <div class="kb">${S.kb === null ? "<p>Đang tải…</p>" : `<textarea id="kbText" spellcheck="false" aria-label="Kiến thức bot"></textarea>
        <p>Luật cố định (không báo giá, không hứa hoàn tiền, luôn tra email trước, chuyển người khi không chắc) nằm trong code, không cần viết lại ở đây.</p>`}</div>`;
      const ta = $("#kbText"); if (ta) { ta.value = S.kb; ta.oninput = () => { S.kb = ta.value; const b = $("#kbSave"); b.disabled = S.kb === S.kbSaved; b.textContent = b.disabled ? "Đã lưu" : "Lưu"; }; }
      $("#kbSave").onclick = saveKb; $("#back").onclick = () => { if (S.kb !== S.kbSaved && !confirm("Kiến thức bot chưa lưu. Bỏ thay đổi?")) return; S.kb = S.kbSaved; S.tab = "cho_nguoi"; render(); };
      return;
    }
    const t = sel();
    if (!t) { main.innerHTML = `<div class="placeholder">Chọn một cuộc chat ở bên trái.</div>`; return; }
    main.innerHTML = `<div class="thead" id="thead"></div>${t.status === "cho_nguoi" && t.ly_do ? `<div class="reason">Lý do: ${esc(t.ly_do)}</div>` : ""}
      <div class="msgs" id="msgs"></div>
      <form class="reply" id="reply"><textarea id="rt" rows="1" placeholder="Trả lời khách…" aria-label="Trả lời"></textarea><button class="btn">Gửi</button></form>
      <div class="note">${t.status === "bot" ? "Bạn trả lời thì bot sẽ ngừng, chuyển sang Cần người." : "Khách thấy tin trong vài giây · Enter gửi, Shift+Enter xuống dòng."}</div>`;
    renderHead(); renderMsgs();
    const rt = $("#rt"); rt.value = S.draft[t.id] || "";
    const grow = () => { rt.style.height = "auto"; rt.style.height = Math.min(rt.scrollHeight, 160) + "px"; };
    rt.oninput = () => { S.draft[t.id] = rt.value; grow(); }; grow();
    rt.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendReply(); } };
    $("#reply").onsubmit = e => { e.preventDefault(); sendReply(); };
  }
  function renderHead() {
    const t = sel(), h = $("#thead"); if (!t || !h) return;
    const [cls, label] = STATUS[t.status];
    h.innerHTML = `<button class="btn ghost sm back" id="back">‹</button>
      <div class="info"><b>${esc(t.email)}</b><div><span class="tag ${cls}">${label}</span> ${t.ctv ? "· CTV " + esc(t.ctv) + " " : ""}· mở ${hm(t.created_at)}</div></div>
      <div class="acts">
        <button class="btn ghost sm" id="copyEm">Copy email</button>
        ${t.status !== "bot" ? `<button class="btn ghost sm" id="toBot">Để bot lo tiếp</button>` : `<button class="btn ghost sm" id="toHuman">Mình nhận</button>`}
        ${t.status !== "dong" ? `<button class="btn sm" id="close">Đóng</button>` : `<button class="btn ghost sm" id="reopen">Mở lại</button>`}
        <button class="btn danger sm" id="del">Xoá</button>
      </div>`;
    $("#back").onclick = () => { S.sel = null; history.replaceState(null, "", location.pathname); render(); };
    $("#copyEm").onclick = () => navigator.clipboard.writeText(t.email).then(() => toast("Đã copy email."));
    const on = (id, fn) => { const b = $("#" + id); if (b) b.onclick = fn; };
    on("toBot", () => changeStatus("bot", "Đã giao lại cho bot."));
    on("toHuman", () => changeStatus("cho_nguoi", "Bot đã dừng, bạn trả lời nhé."));
    on("close", () => changeStatus("dong", "Đã đóng cuộc chat."));
    on("reopen", () => changeStatus("cho_nguoi", "Đã mở lại."));
    on("del", removeTicket);
  }
  function renderMsgs() {
    const box = $("#msgs"); if (!box) return;
    const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
    box.innerHTML = S.msgs.length ? S.msgs.map(m => m.role === "he_thong" ? `<div class="sys">${esc(m.body)} · ${hm(m.created_at)}</div>`
      : `<div class="m ${m.role}"><div class="who">${{ khach: "Khách", bot: "Bot", admin: "Bạn" }[m.role]} · ${hm(m.created_at)}</div><div class="b">${linkify(m.body)}</div></div>`).join("")
      : `<div class="placeholder">Chưa có tin nhắn.</div>`;
    if (atBottom || !renderMsgs.done) box.scrollTop = box.scrollHeight;
    renderMsgs.done = true;
  }

  window.addEventListener("beforeunload", e => { if (S.kb !== null && S.kb !== S.kbSaved) { e.preventDefault(); e.returnValue = ""; } });
  boot();
})();
</script>
</body>
</html>
